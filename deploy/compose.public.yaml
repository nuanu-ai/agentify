# What every public deployment changes about the laptop's stack.
#
# Everything that differs between the two channels is a variable in the host's
# `.env` — the chain, the facilitator, the surface mode, the origin, the Caddy
# address, the published port, the invitation — so there is one file here
# rather than one per channel. What is in it is what is true of any stack this
# repository does not run on somebody's laptop.

services:
  postgres:
    # Two stacks cannot both take 5432, and nothing outside the Compose network
    # has any business reaching either database. The migration suite runs
    # against a disposable server in the release workflow, so nothing on
    # the host needs a port here at all.
    ports: !override []

  # A deployed channel seeds no merchant (ADR-0014). A merchant comes into
  # being one way: a person opens the link mailed to their address and presses
  # the cabinet's one control. The base file seeds the laptop's key by default,
  # so this puts nothing in its place, and a channel's environment file that
  # still gives AGENTIFY_SEED_KEY a value is refused by the release's
  # preflight before anything stops (deploy/README.md, "The release that stops
  # seeding").
  gateway:
    environment:
      SANDBOX_MERCHANT_KEY: "${AGENTIFY_SEED_KEY-}"

  merchant:
    # The laptop's fixture, kept out of a public catalog without the laptop
    # having to ask. The base file leaves this service unprofiled so
    # `docker compose up` still brings up a stack that sells; here it is given
    # a profile nothing enables.
    #
    # Two things would go wrong if it ran. Its key is the laptop's, which a
    # deployed channel never seeds: the door turns it away, so the service
    # never reports healthy and `up -d --wait` cannot finish. And a public
    # catalog has no business selling an eSIM and a room that nobody sells.
    #
    # What this keeps out is the deployment: no public stack runs that process
    # on its own, unattended. Starting it by hand against a stack takes a key
    # a merchant issued in their own cabinet, because no deployed channel
    # seeds one.
    profiles: ["fixtures"]

  scanner:
    # Closed unless the channel's own file says otherwise. The laptop has this
    # on, because the whole path a reader walks — a scan, a mailed link, the
    # cabinet door — has to work from one command there. What a public site
    # accepts from strangers is a different question with a different answer,
    # and it is the operator's to write down rather than the packaging's to
    # decide: a channel that names nothing here takes no registrations.
    environment:
      REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-false}"
      # The two secrets a laptop is allowed to inherit and a deployment is not.
      # `compose.yaml` gives them sandbox answers so `docker compose up` needs
      # no file, and those answers are printed in a public repository: one
      # signs every report link this site hands out, the other is what the
      # address behind a report is encrypted with. A channel that has not put
      # its own in place does not render. Activation does that render before
      # it stops anything, so this refuses with the name of the variable and
      # the sentence above it, and nothing is stopped.
      #
      # Both live in the channel's one environment file, and a channel that
      # has never existed has them written by hand (deploy/README.md, "Setting
      # up a host"). Losing them is not a configuration error that can be
      # corrected later: every link already sent stops verifying and every
      # stored address stops decrypting.
      TOKEN_HMAC_SECRET: "${TOKEN_HMAC_SECRET:?set this channel own report-link signing secret; see deploy/README.md, Setting up a host}"
      EMAIL_ENCRYPTION_KEY: "${EMAIL_ENCRYPTION_KEY:?set this channel own address encryption key; see deploy/README.md, Setting up a host}"

  scanner-privacy:
    # The scheduled job reads the same two, because deleting what retention
    # says is over means reading the addresses it is deleting.
    environment:
      TOKEN_HMAC_SECRET: "${TOKEN_HMAC_SECRET:?set this channel own report-link signing secret; see deploy/README.md, Setting up a host}"
      EMAIL_ENCRYPTION_KEY: "${EMAIL_ENCRYPTION_KEY:?set this channel own address encryption key; see deploy/README.md, Setting up a host}"

  web:
    # The preview serves the files baked into the SHA-tagged image. The base
    # file's bind mounts exist only for local edit-and-reload work.
    volumes: !override
      - agentify-caddy:/data
