# What every public deployment changes about the laptop's stack. Everything
# that differs between the two channels is a variable in the host's environment
# file, so there is one file here rather than one per channel.

services:
  postgres:
    # Nothing outside the Compose network should reach the database, and two
    # stacks cannot both take 5432. The migration suite runs against a disposable
    # server in the release workflow, so the host needs no port here.
    ports: !override []

  # A deployed channel seeds no merchant: one is created only when a person
  # opens the link mailed to them and presses the dashboard's control. Empty
  # rather than a variable, so an environment file naming AGENTIFY_SEED_KEY
  # seeds nothing either; the release's preflight also refuses a rendered seed.
  app:
    environment:
      SANDBOX_MERCHANT_KEY: ""

  merchant:
    # The laptop's fixture merchant, given a profile nothing enables. On a
    # deployed channel its key is never seeded, so it would never turn healthy and
    # `up -d --wait` could not finish; and a public catalog must not sell its
    # fixture products. Run by hand, it needs a key issued in a real dashboard.
    profiles: ["fixtures"]

  scanner:
    # Closed unless the channel's own file says otherwise: what a public site
    # accepts from strangers is the operator's decision, not the packaging's.
    environment:
      REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-false}"
      # compose.yaml gives these two sandbox values that are public in this
      # repository: one signs every report link, the other encrypts the address
      # behind a report. A channel without its own does not render, and activation
      # renders before it stops anything, so nothing is stopped. They live in the
      # channel's environment file (deploy/README.md, "Setting up a host"). Losing
      # them cannot be undone: every link already sent stops verifying and every
      # stored address stops decrypting.
      TOKEN_HMAC_SECRET: "${TOKEN_HMAC_SECRET:?set this channel own report-link signing secret; see deploy/README.md, Setting up a host}"
      EMAIL_ENCRYPTION_KEY: "${EMAIL_ENCRYPTION_KEY:?set this channel own address encryption key; see deploy/README.md, Setting up a host}"

  scanner-privacy:
    # The scheduled job reads the same two, because deleting what retention
    # says is over means reading the addresses it is deleting.
    environment:
      TOKEN_HMAC_SECRET: "${TOKEN_HMAC_SECRET:?set this channel own report-link signing secret; see deploy/README.md, Setting up a host}"
      EMAIL_ENCRYPTION_KEY: "${EMAIL_ENCRYPTION_KEY:?set this channel own address encryption key; see deploy/README.md, Setting up a host}"

  web:
    # The preview serves the files baked into the SHA-tagged image. The base
    # file's bind mounts exist only for local edit-and-reload work.
    volumes: !override
      - agentify-caddy:/data
