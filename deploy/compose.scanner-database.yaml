# The scanner database and shared identity route use this private bridge.
# Only cabinet and scanner web receive the identity secret; no port is published.
services:
  cabinet:
    environment:
      REPORT_IDENTITY_SECRET: "${REPORT_IDENTITY_SECRET:?set the private report identity secret}"
    networks:
      default:
      agentify-scanner-db:
        aliases: [agentify-cabinet-identity]
  postgres:
    networks:
      default:
      agentify-scanner-db:
        aliases: [agentify-scanner-postgres]
networks:
  agentify-scanner-db:
    external: true
    name: ${AGENTIFY_SCANNER_DB_NETWORK:-agentify-scanner-db}
