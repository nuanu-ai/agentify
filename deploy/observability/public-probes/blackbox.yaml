modules:
  http_page:
    prober: http
    timeout: 8s
    http:
      follow_redirects: false
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp:
        - '(?i)<html'
  http_catalog:
    prober: http
    timeout: 8s
    http:
      follow_redirects: false
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp:
        - '"items"[[:space:]]*:[[:space:]]*\['
