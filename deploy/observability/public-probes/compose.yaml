name: agentify-public-probes

x-probe: &probe
  image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
  restart: unless-stopped
  network_mode: host
  mem_limit: 256m
  cpus: "0.25"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  test:
    <<: *probe
    env_file: /etc/agentify-public-probes/test.env
    environment:
      AGENTIFY_CHANNEL: test
      OBSERVABILITY_CA_FILE: /etc/agentify-public-probes/joglo-ca.crt
    command: [run, --server.http.listen-addr=127.0.0.1:12347, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./blackbox.yaml:/etc/alloy/blackbox.yaml:ro
      - /etc/agentify-public-probes/joglo-ca.crt:/etc/agentify-public-probes/joglo-ca.crt:ro
      - test-data:/var/lib/alloy
  production:
    <<: *probe
    env_file: /etc/agentify-public-probes/production.env
    environment:
      AGENTIFY_CHANNEL: production
      OBSERVABILITY_CA_FILE: /etc/agentify-public-probes/joglo-ca.crt
    command: [run, --server.http.listen-addr=127.0.0.1:12348, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./blackbox.yaml:/etc/alloy/blackbox.yaml:ro
      - /etc/agentify-public-probes/joglo-ca.crt:/etc/agentify-public-probes/joglo-ca.crt:ro
      - production-data:/var/lib/alloy

volumes:
  test-data:
  production-data:
