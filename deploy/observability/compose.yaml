name: agentify-observability

services:
  alloy:
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12346
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    env_file: /etc/agentify-observability/writer.env
    environment:
      AGENTIFY_CHANNEL: "${AGENTIFY_CHANNEL:?select test or production}"
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /etc/agentify-observability:/etc/agentify-observability:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro,rslave
      - alloy-data:/var/lib/alloy
    mem_limit: 512m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  alloy-data:
