# The new commerce stack keeps the application's existing service and database
# boundaries. Its project name is supplied by the operator, never by this file.
# Use with compose.yaml and deploy/compose.public.yaml, in that order.
services:
  postgres:
    environment:
      POSTGRES_USER: coinslot
      POSTGRES_DB: coinslot
      POSTGRES_PASSWORD: "${AGENTIFY_DB_PASSWORD:?set a new URL-safe database password}"

  migrate:
    environment:
      DATABASE_URL: "postgres://coinslot:${AGENTIFY_DB_PASSWORD:?set a new URL-safe database password}@postgres:5432/coinslot"

  gateway:
    environment:
      DATABASE_URL: "postgres://coinslot:${AGENTIFY_DB_PASSWORD:?set a new URL-safe database password}@postgres:5432/coinslot"

  cabinet:
    environment:
      DATABASE_URL: "postgres://coinslot:${AGENTIFY_DB_PASSWORD:?set a new URL-safe database password}@postgres:5432/coinslot"

  web:
    # The independently managed edge is the only public 80/443 listener.
    # This Caddy still assembles the commerce routes, over private HTTP.
    ports: !override []
    environment:
      COINSLOT_SITE_ADDRESS: ":8080"
      COINSLOT_TRUSTED_EDGE_CIDR: "172.30.80.2/32"
    networks:
      default:
      agentify-ingress:
        aliases: [agentify-commerce-web]

networks:
  agentify-ingress:
    external: true
    name: agentify-ingress
