# What PRODUCTION changes about the public stack: the database's password, the
# private door behind the edge, and the volumes that hold its data. The project
# name is deploy/stack.sh's, never this file's. Use with compose.yaml and
# deploy/compose.public.yaml, in that order.
services:
  # The init scripts from a path no release changes, which deploy/stack.sh
  # names and deploy/activate.sh keeps equal to the checkout's copy. Mounted
  # from the checkout, they changed path with every revision, and Compose
  # recreated the database on every release.
  postgres:
    volumes:
      - "${AGENTIFY_POSTGRES_INIT:?deploy/stack.sh names the database's init scripts}:/docker-entrypoint-initdb.d:ro"
    environment:
      POSTGRES_USER: agentify
      POSTGRES_DB: agentify
      POSTGRES_PASSWORD: "${AGENTIFY_DB_PASSWORD:?set a new URL-safe database password}"

  migrate:
    environment:
      DATABASE_URL: "postgres://agentify:${AGENTIFY_DB_PASSWORD:?set a new URL-safe database password}@postgres:5432/agentify"

  gateway:
    environment:
      DATABASE_URL: "postgres://agentify:${AGENTIFY_DB_PASSWORD:?set a new URL-safe database password}@postgres:5432/agentify"

  cabinet:
    environment:
      DATABASE_URL: "postgres://agentify:${AGENTIFY_DB_PASSWORD:?set a new URL-safe database password}@postgres:5432/agentify"

  # One database and one account for every process (ADR-0003).
  scanner-migrate:
    environment:
      DATABASE_URL: "postgres://agentify:${AGENTIFY_DB_PASSWORD:?set a new URL-safe database password}@postgres:5432/agentify"

  scanner-worker:
    environment:
      DATABASE_URL: "postgres://agentify:${AGENTIFY_DB_PASSWORD:?set a new URL-safe database password}@postgres:5432/agentify"
      # This channel's answers to three settings the laptop keeps small or
      # local: one worker, named for the channel it runs in; four scans at a
      # time; and the analytics datasets a live site is allowed to name. Each
      # stays a variable, so the host's own file still governs.
      WORKER_ID: "${WORKER_ID:-agentify-production-1}"
      SCANNER_CONCURRENCY: "${SCANNER_CONCURRENCY:-4}"
      POSTHOG_DESTINATION_ENV: "${POSTHOG_DESTINATION_ENV:-production}"
      META_DESTINATION_ENV: "${META_DESTINATION_ENV:-production}"

  scanner:
    environment:
      DATABASE_URL: "postgres://agentify:${AGENTIFY_DB_PASSWORD:?set a new URL-safe database password}@postgres:5432/agentify"
      POSTHOG_DESTINATION_ENV: "${POSTHOG_DESTINATION_ENV:-production}"
      META_DESTINATION_ENV: "${META_DESTINATION_ENV:-production}"

  scanner-privacy:
    environment:
      DATABASE_URL: "postgres://agentify:${AGENTIFY_DB_PASSWORD:?set a new URL-safe database password}@postgres:5432/agentify"

  web:
    # The independently managed edge is the only public 80/443 listener.
    # This Caddy still assembles the commerce routes, over private HTTP.
    ports: !override []
    environment:
      AGENTIFY_SITE_ADDRESS: ":8080"
      AGENTIFY_TRUSTED_EDGE_CIDR: "172.30.80.2/32"
      ADMIN_BASIC_AUTH_USER: "${ADMIN_BASIC_AUTH_USER:?set the scanner admin user}"
      ADMIN_BASIC_AUTH_HASH: "${ADMIN_BASIC_AUTH_HASH:?set the scanner admin bcrypt hash}"
    networks:
      default:
      agentify-ingress:
        aliases: [agentify-web]

networks:
  agentify-ingress:
    external: true
    name: agentify-ingress

# External, so that a host without them stops Compose rather than starting an
# empty production database: deploy/one-database.sh made them on the host that
# ran two databases, and a new host creates them (deploy/README.md, "Backups").
volumes:
  agentify-postgres:
    external: true
    name: agentify-postgres
  agentify-caddy:
    external: true
    name: agentify-caddy
