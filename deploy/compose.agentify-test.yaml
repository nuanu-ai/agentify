# The test data and application stay on dmitry-dev, behind its existing public
# SNI ingress. The new hostname must be routed there before activation.
services:
  web:
    ports: !override
      - "10.20.10.20:8443:443"
    environment:
      AGENTIFY_SITE_ADDRESS: "test.agentify.ad"
      AGENTIFY_FRONT_PAGE: scanner_front_page
      ADMIN_BASIC_AUTH_USER: "${ADMIN_BASIC_AUTH_USER:?set the scanner admin user}"
      ADMIN_BASIC_AUTH_HASH: "${ADMIN_BASIC_AUTH_HASH:?set the scanner admin bcrypt hash}"
    networks:
      default:
      agentify-ingress:

networks:
  agentify-ingress:
    external: true
    name: agentify-test-ingress

# Test keeps its own data. These names appear only after the staged namespace
# cutover has restored and verified the retained test database and Caddy state.
volumes:
  agentify-postgres:
    external: true
    name: agentify-test-postgres
  agentify-caddy:
    external: true
    name: agentify-test-caddy
