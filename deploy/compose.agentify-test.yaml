# The test channel runs on the fixture host, behind its public SNI ingress,
# which must route test.agentify.ad here before activation. The listen address
# is that host's, not this repository's: supply it, and the stack refuses to
# start rather than bind somewhere unintended.
services:
  # The init scripts come from a path no release changes, which deploy/stack.sh
  # names and deploy/activate.sh keeps equal to the checkout's copy. Not from the
  # checkout: that path changes with every revision, and Compose would recreate
  # the database on every release.
  postgres:
    volumes:
      - "${AGENTIFY_POSTGRES_INIT:?deploy/stack.sh names the database's init scripts}:/docker-entrypoint-initdb.d:ro"

  # The test channel never reports a registration or a store to the ad tracker,
  # because nothing signed up here is a real person from a real ad. The switch
  # is fixed here so no line in the host's environment file can turn it on;
  # turned on, the application refuses to start on this channel.
  app:
    environment:
      REGISTRATION_POSTBACK_ENABLED: "false"
      # An explicitly empty value disables background chain recovery.
      PAYMENT_RPC_URL: "${AGENTIFY_PAYMENT_RPC_URL-https://sepolia.base.org}"

  # What the test channel's scanner does is fixed here rather than read from
  # the host's environment file, so no line in that file can change it. It takes
  # registrations and scans from anybody, because the whole path a reader walks
  # has to work on this channel; and it starts no paid browser run and delivers
  # no analytics, because nothing it sees is anybody's real traffic. The rest of
  # the scanner's settings stay the host's.
  scanner:
    environment:
      REGISTRATION_ENABLED: "true"
      SCAN_ACCEPTANCE_ENABLED: "true"
      TURNSTILE_ENFORCED: "false"
      BENCHMARK_ENABLED: "false"
      PUBLIC_SHARE_ENABLED: "false"
      APIFY_BROWSER_MODE: "off"
      REMEDIATION_PROMPT_ENABLED: "true"
      ANALYTICS_RUNTIME_ENV: "test"

  scanner-worker:
    environment:
      # One worker, named for the channel it runs in: heartbeats are keyed on
      # this, and two workers answering to one name read as one restarting.
      WORKER_ID: "${WORKER_ID:-agentify-test-1}"
      ANALYTICS_ENV: "test"
      ANALYTICS_RUNTIME_ENV: "test"
      POSTHOG_ENABLED: "false"
      META_CAPI_ENABLED: "false"
      APIFY_BROWSER_ENABLED: "false"
      APIFY_BROWSER_MODE: "off"

  web:
    ports: !override
      - "${AGENTIFY_TEST_LISTEN_ADDRESS:?set the address the test edge binds on}:8443:443"
    environment:
      AGENTIFY_SITE_ADDRESS: "test.agentify.ad"
      # The documentation's page views are measured as the scanner's pages
      # are on this channel.
      ANALYTICS_RUNTIME_ENV: "test"
    networks:
      default:
      agentify-ingress:

networks:
  agentify-ingress:
    external: true
    name: agentify-test-ingress

# External, as on PRODUCTION: nothing creates them by itself, so a host
# without them stops Compose rather than starting an empty database.
volumes:
  agentify-postgres:
    external: true
    name: agentify-postgres
  agentify-caddy:
    external: true
    name: agentify-caddy
