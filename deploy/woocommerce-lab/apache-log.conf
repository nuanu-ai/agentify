# The shop's request log is the lab Caddy's, which removes credentials before
# it writes a line. Apache's own access log goes to the container's output, and
# WooCommerce accepts API keys in the query string, so these formats keep the
# path alone: no query string and no request line.
LogFormat "%a %t \"%m %U %H\" %>s %O \"%{User-Agent}i\"" combined
LogFormat "%v:%p %a %t \"%m %U %H\" %>s %O \"%{User-Agent}i\"" vhost_combined
