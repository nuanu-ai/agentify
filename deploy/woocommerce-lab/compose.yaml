name: agentify-woo-lab

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - ${WOOCOMMERCE_DATA_ROOT}/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40
    networks: [shop]

  wordpress:
    image: wordpress:7.1-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://woo.nuanu.ai');
        define('WP_SITEURL', 'https://woo.nuanu.ai');
        define('WP_MEMORY_LIMIT', '512M');
        define('WP_ENVIRONMENT_TYPE', 'staging');
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - ${WOOCOMMERCE_DATA_ROOT}/wordpress:/var/www/html
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [shop]

  cli:
    image: wordpress:cli-php8.3
    profiles: [cli]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    volumes:
      - ${WOOCOMMERCE_DATA_ROOT}/wordpress:/var/www/html
      - ./seed:/seed:ro
    networks: [shop]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "${WOO_LAB_LISTEN_ADDRESS:?set the address the lab Caddy binds on}:9444:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${WOOCOMMERCE_DATA_ROOT}/caddy-data:/data
      - ${WOOCOMMERCE_DATA_ROOT}/caddy-config:/config
    networks: [shop]

networks:
  shop:
    name: agentify-woo-lab

