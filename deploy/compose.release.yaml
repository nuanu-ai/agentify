# Ansible builds these revision-tagged images from the exact clean checkout.
# Activation removes build definitions and uses --no-build, so it cannot change
# the images after test acceptance.
services:
  postgres:
    image: "${AGENTIFY_POSTGRES_IMAGE:?set the pinned release Postgres image}"
  migrate:
    build: !reset null
    image: "${AGENTIFY_APP_IMAGE:?set the locally built release image}"
  gateway:
    build: !reset null
    image: "${AGENTIFY_APP_IMAGE:?set the locally built release image}"
  cabinet:
    build: !reset null
    image: "${AGENTIFY_APP_IMAGE:?set the locally built release image}"
  web:
    build: !reset null
    image: "${AGENTIFY_WEB_IMAGE:?set the locally built release image}"
  scanner-migrate:
    build: !reset null
    image: "${AGENTIFY_SCANNER_WORKER_IMAGE:?set the locally built release image}"
  scanner-worker:
    build: !reset null
    image: "${AGENTIFY_SCANNER_WORKER_IMAGE:?set the locally built release image}"
  scanner:
    build: !reset null
    image: "${AGENTIFY_SCANNER_IMAGE:?set the locally built release image}"
  scanner-privacy:
    build: !reset null
    image: "${AGENTIFY_SCANNER_PRIVACY_IMAGE:?set the locally built release image}"
