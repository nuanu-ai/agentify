---
- name: Freeze the sole scanner writer and retain application plus identity custody
  hosts: production
  gather_facts: false
  vars:
    scanner_dir: /home/dmitry/agentify-commerce/ops/deploy/droplet
    scanner_env: /home/dmitry/agentify-scanner/.env.production
    scanner_jobs: /home/dmitry/agentify-scanner/scanner-jobs.sh
    active_cron: /etc/cron.d/agentify
    held_cron: /etc/agentify-cron-scanner-exit-held
    stage_dir: /home/dmitry/agentify-scanner-exit
    preflight_dir: /home/dmitry/agentify-scanner-exit/preflight
    backup_dir: /home/dmitry/agentify-backups/scanner
    custody_dir: /home/dmitry/agentify-backups/scanner-exit
    controller_custody: "{{ playbook_dir }}/../../.local/scanner-exit/{{ source_release_sha[0:8] }}"
    image_env:
      AGENTIFY_SCANNER_WEB_IMAGE: "agentify-scanner-web:{{ source_release_sha }}"
      AGENTIFY_SCANNER_WORKER_IMAGE: "agentify-scanner-worker:{{ source_release_sha }}"
      AGENTIFY_SCANNER_PRIVACY_IMAGE: "agentify-scanner-privacy:{{ source_release_sha }}"
    compose_base: [docker, compose, --env-file, /home/dmitry/agentify-scanner/.env.production, -f, compose.production.yaml, -f, compose.hetzner.yaml]
  tasks:
    - name: Require explicit observed source, reviewed bridge and maintenance acknowledgement
      ansible.builtin.assert:
        that:
          - source_release_sha is defined
          - source_release_sha | default('') is match('^[0-9a-f]{40}$')
          - bridge_release_sha is defined
          - bridge_release_sha | default('') is match('^[0-9a-f]{40}$')
          - scanner_freeze_ack | default('') == 'source-web-worker-and-cron-maintenance'
        fail_msg: Record the source release and approve the source-only maintenance window before freezing.

    - name: Require the prepared bridge checkout while source containers retain their original images
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: /home/dmitry/agentify-commerce
      register: checkout
      changed_when: false
      check_mode: false
    - ansible.builtin.assert:
        that: checkout.stdout == bridge_release_sha
        fail_msg: Reviewed bridge checkout is not staged.

    - name: Inspect protected environment, active cron and held cron
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: ["{{ scanner_env }}", "{{ active_cron }}", "{{ held_cron }}", "{{ scanner_jobs }}"]
      register: source_files
      become: true
      no_log: true
    - name: Refuse a previous or partial scanner exit custody before any source stop
      ansible.builtin.stat:
        path: "{{ custody_dir }}"
      register: custody_before
      become: true
    - ansible.builtin.assert:
        that: not custody_before.stat.exists
        fail_msg: Scanner exit custody already exists; inspect the prior attempt before doing anything.
    - ansible.builtin.assert:
        that:
          - source_files.results[0].stat.exists and source_files.results[0].stat.mode == '0600'
          - source_files.results[1].stat.exists and source_files.results[1].stat.isreg
          - not source_files.results[2].stat.exists
          - source_files.results[3].stat.exists
        fail_msg: Source env, scheduled jobs or freeze archive differs; inspect before stopping services.
    - name: Read the existing two-job schedule and wrapper without exposing source secrets
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: ["{{ active_cron }}", "{{ scanner_jobs }}"]
      register: schedule_source
      become: true
      no_log: true
    - ansible.builtin.set_fact:
        cron_active_lines: "{{ schedule_source.results[0].content | b64decode | regex_findall('(?m)^[ \\t]*[^# \\t\\r\\n].*$') }}"
      no_log: true
    - ansible.builtin.assert:
        that:
          - cron_active_lines == ['SHELL=/bin/bash', '17 3 * * * root /home/dmitry/agentify-scanner/scanner-jobs.sh backup', '23 4 * * * root /home/dmitry/agentify-scanner/scanner-jobs.sh privacy']
          - (schedule_source.results[1].content | b64decode) == lookup('template', playbook_dir ~ '/scanner-jobs.sh.j2')
        fail_msg: Scanner cron has different times, commands or a wrapper for another release; hold nothing.
      vars:
        jobs_release_sha: "{{ source_release_sha }}"
      no_log: true

    - name: Require only one named scanner worker and website
      ansible.builtin.command:
        argv: [docker, inspect, "{{ item }}"]
      loop: [agentify-worker-1, agentify-web-1]
      register: source_containers
      changed_when: false
      check_mode: false
      become: true
      no_log: true
    - name: Inventory all running scanner web and worker container IDs
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --filter, label=com.docker.compose.project=agentify, --filter, "label=com.docker.compose.service={{ item }}"]
      loop: [worker, web]
      register: running_ids
      changed_when: false
      check_mode: false
      become: true
    - ansible.builtin.assert:
        that:
          - (source_containers.results[0].stdout | from_json | first).Config.Labels['com.docker.compose.project'] == 'agentify'
          - (source_containers.results[0].stdout | from_json | first).Config.Labels['com.docker.compose.service'] == 'worker'
          - (source_containers.results[1].stdout | from_json | first).Config.Labels['com.docker.compose.service'] == 'web'
          - (source_containers.results[0].stdout | from_json | first).State.Running
          - (source_containers.results[1].stdout | from_json | first).State.Running
          - running_ids.results[0].stdout_lines == [(source_containers.results[0].stdout | from_json | first).Id[0:12]]
          - running_ids.results[1].stdout_lines == [(source_containers.results[1].stdout | from_json | first).Id[0:12]]
        fail_msg: Running scanner source differs from the named project; stop nothing.
      no_log: true

    - name: Confirm source still targets external Supabase PostgreSQL
      ansible.builtin.command:
        argv: "{{ compose_base + ['--profile', '*', 'config', '--format', 'json'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ image_env }}"
      register: source_config
      changed_when: false
      check_mode: false
      become: true
      no_log: true
    - ansible.builtin.assert:
        that:
          - (source_config.stdout | from_json).services['database-config-check'].environment.DATABASE_MODE == 'external'
          - (source_config.stdout | from_json).services.worker.image == image_env.AGENTIFY_SCANNER_WORKER_IMAGE
          - (source_config.stdout | from_json).services.web.image == image_env.AGENTIFY_SCANNER_WEB_IMAGE
          - (source_containers.results[0].stdout | from_json | first).Config.Image == image_env.AGENTIFY_SCANNER_WORKER_IMAGE
          - (source_containers.results[1].stdout | from_json | first).Config.Image == image_env.AGENTIFY_SCANNER_WEB_IMAGE
          - (source_containers.results[0].stdout | from_json | first).Config.Env | select('match', '^DATABASE_URL=') | list == ['DATABASE_URL=' ~ (source_config.stdout | from_json).services.worker.environment.DATABASE_URL]
          - (source_containers.results[1].stdout | from_json | first).Config.Env | select('match', '^DATABASE_URL=') | list == ['DATABASE_URL=' ~ (source_config.stdout | from_json).services.web.environment.DATABASE_URL]
        fail_msg: Source database mode or scanner image differs from frozen plan.
      no_log: true

    - name: Stage protected transient probe inputs outside the release checkout
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop: ["{{ stage_dir }}", "{{ preflight_dir }}"]
      become: true
      when: not ansible_check_mode
    - ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ stage_dir }}/{{ item }}"
        owner: root
        group: root
        mode: '0600'
      loop: [scanner-fingerprint.sql, scanner-major.sql, scanner-auth-custody.sql, scanner-queue-active.sql, compose.scanner-freeze.yaml]
      become: true
      when: not ansible_check_mode

    - name: Prove source major compatibility before the maintenance window
      ansible.builtin.command:
        argv: "{{ compose_base + ['-f', stage_dir ~ '/compose.scanner-freeze.yaml', '--profile', 'scanner-exit', 'run', '--rm', '--no-deps', '-T', 'scanner-major-only'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ image_env | combine({'SCANNER_EXIT_CUSTODY_DIR': preflight_dir}) }}"
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Prove source identity inventory is readable before stopping the website
      ansible.builtin.command:
        argv: "{{ compose_base + ['-f', stage_dir ~ '/compose.scanner-freeze.yaml', '--profile', 'scanner-exit', 'run', '--rm', '--no-deps', '-T', 'scanner-auth-custody'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ image_env | combine({'SCANNER_EXIT_CUSTODY_DIR': preflight_dir}) }}"
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.slurp:
        src: "{{ preflight_dir }}/source-pg-major"
      register: source_major_preflight
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Observe target PostgreSQL major without changing commerce
      ansible.builtin.command:
        argv: [docker, exec, agentify-commerce-postgres-1, psql, -U, agentify_commerce, -d, agentify_commerce, -At, -v, ON_ERROR_STOP=1, -c, "select current_setting('server_version_num')::int / 10000"]
      register: target_major_preflight
      changed_when: false
      check_mode: false
      become: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that:
          - target_major_preflight.stdout == '17'
          - (source_major_preflight.content | b64decode | trim) | int <= 17
          - (source_major_preflight.content | b64decode | trim) is match('^[0-9]+$')
        fail_msg: Source PostgreSQL version or client compatibility requires a separate review; no source stop occurred.
      when: not ansible_check_mode
    - name: Remove only successful scratch probes; frozen custody has not been created
      ansible.builtin.file:
        path: "{{ preflight_dir }}/{{ item }}"
        state: absent
      loop: [source-pg-major, source-auth-users.ndjson]
      become: true
      no_log: true
      when: not ansible_check_mode

    - name: Record freeze start time so a rolling backup cannot be mistaken for the fresh dump
      ansible.builtin.command:
        argv: [date, -u, +%s]
      register: freeze_start
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Hold the two scanner scheduled jobs before stopping the sole writer
      ansible.builtin.command:
        argv: [mv, "{{ active_cron }}", "{{ held_cron }}"]
      become: true
      when: not ansible_check_mode
    - name: Stop only scanner web and worker; leave external Auth and DB running
      ansible.builtin.command:
        argv: "{{ compose_base + ['stop', '--timeout', '45', 'web', 'worker'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ image_env }}"
      become: true
      no_log: true
      when: not ansible_check_mode

    - name: Refuse in-flight scanner jobs or a revived worker after the stop
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --filter, label=com.docker.compose.project=agentify, --filter, "label=com.docker.compose.service={{ item }}"]
      loop: [worker, web, privacy-cleanup, database-backup]
      register: stopped_services
      changed_when: false
      check_mode: false
      become: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that: stopped_services.results | map(attribute='stdout') | select('ne', '') | list | length == 0
        fail_msg: A scanner writer or scheduled job is still active; no backup can be called frozen.
      when: not ansible_check_mode

    - name: Require the pg-boss queue has no active job after graceful worker stop
      ansible.builtin.command:
        argv: "{{ compose_base + ['-f', stage_dir ~ '/compose.scanner-freeze.yaml', '--profile', 'scanner-exit', 'run', '--rm', '--no-deps', '-T', 'scanner-queue-active'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ image_env }}"
      register: active_queue
      changed_when: false
      check_mode: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that: active_queue.stdout | trim == '0'
        fail_msg: pg-boss still has active work; queued/retry jobs are retained, but active work requires draining.
      when: not ansible_check_mode

    - name: Create one protected immutable custody directory only after the source is held and drained
      ansible.builtin.file:
        path: "{{ custody_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      become: true
      when: not ansible_check_mode

    - name: Create the fresh application-schema dump using the existing protected job
      ansible.builtin.command:
        argv: ["{{ scanner_jobs }}", backup]
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Find the just-created protected dump
      ansible.builtin.find:
        paths: "{{ backup_dir }}"
        patterns: agentify-*.dump
        file_type: file
      register: backups
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that:
          - backups.files | length > 0
          - (backups.files | sort(attribute='mtime') | last).mtime | int >= freeze_start.stdout | int
        fail_msg: Fresh scanner dump is missing; an older rolling backup is not a freeze artifact.
      when: not ansible_check_mode
    - name: Copy the frozen dump once, without pruning ordinary rolling backups
      ansible.builtin.copy:
        src: "{{ (backups.files | sort(attribute='mtime') | last).path }}"
        dest: "{{ custody_dir }}/source-frozen.dump"
        remote_src: true
        owner: root
        group: root
        mode: '0600'
        force: false
      become: true
      no_log: true
      when: not ansible_check_mode

    - name: Capture source table fingerprints and source PostgreSQL major
      ansible.builtin.command:
        argv: "{{ compose_base + ['-f', stage_dir ~ '/compose.scanner-freeze.yaml', '--profile', 'scanner-exit', 'run', '--rm', '--no-deps', '-T', 'scanner-fingerprint'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ image_env }}"
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Capture only source Auth identifiers, emails and confirmation states
      ansible.builtin.command:
        argv: "{{ compose_base + ['-f', stage_dir ~ '/compose.scanner-freeze.yaml', '--profile', 'scanner-exit', 'run', '--rm', '--no-deps', '-T', 'scanner-auth-custody'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ image_env }}"
      become: true
      no_log: true
      when: not ansible_check_mode

    - name: Hash all protected frozen artifacts
      ansible.builtin.stat:
        path: "{{ custody_dir }}/{{ item }}"
        get_checksum: true
        checksum_algorithm: sha256
      loop: [source-frozen.dump, source.fingerprint, source-auth-users.ndjson, source-pg-major]
      register: frozen
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that:
          - frozen.results | selectattr('stat.exists', 'equalto', true) | list | length == 4
          - frozen.results | selectattr('stat.mode', 'equalto', '0600') | list | length == 4
        fail_msg: A frozen artifact is missing or exposed.
      no_log: true
      when: not ansible_check_mode

    - name: Preserve immutable recovery copies on the controller, outside the VM
      ansible.builtin.file:
        path: "{{ controller_custody }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false
      when: not ansible_check_mode
    - ansible.builtin.fetch:
        src: "{{ custody_dir }}/{{ item }}"
        dest: "{{ controller_custody }}/{{ item }}"
        flat: true
      loop: [source-frozen.dump, source.fingerprint, source-auth-users.ndjson, source-pg-major]
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.file:
        path: "{{ controller_custody }}/{{ item }}"
        mode: '0600'
      loop: [source-frozen.dump, source.fingerprint, source-auth-users.ndjson, source-pg-major]
      delegate_to: localhost
      become: false
      when: not ansible_check_mode
    - name: Mark the source as frozen without deleting the source recovery path
      ansible.builtin.copy:
        content: "{{ {'source_release_sha': source_release_sha, 'bridge_release_sha': bridge_release_sha, 'dump_sha256': frozen.results[0].stat.checksum, 'fingerprint_sha256': frozen.results[1].stat.checksum, 'auth_custody_sha256': frozen.results[2].stat.checksum, 'source_major_sha256': frozen.results[3].stat.checksum} | to_nice_json }}\n"
        dest: "{{ custody_dir }}/freeze-manifest.json"
        owner: root
        group: root
        mode: '0600'
        force: false
      become: true
      no_log: true
      when: not ansible_check_mode
