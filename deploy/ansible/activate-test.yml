---
- name: Replace the existing test backend after production acceptance
  hosts: test
  gather_facts: false
  vars:
    source_sha: 15b131909c9f2a67ac4ee4f4994ece1e1c1eb199
    reviewed_release_sha: b7cf3cecb5836465370e533463b8c56899005ba6
    source_dir: /home/dmitry/coinslot-test
    candidate_dir: /home/dmitry/agentify-test-candidate
    project: coinslot-test
    postgres_volume: coinslot-test_coinslot-postgres
    caddy_volume: coinslot-test_coinslot-caddy
    source_app_image: "coinslot-app:{{ source_sha }}"
    source_web_image: "coinslot-web:{{ source_sha }}"
    test_app_image: "agentify-test-app:{{ release_sha }}"
    test_web_image: "agentify-test-web:{{ release_sha }}"
    backup_dir: "/home/dmitry/agentify-test-backups/test-{{ source_sha[0:8] }}-to-{{ release_sha[0:8] }}"
    controller_dir: "{{ playbook_dir }}/../../.local/test-backups/test-{{ source_sha[0:8] }}-to-{{ release_sha[0:8] }}"
    dump_path: "{{ backup_dir }}/test-frozen.dump"
    proof_path: "{{ backup_dir }}/freeze-proof.json"
    ready_path: "{{ backup_dir }}/backend-ready.json"
    source_argv: [docker, compose, --project-name, coinslot-test, --env-file, /home/dmitry/coinslot-test/.env, -f, compose.yaml, -f, deploy/compose.public.yaml]
    candidate_argv: [docker, compose, --project-name, coinslot-test, --env-file, /home/dmitry/agentify-test-candidate/.env, -f, compose.yaml, -f, deploy/compose.public.yaml, -f, deploy/compose.agentify-test.yaml]
    services:
      - {name: coinslot-test-postgres-1, service: postgres, old_image: 'postgres:17-alpine', new_image: 'postgres:17-alpine'}
      - {name: coinslot-test-gateway-1, service: gateway, old_image: "{{ source_app_image }}", new_image: "{{ test_app_image }}"}
      - {name: coinslot-test-cabinet-1, service: cabinet, old_image: "{{ source_app_image }}", new_image: "{{ test_app_image }}"}
      - {name: coinslot-test-web-1, service: web, old_image: "{{ source_web_image }}", new_image: "{{ test_web_image }}"}
    snapshot_sql: |
      {{ lookup('file', playbook_dir ~ '/commerce-snapshot.sql') }}
      SELECT jsonb_build_object(
        'woo_grants', (SELECT count(*) FROM public.cabinet_woo_grants),
        'woo_orders', (SELECT count(*) FROM public.cabinet_woo_orders),
        'woo_shops', (SELECT count(*) FROM public.cabinet_woo_shops),
        'gateway_migrations', (SELECT count(*) FROM drizzle.__drizzle_migrations),
        'cabinet_migrations', (SELECT count(*) FROM drizzle.cabinet_migrations),
        'boss_schedules', (SELECT count(*) FROM pgboss.schedule),
        'boss_states', (SELECT jsonb_object_agg(state, n) FROM (SELECT state, count(*) n FROM pgboss.job GROUP BY state) jobs),
        'open_refund_due', (SELECT count(*) FROM public.orders WHERE open AND state = 'refund_due')
      )::text;
  tasks:
    - name: Require the two reviewed release identities and inventory
      ansible.builtin.assert:
        that:
          - release_sha is defined
          - release_sha | default('') == reviewed_release_sha
          - inventory_hostname == 'codex-vm'
          - "'agentify' in groups['production']"
        fail_msg: This switch only applies to the reviewed b7 test release on codex-vm.

    - name: Verify the prepared candidate SHA
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ candidate_dir }}"
      register: candidate_sha
      changed_when: false
      check_mode: false

    - name: Verify the candidate has no source edits
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ candidate_dir }}"
      register: candidate_status
      changed_when: false
      check_mode: false

    - name: Refuse an unprepared or dirty candidate
      ansible.builtin.assert:
        that:
          - candidate_sha.stdout == release_sha
          - candidate_status.stdout == ''

    - name: Verify the exact archived source release marker
      ansible.builtin.slurp:
        src: "{{ source_dir }}/.coinslot-revision"
      register: source_marker

    - name: Refuse another source test release
      ansible.builtin.assert:
        that: source_marker.content | b64decode | trim == 'release-test ' ~ source_sha ~ ' status=origin-verified'

    - name: Inspect source and candidate protected environments
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: true
        checksum_algorithm: sha256
      loop:
        - "{{ source_dir }}/.env"
        - "{{ candidate_dir }}/.env"
      register: env_stats
      no_log: true

    - name: Refuse missing, exposed or wrongly owned test configuration
      ansible.builtin.assert:
        that:
          - env_stats.results | selectattr('stat.exists', 'equalto', true) | list | length == 2
          - env_stats.results | selectattr('stat.isreg', 'equalto', true) | list | length == 2
          - env_stats.results | selectattr('stat.mode', 'equalto', '0600') | list | length == 2
          - env_stats.results | selectattr('stat.pw_name', 'equalto', 'dmitry') | list | length == 2
      no_log: true

    - name: Prove the automated source test release remains disabled
      ansible.builtin.command:
        argv: [systemctl, "{{ item }}", coinslot-test-pull.timer]
      loop: [is-enabled, is-active]
      register: test_timer
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse an automated redeploy during the ownership switch
      ansible.builtin.assert:
        that:
          - test_timer.results[0].stdout == 'disabled'
          - test_timer.results[1].stdout == 'inactive'

    - name: Compare actual source and candidate migration bytes
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import hashlib, pathlib, sys
            old, new = (pathlib.Path(p) for p in sys.argv[1:])
            rels = []
            for app in ('gateway', 'cabinet'):
                base = pathlib.Path('apps') / app / 'drizzle'
                rels.extend(p.relative_to(old) for p in (old / base).rglob('*') if p.is_file())
            def digest(root, rel):
                return hashlib.sha256((root / rel).read_bytes()).digest()
            assert len([r for r in rels if r.suffix == '.sql' and 'gateway' in r.parts]) == 9
            assert len([r for r in rels if r.suffix == '.sql' and 'cabinet' in r.parts]) == 5
            assert all(digest(old, rel) == digest(new, rel) for rel in rels)
            print('identical 9 gateway and 5 cabinet migrations')
          - "{{ source_dir }}"
          - "{{ candidate_dir }}"
      register: migration_identity
      changed_when: false
      check_mode: false
      no_log: true

    - name: Resolve both Compose configurations without starting anything
      ansible.builtin.command:
        argv: "{{ item.argv + ['config', '--format', 'json'] }}"
        chdir: "{{ item.dir }}"
      loop:
        - {argv: "{{ source_argv }}", dir: "{{ source_dir }}"}
        - {argv: "{{ candidate_argv }}", dir: "{{ candidate_dir }}"}
      register: compose_configs
      become: true
      changed_when: false
      check_mode: false
      no_log: true

    - name: Refuse a changed payment, authentication, database or test surface contract
      ansible.builtin.assert:
        that:
          - (compose_configs.results[0].stdout | from_json).services.gateway.image == source_app_image
          - (compose_configs.results[0].stdout | from_json).services.cabinet.image == source_app_image
          - (compose_configs.results[0].stdout | from_json).services.web.image == source_web_image
          - (compose_configs.results[1].stdout | from_json).services.gateway.image == test_app_image
          - (compose_configs.results[1].stdout | from_json).services.cabinet.image == test_app_image
          - (compose_configs.results[1].stdout | from_json).services.web.image == test_web_image
          - (compose_configs.results[1].stdout | from_json).services.postgres.image == 'postgres:17-alpine'
          - (compose_configs.results[1].stdout | from_json).services.migrate.image == test_app_image
          - (compose_configs.results[1].stdout | from_json).services.merchant.profiles == ['fixtures']
          - (compose_configs.results[0].stdout | from_json).services.gateway.environment.PUBLIC_BASE_URL == 'https://test.coinslot.nuanu.ai'
          - (compose_configs.results[1].stdout | from_json).services.gateway.environment == ((compose_configs.results[0].stdout | from_json).services.gateway.environment | combine({'PUBLIC_BASE_URL':'https://test.agentify.ad'}))
          - (compose_configs.results[1].stdout | from_json).services.cabinet.environment == ((compose_configs.results[0].stdout | from_json).services.cabinet.environment | combine({'PUBLIC_BASE_URL':'https://test.agentify.ad'}))
          - (compose_configs.results[1].stdout | from_json).services.gateway.environment.PAYMENT_NETWORK == 'eip155:84532'
          - (compose_configs.results[1].stdout | from_json).services.gateway.environment.CDP_API_KEY_ID == ''
          - (compose_configs.results[1].stdout | from_json).services.gateway.environment.CDP_API_KEY_SECRET == ''
          - (compose_configs.results[1].stdout | from_json).services.gateway.environment.SANDBOX_MERCHANT_KEY == '' or (compose_configs.results[1].stdout | from_json).services.gateway.environment.SANDBOX_MERCHANT_KEY is match('^csk_test_')
          - (compose_configs.results[1].stdout | from_json).services.cabinet.environment.COOKIE_SECURE == 'true'
          - (compose_configs.results[0].stdout | from_json).services.web.environment.COINSLOT_SURFACE_MODE == 'test'
          - (compose_configs.results[1].stdout | from_json).services.web.environment.COINSLOT_SURFACE_MODE == 'test'
          - (compose_configs.results[1].stdout | from_json).services.web.environment.COINSLOT_SITE_ADDRESS == 'test.agentify.ad'
          - (compose_configs.results[1].stdout | from_json).services.postgres.ports | default([]) == []
          - (compose_configs.results[1].stdout | from_json).services.web.ports | length == 1
          - (compose_configs.results[1].stdout | from_json).services.web.ports[0].host_ip == '10.20.10.20'
          - (compose_configs.results[1].stdout | from_json).services.web.ports[0].published | string == '8443'
          - (compose_configs.results[1].stdout | from_json).services.web.ports[0].target | string == '443'
        fail_msg: The candidate may change only test origin, hostname and exact SHA images.
      no_log: true

    - name: Inspect production and delivered test image IDs
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ item.app }}", "{{ item.web }}"]
      loop:
        - {host: agentify, app: "agentify-commerce-app:{{ release_sha }}", web: "agentify-commerce-web:{{ release_sha }}"}
        - {host: codex-vm, app: "{{ test_app_image }}", web: "{{ test_web_image }}"}
      delegate_to: "{{ item.host }}"
      become: true
      register: reviewed_images
      changed_when: false
      check_mode: false
      no_log: true

    - name: Refuse image tags that differ from the reviewed production release
      ansible.builtin.assert:
        that:
          - (reviewed_images.results[0].stdout | from_json)[0].Id == (reviewed_images.results[1].stdout | from_json)[0].Id
          - (reviewed_images.results[0].stdout | from_json)[1].Id == (reviewed_images.results[1].stdout | from_json)[1].Id
      no_log: true

    - name: Inspect the four named existing test containers
      ansible.builtin.command:
        argv: [docker, inspect, "{{ item.name }}"]
      loop: "{{ services }}"
      become: true
      register: runtime_containers
      changed_when: false
      check_mode: false
      no_log: true

    - name: Identify the archived test image IDs held by Docker
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ source_app_image }}", "{{ source_web_image }}"]
      become: true
      register: source_images
      changed_when: false
      check_mode: false
      no_log: true

    - name: Refuse a different project, volume, port, restart policy or service
      ansible.builtin.assert:
        that:
          - (item.stdout | from_json | first).Config.Labels['com.docker.compose.project'] == project
          - (item.stdout | from_json | first).Config.Labels['com.docker.compose.service'] == item.item.service
          - (item.stdout | from_json | first).Config.Image in [item.item.old_image, item.item.new_image]
          - (item.stdout | from_json | first).Config.Image != item.item.old_image or item.item.service == 'postgres' or (item.stdout | from_json | first).Image == (source_images.stdout | from_json)[0 if item.item.service in ['gateway','cabinet'] else 1].Id
          - (item.stdout | from_json | first).HostConfig.RestartPolicy.Name == 'unless-stopped'
          - (item.stdout | from_json | first).Config.Labels['com.docker.compose.project.working_dir'] == (source_dir if (item.stdout | from_json | first).Config.Image == item.item.old_image else candidate_dir)
          - (item.stdout | from_json | first).Config.Labels['com.docker.compose.project.config_files'] == (source_dir ~ '/compose.yaml,' ~ source_dir ~ '/deploy/compose.public.yaml' if (item.stdout | from_json | first).Config.Image == item.item.old_image else candidate_dir ~ '/compose.yaml,' ~ candidate_dir ~ '/deploy/compose.public.yaml,' ~ candidate_dir ~ '/deploy/compose.agentify-test.yaml')
          - item.item.service != 'postgres' or ((item.stdout | from_json | first).Mounts | selectattr('Destination', 'equalto', '/var/lib/postgresql/data') | map(attribute='Name') | list) == [postgres_volume]
          - item.item.service != 'web' or ((item.stdout | from_json | first).Mounts | selectattr('Destination', 'equalto', '/data') | map(attribute='Name') | list) == [caddy_volume]
          - item.item.service != 'web' or (item.stdout | from_json | first).HostConfig.PortBindings == {'443/tcp':[{'HostIp':'10.20.10.20','HostPort':'8443'}]}
        fail_msg: A named test container differs from the reviewed source or candidate.
      loop: "{{ runtime_containers.results }}"
      no_log: true

    - name: Require the original healthy database to remain the only database
      ansible.builtin.assert:
        that:
          - (runtime_containers.results[0].stdout | from_json | first).State.Health.Status == 'healthy'
          - (runtime_containers.results[0].stdout | from_json | first).Config.Labels['com.docker.compose.project.working_dir'] == source_dir
          - (runtime_containers.results[0].stdout | from_json | first).Config.Labels['com.docker.compose.project.config_files'] == source_dir ~ '/compose.yaml,' ~ source_dir ~ '/deploy/compose.public.yaml'
      no_log: true

    - name: Inventory every running container in the test project
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --no-trunc, --filter, label=com.docker.compose.project=coinslot-test]
      become: true
      register: running_project
      changed_when: false
      check_mode: false

    - name: Refuse an unknown test worker or duplicate service
      ansible.builtin.assert:
        that: >-
          running_project.stdout_lines | difference(runtime_containers.results
            | map(attribute='stdout') | map('from_json') | map('first') | map(attribute='Id') | list) | length == 0

    - name: Identify an interrupted or completed candidate activation
      ansible.builtin.set_fact:
        new_gateway: "{{ (runtime_containers.results[1].stdout | from_json | first).Config.Image == test_app_image }}"
        new_cabinet: "{{ (runtime_containers.results[2].stdout | from_json | first).Config.Image == test_app_image }}"
        new_web: "{{ (runtime_containers.results[3].stdout | from_json | first).Config.Image == test_web_image }}"

    - name: Verify actual old gateway environment matches its protected source config
      ansible.builtin.assert:
        that: (runtime_containers.results[1].stdout | from_json | first).Config.Env | select('equalto', item.key ~ '=' ~ (item.value | string | replace('$$', '$'))) | list | length == 1
      loop: "{{ (compose_configs.results[0].stdout | from_json).services.gateway.environment | dict2items }}"
      when: not new_gateway
      no_log: true

    - name: Verify actual old cabinet environment matches its protected source config
      ansible.builtin.assert:
        that: (runtime_containers.results[2].stdout | from_json | first).Config.Env | select('equalto', item.key ~ '=' ~ (item.value | string | replace('$$', '$'))) | list | length == 1
      loop: "{{ (compose_configs.results[0].stdout | from_json).services.cabinet.environment | dict2items }}"
      when: not new_cabinet
      no_log: true

    - name: Inspect the exact release-specific freeze proof and dump
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: true
        checksum_algorithm: sha256
      loop: ["{{ proof_path }}", "{{ dump_path }}"]
      register: prior_recovery
      no_log: true

    - name: Refuse new writers without a pre-start freeze proof
      ansible.builtin.assert:
        that:
          - not (new_gateway or new_cabinet or new_web) or prior_recovery.results[0].stat.exists
          - not prior_recovery.results[0].stat.exists or prior_recovery.results[1].stat.exists
          - not prior_recovery.results[1].stat.exists or prior_recovery.results[0].stat.exists or (not (runtime_containers.results[1].stdout | from_json | first).State.Running and not (runtime_containers.results[2].stdout | from_json | first).State.Running)
          - not prior_recovery.results[0].stat.exists or new_gateway or not (runtime_containers.results[1].stdout | from_json | first).State.Running
          - not prior_recovery.results[0].stat.exists or new_cabinet or not (runtime_containers.results[2].stdout | from_json | first).State.Running
          - not prior_recovery.results[0].stat.exists or new_web or not (runtime_containers.results[3].stdout | from_json | first).State.Running
        fail_msg: A prior or mixed activation needs its verified freeze proof and no revived old writers.
      no_log: true

    - name: Establish protected server and controller recovery directories before stopping web
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: '0700'
      loop:
        - {path: "{{ backup_dir }}", owner: dmitry, host: codex-vm}
        - {path: "{{ controller_dir }}", owner: dmitry, host: localhost}
      delegate_to: "{{ item.host }}"
      when: not ansible_check_mode

    - name: Preserve both source and candidate environments without overwriting a prior copy
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ backup_dir }}/{{ item.name }}"
        remote_src: true
        owner: dmitry
        group: dmitry
        mode: '0600'
        force: false
      loop:
        - {src: "{{ source_dir }}/.env", name: source.env}
        - {src: "{{ candidate_dir }}/.env", name: candidate.env}
      when: not ansible_check_mode
      no_log: true

    - name: Check preserved environment copies before source shutdown
      ansible.builtin.stat:
        path: "{{ backup_dir }}/{{ item }}"
        get_checksum: true
        checksum_algorithm: sha256
      loop: [source.env, candidate.env]
      register: saved_envs
      when: not ansible_check_mode
      no_log: true

    - name: Refuse drift in the protected environment copies
      ansible.builtin.assert:
        that:
          - saved_envs.results[0].stat.mode == '0600'
          - saved_envs.results[1].stat.mode == '0600'
          - saved_envs.results[0].stat.checksum == env_stats.results[0].stat.checksum
          - saved_envs.results[1].stat.checksum == env_stats.results[1].stat.checksum
      when: not ansible_check_mode
      no_log: true

    - name: Close the old test web listener before freezing its writers
      ansible.builtin.command:
        argv: [docker, stop, --time, '30', coinslot-test-web-1]
      become: true
      when: not ansible_check_mode and not prior_recovery.results[0].stat.exists and not new_web and (runtime_containers.results[3].stdout | from_json | first).State.Running

    - name: Gracefully stop the old gateway and cabinet before the final dump
      ansible.builtin.command:
        argv: [docker, stop, --time, '30', "{{ item.name }}"]
      loop:
        - {name: coinslot-test-gateway-1, old: "{{ not new_gateway }}", running: "{{ (runtime_containers.results[1].stdout | from_json | first).State.Running }}"}
        - {name: coinslot-test-cabinet-1, old: "{{ not new_cabinet }}", running: "{{ (runtime_containers.results[2].stdout | from_json | first).State.Running }}"}
      become: true
      when: not ansible_check_mode and not prior_recovery.results[0].stat.exists and item.old and item.running

    - name: Prove no source writers remain before recording the final rows
      ansible.builtin.command:
        argv: [docker, inspect, "{{ item }}"]
      loop: [coinslot-test-gateway-1, coinslot-test-cabinet-1, coinslot-test-web-1]
      become: true
      register: frozen_services
      changed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode and not prior_recovery.results[0].stat.exists

    - name: Refuse a final dump while an old service or worker is running
      ansible.builtin.assert:
        that:
          - frozen_services.results | map(attribute='stdout') | map('from_json') | map('first') | map(attribute='State.Running') | list == [false,false,false]
      when: not ansible_check_mode and not prior_recovery.results[0].stat.exists
      no_log: true

    - name: Record protected original row hashes and queue aggregates before dumping
      ansible.builtin.command:
        argv: [docker, exec, -i, coinslot-test-postgres-1, psql, -U, coinslot, -d, coinslot, -Atq, -v, ON_ERROR_STOP=1]
        stdin: "{{ snapshot_sql }}"
      become: true
      register: frozen_rows
      changed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode and not prior_recovery.results[0].stat.exists

    - name: Refuse an unexpected test schema or unfinished queue operation
      ansible.builtin.assert:
        that:
          - frozen_rows.stdout_lines | length == 2
          - (frozen_rows.stdout_lines[-2] | from_json).tables | length == 10
          - (frozen_rows.stdout_lines[-1] | from_json).gateway_migrations == 9
          - (frozen_rows.stdout_lines[-1] | from_json).cabinet_migrations == 5
          - (frozen_rows.stdout_lines[-1] | from_json).woo_grants == 0
          - (frozen_rows.stdout_lines[-1] | from_json).woo_orders == 0
          - (frozen_rows.stdout_lines[-1] | from_json).woo_shops == 0
          - (frozen_rows.stdout_lines[-1] | from_json).boss_states.active | default(0) == 0
          - (frozen_rows.stdout_lines[-1] | from_json).boss_states.retry | default(0) == 0
        fail_msg: Preserve the existing refund-due orders and created jobs; reinventory unexpected schema or active jobs.
      when: not ansible_check_mode and not prior_recovery.results[0].stat.exists
      no_log: true

    - name: Make one complete protected custom-format test dump after freeze
      ansible.builtin.shell: |
        set -eu
        umask 077
        test ! -e {{ dump_path | quote }}
        tmp=$(mktemp {{ (dump_path ~ '.tmp.XXXXXX') | quote }})
        trap 'rm -f "$tmp"' EXIT
        docker exec coinslot-test-postgres-1 pg_dump -Fc -U coinslot -d coinslot > "$tmp"
        test -s "$tmp"
        mv -n "$tmp" {{ dump_path | quote }}
      args:
        executable: /bin/bash
      become: true
      when: not ansible_check_mode and not prior_recovery.results[0].stat.exists and not prior_recovery.results[1].stat.exists
      no_log: true

    - name: Make the protected dump readable for the controller recovery fetch
      ansible.builtin.file:
        path: "{{ dump_path }}"
        state: file
        owner: dmitry
        group: dmitry
        mode: '0600'
      become: true
      when: not ansible_check_mode
      no_log: true

    - name: Verify the frozen archive can be listed without a network
      ansible.builtin.command:
        argv: [docker, run, --rm, --network, none, --volume, "{{ backup_dir }}:/backups:ro", 'postgres:17-alpine', pg_restore, --list, /backups/test-frozen.dump]
      become: true
      register: listed_archive
      changed_when: false
      no_log: true
      when: not ansible_check_mode and not prior_recovery.results[0].stat.exists

    - name: Prove the frozen original rows did not move during dump creation
      ansible.builtin.command:
        argv: [docker, exec, -i, coinslot-test-postgres-1, psql, -U, coinslot, -d, coinslot, -Atq, -v, ON_ERROR_STOP=1]
        stdin: "{{ snapshot_sql }}"
      become: true
      register: after_dump_rows
      changed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode and not prior_recovery.results[0].stat.exists

    - name: Refuse any changed original business, Woo or queue rows before startup
      ansible.builtin.assert:
        that: after_dump_rows.stdout_lines == frozen_rows.stdout_lines
      when: not ansible_check_mode and not prior_recovery.results[0].stat.exists
      no_log: true

    - name: Verify fresh dump, environment and controller custody checksums
      ansible.builtin.stat:
        path: "{{ item.path }}"
        get_checksum: true
        checksum_algorithm: sha256
      loop:
        - {path: "{{ dump_path }}", host: codex-vm}
        - {path: "{{ backup_dir }}/source.env", host: codex-vm}
        - {path: "{{ backup_dir }}/candidate.env", host: codex-vm}
        - {path: "{{ controller_dir }}/test-frozen.dump", host: localhost}
        - {path: "{{ controller_dir }}/source.env", host: localhost}
        - {path: "{{ controller_dir }}/candidate.env", host: localhost}
      delegate_to: "{{ item.host }}"
      register: recovery_files
      no_log: true
      when: not ansible_check_mode

    - name: Refuse prior controller files whose bytes or mode differ
      ansible.builtin.assert:
        that:
          - recovery_files.results[0].stat.isreg
          - recovery_files.results[0].stat.mode == '0600'
          - recovery_files.results[0].stat.size > 0
          - recovery_files.results[3].stat.exists | default(false) == false or (recovery_files.results[3].stat.mode == '0600' and recovery_files.results[3].stat.checksum == recovery_files.results[0].stat.checksum)
          - recovery_files.results[4].stat.exists | default(false) == false or (recovery_files.results[4].stat.mode == '0600' and recovery_files.results[4].stat.checksum == recovery_files.results[1].stat.checksum)
          - recovery_files.results[5].stat.exists | default(false) == false or (recovery_files.results[5].stat.mode == '0600' and recovery_files.results[5].stat.checksum == recovery_files.results[2].stat.checksum)
      when: not ansible_check_mode
      no_log: true

    - name: Fetch the frozen dump and both protected environments off the test VM
      ansible.builtin.fetch:
        src: "{{ item.src }}"
        dest: "{{ controller_dir }}/{{ item.name }}"
        flat: true
      loop:
        - {src: "{{ dump_path }}", name: test-frozen.dump}
        - {src: "{{ backup_dir }}/source.env", name: source.env}
        - {src: "{{ backup_dir }}/candidate.env", name: candidate.env}
      when: not ansible_check_mode and not prior_recovery.results[0].stat.exists
      no_log: true

    - name: Restrict every fetched recovery artifact
      ansible.builtin.file:
        path: "{{ controller_dir }}/{{ item }}"
        state: file
        mode: '0600'
      loop: [test-frozen.dump, source.env, candidate.env]
      delegate_to: localhost
      when: not ansible_check_mode and not prior_recovery.results[0].stat.exists
      no_log: true

    - name: Verify off-VM bytes survived the fetch before starting new writers
      ansible.builtin.stat:
        path: "{{ controller_dir }}/{{ item }}"
        get_checksum: true
        checksum_algorithm: sha256
      loop: [test-frozen.dump, source.env, candidate.env]
      delegate_to: localhost
      register: off_vm_files
      when: not ansible_check_mode
      no_log: true

    - name: Require identical protected off-VM dump and secret copies
      ansible.builtin.assert:
        that:
          - off_vm_files.results | selectattr('stat.mode', 'equalto', '0600') | list | length == 3
          - off_vm_files.results[0].stat.checksum == recovery_files.results[0].stat.checksum
          - off_vm_files.results[1].stat.checksum == env_stats.results[0].stat.checksum
          - off_vm_files.results[2].stat.checksum == env_stats.results[1].stat.checksum
      when: not ansible_check_mode
      no_log: true

    - name: Record the release-specific pre-start row and recovery proof
      ansible.builtin.copy:
        dest: "{{ proof_path }}"
        content: "{{ {'source_sha':source_sha, 'release_sha':release_sha, 'dump_sha256':recovery_files.results[0].stat.checksum, 'source_env_sha256':env_stats.results[0].stat.checksum, 'candidate_env_sha256':env_stats.results[1].stat.checksum, 'postgres_volume':postgres_volume, 'business_rows':(frozen_rows.stdout_lines[-2] | from_json), 'related_rows':(frozen_rows.stdout_lines[-1] | from_json)} | to_nice_json }}\n"
        owner: dmitry
        group: dmitry
        mode: '0600'
        force: false
      when: not ansible_check_mode and not prior_recovery.results[0].stat.exists
      no_log: true

    - name: Read the immutable pre-start proof for first apply or retry
      ansible.builtin.slurp:
        src: "{{ proof_path }}"
      register: freeze_proof
      when: not ansible_check_mode
      no_log: true

    - name: Refuse a proof for other data, images or protected configuration
      ansible.builtin.assert:
        that:
          - (freeze_proof.content | b64decode | from_json).source_sha == source_sha
          - (freeze_proof.content | b64decode | from_json).release_sha == release_sha
          - (freeze_proof.content | b64decode | from_json).postgres_volume == postgres_volume
          - (freeze_proof.content | b64decode | from_json).dump_sha256 == recovery_files.results[0].stat.checksum
          - (freeze_proof.content | b64decode | from_json).source_env_sha256 == env_stats.results[0].stat.checksum
          - (freeze_proof.content | b64decode | from_json).candidate_env_sha256 == env_stats.results[1].stat.checksum
      when: not ansible_check_mode
      no_log: true

    - name: Identify server and controller proof custody
      ansible.builtin.stat:
        path: "{{ item.path }}"
        get_checksum: true
        checksum_algorithm: sha256
      loop:
        - {path: "{{ proof_path }}", host: codex-vm}
        - {path: "{{ controller_dir }}/freeze-proof.json", host: localhost}
      delegate_to: "{{ item.host }}"
      register: proof_custody
      when: not ansible_check_mode
      no_log: true

    - name: Refuse an altered controller proof rather than overwriting it
      ansible.builtin.assert:
        that:
          - proof_custody.results[0].stat.isreg
          - proof_custody.results[0].stat.mode == '0600'
          - not (proof_custody.results[1].stat.exists | default(false)) or (proof_custody.results[1].stat.isreg and proof_custody.results[1].stat.mode == '0600' and proof_custody.results[1].stat.checksum == proof_custody.results[0].stat.checksum)
        fail_msg: An existing off-VM freeze proof is missing protection or has different bytes; reconcile it before starting test writers.
      when: not ansible_check_mode
      no_log: true

    - name: Fetch a missing validated freeze proof off the test VM
      ansible.builtin.fetch:
        src: "{{ proof_path }}"
        dest: "{{ controller_dir }}/freeze-proof.json"
        flat: true
      when: not ansible_check_mode and not (proof_custody.results[1].stat.exists | default(false))
      no_log: true

    - name: Restrict a newly fetched controller proof
      ansible.builtin.file:
        path: "{{ controller_dir }}/freeze-proof.json"
        state: file
        mode: '0600'
      delegate_to: localhost
      when: not ansible_check_mode and not (proof_custody.results[1].stat.exists | default(false))
      no_log: true

    - name: Verify the final off-VM proof bytes before starting any candidate writer
      ansible.builtin.stat:
        path: "{{ controller_dir }}/freeze-proof.json"
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: localhost
      register: final_controller_proof
      when: not ansible_check_mode
      no_log: true

    - name: Require identical protected proof on server and controller
      ansible.builtin.assert:
        that:
          - final_controller_proof.stat.isreg
          - final_controller_proof.stat.mode == '0600'
          - final_controller_proof.stat.checksum == proof_custody.results[0].stat.checksum
      when: not ansible_check_mode
      no_log: true

    - name: Recheck the original frozen rows before any first new writer starts
      ansible.builtin.command:
        argv: [docker, exec, -i, coinslot-test-postgres-1, psql, -U, coinslot, -d, coinslot, -Atq, -v, ON_ERROR_STOP=1]
        stdin: "{{ snapshot_sql }}"
      become: true
      register: pre_start_rows
      changed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode and not (new_gateway or new_cabinet or new_web)

    - name: Prove original rows and queued test debt still match the freeze
      ansible.builtin.assert:
        that:
          - (pre_start_rows.stdout_lines[-2] | from_json) == (freeze_proof.content | b64decode | from_json).business_rows
          - (pre_start_rows.stdout_lines[-1] | from_json) == (freeze_proof.content | b64decode | from_json).related_rows
      when: not ansible_check_mode and not (new_gateway or new_cabinet or new_web)
      no_log: true

    - name: Start only candidate gateway, cabinet and web on the original test volumes
      when: not ansible_check_mode
      block:
        - name: Start exact gateway and cabinet images without dependencies or builds
          ansible.builtin.command:
            argv: "{{ candidate_argv + ['up', '-d', '--wait', '--wait-timeout', '180', '--no-deps', '--no-build', '--pull', 'never', 'gateway', 'cabinet'] }}"
            chdir: "{{ candidate_dir }}"
          become: true
          register: app_up
          changed_when: "'Created' in app_up.stderr or 'Started' in app_up.stderr or 'Recreated' in app_up.stderr"

        - name: Start exact test Caddy on the preserved port and certificate volume
          ansible.builtin.command:
            argv: "{{ candidate_argv + ['up', '-d', '--wait', '--wait-timeout', '180', '--no-deps', '--no-build', '--pull', 'never', 'web'] }}"
            chdir: "{{ candidate_dir }}"
          become: true
          register: web_up
          changed_when: "'Created' in web_up.stderr or 'Started' in web_up.stderr or 'Recreated' in web_up.stderr"

        - name: Inspect the final named services and original database volume
          ansible.builtin.command:
            argv: [docker, inspect, "{{ item.name }}"]
          loop: "{{ services }}"
          become: true
          register: final_containers
          changed_when: false
          check_mode: false
          no_log: true

        - name: Require exact images, source database, private bind and healthy processes
          ansible.builtin.assert:
            that:
              - (final_containers.results[0].stdout | from_json | first).State.Health.Status == 'healthy'
              - ((final_containers.results[0].stdout | from_json | first).Mounts | selectattr('Destination', 'equalto', '/var/lib/postgresql/data') | map(attribute='Name') | list) == [postgres_volume]
              - (final_containers.results[0].stdout | from_json | first).Config.Labels['com.docker.compose.project.working_dir'] == source_dir
              - (final_containers.results[1].stdout | from_json | first).State.Health.Status == 'healthy'
              - (final_containers.results[2].stdout | from_json | first).State.Health.Status == 'healthy'
              - (final_containers.results[1].stdout | from_json | first).Config.Image == test_app_image
              - (final_containers.results[2].stdout | from_json | first).Config.Image == test_app_image
              - (final_containers.results[1].stdout | from_json | first).Config.Labels['com.docker.compose.project.working_dir'] == candidate_dir
              - (final_containers.results[2].stdout | from_json | first).Config.Labels['com.docker.compose.project.working_dir'] == candidate_dir
              - (final_containers.results[1].stdout | from_json | first).Image == (reviewed_images.results[1].stdout | from_json)[0].Id
              - (final_containers.results[2].stdout | from_json | first).Image == (reviewed_images.results[1].stdout | from_json)[0].Id
              - (final_containers.results[3].stdout | from_json | first).State.Running
              - (final_containers.results[3].stdout | from_json | first).Config.Image == test_web_image
              - (final_containers.results[3].stdout | from_json | first).Config.Labels['com.docker.compose.project.working_dir'] == candidate_dir
              - (final_containers.results[3].stdout | from_json | first).Image == (reviewed_images.results[1].stdout | from_json)[1].Id
              - (final_containers.results[3].stdout | from_json | first).HostConfig.PortBindings == {'443/tcp':[{'HostIp':'10.20.10.20','HostPort':'8443'}]}
              - ((final_containers.results[3].stdout | from_json | first).Mounts | selectattr('Destination', 'equalto', '/data') | map(attribute='Name') | list) == [caddy_volume]
              - "'COINSLOT_SITE_ADDRESS=test.agentify.ad' in (final_containers.results[3].stdout | from_json | first).Config.Env"
              - "'COINSLOT_SURFACE_MODE=test' in (final_containers.results[3].stdout | from_json | first).Config.Env"
            fail_msg: Do not open ingress for an unverified backend or changed original volume.
          no_log: true

        - name: Validate the new Caddy routes without requiring pre-merge TLS
          ansible.builtin.command:
            argv: [docker, exec, coinslot-test-web-1, caddy, validate, --config, /etc/caddy/Caddyfile]
          become: true
          changed_when: false
          no_log: true

        - name: Record only private backend readiness, with public TLS pending
          ansible.builtin.copy:
            dest: "{{ ready_path }}"
            content: "{{ {'source_sha':source_sha, 'release_sha':release_sha, 'dump_sha256':(freeze_proof.content | b64decode | from_json).dump_sha256, 'backend':'10.20.10.20:8443', 'tls':'pending-ingress-merge-and-apply'} | to_nice_json }}\n"
            owner: dmitry
            group: dmitry
            mode: '0600'
          no_log: true

      rescue:
        - name: Stop every test writer and web after failed candidate acceptance
          ansible.builtin.command:
            argv: [docker, stop, --time, '30', coinslot-test-web-1, coinslot-test-gateway-1, coinslot-test-cabinet-1]
          become: true
          register: failed_candidate_stop
          failed_when: false
          no_log: true

        - name: Verify no test writer remains after failed acceptance
          ansible.builtin.command:
            argv: [docker, ps, --quiet, --no-trunc, --filter, label=com.docker.compose.project=coinslot-test]
          become: true
          register: failed_candidate_running
          changed_when: false
          check_mode: false
          failed_when: false

        - name: Refuse automatic rollback to old test writers
          ansible.builtin.fail:
            msg: >-
              Candidate acceptance failed. The original volume, frozen dump and
              protected environments remain. Writer-stop rc={{ failed_candidate_stop.rc }};
              running-project-inventory rc={{ failed_candidate_running.rc }};
              {{ 'writer state unknown' if failed_candidate_running.rc != 0 else
                 ('all test writers and web are stopped' if
                  (failed_candidate_running.stdout_lines | difference([(runtime_containers.results[0].stdout | from_json | first).Id]) | length) == 0 else
                  'test writer, web or unknown project process still running') }};
              remaining non-Postgres project containers={{
                'unknown' if failed_candidate_running.rc != 0 else
                (failed_candidate_running.stdout_lines | difference([(runtime_containers.results[0].stdout | from_json | first).Id]) | length) }}.
              Reconcile through reviewed Ansible before any old restart or public ingress merge.

    - name: State the backend-only acceptance boundary in check mode
      ansible.builtin.debug:
        msg: >-
          This preview verified exact source/candidate/test image and payment identities.
          Apply freezes and backs up the original test volume, then replaces only
          gateway, cabinet and web. Valid public TLS waits for the human-merged
          Comino ingress route.
      when: ansible_check_mode
