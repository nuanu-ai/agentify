---
- name: Open restored commerce through the existing scanner and commerce TLS edge
  hosts: production
  gather_facts: false
  vars:
    source_host: codex-vm
    source_sha: a2c5b891224bcb9dd10b61f05ad7cc0f2f996940
    release_dir: /home/dmitry/agentify-commerce
    edge_dir: /home/dmitry/agentify-commerce/deploy/edge
    scanner_env: /home/dmitry/agentify-scanner/.env.production
    backup_name: "commerce-{{ source_sha[0:8] }}-to-{{ release_sha[0:8] }}"
    backup_dir: "/home/dmitry/agentify-backups/{{ backup_name }}"
    private_marker: "{{ backup_dir }}/private-started.json"
    restore_marker: "{{ backup_dir }}/restore-verified.json"
    public_marker: "{{ backup_dir }}/public-accepted.json"
    snapshot_sql: "{{ lookup('file', playbook_dir ~ '/commerce-snapshot.sql') }}"
    commerce_argv:
      - docker
      - compose
      - --project-name
      - agentify-commerce
      - --env-file
      - /home/dmitry/agentify-commerce/.env
      - -f
      - compose.yaml
      - -f
      - deploy/compose.public.yaml
      - -f
      - deploy/compose.hetzner-commerce.yaml
    commerce_images:
      COINSLOT_APP_IMAGE: "agentify-commerce-app:{{ release_sha }}"
      COINSLOT_WEB_IMAGE: "agentify-commerce-web:{{ release_sha }}"
    safe_private_probe: >-
      Promise.all(['/healthz','/cabinet/healthz','/x402/catalog','/docs/quickstart']
      .map(async path=>{const r=await fetch('http://web:8080'+path);if(!r.ok)throw Error(path+': '+r.status)}))
      .then(()=>process.exit(0)).catch(()=>process.exit(1))
    edge_argv: [docker, compose, --env-file, /home/dmitry/agentify-scanner/.env.production, -f, compose.yaml]
    maintenance_argv: [docker, compose, --env-file, /home/dmitry/agentify-scanner/.env.production, -f, compose.yaml, -f, compose.scanner-active.yaml]
  tasks:
    - name: Require the reviewed prepared runtime release
      ansible.builtin.assert:
        that:
          - release_sha is defined
          - release_sha | default('') is match('^[0-9a-f]{40}$')
          - source_host in groups['test']

    - name: Identify the already prepared runtime before marker-based recovery
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ release_dir }}"
      register: runtime_sha
      changed_when: false
      check_mode: false

    - name: Refuse recovery with a release argument for another runtime
      ansible.builtin.assert:
        that: runtime_sha.stdout == release_sha
        fail_msg: Pass the actual prepared runtime SHA; a different argument must not quarantine accepted public commerce.

    - name: Inventory the shared public edge before application health checks
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --no-trunc, --filter, label=com.docker.compose.project=agentify-edge]
      become: true
      register: edge_ids
      changed_when: false
      check_mode: false

    - name: Require precisely one public Caddy in the reviewed edge project
      ansible.builtin.assert:
        that: edge_ids.stdout_lines | length == 1

    - name: Inspect the current shared edge before any application probe
      ansible.builtin.command:
        argv: [docker, inspect, "{{ edge_ids.stdout }}"]
      become: true
      register: existing_edge
      changed_when: false
      check_mode: false
      no_log: true

    - name: Refuse an unrelated edge before any public-state recovery
      ansible.builtin.assert:
        that:
          - (existing_edge.stdout | from_json | first).Config.Image == 'caddy:2.10.0-alpine'
          - (existing_edge.stdout | from_json | first).Config.Labels['com.docker.compose.project'] == 'agentify-edge'
          - (existing_edge.stdout | from_json | first).Config.Labels['com.docker.compose.service'] == 'caddy'
          - >-
            (existing_edge.stdout | from_json | first).Mounts
            | selectattr('Destination', 'equalto', '/etc/caddy/Caddyfile')
            | map(attribute='Source') | list in
            [[edge_dir ~ '/Caddyfile.scanner-active'], [edge_dir ~ '/Caddyfile']]
        fail_msg: Inspect an unrelated public edge before modifying commerce routing.
      no_log: true

    - name: Inspect public-acceptance marker before application health checks
      ansible.builtin.stat:
        path: "{{ public_marker }}"
      become: true
      register: public_marker_state
      no_log: true

    - name: Quarantine interrupted public activation without accepted proof
      ansible.builtin.include_tasks: commerce-public-recovery.yml
      when: >-
        not public_marker_state.stat.exists and
        ((existing_edge.stdout | from_json | first).Mounts
         | selectattr('Destination', 'equalto', '/etc/caddy/Caddyfile')
         | map(attribute='Source') | list) == [edge_dir ~ '/Caddyfile']

    - name: Verify the prepared runtime checkout is still clean
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ release_dir }}"
      register: checkout_status
      changed_when: false
      check_mode: false

    - name: Refuse an edited runtime before opening public traffic
      ansible.builtin.assert:
        that: checkout_status.stdout == ''

    - name: Read the frozen restore and successful private startup proofs
      ansible.builtin.slurp:
        src: "{{ item }}"
      become: true
      loop:
        - "{{ restore_marker }}"
        - "{{ private_marker }}"
      register: commerce_proofs
      no_log: true

    - name: Refuse public routing over unverified or mismatched data
      ansible.builtin.assert:
        that:
          - (commerce_proofs.results[0].content | b64decode | from_json).release_sha == release_sha
          - (commerce_proofs.results[0].content | b64decode | from_json).source_sha == source_sha
          - (commerce_proofs.results[1].content | b64decode | from_json).release_sha == release_sha
          - (commerce_proofs.results[1].content | b64decode | from_json).source_sha == source_sha
          - (commerce_proofs.results[1].content | b64decode | from_json).restore_dump_sha256 == (commerce_proofs.results[0].content | b64decode | from_json).dump_sha256
      no_log: true

    - name: Inspect old source writer and web processes
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --no-trunc, --filter, label=com.docker.compose.project=coinslot]
      delegate_to: "{{ source_host }}"
      become: true
      register: old_running
      changed_when: false
      check_mode: false

    - name: Inspect the old source database identity
      ansible.builtin.command:
        argv: [docker, inspect, coinslot-postgres-1]
      delegate_to: "{{ source_host }}"
      become: true
      register: old_database
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require only preserved old Postgres running
      ansible.builtin.assert:
        that:
          - old_running.stdout_lines == [(old_database.stdout | from_json | first).Id]
          - ((old_database.stdout | from_json | first).Mounts | selectattr('Destination', 'equalto', '/var/lib/postgresql/data') | map(attribute='Name') | list) == ['coinslot_coinslot-postgres']
        fail_msg: Old commerce writers resumed; public cutover would have two data owners.
      no_log: true

    - name: Inspect exact private final services before opening the edge
      ansible.builtin.command:
        argv: [docker, inspect, "{{ item }}"]
      become: true
      loop:
        - agentify-commerce-postgres-1
        - agentify-commerce-gateway-1
        - agentify-commerce-cabinet-1
        - agentify-commerce-web-1
      register: final_services
      changed_when: false
      check_mode: false
      no_log: true

    - name: Refuse unhealthy or wrong-image restored application services
      ansible.builtin.assert:
        that:
          - (final_services.results[0].stdout | from_json | first).State.Health.Status == 'healthy'
          - (final_services.results[0].stdout | from_json | first).Config.Image == 'postgres:17-alpine'
          - ((final_services.results[0].stdout | from_json | first).Mounts | selectattr('Destination', 'equalto', '/var/lib/postgresql/data') | map(attribute='Name') | list) == ['agentify-commerce_coinslot-postgres']
          - (final_services.results[1].stdout | from_json | first).State.Health.Status == 'healthy'
          - (final_services.results[2].stdout | from_json | first).State.Health.Status == 'healthy'
          - (final_services.results[1].stdout | from_json | first).Config.Image == commerce_images.COINSLOT_APP_IMAGE
          - (final_services.results[2].stdout | from_json | first).Config.Image == commerce_images.COINSLOT_APP_IMAGE
          - (final_services.results[1].stdout | from_json | first).Image == (commerce_proofs.results[0].content | b64decode | from_json).app_image_id
          - (final_services.results[2].stdout | from_json | first).Image == (commerce_proofs.results[0].content | b64decode | from_json).app_image_id
          - (final_services.results[3].stdout | from_json | first).State.Running
          - (final_services.results[3].stdout | from_json | first).Config.Image == commerce_images.COINSLOT_WEB_IMAGE
          - (final_services.results[3].stdout | from_json | first).Image == (commerce_proofs.results[0].content | b64decode | from_json).web_image_id
          - (final_services.results[3].stdout | from_json | first).HostConfig.PortBindings in [none, {}]
        fail_msg: A restored commerce container is unhealthy, public, or from another release.
      no_log: true

    - name: Verify private commerce health, cabinet, catalog and documentation again
      ansible.builtin.command:
        argv: "{{ commerce_argv + ['exec', '-T', 'gateway', 'node', '-e', safe_private_probe] }}"
        chdir: "{{ release_dir }}"
      environment: "{{ commerce_images }}"
      become: true
      changed_when: false
      check_mode: false
      no_log: true

    - name: Verify preserved scanner credentials and full-edge Compose config
      ansible.builtin.command:
        argv: "{{ edge_argv + ['config', '--format', 'json'] }}"
        chdir: "{{ edge_dir }}"
      become: true
      register: full_edge_config
      changed_when: false
      check_mode: false
      no_log: true

    - name: Refuse any changed edge image, public ports, admin protection or certificate volumes
      ansible.builtin.assert:
        that:
          - (full_edge_config.stdout | from_json).services.caddy.image == 'caddy:2.10.0-alpine'
          - (full_edge_config.stdout | from_json).services.caddy.environment.ADMIN_BASIC_AUTH_USER | length > 0
          - (full_edge_config.stdout | from_json).services.caddy.environment.ADMIN_BASIC_AUTH_HASH | length > 0
          - (full_edge_config.stdout | from_json).services.caddy.networks['agentify-ingress'].ipv4_address == '172.30.80.2'
          - (full_edge_config.stdout | from_json).services.caddy.volumes | selectattr('target', 'equalto', '/etc/caddy/Caddyfile') | map(attribute='source') | list == [edge_dir ~ '/Caddyfile']
          - (existing_edge.stdout | from_json | first).Mounts | selectattr('Destination', 'in', ['/data','/config']) | map(attribute='Name') | sort | list == ['agentify-edge_caddy-config','agentify-edge_caddy-data']
          - (existing_edge.stdout | from_json | first).Config.Env | select('equalto', 'ADMIN_BASIC_AUTH_USER=' ~ (full_edge_config.stdout | from_json).services.caddy.environment.ADMIN_BASIC_AUTH_USER) | list | length == 1
          - (existing_edge.stdout | from_json | first).Config.Env | select('equalto', 'ADMIN_BASIC_AUTH_HASH=' ~ (full_edge_config.stdout | from_json).services.caddy.environment.ADMIN_BASIC_AUTH_HASH) | list | length == 1
        fail_msg: Full edge must preserve existing scanner admin credentials and TLS network.
      no_log: true

    - name: Read any previous public acceptance proof
      ansible.builtin.slurp:
        src: "{{ public_marker }}"
      become: true
      register: earlier_public_proof
      no_log: true
      when: public_marker_state.stat.exists

    - name: Refuse a public marker from another restore or release
      ansible.builtin.assert:
        that:
          - public_marker_state.stat.mode == '0600'
          - (earlier_public_proof.content | b64decode | from_json).release_sha == release_sha
          - (earlier_public_proof.content | b64decode | from_json).restore_dump_sha256 == (commerce_proofs.results[0].content | b64decode | from_json).dump_sha256
      no_log: true
      when: public_marker_state.stat.exists

    - name: Verify protected source and target environments still match their recovery copies
      ansible.builtin.stat:
        path: "{{ item.path }}"
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: "{{ item.host }}"
      become: "{{ item.host == 'agentify' and item.path.startswith(backup_dir) }}"
      loop:
        - {host: codex-vm, path: /home/dmitry/coinslot/.env}
        - {host: agentify, path: "{{ backup_dir }}/source.env"}
        - {host: agentify, path: /home/dmitry/agentify-commerce/.env}
        - {host: agentify, path: "{{ backup_dir }}/target.env"}
        - {host: agentify, path: "{{ backup_dir }}/commerce-frozen.dump"}
      register: current_protected_artifacts
      no_log: true

    - name: Refuse changed credentials or backup bytes before opening traffic
      ansible.builtin.assert:
        that:
          - current_protected_artifacts.results | selectattr('stat.mode', 'equalto', '0600') | list | length == 5
          - current_protected_artifacts.results[0].stat.checksum == current_protected_artifacts.results[1].stat.checksum
          - current_protected_artifacts.results[2].stat.checksum == current_protected_artifacts.results[3].stat.checksum
          - current_protected_artifacts.results[4].stat.checksum == (commerce_proofs.results[0].content | b64decode | from_json).dump_sha256
      no_log: true

    - name: Read the frozen original-column row fingerprint on first activation
      ansible.builtin.slurp:
        src: "{{ backup_dir }}/source-snapshot.json"
      become: true
      register: source_fingerprint
      no_log: true
      when: not public_marker_state.stat.exists

    - name: Snapshot final original business rows immediately before first public exposure
      ansible.builtin.command:
        argv: [docker, exec, -i, agentify-commerce-postgres-1, psql, -U, coinslot, -d, coinslot, -At, -v, ON_ERROR_STOP=1]
        stdin: "{{ snapshot_sql }}"
      become: true
      register: target_rows_before_public
      changed_when: false
      check_mode: false
      no_log: true
      when: not public_marker_state.stat.exists

    - name: Recheck old-source original business rows immediately before opening the app
      ansible.builtin.command:
        argv: [docker, exec, -i, coinslot-postgres-1, psql, -U, coinslot, -d, coinslot, -At, -v, ON_ERROR_STOP=1]
        stdin: "{{ snapshot_sql }}"
      delegate_to: "{{ source_host }}"
      become: true
      register: source_rows_before_public
      changed_when: false
      check_mode: false
      no_log: true
      when: not public_marker_state.stat.exists

    - name: Refuse an unexplained target row change before public traffic
      ansible.builtin.assert:
        that:
          - (target_rows_before_public.stdout_lines[-1] | from_json) == (source_fingerprint.content | b64decode | from_json)
          - (source_rows_before_public.stdout_lines[-1] | from_json) == (source_fingerprint.content | b64decode | from_json)
        fail_msg: New private writers altered frozen original rows; review newer effects before opening traffic.
      no_log: true
      when: not public_marker_state.stat.exists

    - name: Require app maintenance on the first public activation
      ansible.builtin.uri:
        url: https://app.agentify.ad/healthz
        method: GET
        status_code: 503
        validate_certs: true
        return_content: false
      delegate_to: localhost
      register: before_public_app
      changed_when: false
      check_mode: false
      when: not public_marker_state.stat.exists

    - name: Refuse a first public activation without honest maintenance headers
      ansible.builtin.assert:
        that:
          - before_public_app.retry_after == '300'
          - before_public_app.cache_control == 'no-store'
      when: not public_marker_state.stat.exists

    - name: Validate final Caddy routes without joining its occupied fixed-IP network
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - none
          - --env
          - ADMIN_BASIC_AUTH_USER
          - --env
          - ADMIN_BASIC_AUTH_HASH
          - --volume
          - "{{ edge_dir }}/Caddyfile:/etc/caddy/Caddyfile:ro"
          - caddy:2.10.0-alpine
          - caddy
          - validate
          - --config
          - /etc/caddy/Caddyfile
      environment:
        ADMIN_BASIC_AUTH_USER: "{{ (full_edge_config.stdout | from_json).services.caddy.environment.ADMIN_BASIC_AUTH_USER }}"
        ADMIN_BASIC_AUTH_HASH: "{{ (full_edge_config.stdout | from_json).services.caddy.environment.ADMIN_BASIC_AUTH_HASH }}"
      become: true
      changed_when: false
      no_log: true
      when: not ansible_check_mode

    - name: Activate final app route and check all public read-only routes
      block:
        - name: Reuse the shared edge project, certificate volumes and admin settings
          ansible.builtin.command:
            argv: "{{ edge_argv + ['up', '-d', '--wait', '--wait-timeout', '180', '--no-build', 'caddy'] }}"
            chdir: "{{ edge_dir }}"
          become: true
          register: edge_up
          changed_when: "'Created' in edge_up.stderr or 'Started' in edge_up.stderr or 'Recreated' in edge_up.stderr"
          no_log: true
          when: not ansible_check_mode

        - name: Check commerce HTTPS health, catalog, cabinet and documentation
          ansible.builtin.uri:
            url: "https://app.agentify.ad{{ item }}"
            method: GET
            status_code: 200
            validate_certs: true
            return_content: false
          delegate_to: localhost
          loop: [/healthz, /cabinet/healthz, /x402/catalog, /docs/quickstart]
          changed_when: false
          when: not ansible_check_mode

        - name: Keep the original scanner site and worker readiness green
          ansible.builtin.uri:
            url: "https://agentify.ad{{ item }}"
            method: GET
            status_code: 200
            validate_certs: true
            return_content: false
          delegate_to: localhost
          loop: [/api/health/live, /api/health]
          changed_when: false
          when: not ansible_check_mode

        - name: Recheck old source ownership after opening the app
          ansible.builtin.command:
            argv: [docker, ps, --quiet, --no-trunc, --filter, label=com.docker.compose.project=coinslot]
          delegate_to: "{{ source_host }}"
          become: true
          register: old_after_public
          changed_when: false
          check_mode: false
          when: not ansible_check_mode

        - name: Refuse an old writer resurrected during public activation
          ansible.builtin.assert:
            that: old_after_public.stdout_lines == [(old_database.stdout | from_json | first).Id]
          when: not ansible_check_mode

        - name: Preserve exact public acceptance proof outside the runtime checkout
          ansible.builtin.copy:
            content: "{{ {'release_sha': release_sha, 'source_sha': source_sha, 'restore_dump_sha256': (commerce_proofs.results[0].content | b64decode | from_json).dump_sha256} | to_nice_json }}\n"
            dest: "{{ public_marker }}"
            owner: dmitry
            mode: '0600'
            force: false
          become: true
          no_log: true
          when: not ansible_check_mode and not public_marker_state.stat.exists
      rescue:
        - name: Attempt both recovery actions and report their actual outcomes
          ansible.builtin.include_tasks: commerce-public-recovery.yml
