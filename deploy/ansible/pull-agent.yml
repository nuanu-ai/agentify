---
- name: Install one outbound-only Agentify deployment agent
  hosts: production:test
  become: true
  gather_facts: false
  force_handlers: true
  vars:
    channel_name: "{{ 'production' if inventory_hostname in groups['production'] else 'test' }}"
    pull_agent_intent_tags:
      production: deploy-production
      test: deploy-test
    pull_agent_root: /opt/agentify-pull-agent
    pull_agent_release_directory: "{{ pull_agent_root }}/releases/{{ pull_agent_controller_revision }}"
    pull_agent_staging_directory: "{{ pull_agent_root }}/.staging-{{ pull_agent_controller_revision }}"
    pull_agent_configuration_directory: /etc/agentify-pull-agent
    pull_agent_state_directory: "/var/lib/agentify-pull-agent/{{ channel_name }}"
    pull_agent_inventory_file: "{{ pull_agent_configuration_directory }}/{{ channel_name }}-inventory.json"
    pull_agent_configuration_file: "{{ pull_agent_configuration_directory }}/{{ channel_name }}.json"
  tasks:
    - name: Require one explicit channel and a clean trusted controller revision
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname in ['agentify', 'agentify-test']
          - pull_agent_channel_ack | default('') == channel_name
          - (pull_agent_controller_revision | default('')) is match('^[0-9a-f]{40}$')
          - (agentify_home | default('')).startswith('/')
          - agentify_home != '/'
          - "'..' not in agentify_home.split('/')"
          - channel_name != 'test' or (agentify_test_listen_address | default('')) is match('^(10\\.[0-9]{1,3}|172\\.(1[6-9]|2[0-9]|3[01])|192\\.168)\\.[0-9]{1,3}\\.[0-9]{1,3}$')
        fail_msg: Select exactly one channel and acknowledge the trusted controller revision.

    - name: Identify the checkout supplying the installation mechanics
      ansible.builtin.command:
        argv: [git, -C, "{{ playbook_dir }}/../..", rev-parse, HEAD]
      delegate_to: localhost
      become: false
      changed_when: false
      register: pull_agent_local_revision

    - name: Prove the installation mechanics are exact and clean
      ansible.builtin.command:
        argv: [git, -C, "{{ playbook_dir }}/../..", status, --porcelain=v1, --untracked-files=all]
      delegate_to: localhost
      become: false
      changed_when: false
      register: pull_agent_local_status
      failed_when: >-
        pull_agent_local_revision.stdout != pull_agent_controller_revision or
        pull_agent_local_status.stdout != ''

    - name: Hash the reviewed pull-agent installation inputs
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - "{{ playbook_dir }}/../pull-agent.py"
        - "{{ playbook_dir }}/requirements.txt"
      delegate_to: localhost
      become: false
      register: pull_agent_source_files

    - name: Find the deployment account's actual home
      ansible.builtin.getent:
        database: passwd
        key: "{{ ansible_user }}"

    - name: Refuse an unrelated deployment account directory
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_passwd[ansible_user][4] == agentify_home

    - name: Create root-owned agent directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ pull_agent_root }}", mode: '0755'}
        - {path: "{{ pull_agent_root }}/releases", mode: '0755'}
        - {path: "{{ pull_agent_configuration_directory }}", mode: '0700'}
        - {path: "{{ pull_agent_state_directory }}", mode: '0700'}

    - name: Inspect the immutable installed version
      ansible.builtin.stat:
        path: "{{ pull_agent_release_directory }}"
      register: pull_agent_release_path

    - name: Build a missing installed version away from the live link
      when: not pull_agent_release_path.stat.exists
      block:
        - name: Remove only a stale incomplete staging directory for this revision
          ansible.builtin.file:
            path: "{{ pull_agent_staging_directory }}"
            state: absent

        - name: Create the private staging directory
          ansible.builtin.file:
            path: "{{ pull_agent_staging_directory }}"
            state: directory
            owner: root
            group: root
            mode: '0700'

        - name: Stage the reviewed pull-agent program and dependency lock
          ansible.builtin.copy:
            src: "{{ item.src }}"
            dest: "{{ item.dest }}"
            owner: root
            group: root
            mode: "{{ item.mode }}"
          loop:
            - src: "{{ playbook_dir }}/../pull-agent.py"
              dest: "{{ pull_agent_staging_directory }}/pull-agent.py"
              mode: '0755'
            - src: "{{ playbook_dir }}/requirements.txt"
              dest: "{{ pull_agent_staging_directory }}/requirements.txt"
              mode: '0644'

        - name: Install the distribution's Python virtual-environment support
          ansible.builtin.apt:
            name: python3-venv
            state: present
            update_cache: true
            cache_valid_time: 86400

        - name: Create the isolated deployment client environment
          ansible.builtin.command:
            argv: [python3, -m, venv, "{{ pull_agent_staging_directory }}/venv"]
            creates: "{{ pull_agent_staging_directory }}/venv/bin/python"

        - name: Install the pinned deployment client
          ansible.builtin.command:
            argv:
              - "{{ pull_agent_staging_directory }}/venv/bin/pip"
              - install
              - --disable-pip-version-check
              - --requirement
              - "{{ pull_agent_staging_directory }}/requirements.txt"
          register: pull_agent_dependencies
          changed_when: "'Successfully installed' in pull_agent_dependencies.stdout"

        - name: Seal the installed-version identity
          ansible.builtin.copy:
            content: >-
              {{ {
                'controllerRevision': pull_agent_controller_revision,
                'pullAgentSha256': pull_agent_source_files.results[0].stat.checksum,
                'requirementsSha256': pull_agent_source_files.results[1].stat.checksum
              } | to_nice_json }}
            dest: "{{ pull_agent_staging_directory }}/installation.json"
            owner: root
            group: root
            mode: '0444'

        - name: Publish the complete immutable installed version atomically
          ansible.builtin.command:
            argv: [mv, "{{ pull_agent_staging_directory }}", "{{ pull_agent_release_directory }}"]

    - name: Inspect the installed-version files
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - "{{ pull_agent_release_directory }}/pull-agent.py"
        - "{{ pull_agent_release_directory }}/requirements.txt"
        - "{{ pull_agent_release_directory }}/venv/bin/python3"
        - "{{ pull_agent_release_directory }}/installation.json"
      register: pull_agent_installed_files

    - name: Read the installed-version identity
      ansible.builtin.slurp:
        src: "{{ pull_agent_release_directory }}/installation.json"
      register: pull_agent_installation

    - name: Refuse a changed or incomplete installed version
      ansible.builtin.assert:
        that:
          - pull_agent_installed_files.results | map(attribute='stat.exists') | list == [true, true, true, true]
          - pull_agent_installed_files.results[0].stat.checksum == pull_agent_source_files.results[0].stat.checksum
          - pull_agent_installed_files.results[1].stat.checksum == pull_agent_source_files.results[1].stat.checksum
          - (pull_agent_installation.content | b64decode | from_json).controllerRevision == pull_agent_controller_revision
          - (pull_agent_installation.content | b64decode | from_json).pullAgentSha256 == pull_agent_installed_files.results[0].stat.checksum
          - (pull_agent_installation.content | b64decode | from_json).requirementsSha256 == pull_agent_installed_files.results[1].stat.checksum
        fail_msg: The controller-SHA pull-agent installation is incomplete or changed; preserve it and inspect before proceeding.

    - name: Prove the relocated environment can invoke pinned Ansible
      ansible.builtin.command:
        argv:
          - "{{ pull_agent_release_directory }}/venv/bin/python3"
          - -m
          - ansible.cli.playbook
          - --version
      changed_when: false

    - name: Inspect an existing pull-agent timer installation
      ansible.builtin.stat:
        path: /etc/systemd/system/agentify-pull@.timer
      register: pull_agent_timer_unit

    - name: Refuse to update a pull agent during a deployment
      ansible.builtin.command:
        argv: [systemctl, is-active, "agentify-pull@{{ channel_name }}.service"]
      changed_when: false
      failed_when: false
      register: pull_agent_service_state

    - name: Require the selected agent service to be idle before holding its timer
      ansible.builtin.assert:
        that:
          - pull_agent_service_state.stdout not in ['active', 'activating', 'deactivating', 'reloading']
        fail_msg: The selected pull agent is deploying. Leave it untouched and reapply this bootstrap after it finishes.

    - name: Hold polling during the atomic installed-version switch
      ansible.builtin.systemd_service:
        name: "agentify-pull@{{ channel_name }}.timer"
        state: stopped
      when: pull_agent_timer_unit.stat.exists
      notify: Restore the selected pull timer

    - name: Recheck the service after holding its timer
      ansible.builtin.command:
        argv: [systemctl, is-active, "agentify-pull@{{ channel_name }}.service"]
      changed_when: false
      failed_when: false
      register: pull_agent_held_service_state

    - name: Refuse a deployment that raced with the timer hold
      ansible.builtin.assert:
        that:
          - pull_agent_held_service_state.stdout not in ['active', 'activating', 'deactivating', 'reloading']
        fail_msg: The selected pull agent began deploying before its timer stopped. Reapply after it finishes.

    - name: Install the host-local TEST inventory
      ansible.builtin.copy:
        content: >-
          {{ {
            'ansible_connection': 'local',
            'agentify_home': agentify_home,
            'agentify_test_host': 'localhost',
            'agentify_test_user': ansible_user,
            'agentify_test_listen_address': agentify_test_listen_address
          } | to_nice_json }}
        dest: "{{ pull_agent_inventory_file }}"
        owner: root
        group: root
        mode: '0600'
      when: channel_name == 'test'

    - name: Install the host-local PRODUCTION inventory
      ansible.builtin.copy:
        content: >-
          {{ {
            'ansible_connection': 'local',
            'agentify_home': agentify_home,
            'agentify_production_host': 'localhost',
            'agentify_production_user': ansible_user
          } | to_nice_json }}
        dest: "{{ pull_agent_inventory_file }}"
        owner: root
        group: root
        mode: '0600'
      when: channel_name == 'production'

    - name: Install the closed pull-agent configuration
      ansible.builtin.copy:
        content: >-
          {{ {
            'channel': channel_name,
            'repository': 'https://github.com/nuanu-ai/agentify.git',
            'intentTag': pull_agent_intent_tags[channel_name],
            'controllerBranch': 'main',
            'stateDirectory': pull_agent_state_directory,
            'inventoryFile': pull_agent_inventory_file,
            'ansiblePython': pull_agent_root + '/current/venv/bin/python3'
          } | to_nice_json }}
        dest: "{{ pull_agent_configuration_file }}"
        owner: root
        group: root
        mode: '0600'

    - name: Install the shared pull-agent systemd units
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "/etc/systemd/system/{{ item.dest }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - {src: "{{ playbook_dir }}/pull-agent.service", dest: agentify-pull@.service}
        - {src: "{{ playbook_dir }}/pull-agent.timer", dest: agentify-pull@.timer}
      notify: Reload systemd

    - name: Prepare the atomic installed-version link
      ansible.builtin.file:
        src: "{{ pull_agent_release_directory }}"
        dest: "{{ pull_agent_root }}/.current-{{ pull_agent_controller_revision }}"
        state: link
        force: true

    - name: Select the complete installed pull-agent version atomically
      ansible.builtin.command:
        argv:
          - mv
          - -Tf
          - "{{ pull_agent_root }}/.current-{{ pull_agent_controller_revision }}"
          - "{{ pull_agent_root }}/current"

    - name: Enable the selected outbound pull timer
      ansible.builtin.systemd_service:
        name: "agentify-pull@{{ channel_name }}.timer"
        enabled: true
        state: started
        daemon_reload: true

    - name: Prove the selected timer is enabled
      ansible.builtin.command:
        argv: [systemctl, is-enabled, "agentify-pull@{{ channel_name }}.timer"]
      changed_when: false

    - name: Inspect the deployment account's SSH keys
      ansible.builtin.stat:
        path: "{{ agentify_home }}/.ssh/authorized_keys"
      register: pull_agent_authorized_keys

    - name: Remove the retired GitHub runner key without changing operator access
      ansible.builtin.blockinfile:
        path: "{{ agentify_home }}/.ssh/authorized_keys"
        marker: "# {mark} Agentify {{ channel_name }} GitHub deployment"
        state: absent
      when: pull_agent_authorized_keys.stat.exists

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restore the selected pull timer
      ansible.builtin.systemd_service:
        name: "agentify-pull@{{ channel_name }}.timer"
        enabled: true
        state: started
        daemon_reload: true
      when: pull_agent_timer_unit.stat.exists
