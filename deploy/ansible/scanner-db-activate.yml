---
- name: Activate exactly one scanner writer on the restored private database
  hosts: production
  gather_facts: false
  vars:
    scanner_dir: /home/dmitry/agentify-commerce/ops/deploy/droplet
    source_env: /home/dmitry/agentify-scanner/.env.production
    private_env: /home/dmitry/agentify-scanner/.env.private
    custody_dir: /home/dmitry/agentify-backups/scanner-exit
    stage_dir: /home/dmitry/agentify-scanner-exit
    image_manifest: /home/dmitry/agentify-scanner-exit/db-bridge-images.json
    private_jobs: /home/dmitry/agentify-scanner/scanner-jobs-private.sh
    private_cron: /etc/cron.d/agentify
    writer_marker_path: "{{ custody_dir }}/private-writer-start-attempted.json"
    scanner_compose: [docker, compose, --env-file, /home/dmitry/agentify-scanner/.env.private, -f, compose.production.yaml, -f, compose.hetzner.yaml, -f, compose.scanner-database.yaml]
    source_compose: [docker, compose, --env-file, /home/dmitry/agentify-scanner/.env.production, -f, compose.production.yaml, -f, compose.hetzner.yaml]
    private_images:
      AGENTIFY_SCANNER_WEB_IMAGE: "agentify-scanner-web:{{ release_sha }}"
      AGENTIFY_SCANNER_WORKER_IMAGE: "agentify-scanner-worker:{{ release_sha }}"
      AGENTIFY_SCANNER_PRIVACY_IMAGE: "agentify-scanner-privacy:{{ release_sha }}"
    source_images:
      AGENTIFY_SCANNER_WEB_IMAGE: "agentify-scanner-web:{{ source_release_sha }}"
      AGENTIFY_SCANNER_WORKER_IMAGE: "agentify-scanner-worker:{{ source_release_sha }}"
      AGENTIFY_SCANNER_PRIVACY_IMAGE: "agentify-scanner-privacy:{{ source_release_sha }}"
    cron_content: |
      # Frozen source schedule; private DB jobs after scanner acceptance.
      17 3 * * * root /home/dmitry/agentify-scanner/scanner-jobs-private.sh backup
      23 4 * * * root /home/dmitry/agentify-scanner/scanner-jobs-private.sh privacy
  tasks:
    - name: Require explicit reviewed bridge, frozen source and activation gate
      ansible.builtin.assert:
        that:
          - release_sha is defined and release_sha | default('') is match('^[0-9a-f]{40}$')
          - source_release_sha is defined and source_release_sha | default('') is match('^[0-9a-f]{40}$')
          - scanner_activate_ack | default('') == 'private-db-one-web-one-worker'
        fail_msg: Use the exact reviewed DB bridge release and explicit single-writer activation gate.
    - ansible.builtin.slurp:
        src: "{{ custody_dir }}/restore-manifest.json"
      register: restore_marker
      become: true
      no_log: true
    - ansible.builtin.set_fact:
        restored: "{{ restore_marker.content | b64decode | from_json }}"
      no_log: true
    - ansible.builtin.assert:
        that:
          - restored.bridge_release_sha == release_sha
          - restored.source_release_sha == source_release_sha
        fail_msg: Database restore belongs to another release.
    - name: Refuse an earlier private-writer start attempt without effect reconciliation
      ansible.builtin.stat:
        path: "{{ writer_marker_path }}"
      register: writer_attempt_before
      become: true
    - ansible.builtin.assert:
        that: not writer_attempt_before.stat.exists
        fail_msg: A private writer may have made effects in an earlier start attempt; reconcile before retry or rollback.

    - name: Require reviewed checkout, clean build context and prepared images
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: /home/dmitry/agentify-commerce
      register: checkout
      changed_when: false
      check_mode: false
    - ansible.builtin.assert:
        that: checkout.stdout == release_sha
    - ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: /home/dmitry/agentify-commerce
      register: checkout_status
      changed_when: false
      check_mode: false
    - ansible.builtin.assert:
        that: checkout_status.stdout == ''
        fail_msg: Scanner release checkout is edited or has untracked files.
    - ansible.builtin.command:
        argv: [docker, image, inspect, "{{ item }}"]
      loop:
        - "{{ private_images.AGENTIFY_SCANNER_WEB_IMAGE }}"
        - "{{ private_images.AGENTIFY_SCANNER_WORKER_IMAGE }}"
        - "{{ private_images.AGENTIFY_SCANNER_PRIVACY_IMAGE }}"
      changed_when: false
      check_mode: false
      become: true
      no_log: true
      register: activation_images
    - ansible.builtin.slurp:
        src: "{{ image_manifest }}"
      register: staged_image_record
      become: true
      no_log: true
    - ansible.builtin.set_fact:
        staged_image_ids: "{{ staged_image_record.content | b64decode | from_json }}"
      no_log: true
    - ansible.builtin.assert:
        that:
          - staged_image_ids.release_sha == release_sha
          - (activation_images.results[0].stdout | from_json | first).Id == staged_image_ids.web_id
          - (activation_images.results[1].stdout | from_json | first).Id == staged_image_ids.worker_id
          - (activation_images.results[2].stdout | from_json | first).Id == staged_image_ids.privacy_id
        fail_msg: Scanner image IDs changed after the clean reviewed-source build; restage before activation.
      no_log: true

    - name: Verify protected private environment and held source cron
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: ["{{ private_env }}", /etc/agentify-cron-scanner-exit-held, "{{ custody_dir }}/source.fingerprint", "{{ custody_dir }}/source-frozen.dump"]
      register: protected
      become: true
      no_log: true
    - ansible.builtin.assert:
        that:
          - protected.results | selectattr('stat.exists', 'equalto', true) | list | length == 4
          - protected.results[0].stat.mode == '0600'
          - protected.results[2].stat.mode == '0600'
          - protected.results[3].stat.mode == '0600'
        fail_msg: Private configuration, held cron or frozen recovery artifact is missing/exposed.

    - name: Resolve both configuration modes without starting services
      ansible.builtin.command:
        argv: "{{ item.argv + ['--profile', '*', 'config', '--format', 'json'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ item.env }}"
      loop:
        - {argv: "{{ source_compose }}", env: "{{ source_images }}"}
        - {argv: "{{ scanner_compose }}", env: "{{ private_images }}"}
      register: configs
      changed_when: false
      check_mode: false
      become: true
      no_log: true
    - ansible.builtin.assert:
        that:
          - (configs.results[0].stdout | from_json).services['database-config-check'].environment.DATABASE_MODE == 'external'
          - (configs.results[1].stdout | from_json).services['database-config-check'].environment.DATABASE_MODE == 'private'
          - (configs.results[1].stdout | from_json).services.web.environment.TOKEN_HMAC_SECRET == (configs.results[0].stdout | from_json).services.web.environment.TOKEN_HMAC_SECRET
          - (configs.results[1].stdout | from_json).services.web.environment.EMAIL_ENCRYPTION_KEY == (configs.results[0].stdout | from_json).services.web.environment.EMAIL_ENCRYPTION_KEY
          - (configs.results[1].stdout | from_json).services.web.environment.RESEND_API_KEY == (configs.results[0].stdout | from_json).services.web.environment.RESEND_API_KEY
          - (configs.results[1].stdout | from_json).services.worker.environment.WORKER_ID == (configs.results[0].stdout | from_json).services.worker.environment.WORKER_ID
          - (configs.results[1].stdout | from_json).services.web.image == private_images.AGENTIFY_SCANNER_WEB_IMAGE
          - (configs.results[1].stdout | from_json).services.worker.image == private_images.AGENTIFY_SCANNER_WORKER_IMAGE
        fail_msg: Private scanner config changed keys, worker identity or release images.
      no_log: true

    - name: Require bridge membership on named commerce PostgreSQL and no active scanner writer
      ansible.builtin.command:
        argv: [docker, inspect, agentify-commerce-postgres-1]
      register: bridged_pg
      changed_when: false
      check_mode: false
      become: true
      no_log: true
    - ansible.builtin.assert:
        that: "'agentify-scanner-postgres' in (bridged_pg.stdout | from_json | first).NetworkSettings.Networks['agentify-scanner-db'].Aliases"
        fail_msg: Commerce PostgreSQL lost its private scanner bridge.
      no_log: true
    - ansible.builtin.command:
        argv: [docker, ps, --quiet, --filter, label=com.docker.compose.project=agentify, --filter, "label=com.docker.compose.service={{ item }}"]
      loop: [worker, web, privacy-cleanup, database-backup]
      register: source_running
      changed_when: false
      check_mode: false
      become: true
    - ansible.builtin.assert:
        that: source_running.results | map(attribute='stdout') | select('ne', '') | list | length == 0
        fail_msg: A source scanner writer/job is running; start nothing.

    - name: Validate private URLs before touching roles or jobs
      ansible.builtin.command:
        argv: "{{ scanner_compose + ['--profile', 'tools', 'run', '--rm', '--no-deps', '-T', 'database-config-check'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ private_images }}"
      become: true
      changed_when: false
      no_log: true
      when: not ansible_check_mode
    - name: Reconcile private scanner role passwords with explicit maintenance acknowledgement
      ansible.builtin.command:
        argv: "{{ scanner_compose + ['--profile', 'tools', 'run', '--rm', '--no-deps', '-T', 'roles-reconcile'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ private_images }}"
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Apply only reviewed scanner migrations and queue grants to restored scanner DB
      ansible.builtin.command:
        argv: "{{ scanner_compose + ['--profile', 'tools', 'run', '--rm', '--no-deps', '-T', item] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ private_images }}"
      loop: [migrate, queue-init, database-dashboards-install, database-access-finalize]
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Prove all private DB runtime identities, RLS and least privilege
      ansible.builtin.command:
        argv: "{{ scanner_compose + ['--profile', 'tools', 'run', '--rm', '--no-deps', '-T', 'database-access-verify'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ private_images }}"
      register: database_access
      become: true
      changed_when: false
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that: database_access.stdout is search('connectivity, schema, RLS, and least-privilege checks passed')
        fail_msg: Private scanner DB role/schema proof failed.
      when: not ansible_check_mode

    - name: Refuse changed frozen rows after role and queue initialization
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec -i agentify-commerce-postgres-1 psql -U coinslot -d agentify_scanner -At -F '|' -v ON_ERROR_STOP=1 \
          < {{ (stage_dir ~ '/scanner-fingerprint.sql') | quote }} > {{ (stage_dir ~ '/after-init.fingerprint') | quote }}
        cmp {{ (custody_dir ~ '/source.fingerprint') | quote }} {{ (stage_dir ~ '/after-init.fingerprint') | quote }}
      args:
        executable: /bin/bash
      become: true
      no_log: true
      changed_when: false
      when: not ansible_check_mode

    - name: Durably mark the irreversible private-writer boundary before Docker up
      ansible.builtin.copy:
        content: "{{ {'release_sha': release_sha, 'source_release_sha': source_release_sha, 'meaning': 'private web or worker may have started and made effects'} | to_nice_json }}\n"
        dest: "{{ writer_marker_path }}"
        owner: root
        group: root
        mode: '0600'
        force: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Start exactly one reviewed scanner web and worker on the private database
      ansible.builtin.command:
        argv: "{{ scanner_compose + ['up', '-d', '--no-deps', '--wait', '--wait-timeout', '180', '--no-build', 'web', 'worker'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ private_images }}"
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Prove live and DB/worker-ready routes without a real submission or email
      ansible.builtin.command:
        argv: "{{ scanner_compose + ['exec', '-T', 'web', 'node', '-e', item] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ private_images }}"
      loop:
        - "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      become: true
      changed_when: false
      no_log: true
      when: not ansible_check_mode

    - name: Install private backup/privacy wrapper only after a healthy single worker
      ansible.builtin.template:
        src: scanner-jobs-private.sh.j2
        dest: "{{ private_jobs }}"
        owner: root
        group: root
        mode: '0700'
        validate: /bin/bash -n %s
      become: true
      when: not ansible_check_mode
    - ansible.builtin.copy:
        content: "{{ cron_content }}"
        dest: "{{ private_cron }}"
        owner: root
        group: root
        mode: '0644'
        force: false
      become: true
      when: not ansible_check_mode
    - name: Inspect resumed scanner web/worker identity and DB destination
      ansible.builtin.command:
        argv: [docker, inspect, "{{ item }}"]
      loop: [agentify-web-1, agentify-worker-1]
      register: resumed
      changed_when: false
      check_mode: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that:
          - (resumed.results[0].stdout | from_json | first).State.Running
          - (resumed.results[1].stdout | from_json | first).State.Running
          - (resumed.results[0].stdout | from_json | first).Config.Image == private_images.AGENTIFY_SCANNER_WEB_IMAGE
          - (resumed.results[1].stdout | from_json | first).Config.Image == private_images.AGENTIFY_SCANNER_WORKER_IMAGE
          - (resumed.results[0].stdout | from_json | first).Config.Env | select('match', '^DATABASE_URL=') | list == ['DATABASE_URL=' ~ (configs.results[1].stdout | from_json).services.web.environment.DATABASE_URL]
          - (resumed.results[1].stdout | from_json | first).Config.Env | select('match', '^DATABASE_URL=') | list == ['DATABASE_URL=' ~ (configs.results[1].stdout | from_json).services.worker.environment.DATABASE_URL]
        fail_msg: Resumed scanner identity or database destination differs.
      no_log: true
      when: not ansible_check_mode
