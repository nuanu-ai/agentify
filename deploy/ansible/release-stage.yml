---
- name: Require retained data volumes before doing anything on a host
  ansible.builtin.command:
    argv: [docker, volume, inspect, "{{ channel.postgres_volume }}", "{{ channel.caddy_volume }}"]
  changed_when: false
  no_log: true

# The scanner used to be a second Compose project on this host. Activation
# fingerprints the database, migrates it and compares the fingerprint again,
# and none of that means anything while a process from the old project is
# still writing to it.
#
# A stopped container of that project is refused too, because it keeps its
# name. Compose names a container after the project and the service, and on
# TEST the merged project `agentify-test` with its service `scanner-worker`
# creates `agentify-test-scanner-worker-1` — the name of the retired project's
# `worker` container. Docker refuses to create a second container under a name
# that exists, and it does so at "Start scanner runtime", after activation has
# stopped the writers and migrated the database. PRODUCTION does not make this
# transition on this machinery; there the guard refuses every candidate for as
# long as its old scanner project exists.
#
# First, because refusing here costs a `docker ps` and nothing else. The pull
# agent records a refused selection as failed and will not try that revision
# again, so a refusal is not free — the release guide has the operator stop and
# remove the old project before moving the channel's tag, and this is what
# catches the time somebody did not. Staging stops and removes nothing itself.
#
# It runs at stage and nowhere else: activation of a candidate that was staged
# before the old project came back would not see it. That is acceptable because
# the old project is removed once and never created again.
#
# This task and the channel variable it reads leave with this release
# machinery, when the deployment that replaces it arrives. A channel that has
# already activated the merged graph passes it without noticing, because the
# old project has no containers left.
- name: Refuse a candidate while the retired scanner project has any container
  ansible.builtin.command:
    argv: [docker, ps, --all, --filter, "label=com.docker.compose.project={{ channel.retired_scanner_project }}", --format, '{{ "{{.Names}}" }}']
  changed_when: false
  register: retired_scanner_containers
- ansible.builtin.assert:
    that: retired_scanner_containers.stdout == ''
    fail_msg: >-
      The retired scanner project {{ channel.retired_scanner_project }} still
      has containers on this host ({{ retired_scanner_containers.stdout_lines | join(', ') }}).
      A running one writes to the database this release migrates, and a
      stopped one keeps a name the merged project creates. Stop and remove
      them as deploy/ansible/README.md, "Reconcile a host that still runs two
      projects", describes. This refusal is recorded at the stage phase; select
      again as "Observe a selection" in the same guide describes for that phase.

- name: Inspect an existing candidate's delivery state
  ansible.builtin.stat:
    path: "{{ release_directory }}/release-state.json"
  register: existing_state_file
- ansible.builtin.slurp:
    src: "{{ release_directory }}/release-state.json"
  register: existing_state
  when: existing_state_file.stat.exists
- ansible.builtin.assert:
    that:
      - (existing_state.content | b64decode | from_json).revision == release_revision
      - (existing_state.content | b64decode | from_json).state == 'staged'
    fail_msg: >-
      This candidate has begun activation; staging cannot overwrite its state or
      configuration. Recover it explicitly: deploy/ansible/README.md, "Recover a
      failed activation".
  when: existing_state_file.stat.exists

- name: Create the private candidate directory outside the build context
  ansible.builtin.file:
    path: "{{ release_directory }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0700'

- name: Create the trusted controller directory outside the candidate source
  ansible.builtin.file:
    path: "{{ release_controller_directory }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0700'

- name: Install the deployment mechanics from the trusted controller
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ release_controller_directory }}/{{ item.dest }}"
    owner: "{{ ansible_user }}"
    mode: '0600'
  loop:
    - {src: "{{ playbook_dir }}/prepare-release-environments.py", dest: prepare-release-environments.py}
    - {src: "{{ playbook_dir }}/release-runtime.py", dest: release-runtime.py}
    - {src: "{{ playbook_dir }}/release_http.py", dest: release_http.py}
    - {src: "{{ playbook_dir }}/release-docker-cleanup.py", dest: release-docker-cleanup.py}
    - {src: "{{ playbook_dir }}/check-web-configuration.py", dest: check-web-configuration.py}
    - {src: "{{ playbook_dir }}/check-forward-revision.sh", dest: check-forward-revision.sh}
    - {src: "{{ playbook_dir }}/release-data-fingerprint.sql", dest: release-data-fingerprint.sql}
    - {src: "{{ playbook_dir }}/../compose.release.yaml", dest: release.yaml}

- name: Check out the exact public source revision
  ansible.builtin.git:
    repo: https://github.com/nuanu-ai/agentify.git
    dest: "{{ release_source_directory }}"
    version: "{{ release_revision }}"
    force: false
    update: true

- name: Prove the source checkout is exact, public and clean
  ansible.builtin.shell: |
    set -eu
    test "$(git rev-parse HEAD)" = '{{ release_revision }}'
    test "$(git remote get-url origin)" = 'https://github.com/nuanu-ai/agentify.git'
    test -z "$(git status --porcelain=v1 --untracked-files=all)"
  args:
    chdir: "{{ release_source_directory }}"
  changed_when: false

- name: Make the public checkout readable by non-root image users
  ansible.builtin.file:
    path: "{{ release_source_directory }}"
    state: directory
    recurse: true
    mode: a+rX

- name: Require a production candidate from public main history
  ansible.builtin.shell: |
    set -eu
    git fetch --quiet origin refs/heads/main:refs/remotes/origin/main
    git merge-base --is-ancestor '{{ release_revision }}' refs/remotes/origin/main
  args:
    chdir: "{{ release_source_directory }}"
  changed_when: false
  when: channel_name == 'production'

- name: Require production to move forward from its running revision
  ansible.builtin.include_tasks: release-forward-only.yml
  when: channel_name == 'production'

- name: Preserve channel secrets and prepare runtime environment files
  ansible.builtin.command:
    argv: [python3, "{{ release_controller_directory }}/prepare-release-environments.py", "{{ channel | to_json }}", "{{ channel_name }}", "{{ release_directory }}", "{{ release_revision }}", "{{ release_identity | to_json }}", "{{ configuration_directory }}"]
  no_log: true

# What a channel has to supply before anything is worth building. Compose
# interpolates the whole file list against that environment here, so every
# `${VAR:?...}` in it is answered or this task fails with the name of the
# variable and the sentence the file wrote for it — the scanner's two secrets
# among them (deploy/compose.public.yaml).
#
# It is the same render the preflight reads further down, done twice on
# purpose: the document that goes to the preflight has to be produced by the
# application image, which does not exist yet, and a channel that is missing a
# secret should not pay for five image builds to be told so.
- name: Require every channel secret before building anything
  ansible.builtin.command:
    argv: "{{ compose + ['--profile', 'jobs', 'config', '--quiet'] }}"
    chdir: "{{ release_source_directory }}"
  changed_when: false

- name: Bound old release images and build cache before building
  ansible.builtin.command:
    argv:
      - python3
      - "{{ release_controller_directory }}/release-docker-cleanup.py"
      - "{{ release_revision }}"
      - --minimum-free-gib
      - '30'
      - --protect-installed-jobs
      - "{{ configuration_directory }}/scanner-jobs.sh"
  changed_when: false

- name: Pull exact infrastructure images before rendering or activation
  ansible.builtin.command:
    argv: [docker, pull, "{{ item }}"]
  loop: "{{ release_identity.infrastructure.values() | list }}"
  register: pulled_images
  changed_when: "'Downloaded newer image' in pulled_images.stdout"

- name: Build first-party images sequentially from the pristine checkout
  ansible.builtin.command:
    argv: "{{ ['docker', 'build', '--pull', '--label', 'org.opencontainers.image.revision=' + release_revision, '--label', 'org.opencontainers.image.source=https://github.com/nuanu-ai/agentify', '-f', item.dockerfile, '-t', item.image] + item.extra + ['.'] }}"
    chdir: "{{ release_source_directory }}"
  loop:
    - image: "{{ release_identity.firstParty['app'] }}"
      dockerfile: deploy/Dockerfile.app
      extra: []
    - image: "{{ release_identity.firstParty['web'] }}"
      dockerfile: deploy/Dockerfile.web
      extra: []
    - image: "{{ release_identity.firstParty['scanner'] }}"
      dockerfile: deploy/Dockerfile.scanner
      extra: [--target, runner]
    - image: "{{ release_identity.firstParty['scanner-worker'] }}"
      dockerfile: deploy/Dockerfile.scanner-worker
      extra: []
    - image: "{{ release_identity.firstParty['scanner-privacy'] }}"
      dockerfile: deploy/Dockerfile.scanner
      extra: [--target, privacy-jobs]
  loop_control:
    label: "{{ item.image }}"

- name: Verify every locally built image carries the assigned source identity
  ansible.builtin.shell: |
    python3 - <<'PYCODE'
    import json, subprocess
    expected = {{ release_identity.firstParty | to_json }}
    evidence = {}
    for role, reference in expected.items():
        image = json.loads(subprocess.check_output(['docker', 'image', 'inspect', reference]))[0]
        labels = image['Config'].get('Labels', {})
        assert labels.get('org.opencontainers.image.revision') == '{{ release_revision }}', role + ' has the wrong source revision'
        assert labels.get('org.opencontainers.image.source') == 'https://github.com/nuanu-ai/agentify', role + ' has the wrong source repository'
        assert image['Os'] == 'linux' and image['Architecture'] == 'amd64', role + ' has the wrong platform'
        evidence[role] = image['Id']
    print(json.dumps(evidence, sort_keys=True))
    PYCODE
  changed_when: false
  register: built_image_evidence

- name: Drop transient build cache and require an activation reserve
  ansible.builtin.command:
    argv:
      - python3
      - "{{ release_controller_directory }}/release-docker-cleanup.py"
      - "{{ release_revision }}"
      - --minimum-free-gib
      - '10'
      - --protect-installed-jobs
      - "{{ configuration_directory }}/scanner-jobs.sh"
  changed_when: false

- name: Render the whole stack, scheduled job included, with no build definitions
  ansible.builtin.command:
    argv: "{{ compose + ['--profile', 'jobs', 'config', '--format', 'json'] }}"
    chdir: "{{ release_source_directory }}"
  changed_when: false
  register: rendered_configuration
  no_log: true

- name: Validate the actual channel before any application activation
  ansible.builtin.command:
    argv: [docker, run, --rm, -i, --network, none, "{{ release_identity.firstParty['app'] }}", node, packages/core/src/deployment/preflight.mjs, "{{ channel_name }}"]
    stdin: "{{ rendered_configuration.stdout }}"
  changed_when: false
  no_log: true

- name: Save the private rendered configuration for reviewed activation
  ansible.builtin.copy:
    content: "{{ rendered_configuration.stdout }}"
    dest: "{{ release_directory }}/resolved.json"
    mode: '0600'
  no_log: true

- name: Validate private runtime boundaries and capture a secret-free topology
  ansible.builtin.command:
    argv: [python3, "{{ release_controller_directory }}/release-runtime.py", topology, "{{ release_directory }}", "{{ channel_name }}", "{{ channel | to_json }}", "{{ release_revision }}", "{{ release_identity | to_json }}"]
  changed_when: false

- name: Fetch the sanitized topology for this channel's release evidence
  ansible.builtin.fetch:
    src: "{{ release_directory }}/topology.json"
    dest: "{{ release_evidence_directory }}/{{ channel_name }}-topology.json"
    flat: true

- name: Prove candidate web configuration before stopping a live service
  ansible.builtin.command:
    argv: [python3, "{{ release_controller_directory }}/check-web-configuration.py", "{{ release_directory }}", "{{ release_revision }}"]
  changed_when: false
  no_log: true

- name: Mark candidate staged without claiming live activation
  ansible.builtin.copy:
    content: "{{ {'revision': release_revision, 'channel': channel_name, 'state': 'staged', 'images': built_image_evidence.stdout | from_json} | to_nice_json }}\n"
    dest: "{{ release_directory }}/release-state.json"
    mode: '0644'
