---
- name: Answer the new public DNS with honest maintenance until data is restored
  hosts: production
  gather_facts: false
  vars:
    release_dir: /home/dmitry/agentify-commerce
    edge_dir: /home/dmitry/agentify-commerce/deploy/edge
    edge_image: caddy:2.10.0-alpine
    edge_compose_argv: [docker, compose, -f, compose.warmup.yaml]
  tasks:
    - name: Require the reviewed immutable release
      ansible.builtin.assert:
        that:
          - release_sha is defined
          - release_sha | default('') is match('^[0-9a-f]{40}$')
        fail_msg: Pass the reviewed 40-character lowercase release_sha explicitly.

    - name: Verify the prepared checkout revision
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ release_dir }}"
      register: checkout_sha
      changed_when: false
      check_mode: false

    - name: Refuse a different or unprepared release
      ansible.builtin.assert:
        that: checkout_sha.stdout == release_sha
        fail_msg: Run prepare-production.yml for this exact release first.

    - name: Inspect local checkout changes
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ release_dir }}"
      register: checkout_status
      changed_when: false
      check_mode: false

    - name: Refuse edits in the deployed checkout
      ansible.builtin.assert:
        that: checkout_status.stdout == ''

    - name: Verify the existing private ingress network
      ansible.builtin.command:
        argv: [docker, network, inspect, agentify-ingress]
      become: true
      register: ingress_network
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require the reviewed fixed edge address
      ansible.builtin.assert:
        that:
          - (ingress_network.stdout | from_json | first).IPAM.Config[0].Subnet == '172.30.80.0/24'
          - (ingress_network.stdout | from_json | first).IPAM.Config[0].Gateway == '172.30.80.1'

    - name: Require the already staged Caddy image
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ edge_image }}"]
      become: true
      changed_when: false
      check_mode: false
      no_log: true

    - name: Refuse an active final commerce or scanner project
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --filter, "label=com.docker.compose.project={{ item }}"]
      become: true
      loop: [agentify-commerce, agentify]
      register: final_projects
      changed_when: false
      check_mode: false

    - name: Require both final projects to be inactive
      ansible.builtin.assert:
        that: final_projects.results | selectattr('stdout', 'equalto', '') | list | length == 2

    - name: Inspect any existing edge container
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --filter, label=com.docker.compose.project=agentify-edge]
      become: true
      register: running_edge
      changed_when: false
      check_mode: false

    - name: Refuse an unexpected number of edge containers
      ansible.builtin.assert:
        that: running_edge.stdout_lines | length <= 1

    - name: Inspect an existing edge's mounted configuration
      ansible.builtin.command:
        argv: [docker, inspect, "{{ running_edge.stdout }}"]
      become: true
      register: existing_edge
      changed_when: false
      check_mode: false
      no_log: true
      when: running_edge.stdout != ''

    - name: Refuse replacement of a different active edge
      ansible.builtin.assert:
        that: >-
          (existing_edge.stdout | from_json | first).Mounts
          | selectattr('Destination', 'equalto', '/etc/caddy/Caddyfile')
          | map(attribute='Source') | list == [edge_dir ~ '/Caddyfile.warmup']
        fail_msg: A different public edge is active; inspect it before this maintenance playbook.
      when: running_edge.stdout != ''

    - name: Resolve the secret-free maintenance Compose file
      ansible.builtin.command:
        argv: "{{ edge_compose_argv + ['config', '--quiet'] }}"
        chdir: "{{ edge_dir }}"
      become: true
      changed_when: false
      check_mode: false

    - name: Validate maintenance Caddy before binding public ports
      ansible.builtin.command:
        argv: [docker, run, --rm, --network, none, --volume, "{{ edge_dir }}/Caddyfile.warmup:/etc/caddy/Caddyfile:ro", "{{ edge_image }}", caddy, validate, --config, /etc/caddy/Caddyfile]
      become: true
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Start only the public maintenance edge
      ansible.builtin.command:
        argv: "{{ edge_compose_argv + ['up', '-d', '--wait', '--wait-timeout', '180', '--no-build', 'caddy'] }}"
        chdir: "{{ edge_dir }}"
      become: true
      register: edge_up
      changed_when: "'Created' in edge_up.stderr or 'Started' in edge_up.stderr or 'Recreated' in edge_up.stderr"
      when: not ansible_check_mode
