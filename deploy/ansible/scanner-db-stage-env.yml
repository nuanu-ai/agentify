---
- name: Stage a private scanner configuration without changing the running source
  hosts: production
  gather_facts: false
  vars:
    source_env_path: /home/dmitry/agentify-scanner/.env.production
    commerce_env_path: /home/dmitry/agentify-commerce/.env
    private_env_path: /home/dmitry/agentify-scanner/.env.private
    private_alias: agentify-scanner-postgres
    private_db: agentify_scanner
  tasks:
    - name: Require the single protected operation vars file
      ansible.builtin.assert:
        that:
          - scanner_operation_vars_path is defined and scanner_operation_vars_path | default('') is match('^/')
          - scanner_private_credentials is defined
        fail_msg: Supply a protected operation vars file with scanner_private_credentials.
    - ansible.builtin.stat:
        path: "{{ scanner_operation_vars_path }}"
      register: credential_file
      delegate_to: localhost
      become: false
      no_log: true
    - ansible.builtin.assert:
        that: credential_file.stat.exists and credential_file.stat.isreg and credential_file.stat.mode == '0600'
        fail_msg: Local scanner operation vars must be a 0600 regular file.
    - ansible.builtin.set_fact:
        db_credentials: "{{ scanner_private_credentials }}"
      no_log: true
    - ansible.builtin.assert:
        that:
          - db_credentials.admin_password is match('^[A-Za-z0-9_-]{24,}$')
          - db_credentials.web_password is match('^[A-Za-z0-9_-]{24,}$')
          - db_credentials.worker_password is match('^[A-Za-z0-9_-]{24,}$')
          - db_credentials.privacy_password is match('^[A-Za-z0-9_-]{24,}$')
          - db_credentials.dashboard_password is match('^[A-Za-z0-9_-]{24,}$')
          - "[db_credentials.admin_password, db_credentials.web_password, db_credentials.worker_password, db_credentials.privacy_password, db_credentials.dashboard_password] | unique | length == 5"
        fail_msg: DB passwords must be distinct and URL-safe; values are suppressed.
      no_log: true

    - name: Read only the two existing protected VM environments
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: ["{{ source_env_path }}", "{{ commerce_env_path }}"]
      register: originals
      no_log: true
    - ansible.builtin.set_fact:
        source_env_text: "{{ originals.results[0].content | b64decode }}"
      no_log: true
    - ansible.builtin.assert:
        that:
          - (originals.results[1].content | b64decode | regex_findall('(?m)^AGENTIFY_DB_PASSWORD=([A-Za-z0-9_-]+)$')) == [db_credentials.admin_password]
          - (originals.results[0].content | b64decode) is search('(?m)^DATABASE_MODE=external$')
          - (originals.results[0].content | b64decode) is search('(?m)^TOKEN_HMAC_SECRET=')
        fail_msg: Protected commerce password or original scanner key source differs.
      no_log: true

    - name: Refuse replacement of a staged private scanner environment
      ansible.builtin.stat:
        path: "{{ private_env_path }}"
      register: existing_private
      no_log: true
    - ansible.builtin.assert:
        that: not existing_private.stat.exists
        fail_msg: Private scanner environment already exists; investigate rather than overwrite.

    - name: Preserve source keys byte-for-byte and append only the private DB overrides
      ansible.builtin.copy:
        content: "{{ lookup('template', playbook_dir ~ '/scanner-private.env.j2') }}"
        dest: "{{ private_env_path }}"
        owner: dmitry
        group: dmitry
        mode: '0600'
        force: false
      become: true
      no_log: true
      when: not ansible_check_mode
