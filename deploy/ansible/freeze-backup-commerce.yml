---
- name: Freeze the old commerce writers and preserve a final source backup
  hosts: production
  gather_facts: false
  vars:
    source_host: codex-vm
    source_dir: /home/dmitry/coinslot
    source_sha: a2c5b891224bcb9dd10b61f05ad7cc0f2f996940
    source_project: coinslot
    source_volume_name: coinslot_coinslot-postgres
    source_compose_argv:
      - docker
      - compose
      - --project-name
      - coinslot
      - --env-file
      - /home/dmitry/coinslot/.env
      - -f
      - compose.yaml
      - -f
      - deploy/compose.public.yaml
    target_dir: /home/dmitry/agentify-commerce
    target_compose_argv:
      - docker
      - compose
      - --project-name
      - agentify-commerce
      - --env-file
      - /home/dmitry/agentify-commerce/.env
      - -f
      - compose.yaml
      - -f
      - deploy/compose.public.yaml
      - -f
      - deploy/compose.hetzner-commerce.yaml
    target_images:
      COINSLOT_APP_IMAGE: "agentify-commerce-app:{{ release_sha }}"
      COINSLOT_WEB_IMAGE: "agentify-commerce-web:{{ release_sha }}"
    backup_name: "commerce-{{ source_sha[0:8] }}-to-{{ release_sha[0:8] }}"
    source_backup_dir: "/home/dmitry/coinslot-cutover/{{ backup_name }}"
    target_backup_dir: "/home/dmitry/agentify-backups/{{ backup_name }}"
    recovery_dir: "{{ playbook_dir }}/../../.local/commerce-backups/{{ backup_name }}"
    source_dump: "{{ source_backup_dir }}/commerce-frozen.dump"
    source_snapshot: "{{ source_backup_dir }}/source-snapshot.json"
    source_env: "{{ source_dir }}/.env"
    target_env: "{{ target_dir }}/.env"
    source_containers:
      - {name: coinslot-postgres-1, service: postgres, image: 'postgres:17-alpine'}
      - {name: coinslot-gateway-1, service: gateway, image: "coinslot-app:{{ source_sha }}"}
      - {name: coinslot-cabinet-1, service: cabinet, image: "coinslot-app:{{ source_sha }}"}
      - {name: coinslot-web-1, service: web, image: "coinslot-web:{{ source_sha }}"}
    snapshot_sql: "{{ lookup('file', playbook_dir ~ '/commerce-snapshot.sql') }}"
  tasks:
    - name: Require the prepared immutable target release and source inventory
      ansible.builtin.assert:
        that:
          - release_sha is defined
          - release_sha | default('') is match('^[0-9a-f]{40}$')
          - source_host in groups['test']

    - name: Verify the target checkout and protected environment
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ target_dir }}"
      register: target_checkout
      changed_when: false
      check_mode: false

    - name: Refuse a different target release
      ansible.builtin.assert:
        that: target_checkout.stdout == release_sha

    - name: Inspect edits in the prepared target checkout before source freeze
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ target_dir }}"
      register: target_checkout_status
      changed_when: false
      check_mode: false

    - name: Refuse a modified target runtime before stopping old writers
      ansible.builtin.assert:
        that: target_checkout_status.stdout == ''

    - name: Verify both protected commerce configurations
      ansible.builtin.stat:
        path: "{{ item.path }}"
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: "{{ item.host }}"
      loop:
        - {host: codex-vm, path: /home/dmitry/coinslot/.env}
        - {host: agentify, path: /home/dmitry/agentify-commerce/.env}
      register: commerce_env_stats
      no_log: true

    - name: Refuse missing or exposed source and target secrets
      ansible.builtin.assert:
        that:
          - commerce_env_stats.results | selectattr('stat.exists', 'equalto', true) | list | length == 2
          - commerce_env_stats.results | selectattr('stat.isreg', 'equalto', true) | list | length == 2
          - commerce_env_stats.results | selectattr('stat.mode', 'equalto', '0600') | list | length == 2
          - commerce_env_stats.results | selectattr('stat.pw_name', 'equalto', 'dmitry') | list | length == 2
      no_log: true

    - name: Require the observed source release marker
      ansible.builtin.slurp:
        src: "{{ source_dir }}/.coinslot-revision"
      delegate_to: "{{ source_host }}"
      register: source_marker

    - name: Refuse another source release
      ansible.builtin.assert:
        that: >-
          source_marker.content | b64decode | trim ==
          'release-live v0.2.1 ' ~ source_sha ~ ' status=origin-verified'
        fail_msg: The source release marker changed; reinventory it before stopping writers.

    - name: Inspect all named source production containers
      ansible.builtin.command:
        argv: [docker, inspect, "{{ item.name }}"]
      delegate_to: "{{ source_host }}"
      become: true
      loop: "{{ source_containers }}"
      register: source_inspects
      changed_when: false
      check_mode: false
      no_log: true

    - name: Refuse an unexpected source project, image, service or database volume
      ansible.builtin.assert:
        that:
          - (item.stdout | from_json | first).Config.Labels['com.docker.compose.project'] == source_project
          - (item.stdout | from_json | first).Config.Labels['com.docker.compose.service'] == item.item.service
          - (item.stdout | from_json | first).Config.Labels['com.docker.compose.project.working_dir'] == source_dir
          - (item.stdout | from_json | first).Config.Labels['com.docker.compose.project.config_files'] == source_dir ~ '/compose.yaml,' ~ source_dir ~ '/deploy/compose.public.yaml'
          - (item.stdout | from_json | first).Config.Image == item.item.image
          - (item.stdout | from_json | first).HostConfig.RestartPolicy.Name == 'unless-stopped'
          - item.item.service != 'postgres' or ((item.stdout | from_json | first).Mounts | selectattr('Destination', 'equalto', '/var/lib/postgresql/data') | map(attribute='Name') | list) == [source_volume_name]
        fail_msg: A named source container differs from the reviewed production identity.
      loop: "{{ source_inspects.results }}"
      no_log: true

    - name: Refuse an unexpected active source service or partially frozen state
      ansible.builtin.assert:
        that:
          - (source_inspects.results[0].stdout | from_json | first).State.Running
          - >-
            (source_inspects.results[1:4] | map(attribute='stdout') | map('from_json') | map('first')
             | map(attribute='State.Running') | list) in [[true, true, true], [false, false, false]]
        fail_msg: Source must be fully live or already frozen with only Postgres running.
      no_log: true

    - name: Inspect every running source project container
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --no-trunc, --filter, label=com.docker.compose.project=coinslot]
      delegate_to: "{{ source_host }}"
      become: true
      register: source_running
      changed_when: false
      check_mode: false

    - name: Refuse unknown or duplicate source project processes
      ansible.builtin.assert:
        that:
          - source_running.stdout_lines | length in [1, 4]
          - >-
            source_running.stdout_lines | sort ==
            (source_inspects.results | map(attribute='stdout') | map('from_json') | map('first')
             | selectattr('State.Running', 'equalto', true) | map(attribute='Id') | sort | list)

    - name: Inspect any final target project and database volume
      ansible.builtin.command:
        argv: "{{ item }}"
      become: true
      loop:
        - [docker, ps, --quiet, --filter, label=com.docker.compose.project=agentify-commerce]
        - [docker, volume, inspect, agentify-commerce_coinslot-postgres]
      register: final_target_state
      changed_when: false
      failed_when: final_target_state.rc not in [0, 1]
      check_mode: false
      no_log: true

    - name: Refuse a populated final target before the frozen restore
      ansible.builtin.assert:
        that:
          - final_target_state.results[0].stdout == ''
          - final_target_state.results[1].rc == 1
        fail_msg: Final commerce project or volume already exists; this first backup cannot replace data.

    - name: Confirm the source and target resolved commerce environments
      ansible.builtin.command:
        argv: "{{ item.argv + ['config', '--format', 'json'] }}"
        chdir: "{{ item.dir }}"
      environment: "{{ item.environment }}"
      delegate_to: "{{ item.host }}"
      become: true
      loop:
        - {host: codex-vm, dir: /home/dmitry/coinslot, argv: "{{ source_compose_argv }}", environment: {}}
        - {host: agentify, dir: /home/dmitry/agentify-commerce, argv: "{{ target_compose_argv }}", environment: "{{ target_images }}"}
      register: commerce_configs
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require only the reviewed database URL and public origin differences
      ansible.builtin.assert:
        that:
          - (commerce_configs.results[1].stdout | from_json).services.gateway.image == target_images.COINSLOT_APP_IMAGE
          - (commerce_configs.results[1].stdout | from_json).services.cabinet.image == target_images.COINSLOT_APP_IMAGE
          - (commerce_configs.results[1].stdout | from_json).services.web.image == target_images.COINSLOT_WEB_IMAGE
          - (commerce_configs.results[1].stdout | from_json).volumes['coinslot-postgres'].name == 'agentify-commerce_coinslot-postgres'
          - >-
            ((commerce_configs.results[0].stdout | from_json).services.gateway.environment | dict2items
             | rejectattr('key', 'in', ['DATABASE_URL', 'PUBLIC_BASE_URL']) | sort(attribute='key') | list)
            == ((commerce_configs.results[1].stdout | from_json).services.gateway.environment | dict2items
                | rejectattr('key', 'in', ['DATABASE_URL', 'PUBLIC_BASE_URL']) | sort(attribute='key') | list)
          - >-
            ((commerce_configs.results[0].stdout | from_json).services.cabinet.environment | dict2items
             | rejectattr('key', 'in', ['DATABASE_URL', 'PUBLIC_BASE_URL']) | sort(attribute='key') | list)
            == ((commerce_configs.results[1].stdout | from_json).services.cabinet.environment | dict2items
                | rejectattr('key', 'in', ['DATABASE_URL', 'PUBLIC_BASE_URL']) | sort(attribute='key') | list)
          - (commerce_configs.results[1].stdout | from_json).services.gateway.environment.PUBLIC_BASE_URL == 'https://app.agentify.ad'
          - (commerce_configs.results[1].stdout | from_json).services.cabinet.environment.PUBLIC_BASE_URL == 'https://app.agentify.ad'
        fail_msg: Resolved commerce config changed more than the target database and public origin.
      no_log: true

    - name: Verify each resolved source gateway value is live in its container
      ansible.builtin.assert:
        that: (item.key ~ '=' ~ (item.value | string)) in (source_inspects.results[1].stdout | from_json | first).Config.Env
        fail_msg: Running source gateway differs from the protected source Compose environment.
      loop: "{{ (commerce_configs.results[0].stdout | from_json).services.gateway.environment | dict2items }}"
      no_log: true

    - name: Verify each resolved source cabinet value is live in its container
      ansible.builtin.assert:
        that: (item.key ~ '=' ~ (item.value | string)) in (source_inspects.results[2].stdout | from_json | first).Config.Env
        fail_msg: Running source cabinet differs from the protected source Compose environment.
      loop: "{{ (commerce_configs.results[0].stdout | from_json).services.cabinet.environment | dict2items }}"
      no_log: true

    - name: Check current unfinished source orders and queue work
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - coinslot-postgres-1
          - psql
          - -U
          - coinslot
          - -d
          - coinslot
          - -At
          - -v
          - ON_ERROR_STOP=1
          - -c
          - "SELECT (SELECT count(*) FROM public.orders WHERE open), (SELECT count(*) FROM pgboss.job WHERE state IN ('created','retry','active'))"
      delegate_to: "{{ source_host }}"
      become: true
      register: source_unfinished
      changed_when: false
      check_mode: false
      no_log: true

    - name: Refuse to freeze active payment or background work
      ansible.builtin.assert:
        that: source_unfinished.stdout | trim == '0|0'
        fail_msg: Source has unfinished orders or active queue jobs; drain them before freeze.

    - name: Establish source recovery storage before stopping writers
      ansible.builtin.file:
        path: "{{ source_backup_dir }}"
        state: directory
        owner: dmitry
        mode: '0700'
      delegate_to: "{{ source_host }}"
      when: not ansible_check_mode

    - name: Establish off-VM recovery storage before stopping writers
      ansible.builtin.file:
        path: "{{ recovery_dir }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      when: not ansible_check_mode

    - name: Establish new-VM recovery storage before stopping writers
      ansible.builtin.file:
        path: "{{ target_backup_dir }}"
        state: directory
        owner: dmitry
        mode: '0700'
      become: true
      when: not ansible_check_mode

    - name: Stop the old commerce gateway, cabinet worker and web gracefully
      ansible.builtin.command:
        argv: "{{ source_compose_argv + ['stop', '--timeout', '60', 'gateway', 'cabinet', 'web'] }}"
        chdir: "{{ source_dir }}"
      delegate_to: "{{ source_host }}"
      become: true
      register: source_stop
      changed_when: "'Stopped' in source_stop.stderr"
      when: not ansible_check_mode

    - name: Prove only old Postgres remains running after freeze
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --no-trunc, --filter, label=com.docker.compose.project=coinslot]
      delegate_to: "{{ source_host }}"
      become: true
      register: frozen_running
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Refuse a source writer that survived or restarted
      ansible.builtin.assert:
        that: frozen_running.stdout_lines == [(source_inspects.results[0].stdout | from_json | first).Id]
      when: not ansible_check_mode

    - name: Recheck unfinished work against the stopped source
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - coinslot-postgres-1
          - psql
          - -U
          - coinslot
          - -d
          - coinslot
          - -At
          - -v
          - ON_ERROR_STOP=1
          - -c
          - "SELECT (SELECT count(*) FROM public.orders WHERE open), (SELECT count(*) FROM pgboss.job WHERE state IN ('created','retry','active'))"
      delegate_to: "{{ source_host }}"
      become: true
      register: frozen_unfinished
      changed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode

    - name: Refuse an unsettled source after graceful stop
      ansible.builtin.assert:
        that: frozen_unfinished.stdout | trim == '0|0'
      when: not ansible_check_mode

    - name: Snapshot the old business rows without printing their contents
      ansible.builtin.command:
        argv: [docker, exec, -i, coinslot-postgres-1, psql, -U, coinslot, -d, coinslot, -At, -v, ON_ERROR_STOP=1]
        stdin: "{{ snapshot_sql }}"
      delegate_to: "{{ source_host }}"
      become: true
      register: frozen_snapshot
      changed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode

    - name: Inspect previously frozen backup artifacts
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: "{{ source_host }}"
      loop:
        - "{{ source_dump }}"
        - "{{ source_snapshot }}"
      register: source_artifacts
      no_log: true
      when: not ansible_check_mode

    - name: Read a previous source snapshot if this is a retry
      ansible.builtin.slurp:
        src: "{{ source_snapshot }}"
      delegate_to: "{{ source_host }}"
      register: saved_source_snapshot
      no_log: true
      when: not ansible_check_mode and source_artifacts.results[1].stat.exists

    - name: Refuse an incomplete or mismatched previous source freeze
      ansible.builtin.assert:
        that:
          - source_artifacts.results[0].stat.exists == source_artifacts.results[1].stat.exists
          - >-
            not source_artifacts.results[1].stat.exists or
            (saved_source_snapshot.content | b64decode | from_json) == (frozen_snapshot.stdout_lines[-1] | from_json)
        fail_msg: Frozen backup artifacts are partial or source rows changed; review before any retry.
      no_log: true
      when: not ansible_check_mode

    - name: Dump frozen old commerce data without overwriting an earlier artifact
      ansible.builtin.shell: |
        set -eu
        umask 077
        test ! -e {{ source_dump | quote }}
        tmp=$(mktemp {{ (source_backup_dir ~ '/commerce-frozen.dump.tmp.XXXXXX') | quote }})
        trap 'rm -f "$tmp"' EXIT
        docker exec coinslot-postgres-1 pg_dump -Fc -U coinslot -d coinslot > "$tmp"
        test -s "$tmp"
        chown dmitry:dmitry "$tmp"
        mv -n "$tmp" {{ source_dump | quote }}
      args:
        executable: /bin/bash
      delegate_to: "{{ source_host }}"
      become: true
      no_log: true
      when: not ansible_check_mode and not source_artifacts.results[0].stat.exists

    - name: Validate the frozen archive without touching the database
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - none
          - --volume
          - "{{ source_backup_dir }}:/backups:ro"
          - postgres:17-alpine
          - pg_restore
          - --list
          - /backups/commerce-frozen.dump
      delegate_to: "{{ source_host }}"
      become: true
      register: source_archive_list
      changed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode

    - name: Recheck source rows after the archive completed
      ansible.builtin.command:
        argv: [docker, exec, -i, coinslot-postgres-1, psql, -U, coinslot, -d, coinslot, -At, -v, ON_ERROR_STOP=1]
        stdin: "{{ snapshot_sql }}"
      delegate_to: "{{ source_host }}"
      become: true
      register: source_after_dump
      changed_when: false
      no_log: true
      when: not ansible_check_mode

    - name: Refuse source data drift during the final archive
      ansible.builtin.assert:
        that: (source_after_dump.stdout_lines[-1] | from_json) == (frozen_snapshot.stdout_lines[-1] | from_json)
      no_log: true
      when: not ansible_check_mode

    - name: Record the immutable source business snapshot
      ansible.builtin.copy:
        content: "{{ frozen_snapshot.stdout_lines[-1] | from_json | to_nice_json }}\n"
        dest: "{{ source_snapshot }}"
        owner: dmitry
        mode: '0600'
        force: false
      delegate_to: "{{ source_host }}"
      no_log: true
      when: not ansible_check_mode and not source_artifacts.results[1].stat.exists

    - name: Recheck source artifacts and both original environment files before fetching
      ansible.builtin.stat:
        path: "{{ item.path }}"
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: "{{ item.host }}"
      loop:
        - {host: codex-vm, path: "{{ source_dump }}"}
        - {host: codex-vm, path: "{{ source_snapshot }}"}
        - {host: codex-vm, path: "{{ source_env }}"}
        - {host: agentify, path: "{{ target_env }}"}
      register: final_source_artifacts
      no_log: true
      when: not ansible_check_mode

    - name: Refuse secret rotation during the final freeze
      ansible.builtin.assert:
        that:
          - final_source_artifacts.results[2].stat.checksum == commerce_env_stats.results[0].stat.checksum
          - final_source_artifacts.results[3].stat.checksum == commerce_env_stats.results[1].stat.checksum
        fail_msg: Source or target protected environment changed during the freeze.
      no_log: true
      when: not ansible_check_mode

    - name: Inspect existing protected off-VM copies before any fetch
      ansible.builtin.stat:
        path: "{{ recovery_dir }}/{{ item }}"
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: localhost
      loop: [commerce-frozen.dump, source-snapshot.json, source.env, target.env]
      register: controller_artifacts
      no_log: true
      when: not ansible_check_mode

    - name: Refuse overwrite of any off-VM copy from an earlier attempt
      ansible.builtin.assert:
        that: >-
          not item.stat.exists or
          item.stat.checksum == final_source_artifacts.results[item_index].stat.checksum
        fail_msg: Existing off-VM artifact differs; preserve it for reviewed recovery.
      loop: "{{ controller_artifacts.results }}"
      loop_control:
        index_var: item_index
      no_log: true
      when: not ansible_check_mode

    - name: Fetch frozen dump, source secrets and row snapshot off both servers
      ansible.builtin.fetch:
        src: "{{ item.src }}"
        dest: "{{ recovery_dir }}/{{ item.name }}"
        flat: true
        validate_checksum: true
      delegate_to: "{{ item.host }}"
      loop:
        - {host: codex-vm, src: "{{ source_dump }}", name: commerce-frozen.dump, index: 0}
        - {host: codex-vm, src: "{{ source_snapshot }}", name: source-snapshot.json, index: 1}
        - {host: codex-vm, src: "{{ source_env }}", name: source.env, index: 2}
        - {host: agentify, src: "{{ target_env }}", name: target.env, index: 3}
      no_log: true
      when: not ansible_check_mode and not controller_artifacts.results[item.index].stat.exists

    - name: Restrict each off-VM recovery artifact
      ansible.builtin.file:
        path: "{{ recovery_dir }}/{{ item }}"
        mode: '0600'
      delegate_to: localhost
      loop: [commerce-frozen.dump, source-snapshot.json, source.env, target.env]
      when: not ansible_check_mode

    - name: Preserve the exact frozen source artifacts on the new VM
      ansible.builtin.copy:
        src: "{{ recovery_dir }}/{{ item }}"
        dest: "{{ target_backup_dir }}/{{ item }}"
        owner: dmitry
        mode: '0600'
        force: false
      become: true
      loop: [commerce-frozen.dump, source-snapshot.json, source.env, target.env]
      no_log: true
      when: not ansible_check_mode

    - name: Verify SHA-256 of all protected recovery copies
      ansible.builtin.stat:
        path: "{{ item.host_dir }}/{{ item.name }}"
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: "{{ item.host }}"
      become: "{{ item.host == 'agentify' and item.host_dir == target_backup_dir }}"
      loop:
        - {host: codex-vm, host_dir: "{{ source_backup_dir }}", name: commerce-frozen.dump}
        - {host: codex-vm, host_dir: "{{ source_backup_dir }}", name: source-snapshot.json}
        - {host: codex-vm, host_dir: "{{ source_dir }}", name: .env}
        - {host: agentify, host_dir: "{{ target_dir }}", name: .env}
        - {host: agentify, host_dir: "{{ target_backup_dir }}", name: commerce-frozen.dump}
        - {host: agentify, host_dir: "{{ target_backup_dir }}", name: source-snapshot.json}
        - {host: agentify, host_dir: "{{ target_backup_dir }}", name: source.env}
        - {host: agentify, host_dir: "{{ target_backup_dir }}", name: target.env}
        - {host: localhost, host_dir: "{{ recovery_dir }}", name: commerce-frozen.dump}
        - {host: localhost, host_dir: "{{ recovery_dir }}", name: source-snapshot.json}
        - {host: localhost, host_dir: "{{ recovery_dir }}", name: source.env}
        - {host: localhost, host_dir: "{{ recovery_dir }}", name: target.env}
      register: recovery_stats
      no_log: true
      when: not ansible_check_mode

    - name: Refuse a recovery copy that differs from its frozen source
      ansible.builtin.assert:
        that:
          - recovery_stats.results | selectattr('stat.mode', 'equalto', '0600') | list | length == 12
          - recovery_stats.results[0].stat.checksum == recovery_stats.results[4].stat.checksum == recovery_stats.results[8].stat.checksum
          - recovery_stats.results[1].stat.checksum == recovery_stats.results[5].stat.checksum == recovery_stats.results[9].stat.checksum
          - recovery_stats.results[2].stat.checksum == recovery_stats.results[6].stat.checksum == recovery_stats.results[10].stat.checksum
          - recovery_stats.results[3].stat.checksum == recovery_stats.results[7].stat.checksum == recovery_stats.results[11].stat.checksum
          - recovery_stats.results[2].stat.checksum == commerce_env_stats.results[0].stat.checksum
          - recovery_stats.results[3].stat.checksum == commerce_env_stats.results[1].stat.checksum
      no_log: true
      when: not ansible_check_mode
