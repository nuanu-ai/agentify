---
- name: Transfer the single scanner worker and scheduled jobs to the new VM
  hosts: production
  gather_facts: false
  vars:
    donor_host: scanner-donor
    donor_dir: /opt/agentify/current/ops/deploy/droplet
    donor_env: /opt/agentify/shared/.env.production
    donor_cron: /etc/cron.d/agentify
    donor_cron_archive: /etc/agentify-cron-retired
    release_dir: /home/dmitry/agentify-commerce
    target_dir: /home/dmitry/agentify-commerce/ops/deploy/droplet
    target_env: /home/dmitry/agentify-scanner/.env.production
    target_job_script: /home/dmitry/agentify-scanner/scanner-jobs.sh
    target_backup_override: /home/dmitry/agentify-scanner/compose.scanner-handoff.yaml
    target_cron: /etc/cron.d/agentify
    target_backup_dir: /home/dmitry/agentify-backups/scanner
    recovery_dir: "{{ playbook_dir }}/../../.local/scanner-backups"
    worker_image: "agentify-scanner-worker:{{ release_sha }}"
    web_image: "agentify-scanner-web:{{ release_sha }}"
    privacy_image: "agentify-scanner-privacy:{{ release_sha }}"
    donor_compose_argv: [docker, compose, --env-file, /opt/agentify/shared/.env.production, -f, compose.production.yaml]
    target_compose_argv:
      - docker
      - compose
      - --env-file
      - "{{ target_env }}"
      - -f
      - compose.production.yaml
      - -f
      - compose.hetzner.yaml
    target_images:
      AGENTIFY_SCANNER_WEB_IMAGE: "{{ web_image }}"
      AGENTIFY_SCANNER_WORKER_IMAGE: "{{ worker_image }}"
      AGENTIFY_SCANNER_PRIVACY_IMAGE: "{{ privacy_image }}"
    cron_content: |
      SHELL=/bin/bash
      17 3 * * * root /home/dmitry/agentify-scanner/scanner-jobs.sh backup
      23 4 * * * root /home/dmitry/agentify-scanner/scanner-jobs.sh privacy
  tasks:
    - name: Require the reviewed release and explicit donor inventory
      ansible.builtin.assert:
        that:
          - release_sha is defined
          - release_sha | default('') is match('^[0-9a-f]{40}$')
          - donor_host in groups['scanner_source']

    - name: Verify the new VM checkout revision
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ release_dir }}"
      register: checkout_sha
      changed_when: false
      check_mode: false

    - name: Refuse another checkout revision
      ansible.builtin.assert:
        that: checkout_sha.stdout == release_sha

    - name: Verify unchanged scanner credentials on donor and new VM
      ansible.builtin.stat:
        path: "{{ item.path }}"
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: "{{ item.host }}"
      become: "{{ item.become }}"
      loop:
        - {path: /opt/agentify/shared/.env.production, host: scanner-donor, become: true}
        - {path: /home/dmitry/agentify-scanner/.env.production, host: agentify, become: false}
      register: env_stats
      no_log: true

    - name: Refuse secret drift before taking ownership of the shared database
      ansible.builtin.assert:
        that:
          - env_stats.results[0].stat.mode == '0600'
          - env_stats.results[0].stat.pw_name == 'root'
          - env_stats.results[1].stat.mode == '0600'
          - env_stats.results[1].stat.pw_name == 'dmitry'
          - env_stats.results[0].stat.checksum == env_stats.results[1].stat.checksum
      no_log: true

    - name: Resolve donor worker identity without changing its runtime
      ansible.builtin.command:
        argv: "{{ donor_compose_argv + ['config', '--format', 'json'] }}"
        chdir: "{{ donor_dir }}"
      delegate_to: "{{ donor_host }}"
      become: true
      register: donor_config
      changed_when: false
      check_mode: false
      no_log: true

    - name: Resolve new scanner worker and profiled privacy job
      ansible.builtin.command:
        argv: "{{ target_compose_argv + ['--profile', 'jobs', 'config', '--format', 'json'] }}"
        chdir: "{{ target_dir }}"
      environment: "{{ target_images }}"
      become: true
      register: target_config
      changed_when: false
      check_mode: false
      no_log: true

    - name: Refuse a worker identity, database or image mismatch
      ansible.builtin.assert:
        that:
          - (donor_config.stdout | from_json).services.worker.environment.WORKER_ID == (target_config.stdout | from_json).services.worker.environment.WORKER_ID
          - (donor_config.stdout | from_json).services.worker.environment.DATABASE_URL == (target_config.stdout | from_json).services.worker.environment.DATABASE_URL
          - (target_config.stdout | from_json).services.worker.image == worker_image
          - (target_config.stdout | from_json).services['privacy-cleanup'].image == privacy_image
        fail_msg: Keep the original worker ID, shared external database and exact release images.
      no_log: true

    - name: Require the exact worker and privacy images before stopping donor jobs
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ item }}"]
      become: true
      loop:
        - "{{ worker_image }}"
        - "{{ privacy_image }}"
        - postgres:17.6-alpine
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require the new public scanner website to be live before handoff
      ansible.builtin.uri:
        url: https://agentify.ad/api/health/live
        method: GET
        status_code: 200
        validate_certs: true
        return_content: false
      delegate_to: localhost
      changed_when: false

    - name: Query database readiness independently of worker heartbeat
      ansible.builtin.uri:
        url: https://agentify.ad/api/health
        method: GET
        status_code: [200, 503]
        validate_certs: true
        return_content: true
      delegate_to: localhost
      register: scanner_preflight_health
      changed_when: false
      no_log: true

    - name: Refuse handoff without a reachable shared scanner database
      ansible.builtin.assert:
        that: scanner_preflight_health.json.dependencies.database == 'ok'
        fail_msg: The new scanner web cannot read its shared database; do not change worker ownership.
      no_log: true

    - name: Inspect the old and new worker owners
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --filter, label=com.docker.compose.project=agentify, --filter, label=com.docker.compose.service=worker]
      delegate_to: "{{ item }}"
      become: true
      loop:
        - "{{ donor_host }}"
        - agentify
      register: workers_before
      changed_when: false
      check_mode: false

    - name: Refuse two running scanner workers
      ansible.builtin.assert:
        that:
          - workers_before.results[0].stdout_lines | length <= 1
          - workers_before.results[1].stdout_lines | length <= 1
          - workers_before.results[0].stdout == '' or workers_before.results[1].stdout == ''
        fail_msg: Both donor and target workers are running against the shared database.

    - name: Inspect the donor worker's persistent manual-stop policy
      ansible.builtin.command:
        argv: [docker, inspect, agentify-worker-1]
      delegate_to: "{{ donor_host }}"
      become: true
      register: donor_worker_info
      changed_when: false
      check_mode: false
      no_log: true

    - name: Refuse a donor worker that Docker would automatically revive after handoff
      ansible.builtin.assert:
        that:
          - (donor_worker_info.stdout | from_json | first).HostConfig.RestartPolicy.Name == 'unless-stopped'
          - (donor_worker_info.stdout | from_json | first).Config.Labels['com.docker.compose.project'] == 'agentify'
          - (donor_worker_info.stdout | from_json | first).Config.Labels['com.docker.compose.service'] == 'worker'
          - (donor_worker_info.stdout | from_json | first).Config.Env | select('match', '^WORKER_ID=') | list == ['WORKER_ID=' ~ (donor_config.stdout | from_json).services.worker.environment.WORKER_ID]
          - (donor_worker_info.stdout | from_json | first).State.Running == (workers_before.results[0].stdout != '')
        fail_msg: Donor worker restart policy is not the reviewed unless-stopped manual-stop behavior.

    - name: Inspect donor and target cron ownership
      ansible.builtin.stat:
        path: "{{ item.path }}"
      delegate_to: "{{ item.host }}"
      become: true
      loop:
        - {path: /etc/cron.d/agentify, host: scanner-donor}
        - {path: /etc/agentify-cron-retired, host: scanner-donor}
        - {path: /etc/cron.d/agentify, host: agentify}
      register: cron_stats

    - name: Refuse a donor cron with both active and retired copies
      ansible.builtin.assert:
        that:
          - cron_stats.results[0].stat.exists or cron_stats.results[1].stat.exists
          - not (cron_stats.results[0].stat.exists and cron_stats.results[1].stat.exists)
          - not (cron_stats.results[0].stat.exists and cron_stats.results[2].stat.exists)
          - not cron_stats.results[2].stat.exists or cron_stats.results[2].stat.isreg
        fail_msg: Donor and target cron must never be active together against the shared Supabase project.

    - name: Read existing or archived donor cron text before disabling it
      ansible.builtin.slurp:
        src: "{{ donor_cron if cron_stats.results[0].stat.exists else donor_cron_archive }}"
      delegate_to: "{{ donor_host }}"
      become: true
      register: donor_cron_text
      no_log: true

    - name: Identify only active noncomment donor schedule lines
      ansible.builtin.set_fact:
        donor_cron_jobs: "{{ donor_cron_text.content | b64decode | regex_findall('(?m)^\\s*\\d+\\s+\\d+\\s+\\S+\\s+\\S+\\s+\\S+\\s+\\S+\\s+.+$') }}"
      no_log: true

    - name: Require the two known donor jobs before taking them over
      ansible.builtin.assert:
        that:
          - donor_cron_jobs | length == 2
          - donor_cron_jobs | select('match', '^\\s*17\\s+3\\s+.*backup.sh') | list | length == 1
          - donor_cron_jobs | select('match', '^\\s*23\\s+4\\s+.*privacy-cleanup') | list | length == 1
          - donor_cron_jobs | select('search', '/opt/agentify/current/ops/deploy/droplet/backup.sh') | list | length == 1
          - (donor_cron_text.content | b64decode | regex_findall('(?m)^\\s*@\\w+\\s+.*$')) | length == 0
          - (donor_cron_text.content | b64decode | regex_findall('(?m)^\\s*(?:CRON_TZ|TZ)\\s*=')) | length == 0
        fail_msg: The donor cron file contains unexpected jobs; inspect it before handoff.
      no_log: true

    - name: Read donor and target cron time zones before copying wall-clock times
      ansible.builtin.command:
        argv: [timedatectl, show, -p, Timezone, --value]
      delegate_to: "{{ item }}"
      loop:
        - "{{ donor_host }}"
        - agentify
      register: cron_timezones
      changed_when: false
      check_mode: false

    - name: Refuse silently moving scheduled jobs to a different time zone
      ansible.builtin.assert:
        that: cron_timezones.results[0].stdout == cron_timezones.results[1].stdout

    - name: Refuse an unrelated target cron file
      ansible.builtin.slurp:
        src: "{{ target_cron }}"
      become: true
      register: target_cron_text
      no_log: true
      when: cron_stats.results[2].stat.exists

    - name: Require an existing target cron to be exactly this handoff schedule
      ansible.builtin.assert:
        that: (target_cron_text.content | b64decode) == cron_content
        fail_msg: Existing target cron differs; do not replace another schedule.
      no_log: true
      when: cron_stats.results[2].stat.exists

    - name: Require donor scheduled jobs idle before taking ownership
      ansible.builtin.include_tasks: assert-donor-jobs-drained.yml

    - name: Stage a protected target backup directory
      ansible.builtin.file:
        path: "{{ target_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      become: true
      when: not ansible_check_mode

    - name: Stage the exact-release target job script outside cron
      ansible.builtin.template:
        src: scanner-jobs.sh.j2
        dest: "{{ target_job_script }}"
        owner: root
        group: root
        mode: '0700'
        validate: /bin/bash -n %s
      become: true
      when: not ansible_check_mode

    - name: Stage the target-only backup mount override outside the release checkout
      ansible.builtin.copy:
        src: compose.scanner-handoff.yaml
        dest: "{{ target_backup_override }}"
        owner: root
        group: root
        mode: '0644'
      become: true
      when: not ansible_check_mode

    - name: Verify the target backup job uses only the new VM backup directory
      ansible.builtin.command:
        argv: "{{ target_compose_argv + ['-f', target_backup_override, '--profile', 'jobs', 'config', '--format', 'json'] }}"
        chdir: "{{ target_dir }}"
      environment: "{{ target_images }}"
      become: true
      register: target_jobs_config
      changed_when: false
      no_log: true
      when: not ansible_check_mode

    - name: Refuse a backup mount outside the dedicated new VM directory
      ansible.builtin.assert:
        that: (target_jobs_config.stdout | from_json).services['database-backup'].volumes[0].source == target_backup_dir
      no_log: true
      when: not ansible_check_mode

    - name: Inspect protected new VM scanner backups without opening donor files
      ansible.builtin.find:
        paths: "{{ target_backup_dir }}"
        patterns: agentify-*.dump
        file_type: file
      become: true
      register: target_backups_before
      when: not ansible_check_mode

    - name: Read current UTC epoch for a bounded recovery freshness check
      ansible.builtin.command:
        argv: [date, -u, +%s]
      register: handoff_epoch
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Make a fresh target backup before taking the donor worker or cron offline
      ansible.builtin.command:
        argv: ["{{ target_job_script }}", backup]
      become: true
      no_log: true
      when: >-
        not ansible_check_mode and
        (target_backups_before.matched == 0 or
        (handoff_epoch.stdout | int) - ((target_backups_before.files | sort(attribute='path') | last).mtime | int) > 3600)

    - name: Identify the latest protected new VM scanner backup
      ansible.builtin.find:
        paths: "{{ target_backup_dir }}"
        patterns: agentify-*.dump
        file_type: file
      become: true
      register: target_backups_after
      when: not ansible_check_mode

    - name: Require a nonempty target scanner dump
      ansible.builtin.assert:
        that:
          - target_backups_after.matched > 0
          - (target_backups_after.files | sort(attribute='path') | last).size > 0
          - (handoff_epoch.stdout | int) - ((target_backups_after.files | sort(attribute='path') | last).mtime | int) <= 3600
      when: not ansible_check_mode

    - name: Remember the latest target scanner backup path
      ansible.builtin.set_fact:
        latest_backup_path: "{{ (target_backups_after.files | sort(attribute='path') | last).path }}"
      when: not ansible_check_mode

    - name: Verify the existing backup's custom archive directory
      ansible.builtin.command:
        argv: [docker, run, --rm, --network, none, --volume, "{{ target_backup_dir }}:/backups:ro", postgres:17.6-alpine, pg_restore, --list, "/backups/{{ latest_backup_path | basename }}"]
      become: true
      changed_when: false
      no_log: true
      when: not ansible_check_mode

    - name: Record the backup's SHA-256 without exposing data
      ansible.builtin.stat:
        path: "{{ latest_backup_path }}"
        get_checksum: true
        checksum_algorithm: sha256
      become: true
      register: latest_backup_stat
      no_log: true
      when: not ansible_check_mode

    - name: Prepare a protected off-VM recovery directory on the controller
      ansible.builtin.file:
        path: "{{ recovery_dir }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      when: not ansible_check_mode

    - name: Inspect any previously protected off-VM scanner configuration copy
      ansible.builtin.stat:
        path: "{{ recovery_dir }}/scanner.env.production"
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: localhost
      register: local_env_before
      no_log: true
      when: not ansible_check_mode

    - name: Refuse silently replacing a different recovery key set
      ansible.builtin.assert:
        that:
          - not local_env_before.stat.exists or local_env_before.stat.isreg
          - not local_env_before.stat.exists or local_env_before.stat.mode == '0600'
          - not local_env_before.stat.exists or local_env_before.stat.checksum == env_stats.results[1].stat.checksum
        fail_msg: Existing off-VM scanner env differs; preserve and review it before replacing recovery keys.
      no_log: true
      when: not ansible_check_mode

    - name: Fetch the protected scanner keys off the new VM without logging bytes
      ansible.builtin.fetch:
        src: "{{ target_env }}"
        dest: "{{ recovery_dir }}/scanner.env.production"
        flat: true
      register: fetched_scanner_env
      no_log: true
      when: not ansible_check_mode

    - name: Keep the off-VM scanner key set owner-readable only
      ansible.builtin.file:
        path: "{{ recovery_dir }}/scanner.env.production"
        state: file
        mode: '0600'
      delegate_to: localhost
      when: not ansible_check_mode

    - name: Verify the off-VM scanner key set is byte-identical to donor and target
      ansible.builtin.stat:
        path: "{{ recovery_dir }}/scanner.env.production"
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: localhost
      register: local_env_after
      no_log: true
      when: not ansible_check_mode

    - name: Refuse handoff without the protected off-VM scanner keys
      ansible.builtin.assert:
        that: local_env_after.stat.checksum == env_stats.results[0].stat.checksum
      no_log: true
      when: not ansible_check_mode

    - name: Fetch the verified scanner dump off the new VM without logging its bytes
      ansible.builtin.fetch:
        src: "{{ latest_backup_path }}"
        dest: "{{ recovery_dir }}/{{ latest_backup_path | basename }}"
        flat: true
      become: true
      register: fetched_backup
      no_log: true
      when: not ansible_check_mode

    - name: Protect the off-VM recovery dump
      ansible.builtin.file:
        path: "{{ recovery_dir }}/{{ latest_backup_path | basename }}"
        state: file
        mode: '0600'
      delegate_to: localhost
      when: not ansible_check_mode

    - name: Verify the off-VM copy has the same SHA-256
      ansible.builtin.stat:
        path: "{{ recovery_dir }}/{{ latest_backup_path | basename }}"
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: localhost
      register: local_backup_stat
      no_log: true
      when: not ansible_check_mode

    - name: Refuse handoff without a byte-identical off-VM recovery copy
      ansible.builtin.assert:
        that: local_backup_stat.stat.checksum == latest_backup_stat.stat.checksum
      no_log: true
      when: not ansible_check_mode

    - name: Disable the donor cron without destroying its original file
      ansible.builtin.command:
        argv: [mv, "{{ donor_cron }}", "{{ donor_cron_archive }}"]
      delegate_to: "{{ donor_host }}"
      become: true
      when: cron_stats.results[0].stat.exists and not ansible_check_mode

    - name: Require already launched donor jobs drained after cron archival
      ansible.builtin.include_tasks: assert-donor-jobs-drained.yml
      when: not ansible_check_mode

    - name: Stop the donor worker before the replacement can poll
      ansible.builtin.command:
        argv: "{{ donor_compose_argv + ['stop', '--timeout', '30', 'worker'] }}"
        chdir: "{{ donor_dir }}"
      delegate_to: "{{ donor_host }}"
      become: true
      register: donor_worker_stop
      changed_when: "'Stopped' in donor_worker_stop.stderr"
      no_log: true
      when: workers_before.results[0].stdout != '' and not ansible_check_mode

    - name: Start only the replacement worker with the original worker ID
      ansible.builtin.command:
        argv: "{{ target_compose_argv + ['up', '-d', '--no-deps', '--wait', '--wait-timeout', '180', '--no-build', 'worker'] }}"
        chdir: "{{ target_dir }}"
      environment: "{{ target_images }}"
      become: true
      register: target_worker_up
      changed_when: "'Created' in target_worker_up.stderr or 'Started' in target_worker_up.stderr or 'Recreated' in target_worker_up.stderr"
      no_log: true
      when: not ansible_check_mode

    - name: Require scanner readiness through the new public edge and worker
      ansible.builtin.uri:
        url: https://agentify.ad/api/health
        method: GET
        status_code: 200
        validate_certs: true
        return_content: false
      delegate_to: localhost
      changed_when: false
      when: not ansible_check_mode

    - name: Require donor scheduled jobs still drained before target cron installation
      ansible.builtin.include_tasks: assert-donor-jobs-drained.yml
      when: not ansible_check_mode

    - name: Install the new scheduled backup and privacy jobs only after worker readiness
      ansible.builtin.copy:
        content: "{{ cron_content }}"
        dest: "{{ target_cron }}"
        owner: root
        group: root
        mode: '0644'
      become: true
      when: not ansible_check_mode

    - name: Confirm the donor worker remains stopped
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --filter, label=com.docker.compose.project=agentify, --filter, label=com.docker.compose.service=worker]
      delegate_to: "{{ donor_host }}"
      become: true
      register: donor_worker_after
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Inspect the donor worker state after the intentional stop
      ansible.builtin.command:
        argv: [docker, inspect, agentify-worker-1]
      delegate_to: "{{ donor_host }}"
      become: true
      register: donor_worker_state_after
      changed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode

    - name: Refuse a duplicate worker after handoff
      ansible.builtin.assert:
        that:
          - donor_worker_after.stdout == ''
          - not (donor_worker_state_after.stdout | from_json | first).State.Running
          - (donor_worker_state_after.stdout | from_json | first).HostConfig.RestartPolicy.Name == 'unless-stopped'
      when: not ansible_check_mode
