---
- name: Stage the unified Agentify production release without activating it
  hosts: production
  gather_facts: false
  vars:
    release_dir: /home/dmitry/agentify-commerce
    ingress_network: agentify-ingress
    ingress_subnet: 172.30.80.0/24
    ingress_gateway: 172.30.80.1
    app_image: "agentify-commerce-app:{{ release_sha }}"
    web_image: "agentify-commerce-web:{{ release_sha }}"
    scanner_worker_image: "agentify-scanner-worker:{{ release_sha }}"
    edge_image: caddy:2.10.0-alpine
    commerce_compose_argv:
      - docker
      - compose
      - --project-name
      - agentify-commerce
      - --env-file
      - "{{ release_dir }}/.env"
      - -f
      - compose.yaml
      - -f
      - deploy/compose.public.yaml
      - -f
      - deploy/compose.hetzner-commerce.yaml
  tasks:
    - name: Require an explicit immutable release and an inactive preparation
      ansible.builtin.assert:
        that:
          - release_sha is defined
          - release_sha | default('') is match('^[0-9a-f]{40}$')
        fail_msg: Pass the reviewed 40-character lowercase release_sha explicitly.

    - name: Inspect the existing protected commerce configuration
      ansible.builtin.stat:
        path: "{{ release_dir }}/.env"
        get_checksum: false
      register: commerce_env

    - name: Refuse a missing or exposed production configuration
      ansible.builtin.assert:
        that:
          - commerce_env.stat.exists
          - commerce_env.stat.isreg
          - commerce_env.stat.mode == '0600'
          - commerce_env.stat.pw_name == 'dmitry'
        fail_msg: The existing server-owned production .env must be a regular dmitry-owned 0600 file.

    - name: Inspect whether unified production projects are already active
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --filter, "label=com.docker.compose.project={{ item }}"]
      become: true
      loop:
        - agentify-commerce
        - agentify
        - agentify-edge
      register: active_production_projects
      changed_when: false
      check_mode: false

    - name: Refuse preparation over a final commerce or scanner stack
      ansible.builtin.assert:
        that: active_production_projects.results[0:2] | selectattr('stdout', 'equalto', '') | list | length == 2
        fail_msg: A final commerce or scanner project is running; use a controlled release playbook instead.

    - name: Refuse more than one existing edge container
      ansible.builtin.assert:
        that: active_production_projects.results[2].stdout_lines | length <= 1
        fail_msg: Inspect the active edge project before preparing another release.

    - name: Inspect an active edge before checking out another release
      ansible.builtin.command:
        argv: [docker, inspect, "{{ active_production_projects.results[2].stdout }}"]
      become: true
      register: preparation_edge
      changed_when: false
      check_mode: false
      no_log: true
      when: active_production_projects.results[2].stdout != ''

    - name: Allow preparation only behind the reviewed maintenance edge
      ansible.builtin.assert:
        that: >-
          (preparation_edge.stdout | from_json | first).Mounts
          | selectattr('Destination', 'equalto', '/etc/caddy/Caddyfile')
          | map(attribute='Source') | list == [release_dir ~ '/deploy/edge/Caddyfile.warmup']
        fail_msg: A nonmaintenance public edge is active; use a controlled release playbook instead.
      when: active_production_projects.results[2].stdout != ''

    - name: Check out the reviewed release in the existing production directory
      ansible.builtin.git:
        repo: https://github.com/nuanu-ai/agentify.git
        dest: "{{ release_dir }}"
        version: "{{ release_sha }}"
        update: true
        force: false

    - name: Verify the exact checked-out commit
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ release_dir }}"
      register: checked_out_sha
      changed_when: false
      check_mode: false

    - name: Refuse another checked-out revision
      ansible.builtin.assert:
        that: checked_out_sha.stdout == release_sha
      when: not ansible_check_mode

    - name: Inspect every nonignored checkout change
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ release_dir }}"
      register: production_source_status
      changed_when: false
      check_mode: false

    - name: Refuse a modified or untracked production checkout
      ansible.builtin.assert:
        that: production_source_status.stdout == ''
        fail_msg: The release checkout has nonignored source changes; do not build from it.
      when: not ansible_check_mode

    - name: Inspect the ingress and commerce override files
      ansible.builtin.stat:
        path: "{{ release_dir }}/{{ item }}"
      loop:
        - deploy/edge/compose.yaml
        - deploy/edge/Caddyfile
        - ops/deploy/droplet/compose.hetzner.yaml
      register: staged_edge_files

    - name: Refuse a release lacking the reviewed unified ingress
      ansible.builtin.assert:
        that: staged_edge_files.results | selectattr('stat.isreg', 'equalto', true) | list | length == 3
        fail_msg: The release SHA must contain all reviewed ingress and scanner override files.
      when: not ansible_check_mode

    - name: Inspect Docker Compose without changing the VM baseline
      ansible.builtin.command:
        argv: [docker, compose, version, --short]
      become: true
      register: compose_version
      changed_when: false
      check_mode: false

    - name: Resolve the production commerce stack without starting services
      ansible.builtin.command:
        argv: "{{ commerce_compose_argv + ['config', '--quiet'] }}"
        chdir: "{{ release_dir }}"
      environment:
        COINSLOT_APP_IMAGE: "{{ app_image }}"
        COINSLOT_WEB_IMAGE: "{{ web_image }}"
      become: true
      changed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode

    - name: Verify the resolved production image set is the reviewed release
      ansible.builtin.command:
        argv: "{{ commerce_compose_argv + ['config', '--images'] }}"
        chdir: "{{ release_dir }}"
      environment:
        COINSLOT_APP_IMAGE: "{{ app_image }}"
        COINSLOT_WEB_IMAGE: "{{ web_image }}"
      become: true
      register: commerce_images
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Refuse a production stack with implicit or mutable image tags
      ansible.builtin.assert:
        that: commerce_images.stdout_lines | unique | sort == [app_image, web_image, 'postgres:17-alpine'] | sort
        fail_msg: Resolved commerce images differ from the exact release tags and pinned Postgres image.
      when: not ansible_check_mode

    - name: Inspect the private ingress network
      ansible.builtin.command:
        argv: [docker, network, inspect, "{{ ingress_network }}"]
      become: true
      register: ingress_inspect
      changed_when: false
      failed_when: ingress_inspect.rc not in [0, 1]
      check_mode: false
      no_log: true

    - name: Refuse an existing network with the wrong address plan
      ansible.builtin.assert:
        that:
          - (ingress_inspect.stdout | from_json | first).IPAM.Config[0].Subnet == ingress_subnet
          - (ingress_inspect.stdout | from_json | first).IPAM.Config[0].Gateway == ingress_gateway
        fail_msg: The existing ingress network has different IPAM; inspect the VM before changing this topology.
      when: ingress_inspect.rc == 0
      no_log: true

    - name: Create the private ingress network if absent
      ansible.builtin.command:
        argv:
          - docker
          - network
          - create
          - --driver
          - bridge
          - --subnet
          - "{{ ingress_subnet }}"
          - --gateway
          - "{{ ingress_gateway }}"
          - "{{ ingress_network }}"
      become: true
      when: ingress_inspect.rc == 1 and not ansible_check_mode

    - name: Inspect the exact commerce application image
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ app_image }}"]
      become: true
      register: app_image_inspect
      changed_when: false
      failed_when: app_image_inspect.rc not in [0, 1]
      check_mode: false
      no_log: true

    - name: Inspect the exact commerce web image
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ web_image }}"]
      become: true
      register: web_image_inspect
      changed_when: false
      failed_when: web_image_inspect.rc not in [0, 1]
      check_mode: false
      no_log: true

    - name: Inspect the edge's declared Caddy image
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ edge_image }}"]
      become: true
      register: edge_image_inspect
      changed_when: false
      failed_when: edge_image_inspect.rc not in [0, 1]
      check_mode: false
      no_log: true

    - name: Pull the edge image only if absent
      ansible.builtin.command:
        argv: [docker, pull, "{{ edge_image }}"]
      become: true
      no_log: true
      when: edge_image_inspect.rc == 1 and not ansible_check_mode

    - name: Build the absent application image only on the new VM
      ansible.builtin.command:
        argv: "{{ commerce_compose_argv + ['build', 'gateway'] }}"
        chdir: "{{ release_dir }}"
      environment:
        COINSLOT_APP_IMAGE: "{{ app_image }}"
        COINSLOT_WEB_IMAGE: "{{ web_image }}"
      become: true
      no_log: true
      when: app_image_inspect.rc == 1 and not ansible_check_mode

    - name: Build the absent web image only on the new VM
      ansible.builtin.command:
        argv: "{{ commerce_compose_argv + ['build', 'web'] }}"
        chdir: "{{ release_dir }}"
      environment:
        COINSLOT_APP_IMAGE: "{{ app_image }}"
        COINSLOT_WEB_IMAGE: "{{ web_image }}"
      become: true
      no_log: true
      when: web_image_inspect.rc == 1 and not ansible_check_mode

    - name: Verify both release images exist after preparation
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ item }}"]
      become: true
      loop:
        - "{{ app_image }}"
        - "{{ web_image }}"
      changed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode

    - name: Resolve protected commerce config for behavioral preflight
      ansible.builtin.command:
        argv: "{{ commerce_compose_argv + ['config', '--format', 'json'] }}"
        chdir: "{{ release_dir }}"
      environment:
        COINSLOT_APP_IMAGE: "{{ app_image }}"
        COINSLOT_WEB_IMAGE: "{{ web_image }}"
      become: true
      register: commerce_resolved
      changed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode

    - name: Run the release's production preflight in a transient network-free container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --interactive
          - --network
          - none
          - --entrypoint
          - node
          - "{{ app_image }}"
          - packages/core/src/deployment/preflight.mjs
          - commerce
        stdin: "{{ commerce_resolved.stdout }}"
        stdin_add_newline: false
      become: true
      register: commerce_preflight
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode

    - name: Refuse a commerce release that did not pass behavioral preflight
      ansible.builtin.assert:
        that: commerce_preflight.rc == 0
        fail_msg: The reviewed commerce configuration did not pass the release preflight; no service was started.
      when: not ansible_check_mode

    - name: Inspect the optional exact scanner worker image
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ scanner_worker_image }}"]
      become: true
      register: scanner_worker_image_inspect
      changed_when: false
      failed_when: scanner_worker_image_inspect.rc not in [0, 1]
      check_mode: false
      no_log: true
      when: prepare_scanner_worker_image | default(false) | bool

    - name: Build only the scanner worker image when explicitly requested
      ansible.builtin.command:
        argv:
          - docker
          - build
          - --file
          - ops/deploy/scanner-worker.Dockerfile
          - --tag
          - "{{ scanner_worker_image }}"
          - .
        chdir: "{{ release_dir }}"
      become: true
      no_log: true
      when:
        - prepare_scanner_worker_image | default(false) | bool
        - scanner_worker_image_inspect.rc == 1
        - not ansible_check_mode

    - name: Explain what a pre-apply check cannot prove
      ansible.builtin.debug:
        msg: >-
          Check mode previews the Git change and inspects current Docker state.
          The new release's Compose config, network creation, and missing image
          builds require a real preparation run before they can be verified.
      when: ansible_check_mode
