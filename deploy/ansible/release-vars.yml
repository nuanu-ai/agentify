    origin: https://agentify.ad
    commerce_project: agentify-commerce
    scanner_project: agentify
    commerce_environment: /home/dmitry/agentify-namespace-57eaca4/.env
    scanner_environment: /home/dmitry/agentify-scanner/.env.namespace-57eaca4
