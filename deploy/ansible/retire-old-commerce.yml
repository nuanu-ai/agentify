---
- name: Retire old live commerce and private warmup after accepted public cutover
  hosts: production
  gather_facts: false
  vars:
    source_host: codex-vm
    source_dir: /home/dmitry/coinslot
    source_sha: a2c5b891224bcb9dd10b61f05ad7cc0f2f996940
    source_compose_argv:
      - docker
      - compose
      - --project-name
      - coinslot
      - --env-file
      - /home/dmitry/coinslot/.env
      - -f
      - compose.yaml
      - -f
      - deploy/compose.public.yaml
    target_dir: /home/dmitry/agentify-commerce
    target_backup_dir: "/home/dmitry/agentify-backups/commerce-{{ source_sha[0:8] }}-to-{{ release_sha[0:8] }}"
    public_marker: "{{ target_backup_dir }}/public-accepted.json"
    restore_marker: "{{ target_backup_dir }}/restore-verified.json"
    warmup_volume: agentify-commerce-warmup-postgres
    warmup_argv:
      - docker
      - compose
      - --project-name
      - agentify-commerce-warmup
      - --env-file
      - /home/dmitry/agentify-commerce/.env
      - -f
      - compose.yaml
      - -f
      - deploy/compose.public.yaml
      - -f
      - deploy/compose.hetzner-commerce.yaml
      - -f
      - deploy/compose.warmup-commerce.yaml
    warmup_images:
      COINSLOT_APP_IMAGE: "agentify-commerce-app:{{ release_sha }}"
      COINSLOT_WEB_IMAGE: "agentify-commerce-web:{{ release_sha }}"
      COINSLOT_SEED_KEY: ''
      COINSLOT_INVITATION: ''
    target_images:
      COINSLOT_APP_IMAGE: "agentify-commerce-app:{{ release_sha }}"
      COINSLOT_WEB_IMAGE: "agentify-commerce-web:{{ release_sha }}"
    edge_dir: /home/dmitry/agentify-commerce/deploy/edge
  tasks:
    - name: Require the reviewed public runtime release
      ansible.builtin.assert:
        that:
          - release_sha is defined
          - release_sha | default('') is match('^[0-9a-f]{40}$')
          - source_host in groups['test']

    - name: Verify runtime checkout still matches the accepted release
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ target_dir }}"
      register: target_revision
      changed_when: false
      check_mode: false

    - name: Refuse retirement against another target revision
      ansible.builtin.assert:
        that: target_revision.stdout == release_sha

    - name: Read exact restored and publicly accepted production proofs
      ansible.builtin.slurp:
        src: "{{ item }}"
      become: true
      loop:
        - "{{ restore_marker }}"
        - "{{ public_marker }}"
      register: retirement_proofs
      no_log: true

    - name: Refuse source retirement without the exact accepted dump and images
      ansible.builtin.assert:
        that:
          - (retirement_proofs.results[0].content | b64decode | from_json).release_sha == release_sha
          - (retirement_proofs.results[0].content | b64decode | from_json).source_sha == source_sha
          - (retirement_proofs.results[1].content | b64decode | from_json).release_sha == release_sha
          - (retirement_proofs.results[1].content | b64decode | from_json).restore_dump_sha256 == (retirement_proofs.results[0].content | b64decode | from_json).dump_sha256
      no_log: true

    - name: Inspect final running commerce database, gateway, cabinet and inner web
      ansible.builtin.command:
        argv: [docker, inspect, "{{ item }}"]
      become: true
      loop:
        - agentify-commerce-postgres-1
        - agentify-commerce-gateway-1
        - agentify-commerce-cabinet-1
        - agentify-commerce-web-1
      register: target_services
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require exact-image, healthy final commerce before old database shutdown
      ansible.builtin.assert:
        that:
          - (target_services.results[0].stdout | from_json | first).State.Health.Status == 'healthy'
          - ((target_services.results[0].stdout | from_json | first).Mounts | selectattr('Destination', 'equalto', '/var/lib/postgresql/data') | map(attribute='Name') | list) == ['agentify-commerce_coinslot-postgres']
          - (target_services.results[1].stdout | from_json | first).State.Health.Status == 'healthy'
          - (target_services.results[2].stdout | from_json | first).State.Health.Status == 'healthy'
          - (target_services.results[1].stdout | from_json | first).Config.Image == target_images.COINSLOT_APP_IMAGE
          - (target_services.results[2].stdout | from_json | first).Config.Image == target_images.COINSLOT_APP_IMAGE
          - (target_services.results[1].stdout | from_json | first).Image == (retirement_proofs.results[0].content | b64decode | from_json).app_image_id
          - (target_services.results[2].stdout | from_json | first).Image == (retirement_proofs.results[0].content | b64decode | from_json).app_image_id
          - (target_services.results[3].stdout | from_json | first).State.Running
          - (target_services.results[3].stdout | from_json | first).Config.Image == target_images.COINSLOT_WEB_IMAGE
          - (target_services.results[3].stdout | from_json | first).Image == (retirement_proofs.results[0].content | b64decode | from_json).web_image_id
        fail_msg: The public target is not the exact healthy restored commerce release.
      no_log: true

    - name: Verify full shared edge still exposes commerce from the new VM
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --no-trunc, --filter, label=com.docker.compose.project=agentify-edge]
      become: true
      register: edge_ids
      changed_when: false
      check_mode: false

    - name: Require one running shared edge
      ansible.builtin.assert:
        that: edge_ids.stdout_lines | length == 1

    - name: Inspect accepted edge Caddyfile and TLS volume mounts
      ansible.builtin.command:
        argv: [docker, inspect, "{{ edge_ids.stdout }}"]
      become: true
      register: edge_container
      changed_when: false
      check_mode: false
      no_log: true

    - name: Refuse retirement if maintenance or unrelated edge is active
      ansible.builtin.assert:
        that:
          - (edge_container.stdout | from_json | first).Mounts | selectattr('Destination', 'equalto', '/etc/caddy/Caddyfile') | map(attribute='Source') | list == [edge_dir ~ '/Caddyfile']
          - (edge_container.stdout | from_json | first).Mounts | selectattr('Destination', 'in', ['/data','/config']) | map(attribute='Name') | sort | list == ['agentify-edge_caddy-config','agentify-edge_caddy-data']
        fail_msg: Full scanner and commerce Caddy routes are not the active shared edge.
      no_log: true

    - name: Confirm public commerce routes remain healthy over valid HTTPS
      ansible.builtin.uri:
        url: "https://app.agentify.ad{{ item }}"
        method: GET
        status_code: 200
        validate_certs: true
        return_content: false
      delegate_to: localhost
      loop: [/healthz, /cabinet/healthz, /x402/catalog, /docs/quickstart]
      changed_when: false
      check_mode: false

    - name: Confirm original scanner still reads its external database
      ansible.builtin.uri:
        url: https://agentify.ad/api/health
        method: GET
        status_code: 200
        validate_certs: true
        return_content: false
      delegate_to: localhost
      changed_when: false
      check_mode: false

    - name: Inspect the old production containers, including stopped writers
      ansible.builtin.command:
        argv: [docker, inspect, "{{ item }}"]
      delegate_to: "{{ source_host }}"
      become: true
      loop: [coinslot-postgres-1, coinslot-gateway-1, coinslot-cabinet-1, coinslot-web-1]
      register: old_services
      changed_when: false
      check_mode: false
      no_log: true

    - name: Refuse shutdown while old source writers or web are active
      ansible.builtin.assert:
        that:
          - old_services.results[1:4] | map(attribute='stdout') | map('from_json') | map('first') | selectattr('State.Running', 'equalto', true) | list | length == 0
          - old_services.results | map(attribute='stdout') | map('from_json') | map('first') | map(attribute='HostConfig.RestartPolicy.Name') | unique | list == ['unless-stopped']
          - ((old_services.results[0].stdout | from_json | first).Mounts | selectattr('Destination', 'equalto', '/var/lib/postgresql/data') | map(attribute='Name') | list) == ['coinslot_coinslot-postgres']
        fail_msg: Old application processes must remain stopped and their source volume retained.
      no_log: true

    - name: Stop only old production PostgreSQL after successful public acceptance
      ansible.builtin.command:
        argv: "{{ source_compose_argv + ['stop', '--timeout', '60', 'postgres'] }}"
        chdir: "{{ source_dir }}"
      delegate_to: "{{ source_host }}"
      become: true
      register: old_postgres_stop
      changed_when: "'Stopped' in old_postgres_stop.stderr"
      no_log: true
      when: not ansible_check_mode and (old_services.results[0].stdout | from_json | first).State.Running

    - name: Verify no old production service remains running
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --no-trunc, --filter, label=com.docker.compose.project=coinslot]
      delegate_to: "{{ source_host }}"
      become: true
      register: old_after_stop
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Require complete old application retirement
      ansible.builtin.assert:
        that: old_after_stop.stdout == ''
      when: not ansible_check_mode

    - name: Inspect all intentionally stopped old containers after retirement
      ansible.builtin.command:
        argv: [docker, inspect, "{{ item }}"]
      delegate_to: "{{ source_host }}"
      become: true
      loop: [coinslot-postgres-1, coinslot-gateway-1, coinslot-cabinet-1, coinslot-web-1]
      register: retired_source_containers
      changed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode

    - name: Require all old services persistently stopped after the data-owner switch
      ansible.builtin.assert:
        that:
          - retired_source_containers.results | map(attribute='stdout') | map('from_json') | map('first') | selectattr('State.Running', 'equalto', true) | list | length == 0
          - retired_source_containers.results | map(attribute='stdout') | map('from_json') | map('first') | map(attribute='HostConfig.RestartPolicy.Name') | unique | list == ['unless-stopped']
      no_log: true
      when: not ansible_check_mode

    - name: Stop only the empty private warmup after production acceptance
      ansible.builtin.command:
        argv: "{{ warmup_argv + ['stop', '--timeout', '60', 'postgres', 'gateway', 'cabinet', 'web'] }}"
        chdir: "{{ target_dir }}"
      environment: "{{ warmup_images }}"
      become: true
      register: warmup_stop
      changed_when: "'Stopped' in warmup_stop.stderr"
      no_log: true
      when: not ansible_check_mode

    - name: Verify both source and warmup database volumes remain for recovery
      ansible.builtin.command:
        argv: [docker, volume, inspect, "{{ item.name }}"]
      delegate_to: "{{ item.host }}"
      become: true
      loop:
        - {host: codex-vm, name: coinslot_coinslot-postgres}
        - {host: agentify, name: "{{ warmup_volume }}"}
      register: retained_volumes
      changed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode

    - name: Refuse unexpected retained volume ownership
      ansible.builtin.assert:
        that:
          - (retained_volumes.results[0].stdout | from_json | first).Name == 'coinslot_coinslot-postgres'
          - (retained_volumes.results[1].stdout | from_json | first).Name == warmup_volume
          - (retained_volumes.results[1].stdout | from_json | first).Labels['com.docker.compose.project'] == 'agentify-commerce-warmup'
      no_log: true
      when: not ansible_check_mode

    - name: Verify the private warmup has no running service left
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --filter, label=com.docker.compose.project=agentify-commerce-warmup]
      become: true
      register: warmup_after_stop
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Require empty warmup runtime while preserving its volume
      ansible.builtin.assert:
        that: warmup_after_stop.stdout == ''
      when: not ansible_check_mode

    - name: Recheck new production after retiring only the old runtime
      ansible.builtin.uri:
        url: https://app.agentify.ad/healthz
        method: GET
        status_code: 200
        validate_certs: true
        return_content: false
      delegate_to: localhost
      changed_when: false
      when: not ansible_check_mode
