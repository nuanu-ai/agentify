---
- name: Inspect any donor backup or privacy job container
  ansible.builtin.command:
    argv: [docker, ps, --quiet, --filter, label=com.docker.compose.project=agentify, --filter, "label=com.docker.compose.service={{ item }}"]
  delegate_to: "{{ donor_host }}"
  become: true
  loop: [database-backup, privacy-cleanup]
  register: donor_job_containers
  changed_when: false
  check_mode: false
  no_log: true

- name: Inspect donor cron job launch and backup processes
  ansible.builtin.command:
    argv: [pgrep, -af, '/opt/agentify/current/ops/deploy/droplet/backup.sh|privacy-cleanup']
  delegate_to: "{{ donor_host }}"
  become: true
  register: donor_job_processes
  changed_when: false
  failed_when: donor_job_processes.rc not in [0, 1]
  check_mode: false
  no_log: true

- name: Refuse overlapping or still-draining donor jobs
  ansible.builtin.assert:
    that:
      - donor_job_containers.results | selectattr('stdout', 'equalto', '') | list | length == 2
      - donor_job_processes.stdout == ''
    fail_msg: A donor backup or privacy job is still running; wait for it to drain and rerun.
