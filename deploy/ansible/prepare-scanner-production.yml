---
- name: Stage the donor scanner configuration and exact release images without activation
  hosts: production
  gather_facts: false
  vars:
    donor_host: scanner-donor
    donor_release_dir: /opt/agentify/current/ops/deploy/droplet
    donor_env_path: /opt/agentify/shared/.env.production
    target_release_dir: /home/dmitry/agentify-commerce
    scanner_dir: /home/dmitry/agentify-scanner
    scanner_env_path: /home/dmitry/agentify-scanner/.env.production
    scanner_web_image: "agentify-scanner-web:{{ release_sha }}"
    scanner_worker_image: "agentify-scanner-worker:{{ release_sha }}"
    scanner_privacy_image: "agentify-scanner-privacy:{{ release_sha }}"
    donor_compose_argv:
      - docker
      - compose
      - --profile
      - tools
      - --env-file
      - "{{ donor_env_path }}"
      - -f
      - compose.production.yaml
    target_compose_argv:
      - docker
      - compose
      - --profile
      - tools
      - --profile
      - jobs
      - --env-file
      - "{{ scanner_env_path }}"
      - -f
      - compose.production.yaml
      - -f
      - compose.hetzner.yaml
    scanner_image_environment:
      AGENTIFY_SCANNER_WEB_IMAGE: "{{ scanner_web_image }}"
      AGENTIFY_SCANNER_WORKER_IMAGE: "{{ scanner_worker_image }}"
      AGENTIFY_SCANNER_PRIVACY_IMAGE: "{{ scanner_privacy_image }}"
  tasks:
    - name: Require the reviewed immutable release and donor inventory entry
      ansible.builtin.assert:
        that:
          - release_sha is defined
          - release_sha | default('') is match('^[0-9a-f]{40}$')
          - donor_host in groups['scanner_source']
        fail_msg: Use the reviewed 40-character release_sha and the scanner donor inventory.

    - name: Verify the donor production environment is protected
      ansible.builtin.stat:
        path: "{{ donor_env_path }}"
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: "{{ donor_host }}"
      become: true
      register: donor_env_stat
      no_log: true

    - name: Refuse a missing or exposed donor production environment
      ansible.builtin.assert:
        that:
          - donor_env_stat.stat.exists
          - donor_env_stat.stat.isreg
          - donor_env_stat.stat.mode == '0600'
          - donor_env_stat.stat.pw_name == 'root'
        fail_msg: Donor .env.production must be a regular root-owned 0600 file.

    - name: Validate the donor's production Compose file without changing its services
      ansible.builtin.command:
        argv: "{{ donor_compose_argv + ['config', '--quiet'] }}"
        chdir: "{{ donor_release_dir }}"
      delegate_to: "{{ donor_host }}"
      become: true
      changed_when: false
      check_mode: false
      no_log: true

    - name: Resolve donor database mode and browser build settings without starting containers
      ansible.builtin.command:
        argv: "{{ donor_compose_argv + ['config', '--format', 'json'] }}"
        chdir: "{{ donor_release_dir }}"
      delegate_to: "{{ donor_host }}"
      become: true
      changed_when: false
      check_mode: false
      register: donor_compose_config
      no_log: true

    - name: Require the donor's existing external database and consistent browser auth settings
      ansible.builtin.assert:
        that:
          - (donor_compose_config.stdout | from_json).services['database-config-check'].environment.DATABASE_MODE == 'external'
          - (donor_compose_config.stdout | from_json).services.web.build.args.NEXT_PUBLIC_REGISTRATION_ENABLED == (donor_compose_config.stdout | from_json).services.web.environment.REGISTRATION_ENABLED
          - (donor_compose_config.stdout | from_json).services.web.build.args.NEXT_PUBLIC_SUPABASE_AUTH_URL == (donor_compose_config.stdout | from_json).services.web.environment.NEXT_PUBLIC_SUPABASE_AUTH_URL
          - (donor_compose_config.stdout | from_json).services.web.build.args.NEXT_PUBLIC_SUPABASE_AUTH_PUBLISHABLE_KEY == (donor_compose_config.stdout | from_json).services.web.environment.NEXT_PUBLIC_SUPABASE_AUTH_PUBLISHABLE_KEY
        fail_msg: Donor Compose does not prove an external DB with matching browser/server auth.
      no_log: true

    - name: Read the exact donor environment bytes under suppressed output
      ansible.builtin.slurp:
        src: "{{ donor_env_path }}"
      delegate_to: "{{ donor_host }}"
      become: true
      register: donor_env_bytes
      no_log: true

    - name: Verify the new VM still has the reviewed release checkout
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ target_release_dir }}"
      changed_when: false
      check_mode: false
      register: scanner_checkout_sha

    - name: Refuse building scanner images from another revision
      ansible.builtin.assert:
        that: scanner_checkout_sha.stdout == release_sha
        fail_msg: Run production release preparation at the reviewed SHA first.

    - name: Refuse an edited or untracked scanner build context
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ target_release_dir }}"
      changed_when: false
      check_mode: false
      register: scanner_checkout_status

    - name: Require a clean build context
      ansible.builtin.assert:
        that: scanner_checkout_status.stdout == ''
        fail_msg: The new VM release checkout contains edits or untracked files.

    - name: Inspect the scanner configuration directory
      ansible.builtin.stat:
        path: "{{ scanner_dir }}"
      register: scanner_dir_stat

    - name: Refuse an existing exposed scanner configuration directory
      ansible.builtin.assert:
        that:
          - not scanner_dir_stat.stat.exists or scanner_dir_stat.stat.isdir
          - not scanner_dir_stat.stat.exists or scanner_dir_stat.stat.mode == '0700'
          - not scanner_dir_stat.stat.exists or scanner_dir_stat.stat.pw_name == 'dmitry'
        fail_msg: Existing scanner configuration directory must be dmitry-owned 0700.

    - name: Create the protected scanner configuration directory once
      ansible.builtin.file:
        path: "{{ scanner_dir }}"
        state: directory
        owner: dmitry
        group: dmitry
        mode: '0700'
      when: not scanner_dir_stat.stat.exists

    - name: Inspect the staged scanner environment
      ansible.builtin.stat:
        path: "{{ scanner_env_path }}"
        get_checksum: true
        checksum_algorithm: sha256
      register: staged_scanner_env
      no_log: true

    - name: Refuse an altered or exposed staged scanner environment
      ansible.builtin.assert:
        that:
          - not staged_scanner_env.stat.exists or staged_scanner_env.stat.isreg
          - not staged_scanner_env.stat.exists or staged_scanner_env.stat.mode == '0600'
          - not staged_scanner_env.stat.exists or staged_scanner_env.stat.pw_name == 'dmitry'
          - not staged_scanner_env.stat.exists or staged_scanner_env.stat.checksum == donor_env_stat.stat.checksum
        fail_msg: Existing staged scanner env differs from donor; investigate rather than overwrite it.
      no_log: true

    - name: Stage the unchanged donor environment only if absent
      ansible.builtin.copy:
        content: "{{ donor_env_bytes.content | b64decode }}"
        dest: "{{ scanner_env_path }}"
        owner: dmitry
        group: dmitry
        mode: '0600'
      diff: false
      no_log: true
      when: not staged_scanner_env.stat.exists and not ansible_check_mode

    - name: Verify the staged bytes, owner and mode
      ansible.builtin.stat:
        path: "{{ scanner_env_path }}"
        get_checksum: true
        checksum_algorithm: sha256
      register: staged_scanner_env_after
      no_log: true
      when: not ansible_check_mode

    - name: Refuse a scanner environment copy that changed donor bytes
      ansible.builtin.assert:
        that:
          - staged_scanner_env_after.stat.checksum == donor_env_stat.stat.checksum
          - staged_scanner_env_after.stat.mode == '0600'
          - staged_scanner_env_after.stat.pw_name == 'dmitry'
        fail_msg: Scanner env copy differs from donor or lost 0600 protection.
      no_log: true
      when: not ansible_check_mode

    - name: Resolve the target scanner Compose files without starting services
      ansible.builtin.command:
        argv: "{{ target_compose_argv + ['config', '--format', 'json'] }}"
        chdir: "{{ target_release_dir }}/ops/deploy/droplet"
      environment: "{{ scanner_image_environment }}"
      become: true
      changed_when: false
      check_mode: false
      register: target_scanner_config
      no_log: true
      when: not ansible_check_mode

    - name: Require exact release tags, external DB and matching browser auth on target
      ansible.builtin.assert:
        that:
          - (target_scanner_config.stdout | from_json).services.web.image == scanner_web_image
          - (target_scanner_config.stdout | from_json).services.worker.image == scanner_worker_image
          - (target_scanner_config.stdout | from_json).services['privacy-cleanup'].image == scanner_privacy_image
          - (target_scanner_config.stdout | from_json).services['database-config-check'].environment.DATABASE_MODE == 'external'
          - (target_scanner_config.stdout | from_json).services.web.build.args.NEXT_PUBLIC_REGISTRATION_ENABLED == (target_scanner_config.stdout | from_json).services.web.environment.REGISTRATION_ENABLED
          - (target_scanner_config.stdout | from_json).services.web.build.args.NEXT_PUBLIC_SUPABASE_AUTH_URL == (target_scanner_config.stdout | from_json).services.web.environment.NEXT_PUBLIC_SUPABASE_AUTH_URL
          - (target_scanner_config.stdout | from_json).services.web.build.args.NEXT_PUBLIC_SUPABASE_AUTH_PUBLISHABLE_KEY == (target_scanner_config.stdout | from_json).services.web.environment.NEXT_PUBLIC_SUPABASE_AUTH_PUBLISHABLE_KEY
        fail_msg: Target scanner Compose does not match the reviewed images and donor auth/database mode.
      no_log: true
      when: not ansible_check_mode

    - name: Refuse provider, worker or web setting drift from the running donor
      ansible.builtin.assert:
        that:
          - (target_scanner_config.stdout | from_json).services.web.environment == (donor_compose_config.stdout | from_json).services.web.environment
          - (target_scanner_config.stdout | from_json).services.worker.environment == (donor_compose_config.stdout | from_json).services.worker.environment
        fail_msg: Target web or worker settings differ from donor; inspect the changed key names before activation.
      no_log: true
      when: not ansible_check_mode

    - name: Inspect the exact scanner release images
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ item }}"]
      become: true
      loop:
        - "{{ scanner_web_image }}"
        - "{{ scanner_privacy_image }}"
        - "{{ scanner_worker_image }}"
      register: scanner_image_inspect
      changed_when: false
      failed_when: scanner_image_inspect.rc not in [0, 1]
      check_mode: false
      no_log: true
      when: not ansible_check_mode

    - name: Require the worker image already prepared without launching it
      ansible.builtin.assert:
        that: scanner_image_inspect.results[2].rc == 0
        fail_msg: Prepare the exact-SHA scanner worker image first; this playbook never starts it.
      when: not ansible_check_mode

    - name: Build the absent scanner website image from donor public build settings
      ansible.builtin.command:
        argv: "{{ target_compose_argv + ['build', 'web'] }}"
        chdir: "{{ target_release_dir }}/ops/deploy/droplet"
      environment: "{{ scanner_image_environment }}"
      become: true
      no_log: true
      when: not ansible_check_mode and scanner_image_inspect.results[0].rc == 1

    - name: Build the absent privacy-job image without running the job
      ansible.builtin.command:
        argv: "{{ target_compose_argv + ['build', 'privacy-cleanup'] }}"
        chdir: "{{ target_release_dir }}/ops/deploy/droplet"
      environment: "{{ scanner_image_environment }}"
      become: true
      no_log: true
      when: not ansible_check_mode and scanner_image_inspect.results[1].rc == 1

    - name: Verify all three scanner release images exist
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ item }}"]
      become: true
      loop:
        - "{{ scanner_web_image }}"
        - "{{ scanner_privacy_image }}"
        - "{{ scanner_worker_image }}"
      changed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode

    - name: Check the web image's embedded registration and auth build markers
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - none
          - -e
          - REGISTRATION_ENABLED
          - -e
          - SUPABASE_AUTH_URL
          - -e
          - SUPABASE_AUTH_PUBLISHABLE_KEY
          - -e
          - SUPABASE_AUTH_SERVICE_ROLE_KEY
          - -e
          - NEXT_PUBLIC_SUPABASE_AUTH_URL
          - -e
          - NEXT_PUBLIC_SUPABASE_AUTH_PUBLISHABLE_KEY
          - --entrypoint
          - /usr/local/bin/web-entrypoint.sh
          - "{{ scanner_web_image }}"
          - /bin/true
      environment:
        REGISTRATION_ENABLED: "{{ (target_scanner_config.stdout | from_json).services.web.environment.REGISTRATION_ENABLED }}"
        SUPABASE_AUTH_URL: "{{ (target_scanner_config.stdout | from_json).services.web.environment.SUPABASE_AUTH_URL }}"
        SUPABASE_AUTH_PUBLISHABLE_KEY: "{{ (target_scanner_config.stdout | from_json).services.web.environment.SUPABASE_AUTH_PUBLISHABLE_KEY }}"
        SUPABASE_AUTH_SERVICE_ROLE_KEY: preflight-only-placeholder
        NEXT_PUBLIC_SUPABASE_AUTH_URL: "{{ (target_scanner_config.stdout | from_json).services.web.environment.NEXT_PUBLIC_SUPABASE_AUTH_URL }}"
        NEXT_PUBLIC_SUPABASE_AUTH_PUBLISHABLE_KEY: "{{ (target_scanner_config.stdout | from_json).services.web.environment.NEXT_PUBLIC_SUPABASE_AUTH_PUBLISHABLE_KEY }}"
      become: true
      register: scanner_web_marker_check
      changed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode

    - name: Refuse a web image built with stale browser auth
      ansible.builtin.assert:
        that: scanner_web_marker_check.rc == 0
        fail_msg: Scanner web image build markers do not match donor production auth.
      when: not ansible_check_mode

    - name: Verify the existing Supabase role access and schema from the new VM
      ansible.builtin.command:
        argv: "{{ target_compose_argv + ['run', '--rm', '--no-deps', '-T', 'database-access-verify'] }}"
        chdir: "{{ target_release_dir }}/ops/deploy/droplet"
      environment: "{{ scanner_image_environment }}"
      become: true
      register: scanner_db_verify
      changed_when: false
      check_mode: false
      no_log: true
      when: not ansible_check_mode

    - name: Refuse a release without read-only Supabase access proof
      ansible.builtin.assert:
        that:
          - scanner_db_verify.rc == 0
          - scanner_db_verify.stdout is search('External database connectivity, schema, RLS, and least-privilege checks passed.')
        fail_msg: New VM scanner DB role/schema access check failed; no service was started.
      when: not ansible_check_mode

    - name: Report the verified database access without exposing its credentials
      ansible.builtin.debug:
        msg: External database connectivity, schema, RLS, and least-privilege checks passed from the new VM.
      when: not ansible_check_mode

    - name: Explain preparation's boundary
      ansible.builtin.debug:
        msg: >-
          Donor configuration was checked read-only. Scanner images and the
          unchanged protected env are staged; no new scanner service, migration,
          role reconciliation, queue initialization, privacy job or donor stop
          was run. The transient DB verifier checks existing access only. Check
          mode cannot build images or verify a prospective env copy.
