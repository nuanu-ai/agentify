---
- name: Replace DB-bridge Supabase Auth with reviewed scanner Auth on the same private database
  hosts: production
  gather_facts: false
  vars:
    release_dir: /home/dmitry/agentify-commerce
    staged_release_dir: /home/dmitry/agentify-scanner-ba-stage
    scanner_dir: /home/dmitry/agentify-commerce/ops/deploy/droplet
    staged_scanner_dir: /home/dmitry/agentify-scanner-ba-stage/ops/deploy/droplet
    private_env: /home/dmitry/agentify-scanner/.env.private
    auth_env: /home/dmitry/agentify-scanner/.env.ba
    stage_dir: /home/dmitry/agentify-scanner-exit
    image_manifest: /home/dmitry/agentify-scanner-exit/auth-images.json
    custody_dir: /home/dmitry/agentify-backups/scanner-exit
    auth_window_dir: /home/dmitry/agentify-backups/scanner-exit/auth-window
    controller_auth_window: "{{ playbook_dir }}/../../.local/scanner-exit/{{ bridge_release_sha[0:8] }}/auth-window"
    writer_marker_path: /home/dmitry/agentify-backups/scanner-exit/auth-writer-start-attempted.json
    private_jobs: /home/dmitry/agentify-scanner/scanner-jobs-private.sh
    auth_jobs: /home/dmitry/agentify-scanner/scanner-jobs-ba.sh
    held_auth_cron: /etc/agentify-cron-scanner-ba-held
    source_images:
      AGENTIFY_SCANNER_WEB_IMAGE: "agentify-scanner-web:{{ bridge_release_sha }}"
      AGENTIFY_SCANNER_WORKER_IMAGE: "agentify-scanner-worker:{{ bridge_release_sha }}"
      AGENTIFY_SCANNER_PRIVACY_IMAGE: "agentify-scanner-privacy:{{ bridge_release_sha }}"
    auth_images:
      AGENTIFY_SCANNER_WEB_IMAGE: "agentify-scanner-web:{{ auth_release_sha }}"
      AGENTIFY_SCANNER_WORKER_IMAGE: "agentify-scanner-worker:{{ auth_release_sha }}"
      AGENTIFY_SCANNER_PRIVACY_IMAGE: "agentify-scanner-privacy:{{ auth_release_sha }}"
    source_compose: [docker, compose, --env-file, /home/dmitry/agentify-scanner/.env.private, -f, compose.production.yaml, -f, compose.hetzner.yaml, -f, compose.scanner-database.yaml]
    auth_compose: [docker, compose, --env-file, /home/dmitry/agentify-scanner/.env.ba, -f, compose.production.yaml, -f, compose.hetzner.yaml, -f, compose.scanner-database.yaml]
    auth_cron_content: |
      # Private scanner backup and privacy jobs after reviewed Auth release.
      17 3 * * * root /home/dmitry/agentify-scanner/scanner-jobs-ba.sh backup
      23 4 * * * root /home/dmitry/agentify-scanner/scanner-jobs-ba.sh privacy
    live_js: "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    ready_js: "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
  tasks:
    - name: Require exact DB bridge, final reviewed release and separate Auth maintenance gate
      ansible.builtin.assert:
        that:
          - bridge_release_sha | default('') == 'ebb8fce71c6767ab73c3e9b1e55639efbf9cda6f'
          - auth_release_sha is defined and auth_release_sha | default('') is match('^[0-9a-f]{40}$')
          - scanner_auth_activate_ack | default('') == 'bridge-private-db-held-one-auth-writer'
          - scanner_auth_identity_review_ack | default('') == 'fresh-private-baseline-report-reviewed'
        fail_msg: Activate only the reviewed Auth SHA after DB bridge acceptance.
    - ansible.builtin.stat:
        path: "{{ writer_marker_path }}"
      register: auth_writer_prior
      become: true
    - ansible.builtin.assert:
        that: not auth_writer_prior.stat.exists
        fail_msg: A final Auth writer may have started before; reconcile effects before any retry or bridge revival.
    - ansible.builtin.slurp:
        src: "{{ image_manifest }}"
      register: image_custody
      become: true
      no_log: true
    - ansible.builtin.set_fact:
        staged: "{{ image_custody.content | b64decode | from_json }}"
      no_log: true
    - ansible.builtin.assert:
        that:
          - staged.auth_release_sha == auth_release_sha
          - staged.bridge_release_sha == bridge_release_sha
        fail_msg: Auth image custody belongs to another release.
    - name: Require reviewed fresh Auth-window freeze, not the initial DB-phase custody
      ansible.builtin.slurp:
        src: "{{ auth_window_dir }}/auth-freeze-manifest.json"
      register: fresh_manifest
      become: true
      no_log: true
    - ansible.builtin.set_fact:
        fresh: "{{ fresh_manifest.content | b64decode | from_json }}"
      no_log: true
    - ansible.builtin.assert:
        that:
          - fresh.bridge_release_sha == bridge_release_sha
          - fresh.auth_release_sha == auth_release_sha
          - fresh.link_count_baseline == 'current_private_leads'
          - fresh.identity_reconciliation_exit in [0, 2]
        fail_msg: Fresh private-baseline identity custody belongs to another release or is unreviewed.
    - name: Require identical 0600 private DB backup, Auth inventory, links and continuity off the VM
      ansible.builtin.stat:
        path: "{{ item.dir }}/{{ item.file }}"
        get_checksum: true
        checksum_algorithm: sha256
      loop:
        - {dir: "{{ auth_window_dir }}", file: bridge-before-auth.dump}
        - {dir: "{{ auth_window_dir }}", file: source-auth-users.ndjson}
        - {dir: "{{ auth_window_dir }}", file: private-lead-links.ndjson}
        - {dir: "{{ auth_window_dir }}", file: pre-auth.continuity}
      register: vm_fresh
      become: true
      no_log: true
    - ansible.builtin.stat:
        path: "{{ controller_auth_window }}/{{ item }}"
        get_checksum: true
        checksum_algorithm: sha256
      loop: [bridge-before-auth.dump, source-auth-users.ndjson, private-lead-links.ndjson, pre-auth.continuity]
      register: local_fresh
      delegate_to: localhost
      become: false
      no_log: true
    - ansible.builtin.assert:
        that:
          - vm_fresh.results | selectattr('stat.mode', 'equalto', '0600') | list | length == 4
          - local_fresh.results | selectattr('stat.mode', 'equalto', '0600') | list | length == 4
          - vm_fresh.results[0].stat.checksum == local_fresh.results[0].stat.checksum
          - vm_fresh.results[0].stat.checksum == fresh.backup_sha256
          - vm_fresh.results[1].stat.checksum == local_fresh.results[1].stat.checksum
          - vm_fresh.results[1].stat.checksum == fresh.source_auth_sha256
          - vm_fresh.results[2].stat.checksum == local_fresh.results[2].stat.checksum
          - vm_fresh.results[2].stat.checksum == fresh.private_lead_links_sha256
          - vm_fresh.results[3].stat.checksum == local_fresh.results[3].stat.checksum
          - vm_fresh.results[3].stat.checksum == fresh.continuity_sha256
        fail_msg: Fresh private DB/Auth custody differs between VM and protected off-VM recovery.
      no_log: true
    - name: Require staged final checkout and unchanged running DB bridge checkout
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ item }}"
      loop: ["{{ release_dir }}", "{{ staged_release_dir }}"]
      register: checkouts
      changed_when: false
      check_mode: false
    - ansible.builtin.assert:
        that:
          - checkouts.results[0].stdout == bridge_release_sha
          - checkouts.results[1].stdout == auth_release_sha
        fail_msg: Active bridge or detached Auth source differs from staged custody.
    - ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ item }}"
      loop: ["{{ release_dir }}", "{{ staged_release_dir }}"]
      register: dirty_checkouts
      changed_when: false
      check_mode: false
    - ansible.builtin.assert:
        that: dirty_checkouts.results | map(attribute='stdout') | select('ne', '') | list | length == 0
        fail_msg: Release checkout changed since clean Auth image build.
    - name: Require staged image IDs still refer to the reviewed builds
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ item }}"]
      loop:
        - "{{ auth_images.AGENTIFY_SCANNER_WEB_IMAGE }}"
        - "{{ auth_images.AGENTIFY_SCANNER_WORKER_IMAGE }}"
        - "{{ auth_images.AGENTIFY_SCANNER_PRIVACY_IMAGE }}"
      register: images_now
      changed_when: false
      check_mode: false
      become: true
      no_log: true
    - ansible.builtin.assert:
        that:
          - (images_now.results[0].stdout | from_json | first).Id == staged.web_id
          - (images_now.results[1].stdout | from_json | first).Id == staged.worker_id
          - (images_now.results[2].stdout | from_json | first).Id == staged.privacy_id
        fail_msg: Auth image tags now point to other builds.
      no_log: true
    - name: Require protected BA environment and bridge cron now held alone
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: ["{{ private_env }}", "{{ auth_env }}", /etc/cron.d/agentify, "{{ held_auth_cron }}"]
      register: protected
      become: true
      no_log: true
    - ansible.builtin.assert:
        that:
          - protected.results[0].stat.mode == '0600'
          - protected.results[1].stat.mode == '0600'
          - not protected.results[2].stat.exists
          - protected.results[3].stat.exists
        fail_msg: Fresh Auth freeze did not hold only the original DB bridge cron.
    - ansible.builtin.slurp:
        src: "{{ auth_env }}"
      register: auth_environment
      become: true
      no_log: true
    - ansible.builtin.assert:
        that: not (auth_environment.content | b64decode) is search('(?m)^(?:NEXT_PUBLIC_)?SUPABASE_[A-Z0-9_]+=')
        fail_msg: Final Auth environment still contains managed Supabase settings.
      no_log: true
    - name: Require the exact held two-job private cron and bridge wrapper
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: ["{{ held_auth_cron }}", "{{ private_jobs }}"]
      register: source_schedule
      become: true
      no_log: true
    - ansible.builtin.set_fact:
        active_lines: "{{ source_schedule.results[0].content | b64decode | regex_findall('(?m)^[ \\t]*[^# \\t\\r\\n].*$') }}"
      no_log: true
    - ansible.builtin.assert:
        that:
          - active_lines == ['17 3 * * * root /home/dmitry/agentify-scanner/scanner-jobs-private.sh backup', '23 4 * * * root /home/dmitry/agentify-scanner/scanner-jobs-private.sh privacy']
          - (source_schedule.results[1].content | b64decode) == lookup('template', playbook_dir ~ '/scanner-jobs-private.sh.j2')
        fail_msg: Active scanner jobs changed since DB bridge acceptance.
      vars:
        jobs_release_sha: "{{ bridge_release_sha }}"
      no_log: true
    - name: Require scanner maintenance 503 and unchanged commerce PostgreSQL bridge
      ansible.builtin.command:
        argv: [docker, inspect, "{{ item }}"]
      loop: [agentify-edge-caddy-1, agentify-web-1, agentify-worker-1, agentify-commerce-postgres-1]
      register: running
      changed_when: false
      check_mode: false
      become: true
      no_log: true
    - ansible.builtin.assert:
        that:
          - ((running.results[0].stdout | from_json | first).Mounts | selectattr('Destination', 'equalto', '/etc/caddy/Caddyfile') | map(attribute='Source') | list) == ['/home/dmitry/agentify-commerce/deploy/edge/Caddyfile.scanner-db-maintenance']
          - (running.results[1].stdout | from_json | first).Id == staged.source_web_id
          - (running.results[2].stdout | from_json | first).Id == staged.source_worker_id
          - (running.results[3].stdout | from_json | first).Id == staged.commerce_postgres_id
          - not (running.results[1].stdout | from_json | first).State.Running
          - not (running.results[2].stdout | from_json | first).State.Running
          - (running.results[1].stdout | from_json | first).Config.Image == source_images.AGENTIFY_SCANNER_WEB_IMAGE
          - (running.results[2].stdout | from_json | first).Config.Image == source_images.AGENTIFY_SCANNER_WORKER_IMAGE
          - "'agentify-scanner-postgres' in (running.results[3].stdout | from_json | first).NetworkSettings.Networks['agentify-scanner-db'].Aliases"
        fail_msg: Maintenance edge, stopped bridge writer or commerce PostgreSQL changed since fresh freeze.
      no_log: true
    - name: Render both scanner revisions with their protected private environments
      ansible.builtin.command:
        argv: "{{ item.argv + ['--profile', '*', 'config', '--format', 'json'] }}"
        chdir: "{{ item.dir }}"
      environment: "{{ item.images }}"
      loop:
        - {argv: "{{ source_compose }}", dir: "{{ scanner_dir }}", images: "{{ source_images }}"}
        - {argv: "{{ auth_compose }}", dir: "{{ staged_scanner_dir }}", images: "{{ auth_images }}"}
      register: configs
      changed_when: false
      check_mode: false
      become: true
      no_log: true
    - ansible.builtin.assert:
        that:
          - (configs.results[0].stdout | from_json).services['database-config-check'].environment.DATABASE_MODE == 'private'
          - (configs.results[1].stdout | from_json).services['database-config-check'].environment.DATABASE_MODE == 'private'
          - (configs.results[1].stdout | from_json).services.web.environment.DATABASE_URL == (configs.results[0].stdout | from_json).services.web.environment.DATABASE_URL
          - (configs.results[1].stdout | from_json).services.worker.environment.DATABASE_URL == (configs.results[0].stdout | from_json).services.worker.environment.DATABASE_URL
          - (configs.results[1].stdout | from_json).services.web.environment.TOKEN_HMAC_SECRET == (configs.results[0].stdout | from_json).services.web.environment.TOKEN_HMAC_SECRET
          - (configs.results[1].stdout | from_json).services.web.environment.EMAIL_ENCRYPTION_KEY == (configs.results[0].stdout | from_json).services.web.environment.EMAIL_ENCRYPTION_KEY
          - (configs.results[1].stdout | from_json).services.web.environment.RESEND_API_KEY == (configs.results[0].stdout | from_json).services.web.environment.RESEND_API_KEY
          - (configs.results[1].stdout | from_json).services.web.environment.REGISTRATION_ENABLED == (configs.results[0].stdout | from_json).services.web.environment.REGISTRATION_ENABLED
          - (running.results[1].stdout | from_json | first).Config.Env | select('match', '^DATABASE_URL=') | list == ['DATABASE_URL=' ~ (configs.results[0].stdout | from_json).services.web.environment.DATABASE_URL]
          - (running.results[2].stdout | from_json | first).Config.Env | select('match', '^DATABASE_URL=') | list == ['DATABASE_URL=' ~ (configs.results[0].stdout | from_json).services.worker.environment.DATABASE_URL]
        fail_msg: Final release changed DB target, keys or registration flag; live bridge does not match its source configuration.
      no_log: true

    - name: Stage read-only continuity and Auth access checks outside release checkout
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ stage_dir }}/{{ item }}"
        owner: root
        group: root
        mode: '0600'
      loop: [scanner-auth-continuity.sql, verify-scanner-auth-access.sh]
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Refuse revived bridge writers or scheduled jobs after fresh freeze
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --filter, label=com.docker.compose.project=agentify, --filter, "label=com.docker.compose.service={{ item }}"]
      loop: [web, worker, privacy-cleanup, database-backup]
      register: remaining
      changed_when: false
      check_mode: false
      become: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that: remaining.results | map(attribute='stdout') | select('ne', '') | list | length == 0
        fail_msg: A scanner writer or job revived after fresh Auth freeze.
      when: not ansible_check_mode
    - name: Refuse pg-boss jobs still active after worker graceful stop
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec -i agentify-commerce-postgres-1 psql -U agentify_commerce -d agentify_scanner -At -v ON_ERROR_STOP=1 \
          < {{ (stage_dir ~ '/scanner-queue-active.sql') | quote }}
      args:
        executable: /bin/bash
      register: active_queue
      changed_when: false
      check_mode: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that: active_queue.stdout | trim == '0'
        fail_msg: Active scanner queue jobs need to drain before Auth code replacement.
      when: not ansible_check_mode
    - name: Require frozen old lead/report rows are still unchanged before additive migration
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec -i agentify-commerce-postgres-1 psql -U agentify_commerce -d agentify_scanner -At -F '|' -v ON_ERROR_STOP=1 \
          < {{ (stage_dir ~ '/scanner-auth-continuity.sql') | quote }} > {{ (stage_dir ~ '/before-auth.continuity') | quote }}
        cmp {{ (auth_window_dir ~ '/pre-auth.continuity') | quote }} {{ (stage_dir ~ '/before-auth.continuity') | quote }}
      args:
        executable: /bin/bash
      changed_when: false
      become: true
      no_log: true
      when: not ansible_check_mode

    - name: Move active release checkout only after bridge writers and cron are held
      ansible.builtin.command:
        argv: [git, checkout, --detach, "{{ auth_release_sha }}"]
        chdir: "{{ release_dir }}"
      when: not ansible_check_mode
    - ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ release_dir }}"
      register: active_auth_checkout
      changed_when: false
      check_mode: false
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that: active_auth_checkout.stdout == auth_release_sha
        fail_msg: Active release checkout failed to reach reviewed Auth SHA.
      when: not ansible_check_mode
    - name: Validate final private DB URLs before any Auth migration
      ansible.builtin.command:
        argv: "{{ auth_compose + ['--profile', 'tools', 'run', '--rm', '--no-deps', '-T', 'database-config-check'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ auth_images }}"
      become: true
      changed_when: false
      no_log: true
      when: not ansible_check_mode
    - name: Reconcile existing private roles without rotating commerce or scanner passwords
      ansible.builtin.command:
        argv: "{{ auth_compose + ['--profile', 'tools', 'run', '--rm', '--no-deps', '-T', 'roles-reconcile'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ auth_images }}"
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Apply reviewed Auth migration 0015 and existing queue/dashboard/finalization gates
      ansible.builtin.command:
        argv: "{{ auth_compose + ['--profile', 'tools', 'run', '--rm', '--no-deps', '-T', item] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ auth_images }}"
      loop: [migrate, queue-init, database-dashboards-install, database-access-finalize]
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Recheck private runtime database policies and role isolation
      ansible.builtin.command:
        argv: "{{ auth_compose + ['--profile', 'tools', 'run', '--rm', '--no-deps', '-T', 'database-access-verify'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ auth_images }}"
      register: private_access
      changed_when: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that: private_access.stdout is search('connectivity, schema, RLS, and least-privilege checks passed')
        fail_msg: Existing private DB runtime policies failed after Auth migration.
      when: not ansible_check_mode
    - name: Check Auth tables, lead link, RLS and web/privacy/worker/dashboard grants read-only
      ansible.builtin.command:
        argv: [docker, run, --rm, --network, agentify-scanner-db, --env-file, "{{ auth_env }}", -v, "{{ stage_dir }}/verify-scanner-auth-access.sh:/verify-scanner-auth-access.sh:ro", postgres:17.6-alpine, /bin/sh, /verify-scanner-auth-access.sh]
      register: auth_access
      changed_when: false
      check_mode: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that: auth_access.stdout is search('Scanner Auth tables, link constraints, RLS and role boundaries passed')
        fail_msg: Scanner Auth DB identity privileges or lead FK are not ready.
      when: not ansible_check_mode
    - name: Refuse any old lead field or report-session row changed by migration
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec -i agentify-commerce-postgres-1 psql -U agentify_commerce -d agentify_scanner -At -F '|' -v ON_ERROR_STOP=1 \
          < {{ (stage_dir ~ '/scanner-auth-continuity.sql') | quote }} > {{ (stage_dir ~ '/after-auth.continuity') | quote }}
        cmp {{ (auth_window_dir ~ '/pre-auth.continuity') | quote }} {{ (stage_dir ~ '/after-auth.continuity') | quote }}
      args:
        executable: /bin/bash
      changed_when: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Refuse changed commerce PostgreSQL container or scanner bridge before starting Auth writers
      ansible.builtin.command:
        argv: [docker, inspect, agentify-commerce-postgres-1]
      register: postgres_after_migration
      changed_when: false
      check_mode: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that:
          - (postgres_after_migration.stdout | from_json | first).Id == staged.commerce_postgres_id
          - "'agentify-scanner-postgres' in (postgres_after_migration.stdout | from_json | first).NetworkSettings.Networks['agentify-scanner-db'].Aliases"
        fail_msg: Commerce PostgreSQL or scanner private network attachment changed.
      no_log: true
      when: not ansible_check_mode

    - name: Durably mark the final Auth writer attempt before Docker can make new effects
      ansible.builtin.copy:
        content: "{{ {'bridge_release_sha': bridge_release_sha, 'auth_release_sha': auth_release_sha, 'meaning': 'final Auth web or worker may have started and made effects'} | to_nice_json }}\n"
        dest: "{{ writer_marker_path }}"
        owner: root
        group: root
        mode: '0600'
        force: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Start one reviewed final Auth web and worker pair on the unchanged private DB
      ansible.builtin.command:
        argv: "{{ auth_compose + ['up', '-d', '--no-deps', '--wait', '--wait-timeout', '180', '--no-build', 'web', 'worker'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ auth_images }}"
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Probe the final web live and database-ready routes while edge still returns maintenance
      ansible.builtin.command:
        argv: "{{ auth_compose + ['exec', '-T', 'web', 'node', '-e', item] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ auth_images }}"
      loop: ["{{ live_js }}", "{{ ready_js }}"]
      changed_when: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Require exactly the reviewed final pair and unchanged commerce PostgreSQL after start
      ansible.builtin.command:
        argv: [docker, inspect, "{{ item }}"]
      loop: [agentify-web-1, agentify-worker-1, agentify-commerce-postgres-1]
      register: final_containers
      changed_when: false
      check_mode: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that:
          - (final_containers.results[0].stdout | from_json | first).State.Running
          - (final_containers.results[1].stdout | from_json | first).State.Running
          - (final_containers.results[0].stdout | from_json | first).Config.Image == auth_images.AGENTIFY_SCANNER_WEB_IMAGE
          - (final_containers.results[1].stdout | from_json | first).Config.Image == auth_images.AGENTIFY_SCANNER_WORKER_IMAGE
          - (final_containers.results[0].stdout | from_json | first).Image == staged.web_id
          - (final_containers.results[1].stdout | from_json | first).Image == staged.worker_id
          - (final_containers.results[2].stdout | from_json | first).Id == staged.commerce_postgres_id
          - "'agentify-scanner-postgres' in (final_containers.results[2].stdout | from_json | first).NetworkSettings.Networks['agentify-scanner-db'].Aliases"
        fail_msg: Final writer pair or commerce PostgreSQL identity changed after Auth start.
      no_log: true
      when: not ansible_check_mode
    - name: Install final private DB jobs wrapper with the same schedule, Auth SHA and sanitized env
      ansible.builtin.template:
        src: scanner-jobs-private.sh.j2
        dest: "{{ auth_jobs }}"
        owner: root
        group: root
        mode: '0700'
      vars:
        jobs_release_sha: "{{ auth_release_sha }}"
        jobs_env_path: "{{ auth_env }}"
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.copy:
        content: "{{ auth_cron_content }}"
        dest: /etc/cron.d/agentify
        owner: root
        group: root
        mode: '0644'
        force: false
      become: true
      when: not ansible_check_mode
    - name: Verify final cron was installed exactly while old bridge cron remains held
      ansible.builtin.slurp:
        src: /etc/cron.d/agentify
      register: final_cron
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that: (final_cron.content | b64decode) == auth_cron_content
        fail_msg: Final backup/privacy schedule differs from the reviewed two jobs.
      no_log: true
      when: not ansible_check_mode
