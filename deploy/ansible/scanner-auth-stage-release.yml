---
- name: Stage reviewed scanner Auth release away from the running DB bridge
  hosts: production
  gather_facts: false
  vars:
    release_dir: /home/dmitry/agentify-commerce
    staged_release_dir: /home/dmitry/agentify-scanner-ba-stage
    scanner_dir: /home/dmitry/agentify-commerce/ops/deploy/droplet
    staged_scanner_dir: /home/dmitry/agentify-scanner-ba-stage/ops/deploy/droplet
    private_env: /home/dmitry/agentify-scanner/.env.private
    auth_env: /home/dmitry/agentify-scanner/.env.ba
    private_jobs: /home/dmitry/agentify-scanner/scanner-jobs-private.sh
    stage_dir: /home/dmitry/agentify-scanner-exit
    image_manifest: /home/dmitry/agentify-scanner-exit/auth-images.json
    source_images:
      AGENTIFY_SCANNER_WEB_IMAGE: "agentify-scanner-web:{{ bridge_release_sha }}"
      AGENTIFY_SCANNER_WORKER_IMAGE: "agentify-scanner-worker:{{ bridge_release_sha }}"
      AGENTIFY_SCANNER_PRIVACY_IMAGE: "agentify-scanner-privacy:{{ bridge_release_sha }}"
    auth_images:
      AGENTIFY_SCANNER_WEB_IMAGE: "agentify-scanner-web:{{ auth_release_sha }}"
      AGENTIFY_SCANNER_WORKER_IMAGE: "agentify-scanner-worker:{{ auth_release_sha }}"
      AGENTIFY_SCANNER_PRIVACY_IMAGE: "agentify-scanner-privacy:{{ auth_release_sha }}"
    source_compose: [docker, compose, --env-file, /home/dmitry/agentify-scanner/.env.private, -f, compose.production.yaml, -f, compose.hetzner.yaml, -f, compose.scanner-database.yaml]
    auth_compose: [docker, compose, --env-file, /home/dmitry/agentify-scanner/.env.ba, -f, compose.production.yaml, -f, compose.hetzner.yaml, -f, compose.scanner-database.yaml]
  tasks:
    - name: Require the committed DB bridge, reviewed Auth commit and pre-window staging gate
      ansible.builtin.assert:
        that:
          - bridge_release_sha | default('') == 'ebb8fce71c6767ab73c3e9b1e55639efbf9cda6f'
          - auth_release_sha is defined and auth_release_sha | default('') is match('^[0-9a-f]{40}$')
          - auth_release_sha != bridge_release_sha
          - scanner_auth_stage_ack | default('') == 'bridge-running-build-auth-separately'
        fail_msg: Stage only the reviewed Auth release while the DB bridge remains live.
    - name: Require clean running bridge checkout
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ release_dir }}"
      register: source_checkout
      changed_when: false
      check_mode: false
    - ansible.builtin.assert:
        that: source_checkout.stdout == bridge_release_sha
        fail_msg: Running scanner release is not the committed DB bridge.
    - ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ release_dir }}"
      register: source_dirty
      changed_when: false
      check_mode: false
    - ansible.builtin.assert:
        that: source_dirty.stdout == ''
        fail_msg: Running scanner checkout has unrelated edits.

    - name: Record live scanner and commerce container identities before staging
      ansible.builtin.command:
        argv: [docker, inspect, "{{ item }}"]
      loop: [agentify-web-1, agentify-worker-1, agentify-commerce-postgres-1]
      register: before
      changed_when: false
      check_mode: false
      become: true
      no_log: true
    - ansible.builtin.assert:
        that:
          - (before.results[0].stdout | from_json | first).State.Running
          - (before.results[1].stdout | from_json | first).State.Running
          - (before.results[2].stdout | from_json | first).State.Running
          - (before.results[0].stdout | from_json | first).Config.Image == source_images.AGENTIFY_SCANNER_WEB_IMAGE
          - (before.results[1].stdout | from_json | first).Config.Image == source_images.AGENTIFY_SCANNER_WORKER_IMAGE
          - "'agentify-scanner-postgres' in (before.results[2].stdout | from_json | first).NetworkSettings.Networks['agentify-scanner-db'].Aliases"
        fail_msg: Running scanner/commerce identities or private database alias changed.
      no_log: true
    - name: Require exact current private backup and privacy schedule
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: [/etc/cron.d/agentify, "{{ private_jobs }}"]
      register: source_schedule
      become: true
      no_log: true
    - ansible.builtin.set_fact:
        active_schedule: "{{ source_schedule.results[0].content | b64decode | regex_findall('(?m)^[ \\t]*[^# \\t\\r\\n].*$') }}"
      no_log: true
    - ansible.builtin.assert:
        that:
          - active_schedule == ['17 3 * * * root /home/dmitry/agentify-scanner/scanner-jobs-private.sh backup', '23 4 * * * root /home/dmitry/agentify-scanner/scanner-jobs-private.sh privacy']
          - (source_schedule.results[1].content | b64decode) == lookup('template', playbook_dir ~ '/scanner-jobs-private.sh.j2')
        fail_msg: Live private scanner cron or wrapper differs; do not stage over it.
      vars:
        jobs_release_sha: "{{ bridge_release_sha }}"
      no_log: true
    - ansible.builtin.slurp:
        src: "{{ private_env }}"
      register: private_source
      become: true
      no_log: true
    - ansible.builtin.assert:
        that: (private_source.content | b64decode) is search('(?m)^DATABASE_MODE=private$')
        fail_msg: Running bridge has no private database configuration.
      no_log: true
    - ansible.builtin.set_fact:
        auth_env_content: "{{ private_source.content | b64decode | regex_replace('(?m)^(?:NEXT_PUBLIC_)?SUPABASE_[A-Z0-9_]+=.*(?:\\r?\\n|$)', '') }}"
      no_log: true
    - name: Create protected Auth environment by removing only obsolete Supabase variables
      ansible.builtin.copy:
        content: "{{ auth_env_content }}"
        dest: "{{ auth_env }}"
        owner: root
        group: root
        mode: '0600'
        force: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.slurp:
        src: "{{ auth_env }}"
      register: auth_source
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that:
          - (auth_source.content | b64decode) == auth_env_content
          - not (auth_source.content | b64decode) is search('(?m)^(?:NEXT_PUBLIC_)?SUPABASE_[A-Z0-9_]+=')
        fail_msg: Auth environment differs from protected private source or still contains Supabase settings.
      no_log: true
      when: not ansible_check_mode

    - name: Fetch exact public Auth release without changing running bridge checkout
      ansible.builtin.command:
        argv: [git, fetch, --no-tags, origin, "{{ auth_release_sha }}"]
        chdir: "{{ release_dir }}"
      when: not ansible_check_mode
    - ansible.builtin.command:
        argv: [git, rev-parse, "{{ auth_release_sha }}^{commit}"]
        chdir: "{{ release_dir }}"
      register: fetched_auth
      changed_when: false
      check_mode: false
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that: fetched_auth.stdout == auth_release_sha
        fail_msg: Fetched Auth source is not the reviewed commit.
      when: not ansible_check_mode
    - ansible.builtin.stat:
        path: "{{ staged_release_dir }}"
      register: stage_existing
    - name: Add one detached release worktree so live bridge cron still reads bridge files
      ansible.builtin.command:
        argv: [git, worktree, add, --detach, "{{ staged_release_dir }}", "{{ auth_release_sha }}"]
        chdir: "{{ release_dir }}"
      when: not ansible_check_mode and not stage_existing.stat.exists
    - ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ staged_release_dir }}"
      register: staged_checkout
      changed_when: false
      check_mode: false
      when: not ansible_check_mode
    - ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ staged_release_dir }}"
      register: staged_dirty
      changed_when: false
      check_mode: false
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that:
          - staged_checkout.stdout == auth_release_sha
          - staged_dirty.stdout == ''
        fail_msg: Detached staging worktree is not the exact clean Auth release.
      when: not ansible_check_mode

    - name: Resolve final Auth Compose without touching a running container
      ansible.builtin.command:
        argv: "{{ auth_compose + ['--profile', '*', 'config', '--format', 'json'] }}"
        chdir: "{{ staged_scanner_dir }}"
      environment: "{{ auth_images }}"
      register: auth_config
      changed_when: false
      check_mode: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Resolve running bridge Compose for key and feature-flag comparison
      ansible.builtin.command:
        argv: "{{ source_compose + ['--profile', '*', 'config', '--format', 'json'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ source_images }}"
      register: source_config
      changed_when: false
      check_mode: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that:
          - (auth_config.stdout | from_json).services['database-config-check'].environment.DATABASE_MODE == 'private'
          - (auth_config.stdout | from_json).services.web.environment.DATABASE_URL == (source_config.stdout | from_json).services.web.environment.DATABASE_URL
          - (auth_config.stdout | from_json).services.worker.environment.DATABASE_URL == (source_config.stdout | from_json).services.worker.environment.DATABASE_URL
          - (auth_config.stdout | from_json).services.web.environment.TOKEN_HMAC_SECRET == (source_config.stdout | from_json).services.web.environment.TOKEN_HMAC_SECRET
          - (auth_config.stdout | from_json).services.web.environment.EMAIL_ENCRYPTION_KEY == (source_config.stdout | from_json).services.web.environment.EMAIL_ENCRYPTION_KEY
          - (auth_config.stdout | from_json).services.web.environment.RESEND_API_KEY == (source_config.stdout | from_json).services.web.environment.RESEND_API_KEY
          - (auth_config.stdout | from_json).services.web.environment.REGISTRATION_ENABLED == (source_config.stdout | from_json).services.web.environment.REGISTRATION_ENABLED
          - (auth_config.stdout | from_json).services.web.image == auth_images.AGENTIFY_SCANNER_WEB_IMAGE
          - (auth_config.stdout | from_json).services.worker.image == auth_images.AGENTIFY_SCANNER_WORKER_IMAGE
          - "((auth_config.stdout | from_json).services.web.environment.keys() | select('match', '^(NEXT_PUBLIC_)?SUPABASE_') | list | length) == 0"
          - "((auth_config.stdout | from_json).services['privacy-cleanup'].environment.keys() | select('match', '^(NEXT_PUBLIC_)?SUPABASE_') | list | length) == 0"
        fail_msg: Auth release changed private DB, keys, registration flag or passed Supabase settings.
      no_log: true
      when: not ansible_check_mode

    - name: Build all final Auth images from the detached clean reviewed source
      ansible.builtin.command:
        argv: "{{ auth_compose + ['build', item] }}"
        chdir: "{{ staged_scanner_dir }}"
      environment: "{{ auth_images }}"
      loop: [web, worker, privacy-cleanup]
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.command:
        argv: [docker, image, inspect, "{{ item }}"]
      loop:
        - "{{ auth_images.AGENTIFY_SCANNER_WEB_IMAGE }}"
        - "{{ auth_images.AGENTIFY_SCANNER_WORKER_IMAGE }}"
        - "{{ auth_images.AGENTIFY_SCANNER_PRIVACY_IMAGE }}"
      register: built_auth_images
      changed_when: false
      check_mode: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.copy:
        content: "{{ {'auth_release_sha': auth_release_sha, 'bridge_release_sha': bridge_release_sha, 'web_id': (built_auth_images.results[0].stdout | from_json | first).Id, 'worker_id': (built_auth_images.results[1].stdout | from_json | first).Id, 'privacy_id': (built_auth_images.results[2].stdout | from_json | first).Id, 'source_web_id': (before.results[0].stdout | from_json | first).Id, 'source_worker_id': (before.results[1].stdout | from_json | first).Id, 'commerce_postgres_id': (before.results[2].stdout | from_json | first).Id} | to_nice_json }}\n"
        dest: "{{ image_manifest }}"
        owner: root
        group: root
        mode: '0600'
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Prove staging left active scanner and commerce PostgreSQL intact
      ansible.builtin.command:
        argv: [docker, inspect, "{{ item }}"]
      loop: [agentify-web-1, agentify-worker-1, agentify-commerce-postgres-1]
      register: after
      changed_when: false
      check_mode: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that:
          - (after.results[0].stdout | from_json | first).Id == (before.results[0].stdout | from_json | first).Id
          - (after.results[1].stdout | from_json | first).Id == (before.results[1].stdout | from_json | first).Id
          - (after.results[2].stdout | from_json | first).Id == (before.results[2].stdout | from_json | first).Id
        fail_msg: Auth staging replaced a live container; stop before activation.
      no_log: true
      when: not ansible_check_mode
