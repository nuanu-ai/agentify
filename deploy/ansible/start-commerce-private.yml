---
- name: Start verified commerce privately while the public app stays unavailable
  hosts: production
  gather_facts: false
  vars:
    source_host: codex-vm
    source_sha: a2c5b891224bcb9dd10b61f05ad7cc0f2f996940
    target_dir: /home/dmitry/agentify-commerce
    edge_dir: /home/dmitry/agentify-commerce/deploy/edge
    backup_name: "commerce-{{ source_sha[0:8] }}-to-{{ release_sha[0:8] }}"
    target_backup_dir: "/home/dmitry/agentify-backups/{{ backup_name }}"
    restore_marker: "{{ target_backup_dir }}/restore-verified.json"
    private_marker: "{{ target_backup_dir }}/private-started.json"
    snapshot_sql: "{{ lookup('file', playbook_dir ~ '/commerce-snapshot.sql') }}"
    compose_argv:
      - docker
      - compose
      - --project-name
      - agentify-commerce
      - --env-file
      - /home/dmitry/agentify-commerce/.env
      - -f
      - compose.yaml
      - -f
      - deploy/compose.public.yaml
      - -f
      - deploy/compose.hetzner-commerce.yaml
    compose_environment:
      COINSLOT_APP_IMAGE: "agentify-commerce-app:{{ release_sha }}"
      COINSLOT_WEB_IMAGE: "agentify-commerce-web:{{ release_sha }}"
    safe_private_probe: >-
      Promise.all(['/healthz','/cabinet/healthz','/x402/catalog','/docs/quickstart']
      .map(async path=>{const r=await fetch('http://web:8080'+path);if(!r.ok)throw Error(path+': '+r.status)}))
      .then(()=>process.exit(0)).catch(()=>process.exit(1))
  tasks:
    - name: Require the exact restored runtime release
      ansible.builtin.assert:
        that:
          - release_sha is defined
          - release_sha | default('') is match('^[0-9a-f]{40}$')
          - source_host in groups['test']

    - name: Verify the prepared target checkout
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ target_dir }}"
      register: checkout_sha
      changed_when: false
      check_mode: false

    - name: Refuse another target release
      ansible.builtin.assert:
        that: checkout_sha.stdout == release_sha

    - name: Inspect target source edits before taking writer ownership
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ target_dir }}"
      register: checkout_status
      changed_when: false
      check_mode: false

    - name: Require an unmodified target runtime checkout
      ansible.builtin.assert:
        that: checkout_status.stdout == ''

    - name: Verify the exact frozen restore proof
      ansible.builtin.slurp:
        src: "{{ restore_marker }}"
      become: true
      register: restored_proof
      no_log: true

    - name: Refuse an unverified data restore
      ansible.builtin.assert:
        that:
          - (restored_proof.content | b64decode | from_json).release_sha == release_sha
          - (restored_proof.content | b64decode | from_json).source_sha == source_sha
      no_log: true

    - name: Inspect the old source project before taking writer ownership
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --no-trunc, --filter, label=com.docker.compose.project=coinslot]
      delegate_to: "{{ source_host }}"
      become: true
      register: old_running
      changed_when: false
      check_mode: false

    - name: Inspect old Postgres and the stopped old writer identities
      ansible.builtin.command:
        argv: [docker, inspect, "{{ item }}"]
      delegate_to: "{{ source_host }}"
      become: true
      loop: [coinslot-postgres-1, coinslot-gateway-1, coinslot-cabinet-1, coinslot-web-1]
      register: old_inspects
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require old source writers and web to remain intentionally stopped
      ansible.builtin.assert:
        that:
          - old_running.stdout_lines == [(old_inspects.results[0].stdout | from_json | first).Id]
          - old_inspects.results[1:4] | map(attribute='stdout') | map('from_json') | map('first') | selectattr('State.Running', 'equalto', true) | list | length == 0
          - old_inspects.results[1:4] | map(attribute='stdout') | map('from_json') | map('first') | map(attribute='HostConfig.RestartPolicy.Name') | unique | list == ['unless-stopped']
        fail_msg: Old commerce resumed; never run both writer sets.
      no_log: true

    - name: Inspect final commerce project running services
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --no-trunc, --filter, label=com.docker.compose.project=agentify-commerce]
      become: true
      register: final_running_ids
      changed_when: false
      check_mode: false

    - name: Inspect actual final container identities
      ansible.builtin.command:
        argv: [docker, inspect, "{{ item }}"]
      become: true
      loop: "{{ final_running_ids.stdout_lines }}"
      register: final_inspects
      changed_when: false
      check_mode: false
      no_log: true

    - name: Refuse any foreign final service or wrong image
      ansible.builtin.assert:
        that:
          - (item.stdout | from_json | first).Config.Labels['com.docker.compose.service'] in ['postgres','gateway','cabinet','web']
          - (item.stdout | from_json | first).Config.Labels['com.docker.compose.service'] not in ['gateway','cabinet'] or (item.stdout | from_json | first).Config.Image == compose_environment.COINSLOT_APP_IMAGE
          - (item.stdout | from_json | first).Config.Labels['com.docker.compose.service'] != 'web' or (item.stdout | from_json | first).Config.Image == compose_environment.COINSLOT_WEB_IMAGE
          - (item.stdout | from_json | first).Config.Labels['com.docker.compose.service'] not in ['gateway','cabinet'] or (item.stdout | from_json | first).Image == (restored_proof.content | b64decode | from_json).app_image_id
          - (item.stdout | from_json | first).Config.Labels['com.docker.compose.service'] != 'web' or (item.stdout | from_json | first).Image == (restored_proof.content | b64decode | from_json).web_image_id
        fail_msg: Unexpected final commerce process or image; inspect before continuing.
      loop: "{{ final_inspects.results }}"
      no_log: true

    - name: Require restored PostgreSQL to be the existing final service
      ansible.builtin.command:
        argv: [docker, inspect, agentify-commerce-postgres-1]
      become: true
      register: final_postgres
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require one running final PostgreSQL on the correct volume
      ansible.builtin.assert:
        that:
          - (final_postgres.stdout | from_json | first).Id in final_running_ids.stdout_lines
          - (final_postgres.stdout | from_json | first).Config.Labels['com.docker.compose.service'] == 'postgres'
          - (final_postgres.stdout | from_json | first).Config.Image == 'postgres:17-alpine'
          - ((final_postgres.stdout | from_json | first).Mounts | selectattr('Destination', 'equalto', '/var/lib/postgresql/data') | map(attribute='Name') | list) == ['agentify-commerce_coinslot-postgres']
      no_log: true

    - name: Verify scanner-active edge still protects the app origin
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --no-trunc, --filter, label=com.docker.compose.project=agentify-edge]
      become: true
      register: edge_ids
      changed_when: false
      check_mode: false

    - name: Require the one existing shared production edge
      ansible.builtin.assert:
        that: edge_ids.stdout_lines | length == 1

    - name: Inspect the existing edge file mount
      ansible.builtin.command:
        argv: [docker, inspect, "{{ edge_ids.stdout }}"]
      become: true
      register: edge_inspect
      changed_when: false
      check_mode: false
      no_log: true

    - name: Refuse an app route that is already public
      ansible.builtin.assert:
        that: >-
          (edge_inspect.stdout | from_json | first).Mounts
          | selectattr('Destination', 'equalto', '/etc/caddy/Caddyfile')
          | map(attribute='Source') | list == [edge_dir ~ '/Caddyfile.scanner-active']
        fail_msg: Private startup requires the scanner-active edge with app 503.

    - name: Require honest public maintenance before any writer starts
      ansible.builtin.uri:
        url: https://app.agentify.ad/healthz
        method: GET
        status_code: 503
        validate_certs: true
        return_content: false
      delegate_to: localhost
      register: maintenance
      changed_when: false
      check_mode: false

    - name: Require Retry-After and no-store on the closed app
      ansible.builtin.assert:
        that:
          - maintenance.retry_after == '300'
          - maintenance.cache_control == 'no-store'

    - name: Read frozen row proof
      ansible.builtin.slurp:
        src: "{{ target_backup_dir }}/source-snapshot.json"
      become: true
      register: frozen_rows
      no_log: true

    - name: Verify the old source business rows are still the frozen rows
      ansible.builtin.command:
        argv: [docker, exec, -i, coinslot-postgres-1, psql, -U, coinslot, -d, coinslot, -At, -v, ON_ERROR_STOP=1]
        stdin: "{{ snapshot_sql }}"
      delegate_to: "{{ source_host }}"
      become: true
      register: source_rows_now
      changed_when: false
      check_mode: false
      no_log: true

    - name: Refuse an old-source data change after final restore
      ansible.builtin.assert:
        that: (source_rows_now.stdout_lines[-1] | from_json) == (frozen_rows.content | b64decode | from_json)
      no_log: true

    - name: Verify current secret files against their protected frozen copies
      ansible.builtin.stat:
        path: "{{ item.path }}"
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: "{{ item.host }}"
      become: "{{ item.host == 'agentify' and item.path.startswith(target_backup_dir) }}"
      loop:
        - {host: codex-vm, path: /home/dmitry/coinslot/.env}
        - {host: agentify, path: "{{ target_backup_dir }}/source.env"}
        - {host: agentify, path: /home/dmitry/agentify-commerce/.env}
        - {host: agentify, path: "{{ target_backup_dir }}/target.env"}
      register: protected_envs
      no_log: true

    - name: Refuse changed source or target credentials before new writer startup
      ansible.builtin.assert:
        that:
          - protected_envs.results | selectattr('stat.mode', 'equalto', '0600') | list | length == 4
          - protected_envs.results[0].stat.checksum == protected_envs.results[1].stat.checksum
          - protected_envs.results[2].stat.checksum == protected_envs.results[3].stat.checksum
      no_log: true

    - name: Check if a private-startup marker already exists
      ansible.builtin.stat:
        path: "{{ private_marker }}"
      become: true
      register: private_marker_state
      no_log: true

    - name: Read earlier successful private-startup proof on retry
      ansible.builtin.slurp:
        src: "{{ private_marker }}"
      become: true
      register: earlier_private_proof
      no_log: true
      when: private_marker_state.stat.exists

    - name: Refuse a private proof from another source or target
      ansible.builtin.assert:
        that:
          - private_marker_state.stat.isreg
          - private_marker_state.stat.mode == '0600'
          - (earlier_private_proof.content | b64decode | from_json).release_sha == release_sha
          - (earlier_private_proof.content | b64decode | from_json).source_sha == source_sha
          - (earlier_private_proof.content | b64decode | from_json).restore_dump_sha256 == (restored_proof.content | b64decode | from_json).dump_sha256
      no_log: true
      when: private_marker_state.stat.exists

    - name: Check final original business rows before starting new writers
      ansible.builtin.command:
        argv: [docker, exec, -i, agentify-commerce-postgres-1, psql, -U, coinslot, -d, coinslot, -At, -v, ON_ERROR_STOP=1]
        stdin: "{{ snapshot_sql }}"
      become: true
      register: before_start_rows
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require the frozen rows when this is the first private start
      ansible.builtin.assert:
        that: (before_start_rows.stdout_lines[-1] | from_json) == (frozen_rows.content | b64decode | from_json)
        fail_msg: Final rows changed before the first private writer start; preserve and inspect them.
      no_log: true
      when: not private_marker_state.stat.exists

    - name: Refuse already-running new writers without their private proof
      ansible.builtin.assert:
        that: final_running_ids.stdout_lines | length == 1
        fail_msg: A partial or unverified final startup exists; review before retrying.
      when: not private_marker_state.stat.exists

    - name: Require no connected shop before cabinet background worker starts
      ansible.builtin.command:
        argv: [docker, exec, agentify-commerce-postgres-1, psql, -U, coinslot, -d, coinslot, -At, -v, ON_ERROR_STOP=1, -c, 'SELECT count(*) FROM public.cabinet_woo_shops']
      become: true
      register: new_connected_shops
      changed_when: false
      check_mode: false
      no_log: true

    - name: Refuse unexpected shops in the new private database
      ansible.builtin.assert:
        that: new_connected_shops.stdout | trim == '0'
      when: not private_marker_state.stat.exists

    - name: Start and verify the final gateway, cabinet and inner Caddy in order
      block:
        - name: Start final gateway after verified migrations
          ansible.builtin.command:
            argv: "{{ compose_argv + ['up', '-d', '--no-deps', '--wait', '--wait-timeout', '180', '--no-build', 'gateway'] }}"
            chdir: "{{ target_dir }}"
          environment: "{{ compose_environment }}"
          become: true
          register: gateway_up
          changed_when: "'Created' in gateway_up.stderr or 'Started' in gateway_up.stderr or 'Recreated' in gateway_up.stderr"
          no_log: true
          when: not ansible_check_mode

        - name: Start final cabinet and its empty-shop Woo worker
          ansible.builtin.command:
            argv: "{{ compose_argv + ['up', '-d', '--no-deps', '--wait', '--wait-timeout', '180', '--no-build', 'cabinet'] }}"
            chdir: "{{ target_dir }}"
          environment: "{{ compose_environment }}"
          become: true
          register: cabinet_up
          changed_when: "'Created' in cabinet_up.stderr or 'Started' in cabinet_up.stderr or 'Recreated' in cabinet_up.stderr"
          no_log: true
          when: not ansible_check_mode

        - name: Start final inner commerce Caddy without a host port
          ansible.builtin.command:
            argv: "{{ compose_argv + ['up', '-d', '--no-deps', '--wait', '--wait-timeout', '180', '--no-build', 'web'] }}"
            chdir: "{{ target_dir }}"
          environment: "{{ compose_environment }}"
          become: true
          register: web_up
          changed_when: "'Created' in web_up.stderr or 'Started' in web_up.stderr or 'Recreated' in web_up.stderr"
          no_log: true
          when: not ansible_check_mode

        - name: Probe only private read-only commerce routes
          ansible.builtin.command:
            argv: "{{ compose_argv + ['exec', '-T', 'gateway', 'node', '-e', safe_private_probe] }}"
            chdir: "{{ target_dir }}"
          environment: "{{ compose_environment }}"
          become: true
          changed_when: false
          no_log: true
          when: not ansible_check_mode

        - name: Inspect exact running private commerce services
          ansible.builtin.command:
            argv: [docker, inspect, "{{ item }}"]
          become: true
          loop: [agentify-commerce-gateway-1, agentify-commerce-cabinet-1, agentify-commerce-web-1]
          register: started_services
          changed_when: false
          check_mode: false
          no_log: true
          when: not ansible_check_mode

        - name: Require healthy gateway and cabinet with the exact application image
          ansible.builtin.assert:
            that:
              - (item.stdout | from_json | first).State.Running
              - (item.stdout | from_json | first).State.Health.Status == 'healthy'
              - (item.stdout | from_json | first).Config.Image == compose_environment.COINSLOT_APP_IMAGE
              - (item.stdout | from_json | first).Image == (restored_proof.content | b64decode | from_json).app_image_id
              - (item.stdout | from_json | first).Config.Labels['com.docker.compose.project'] == 'agentify-commerce'
            fail_msg: Private gateway or cabinet is not the exact healthy restored release.
          loop: "{{ started_services.results[0:2] }}"
          no_log: true
          when: not ansible_check_mode

        - name: Require inner commerce Caddy running with exact web image and private port
          ansible.builtin.assert:
            that:
              - (started_services.results[2].stdout | from_json | first).State.Running
              - (started_services.results[2].stdout | from_json | first).Config.Image == compose_environment.COINSLOT_WEB_IMAGE
              - (started_services.results[2].stdout | from_json | first).Image == (restored_proof.content | b64decode | from_json).web_image_id
              - (started_services.results[2].stdout | from_json | first).HostConfig.PortBindings in [none, {}]
              - (started_services.results[2].stdout | from_json | first).Config.Labels['com.docker.compose.project'] == 'agentify-commerce'
          no_log: true
          when: not ansible_check_mode

        - name: Recheck original business rows after new processes started
          ansible.builtin.command:
            argv: [docker, exec, -i, agentify-commerce-postgres-1, psql, -U, coinslot, -d, coinslot, -At, -v, ON_ERROR_STOP=1]
            stdin: "{{ snapshot_sql }}"
          become: true
          register: after_start_rows
          changed_when: false
          no_log: true
          when: not ansible_check_mode and not private_marker_state.stat.exists

        - name: Refuse unexpected changes to the frozen original data
          ansible.builtin.assert:
            that: (after_start_rows.stdout_lines[-1] | from_json) == (frozen_rows.content | b64decode | from_json)
            fail_msg: New writers changed the original frozen rows; they must stop for reconciliation.
          no_log: true
          when: not ansible_check_mode and not private_marker_state.stat.exists

        - name: Verify old source writers are still stopped after new startup
          ansible.builtin.command:
            argv: [docker, ps, --quiet, --no-trunc, --filter, label=com.docker.compose.project=coinslot]
          delegate_to: "{{ source_host }}"
          become: true
          register: source_after_start
          changed_when: false
          check_mode: false
          when: not ansible_check_mode

        - name: Refuse concurrent source and target writer ownership
          ansible.builtin.assert:
            that: source_after_start.stdout_lines == [(old_inspects.results[0].stdout | from_json | first).Id]
          when: not ansible_check_mode

        - name: Record successful private startup outside the runtime checkout
          ansible.builtin.copy:
            content: "{{ {'release_sha': release_sha, 'source_sha': source_sha, 'restore_dump_sha256': (restored_proof.content | b64decode | from_json).dump_sha256} | to_nice_json }}\n"
            dest: "{{ private_marker }}"
            owner: dmitry
            mode: '0600'
            force: false
          become: true
          no_log: true
          when: not ansible_check_mode and not private_marker_state.stat.exists
      rescue:
        - name: Stop new processes after a failed private acceptance
          ansible.builtin.command:
            argv: "{{ compose_argv + ['stop', '--timeout', '60', 'gateway', 'cabinet', 'web'] }}"
            chdir: "{{ target_dir }}"
          environment: "{{ compose_environment }}"
          become: true
          no_log: true
          when: not ansible_check_mode

        - name: Preserve target and source data for reviewed reconciliation
          ansible.builtin.fail:
            msg: Private startup failed; new writers are stopped. Preserve both databases and review any newer target effects before retrying.
