---
- name: Stage, activate or verify one Agentify source revision
  hosts: production:test
  become: true
  gather_facts: false
  vars_files: [release-vars.yml]
  vars:
    channel_name: "{{ 'production' if inventory_hostname in groups['production'] else 'test' }}"
    channel: "{{ release_channels[channel_name] }}"
    release_directory: "{{ agentify_home }}/agentify-releases/{{ release_revision }}"
    configuration_directory: "{{ agentify_home }}/agentify-configuration"
    release_source_directory: "{{ release_directory }}/source"
    release_controller_directory: "{{ release_directory }}/controller"
    recovery_directory: "{{ release_directory }}/recovery"
    release_identity:
      firstParty:
        app: "agentify-app:{{ release_revision }}"
        web: "agentify-web:{{ release_revision }}"
        scanner: "agentify-scanner:{{ release_revision }}"
        scanner-worker: "agentify-scanner-worker:{{ release_revision }}"
        scanner-privacy: "agentify-scanner-privacy:{{ release_revision }}"
      infrastructure:
        postgres: docker.io/library/postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        caddy: docker.io/library/caddy@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    compose: [docker, compose, --project-name, "{{ channel.project }}", --env-file, "{{ release_directory }}/agentify.env", -f, compose.yaml, -f, deploy/compose.public.yaml, -f, "{{ channel.overlay }}", -f, "{{ release_controller_directory }}/release.yaml"]
    identity_cutover_command: [docker, run, --rm, --user, '0:0', --read-only, --tmpfs, /tmp, --network, "{{ channel.project }}_default", --env-file, "{{ recovery_directory }}/identity-cutover.env", --mount, "type=bind,src={{ recovery_directory }},dst=/cutover", "{{ release_identity.firstParty['app'] }}", pnpm, --filter, '@agentify/cabinet', --fail-if-no-match, exec, tsx, src/scanner-identity-cutover.ts]
  tasks:
    - name: Require an explicit phase and exact channel inventory
      ansible.builtin.assert:
        that:
          - release_phase | default('') in ['stage', 'activate', 'verify']
          - (release_revision | default('')) is match('^[0-9a-f]{40}$')
          - (release_controller_revision | default('')) is match('^[0-9a-f]{40}$')
          - (release_evidence_directory | default('')) is match('^/')
          - (agentify_home | default('')).startswith('/')
          - agentify_home != '/'
          - "'..' not in agentify_home.split('/')"
          - ansible_play_hosts_all | length == 1
          - inventory_hostname in ['agentify', 'agentify-test']
          - release_channel_ack | default('') == channel_name
        fail_msg: Select one explicit channel, candidate revision and trusted controller revision.
    - name: Identify the controller checkout used for this release
      ansible.builtin.command:
        argv: [git, -C, "{{ playbook_dir }}/../..", rev-parse, HEAD]
      delegate_to: localhost
      become: false
      changed_when: false
      register: controller_revision
    - name: Require clean release mechanics from the assigned controller revision
      ansible.builtin.command:
        argv: [git, -C, "{{ playbook_dir }}/../..", status, --porcelain=v1, --untracked-files=all]
      delegate_to: localhost
      become: false
      changed_when: false
      register: controller_status
      failed_when: controller_revision.stdout != release_controller_revision or controller_status.stdout != ''
    - name: Stage without replacing a running application
      ansible.builtin.include_tasks: release-stage.yml
      when: release_phase == 'stage'
    - name: Activate the staged release after channel selection
      ansible.builtin.include_tasks: release-activate.yml
      when: release_phase == 'activate'
    - name: Verify the assigned release against the running services
      ansible.builtin.include_tasks: release-verify.yml
      when: release_phase in ['activate', 'verify']
