---
# Install a dedicated runner key without replacing any operator's SSH access.
# Run from a trusted operator machine, once for each channel. Private keys stay
# in that channel's GitHub environment; this play accepts only the public key.
- name: Install one channel's deployment SSH key
  hosts: production:test
  become: true
  gather_facts: false
  vars:
    channel_name: "{{ 'production' if inventory_hostname in groups['production'] else 'test' }}"
  tasks:
    - name: Require an explicit channel and its dedicated public key
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname in ['agentify', 'agentify-test']
          - release_channel_ack | default('') == channel_name
          - (agentify_home | default('')).startswith('/')
          - agentify_home != '/'
          - "'..' not in agentify_home.split('/')"
          - (release_host_key_output | default('')) is match('^/')
          - (release_ssh_public_key | default('')) is match('^ssh-ed25519 [A-Za-z0-9+/]+={0,2} agentify-ci-' + channel_name + '$')
        fail_msg: Select exactly one channel and its dedicated agentify-ci public key.

    - name: Find the deployment account's actual home
      ansible.builtin.getent:
        database: passwd
        key: "{{ ansible_user }}"

    - name: Refuse an unrelated account directory
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_passwd[ansible_user][4] == agentify_home

    - name: Retain a private SSH directory
      ansible.builtin.file:
        path: "{{ agentify_home }}/.ssh"
        state: directory
        owner: "{{ ansible_user }}"
        mode: '0700'

    - name: Install the dedicated key with forwarding and terminal access disabled
      ansible.builtin.blockinfile:
        path: "{{ agentify_home }}/.ssh/authorized_keys"
        create: true
        owner: "{{ ansible_user }}"
        mode: '0600'
        marker: "# {mark} Agentify {{ channel_name }} GitHub deployment"
        block: "restrict {{ release_ssh_public_key }}"

    - name: Read the existing SSH host identity for the runner's pinned trust
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      register: release_host_key

    - name: Save a pinned known_hosts entry for this exact inventory endpoint
      ansible.builtin.copy:
        content: "{{ (ansible_host if (ansible_port | default(22) | int) == 22 else '[' + ansible_host + ']:' + (ansible_port | string)) + ' ' + ((release_host_key.content | b64decode).split()[:2] | join(' ')) + '\n' }}"
        dest: "{{ release_host_key_output }}"
        mode: '0600'
      delegate_to: localhost
      become: false
