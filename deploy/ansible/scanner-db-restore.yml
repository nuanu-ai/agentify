---
- name: Restore frozen scanner data into a new database without starting a writer
  hosts: production
  gather_facts: false
  vars:
    custody_dir: /home/dmitry/agentify-backups/scanner-exit
    stage_dir: /home/dmitry/agentify-scanner-exit
    controller_custody: "{{ playbook_dir }}/../../.local/scanner-exit/{{ source_release_sha[0:8] }}"
  tasks:
    - name: Require explicit source and reviewed bridge release identities
      ansible.builtin.assert:
        that:
          - source_release_sha is defined and source_release_sha | default('') is match('^[0-9a-f]{40}$')
          - release_sha is defined and release_sha | default('') is match('^[0-9a-f]{40}$')
          - scanner_restore_ack | default('') == 'new-scanner-database-only'
        fail_msg: State the frozen source SHA, reviewed bridge SHA and database-only restore acknowledgement.

    - name: Require the source freeze marker and stopped scanner services
      ansible.builtin.slurp:
        src: "{{ custody_dir }}/freeze-manifest.json"
      register: freeze_marker
      become: true
      no_log: true
    - ansible.builtin.set_fact:
        freeze: "{{ freeze_marker.content | b64decode | from_json }}"
      no_log: true
    - ansible.builtin.assert:
        that: freeze.source_release_sha == source_release_sha
        fail_msg: Frozen source is not the requested release.

    - name: Require both source containers still stopped
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --filter, label=com.docker.compose.project=agentify, --filter, "label=com.docker.compose.service={{ item }}"]
      loop: [worker, web, privacy-cleanup, database-backup]
      register: source_running
      changed_when: false
      check_mode: false
      become: true
    - ansible.builtin.assert:
        that: source_running.results | map(attribute='stdout') | select('ne', '') | list | length == 0
        fail_msg: A source scanner writer or job revived after the freeze.
    - ansible.builtin.stat:
        path: /etc/agentify-cron-scanner-exit-held
      register: held_cron
      become: true
    - ansible.builtin.assert:
        that: held_cron.stat.exists and held_cron.stat.isreg
        fail_msg: Source scanner cron is not held.

    - name: Compare controller custody checksums to the immutable VM freeze
      ansible.builtin.stat:
        path: "{{ controller_custody }}/{{ item }}"
        get_checksum: true
        checksum_algorithm: sha256
      loop: [source-frozen.dump, source.fingerprint, source-auth-users.ndjson, source-pg-major]
      register: controller_files
      delegate_to: localhost
      become: false
      no_log: true
    - ansible.builtin.assert:
        that:
          - controller_files.results | selectattr('stat.exists', 'equalto', true) | list | length == 4
          - controller_files.results | selectattr('stat.mode', 'equalto', '0600') | list | length == 4
          - controller_files.results[0].stat.checksum == freeze.dump_sha256
          - controller_files.results[1].stat.checksum == freeze.fingerprint_sha256
          - controller_files.results[2].stat.checksum == freeze.auth_custody_sha256
          - controller_files.results[3].stat.checksum == freeze.source_major_sha256
        fail_msg: Off-VM scanner recovery custody changed or is unprotected.
      no_log: true

    - name: Read source PostgreSQL major from protected recovery evidence
      ansible.builtin.set_fact:
        source_pg_major: "{{ lookup('file', controller_custody ~ '/source-pg-major') | trim }}"
      no_log: true
    - ansible.builtin.assert:
        that: source_pg_major is match('^[0-9]+$')
        fail_msg: Source PostgreSQL version evidence is missing.

    - name: Observe stable commerce PostgreSQL container and volume identity
      ansible.builtin.command:
        argv: [docker, inspect, agentify-commerce-postgres-1]
      register: commerce_before
      changed_when: false
      check_mode: false
      become: true
      no_log: true
    - ansible.builtin.assert:
        that:
          - (commerce_before.stdout | from_json | first).Config.Labels['com.docker.compose.project'] == 'agentify-commerce'
          - (commerce_before.stdout | from_json | first).Config.Labels['com.docker.compose.service'] == 'postgres'
          - (commerce_before.stdout | from_json | first).State.Running
          - ((commerce_before.stdout | from_json | first).Mounts | selectattr('Destination', 'equalto', '/var/lib/postgresql/data') | map(attribute='Type') | list) == ['volume']
        fail_msg: Named commerce PostgreSQL container or volume differs before restore.
      no_log: true

    - name: Verify no scanner DB already exists before transferring frozen data
      ansible.builtin.command:
        argv: [docker, exec, agentify-commerce-postgres-1, psql, -U, agentify_commerce, -d, agentify_commerce, -At, -v, ON_ERROR_STOP=1, -c, "select count(*) from pg_database where datname='agentify_scanner'"]
      register: target_exists
      changed_when: false
      check_mode: false
      become: true
    - ansible.builtin.assert:
        that: target_exists.stdout == '0'
        fail_msg: Scanner DB exists already; restore is one-shot and never overwrites it.

    - name: Stage only checksum-verified, protected files outside either checkout
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0600'
        force: false
      loop:
        - {src: "{{ controller_custody }}/source-frozen.dump", dest: "{{ custody_dir }}/source-frozen.dump"}
        - {src: "{{ controller_custody }}/source.fingerprint", dest: "{{ custody_dir }}/source.fingerprint"}
        - {src: scanner-db-restore.sh, dest: "{{ stage_dir }}/scanner-db-restore.sh"}
        - {src: scanner-fingerprint.sql, dest: "{{ stage_dir }}/scanner-fingerprint.sql"}
        - {src: scanner-lead-links.sql, dest: "{{ stage_dir }}/scanner-lead-links.sql"}
      become: true
      no_log: true
      when: not ansible_check_mode

    - name: Restore only the absent scanner DB and compare every table's data digest
      ansible.builtin.command:
        argv: [bash, "{{ stage_dir }}/scanner-db-restore.sh"]
      environment:
        SCANNER_DUMP: "{{ custody_dir }}/source-frozen.dump"
        SCANNER_SOURCE_FINGERPRINT: "{{ custody_dir }}/source.fingerprint"
        SCANNER_DUMP_SHA256: "{{ freeze.dump_sha256 }}"
        SCANNER_SOURCE_SHA256: "{{ freeze.fingerprint_sha256 }}"
        SCANNER_RELEASE_SHA: "{{ release_sha }}"
        SCANNER_SOURCE_PG_MAJOR: "{{ source_pg_major }}"
      register: restore_result
      become: true
      no_log: true
      when: not ansible_check_mode

    - name: Prove commerce remained the same running container and data volume
      ansible.builtin.command:
        argv: [docker, inspect, agentify-commerce-postgres-1]
      register: commerce_after
      changed_when: false
      check_mode: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that:
          - (commerce_after.stdout | from_json | first).Id == (commerce_before.stdout | from_json | first).Id
          - ((commerce_after.stdout | from_json | first).Mounts | selectattr('Destination', 'equalto', '/var/lib/postgresql/data') | map(attribute='Name') | list) == ((commerce_before.stdout | from_json | first).Mounts | selectattr('Destination', 'equalto', '/var/lib/postgresql/data') | map(attribute='Name') | list)
          - (commerce_after.stdout | from_json | first).State.Running
        fail_msg: Commerce PostgreSQL container or data volume changed during scanner-only restore.
      no_log: true
      when: not ansible_check_mode

    - name: Export restored lead-to-source-Auth links without encrypted lead fields
      ansible.builtin.command:
        argv: [docker, exec, -i, agentify-commerce-postgres-1, psql, -U, agentify_commerce, -d, agentify_scanner, -At, -v, ON_ERROR_STOP=1]
        stdin: "{{ lookup('file', playbook_dir ~ '/scanner-lead-links.sql') }}"
      register: restored_links
      changed_when: false
      check_mode: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.copy:
        content: "{{ restored_links.stdout }}\n"
        dest: "{{ controller_custody }}/target-lead-links.ndjson"
        mode: '0600'
        force: false
      delegate_to: localhost
      become: false
      no_log: true
      when: not ansible_check_mode

    - name: Reconcile linked identities and flag confirmed source-only accounts
      ansible.builtin.command:
        argv: [node, ops/scripts/scanner-auth-reconcile.mjs, "{{ controller_custody }}/source-auth-users.ndjson", "{{ controller_custody }}/target-lead-links.ndjson", "{{ controller_custody }}/identity-reconciliation.json"]
        chdir: "{{ playbook_dir }}/../.."
      register: identity_reconciliation
      failed_when: identity_reconciliation.rc not in [0, 2]
      changed_when: identity_reconciliation.rc in [0, 2]
      delegate_to: localhost
      become: false
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.debug:
        msg: "{{ identity_reconciliation.stdout }}"
      when: not ansible_check_mode

    - name: Record this one-shot database-only restore outside the application checkout
      ansible.builtin.copy:
        content: "{{ {'source_release_sha': source_release_sha, 'bridge_release_sha': release_sha, 'dump_sha256': freeze.dump_sha256, 'fingerprint_sha256': freeze.fingerprint_sha256, 'identity_reconciliation_exit': identity_reconciliation.rc} | to_nice_json }}\n"
        dest: "{{ custody_dir }}/restore-manifest.json"
        owner: root
        group: root
        mode: '0600'
        force: false
      become: true
      no_log: true
      when: not ansible_check_mode
