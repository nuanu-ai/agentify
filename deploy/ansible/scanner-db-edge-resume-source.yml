---
- name: Return the normal edge to original Supabase scanner after early rollback
  hosts: production
  gather_facts: false
  vars:
    edge_dir: /home/dmitry/agentify-commerce/deploy/edge
    edge_env: /home/dmitry/agentify-scanner/.env.production
    writer_marker_path: /home/dmitry/agentify-backups/scanner-exit/private-writer-start-attempted.json
  tasks:
    - ansible.builtin.assert:
        that: scanner_resume_ack | default('') == 'no-private-writer-ever-started'
        fail_msg: Source edge rollback is valid only before any private writer has started.
    - ansible.builtin.stat:
        path: "{{ writer_marker_path }}"
      register: writer_attempt
      become: true
    - ansible.builtin.assert:
        that: not writer_attempt.stat.exists
        fail_msg: A private writer may have made effects; do not reopen the source edge.
    - name: Require original source scanner is healthy and edge still in maintenance
      ansible.builtin.command:
        argv: [docker, inspect, "{{ item }}"]
      loop: [agentify-web-1, agentify-worker-1, agentify-edge-caddy-1]
      register: state
      changed_when: false
      check_mode: false
      become: true
      no_log: true
    - ansible.builtin.assert:
        that:
          - (state.results[0].stdout | from_json | first).State.Running
          - (state.results[1].stdout | from_json | first).State.Running
          - ((state.results[2].stdout | from_json | first).Mounts | selectattr('Destination', 'equalto', '/etc/caddy/Caddyfile') | map(attribute='Source') | list) == ['/home/dmitry/agentify-commerce/deploy/edge/Caddyfile.scanner-db-maintenance']
        fail_msg: Original scanner or maintenance edge is not in the expected rollback state.
      no_log: true
    - name: Restore only normal Caddy routing with its existing certificate volumes
      ansible.builtin.command:
        argv: [docker, compose, --env-file, "{{ edge_env }}", -f, compose.yaml, up, -d, --no-deps, --wait, --wait-timeout, '90', --no-build, caddy]
        chdir: "{{ edge_dir }}"
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Prove scanner and commerce ordinary TLS routes
      ansible.builtin.command:
        argv: [curl, --silent, --show-error, --output, /dev/null, --write-out, '%{http_code}', --resolve, "{{ item.host }}:443:127.0.0.1", "https://{{ item.host }}{{ item.path }}"]
      loop:
        - {host: agentify.ad, path: /api/health}
        - {host: app.agentify.ad, path: /cabinet/healthz}
      register: routes
      changed_when: false
      check_mode: false
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that: routes.results | map(attribute='stdout') | list == ['200', '200']
        fail_msg: Scanner or commerce TLS route failed after source rollback.
      when: not ansible_check_mode
