# Controller-staged, opt-in transient probes against the still-external source.
# No resident service is started. Output is a protected directory on the VM.
services:
  scanner-major-only:
    profiles: [scanner-exit]
    image: postgres:17.6-alpine
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL:?source admin URL required}
    command: [sh, -c, 'umask 077; psql "$$DATABASE_URL" -At -v ON_ERROR_STOP=1 -f /scanner-major.sql > /custody/source-pg-major']
    volumes:
      - /home/dmitry/agentify-scanner-exit/scanner-major.sql:/scanner-major.sql:ro
      - ${SCANNER_EXIT_CUSTODY_DIR:-/home/dmitry/agentify-backups/scanner-exit}:/custody
    networks: [egress]
    restart: 'no'
  scanner-fingerprint:
    profiles: [scanner-exit]
    image: postgres:17.6-alpine
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL:?source admin URL required}
    command: [sh, -c, 'umask 077; psql "$$DATABASE_URL" -At -F "|" -v ON_ERROR_STOP=1 -f /scanner-fingerprint.sql > /custody/source.fingerprint; psql "$$DATABASE_URL" -At -v ON_ERROR_STOP=1 -f /scanner-major.sql > /custody/source-pg-major']
    volumes:
      - /home/dmitry/agentify-scanner-exit/scanner-fingerprint.sql:/scanner-fingerprint.sql:ro
      - /home/dmitry/agentify-scanner-exit/scanner-major.sql:/scanner-major.sql:ro
      - ${SCANNER_EXIT_CUSTODY_DIR:-/home/dmitry/agentify-backups/scanner-exit}:/custody
    networks: [egress]
    restart: 'no'
  scanner-auth-custody:
    profiles: [scanner-exit]
    image: postgres:17.6-alpine
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL:?source admin URL required}
    command: [sh, -c, 'umask 077; psql "$$DATABASE_URL" -At -v ON_ERROR_STOP=1 -f /scanner-auth-custody.sql > /custody/source-auth-users.ndjson']
    volumes:
      - /home/dmitry/agentify-scanner-exit/scanner-auth-custody.sql:/scanner-auth-custody.sql:ro
      - ${SCANNER_EXIT_CUSTODY_DIR:-/home/dmitry/agentify-backups/scanner-exit}:/custody
    networks: [egress]
    restart: 'no'
  scanner-queue-active:
    profiles: [scanner-exit]
    image: postgres:17.6-alpine
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL:?source admin URL required}
    command: [sh, -c, 'psql "$$DATABASE_URL" -At -v ON_ERROR_STOP=1 -f /scanner-queue-active.sql']
    volumes:
      - /home/dmitry/agentify-scanner-exit/scanner-queue-active.sql:/scanner-queue-active.sql:ro
    networks: [egress]
    restart: 'no'
