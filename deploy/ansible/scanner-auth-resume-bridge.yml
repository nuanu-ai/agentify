---
- name: Resume accepted DB bridge only before any final Auth writer start attempt
  hosts: production
  gather_facts: false
  vars:
    release_dir: /home/dmitry/agentify-commerce
    scanner_dir: /home/dmitry/agentify-commerce/ops/deploy/droplet
    held_auth_cron: /etc/agentify-cron-scanner-ba-held
    auth_writer_marker: /home/dmitry/agentify-backups/scanner-exit/auth-writer-start-attempted.json
    source_images:
      AGENTIFY_SCANNER_WEB_IMAGE: "agentify-scanner-web:{{ bridge_release_sha }}"
      AGENTIFY_SCANNER_WORKER_IMAGE: "agentify-scanner-worker:{{ bridge_release_sha }}"
      AGENTIFY_SCANNER_PRIVACY_IMAGE: "agentify-scanner-privacy:{{ bridge_release_sha }}"
    source_compose: [docker, compose, --env-file, /home/dmitry/agentify-scanner/.env.private, -f, compose.production.yaml, -f, compose.hetzner.yaml, -f, compose.scanner-database.yaml]
    ready_js: "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
  tasks:
    - ansible.builtin.assert:
        that:
          - bridge_release_sha | default('') == 'ebb8fce71c6767ab73c3e9b1e55639efbf9cda6f'
          - scanner_auth_resume_ack | default('') == 'no-final-auth-writer-attempt'
        fail_msg: Bridge revival is valid only before any final Auth writer attempt.
    - ansible.builtin.stat:
        path: "{{ auth_writer_marker }}"
      register: writer_attempt
      become: true
    - ansible.builtin.assert:
        that: not writer_attempt.stat.exists
        fail_msg: Durable Auth writer attempt marker exists; reconcile effects before any bridge revival.
    - ansible.builtin.stat:
        path: "{{ item }}"
      loop: ["{{ held_auth_cron }}", /etc/cron.d/agentify, /home/dmitry/agentify-scanner/.env.private]
      register: held
      become: true
      no_log: true
    - ansible.builtin.assert:
        that:
          - held.results[0].stat.exists
          - not held.results[1].stat.exists
          - held.results[2].stat.mode == '0600'
        fail_msg: Held bridge schedule or private scanner env differs; resume nothing.
    - name: Require no backup/privacy job and no unexpected scanner writer
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --filter, label=com.docker.compose.project=agentify, --filter, "label=com.docker.compose.service={{ item }}"]
      loop: [web, worker, privacy-cleanup, database-backup]
      register: active
      changed_when: false
      check_mode: false
      become: true
    - ansible.builtin.command:
        argv: [docker, inspect, "{{ item }}"]
      loop: [agentify-web-1, agentify-worker-1, agentify-commerce-postgres-1]
      register: named
      changed_when: false
      check_mode: false
      become: true
      no_log: true
    - ansible.builtin.assert:
        that:
          - active.results[0].stdout_lines in [[], [(named.results[0].stdout | from_json | first).Id[0:12]]]
          - active.results[1].stdout_lines in [[], [(named.results[1].stdout | from_json | first).Id[0:12]]]
          - active.results[2].stdout == ''
          - active.results[3].stdout == ''
          - (named.results[0].stdout | from_json | first).Config.Image == source_images.AGENTIFY_SCANNER_WEB_IMAGE
          - (named.results[1].stdout | from_json | first).Config.Image == source_images.AGENTIFY_SCANNER_WORKER_IMAGE
          - (named.results[2].stdout | from_json | first).State.Running
          - "'agentify-scanner-postgres' in (named.results[2].stdout | from_json | first).NetworkSettings.Networks['agentify-scanner-db'].Aliases"
        fail_msg: An unexpected or final Auth writer/job exists; do not revive DB bridge.
      no_log: true
    - ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=all]
        chdir: "{{ release_dir }}"
      register: dirty
      changed_when: false
      check_mode: false
    - ansible.builtin.assert:
        that: dirty.stdout == ''
        fail_msg: Active release checkout has edits; do not change it for rollback.
    - name: Restore only exact accepted DB bridge checkout
      ansible.builtin.command:
        argv: [git, checkout, --detach, "{{ bridge_release_sha }}"]
        chdir: "{{ release_dir }}"
      when: not ansible_check_mode
    - ansible.builtin.command:
        argv: "{{ source_compose + ['--profile', '*', 'config', '--format', 'json'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ source_images }}"
      register: source_config
      changed_when: false
      check_mode: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that:
          - (source_config.stdout | from_json).services['database-config-check'].environment.DATABASE_MODE == 'private'
          - (source_config.stdout | from_json).services.web.image == source_images.AGENTIFY_SCANNER_WEB_IMAGE
          - (source_config.stdout | from_json).services.worker.image == source_images.AGENTIFY_SCANNER_WORKER_IMAGE
        fail_msg: Accepted DB bridge no longer targets the private scanner DB.
      no_log: true
      when: not ansible_check_mode
    - name: Start or retain only the old private-DB bridge web and worker
      ansible.builtin.command:
        argv: "{{ source_compose + ['up', '-d', '--no-deps', '--wait', '--wait-timeout', '180', '--no-build', 'web', 'worker'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ source_images }}"
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.command:
        argv: "{{ source_compose + ['exec', '-T', 'web', 'node', '-e', ready_js] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ source_images }}"
      changed_when: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Restore byte-identical original private DB backup/privacy cron
      ansible.builtin.command:
        argv: [mv, "{{ held_auth_cron }}", /etc/cron.d/agentify]
      become: true
      when: not ansible_check_mode
    - name: Require commerce PG remains same running container after bridge revival
      ansible.builtin.command:
        argv: [docker, inspect, agentify-commerce-postgres-1]
      register: postgres_after
      changed_when: false
      check_mode: false
      become: true
      no_log: true
      when: not ansible_check_mode
    - ansible.builtin.assert:
        that: (postgres_after.stdout | from_json | first).Id == (named.results[2].stdout | from_json | first).Id
        fail_msg: Commerce PG container changed during scanner-only bridge revival.
      no_log: true
      when: not ansible_check_mode
