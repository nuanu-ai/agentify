---
- name: Resume original Supabase scanner only before any private writer starts
  hosts: production
  gather_facts: false
  vars:
    scanner_dir: /home/dmitry/agentify-commerce/ops/deploy/droplet
    source_env: /home/dmitry/agentify-scanner/.env.production
    writer_marker_path: /home/dmitry/agentify-backups/scanner-exit/private-writer-start-attempted.json
    source_compose: [docker, compose, --env-file, /home/dmitry/agentify-scanner/.env.production, -f, compose.production.yaml, -f, compose.hetzner.yaml]
    source_images:
      AGENTIFY_SCANNER_WEB_IMAGE: "agentify-scanner-web:{{ source_release_sha }}"
      AGENTIFY_SCANNER_WORKER_IMAGE: "agentify-scanner-worker:{{ source_release_sha }}"
      AGENTIFY_SCANNER_PRIVACY_IMAGE: "agentify-scanner-privacy:{{ source_release_sha }}"
    ready_js: "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
  tasks:
    - name: Require exact original release and no-private-writer rollback boundary
      ansible.builtin.assert:
        that:
          - source_release_sha is defined and source_release_sha | default('') is match('^[0-9a-f]{40}$')
          - scanner_resume_ack | default('') == 'no-private-writer-ever-started'
        fail_msg: After private web/worker starts, effects require manual reconciliation before returning to Supabase.
    - name: Refuse rollback even if a briefly started private writer is stopped now
      ansible.builtin.stat:
        path: "{{ writer_marker_path }}"
      register: writer_attempt
      become: true
    - ansible.builtin.assert:
        that: not writer_attempt.stat.exists
        fail_msg: Durable private-writer attempt marker exists; effect reconciliation is required before any source revival.
    - name: Require held original cron and no active replacement schedule
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/etc/agentify-cron-scanner-exit-held, /etc/cron.d/agentify]
      register: cron_state
      become: true
    - ansible.builtin.assert:
        that: cron_state.results[0].stat.exists and not cron_state.results[1].stat.exists
        fail_msg: Original schedule is not held alone; resume nothing.
    - name: Require no scanner web, worker or private scheduled job currently running
      ansible.builtin.command:
        argv: [docker, ps, --quiet, --filter, label=com.docker.compose.project=agentify, --filter, "label=com.docker.compose.service={{ item }}"]
      loop: [web, worker, privacy-cleanup, database-backup]
      register: active
      changed_when: false
      check_mode: false
      become: true
    - ansible.builtin.assert:
        that: active.results | map(attribute='stdout') | select('ne', '') | list | length == 0
        fail_msg: A scanner writer or job is active; reconcile effects first.
    - name: Confirm original release images and external database mode remain available
      ansible.builtin.command:
        argv: "{{ source_compose + ['--profile', '*', 'config', '--format', 'json'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ source_images }}"
      register: source_config
      changed_when: false
      check_mode: false
      become: true
      no_log: true
    - ansible.builtin.assert:
        that:
          - (source_config.stdout | from_json).services['database-config-check'].environment.DATABASE_MODE == 'external'
          - (source_config.stdout | from_json).services.web.image == source_images.AGENTIFY_SCANNER_WEB_IMAGE
          - (source_config.stdout | from_json).services.worker.image == source_images.AGENTIFY_SCANNER_WORKER_IMAGE
        fail_msg: Original release images or Supabase DB destination changed.
      no_log: true
    - name: Start only the original source web and worker against unchanged Supabase
      ansible.builtin.command:
        argv: "{{ source_compose + ['up', '-d', '--no-deps', '--wait', '--wait-timeout', '180', '--no-build', 'web', 'worker'] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ source_images }}"
      become: true
      no_log: true
      when: not ansible_check_mode
    - name: Prove source site and worker readiness before restoring cron
      ansible.builtin.command:
        argv: "{{ source_compose + ['exec', '-T', 'web', 'node', '-e', ready_js] }}"
        chdir: "{{ scanner_dir }}"
      environment: "{{ source_images }}"
      become: true
      changed_when: false
      no_log: true
      when: not ansible_check_mode
    - name: Resume the byte-identical original backup and privacy schedule
      ansible.builtin.command:
        argv: [mv, /etc/agentify-cron-scanner-exit-held, /etc/cron.d/agentify]
      become: true
      when: not ansible_check_mode
