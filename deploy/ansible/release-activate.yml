---
- name: Require both actual rendered channel graphs to match the selected revision
  ansible.builtin.command:
    argv: [python3, "{{ playbook_dir }}/release-runtime.py", compare, "{{ release_evidence_directory }}/test-topology.json", "{{ release_evidence_directory }}/production-topology.json", "{{ release_revision }}", "{{ release_identity | to_json }}"]
  delegate_to: localhost
  become: false
  changed_when: false
  when: channel_name == 'production'

- name: Require accepted test evidence before production promotion
  ansible.builtin.command:
    argv: [python3, "{{ playbook_dir }}/release-runtime.py", acceptance, "{{ release_evidence_directory }}/test-runtime-verified.json", "{{ release_evidence_directory }}/test-accepted.json", "{{ release_revision }}"]
  delegate_to: localhost
  become: false
  changed_when: false
  when: channel_name == 'production'

- name: Read the staged activation state
  ansible.builtin.slurp:
    src: "{{ release_directory }}/release-state.json"
  register: staged_state
- name: Refuse an unstaged or uncertain prior activation
  ansible.builtin.assert:
    that:
      - (staged_state.content | b64decode | from_json).revision == release_revision
      - (staged_state.content | b64decode | from_json).state == 'staged'
    fail_msg: An activating/verified release needs explicit recovery or verification, never an implicit retry.

- name: Prove staged source is unchanged before stopping writers
  ansible.builtin.shell: |
    set -eu
    cd '{{ release_source_directory }}'
    test "$(git rev-parse HEAD)" = '{{ release_revision }}'
    test -z "$(git status --porcelain=v1 --untracked-files=all)"
  become_user: dmitry
  changed_when: false

- name: Prove staged image IDs are unchanged before stopping writers
  ansible.builtin.shell: |
    python3 - <<'PYCODE'
    import json, pathlib, subprocess
    state = json.loads(pathlib.Path('{{ release_directory }}/release-state.json').read_text())
    references = {{ release_identity.firstParty | to_json }}
    for role, reference in references.items():
        image = json.loads(subprocess.check_output(['docker', 'image', 'inspect', reference]))[0]
        assert state['images'][role] == image['Id'], role + ' image changed after staging'
        labels = image['Config'].get('Labels', {})
        assert labels.get('org.opencontainers.image.revision') == '{{ release_revision }}', role + ' revision changed after staging'
        assert labels.get('org.opencontainers.image.source') == 'https://github.com/nuanu-ai/agentify', role + ' source changed after staging'
    print('Staged local image IDs are unchanged')
    PYCODE
  changed_when: false

- name: Acquire the host's release lock without replacing another operator's lock
  ansible.builtin.command:
    argv: [mkdir, /run/lock/agentify-release]

- block:
    - name: Inspect retained PostgreSQL before touching a writer
      ansible.builtin.command:
        argv: [docker, inspect, "{{ channel.postgres_container }}"]
      changed_when: false
      register: retained_postgres
      no_log: true
    - ansible.builtin.assert:
        that:
          - (retained_postgres.stdout | from_json | first).State.Running
          - ((retained_postgres.stdout | from_json | first).Mounts | selectattr('Destination', 'equalto', '/var/lib/postgresql/data') | map(attribute='Name') | list) == [channel.postgres_volume]
        fail_msg: The retained PostgreSQL instance or its data volume differs.
      no_log: true

    - name: Refuse an unreviewed PostgreSQL image change before stopping writers
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ release_identity.infrastructure.postgres }}", --format, "{{ '{{.Id}}' }}"]
      register: assigned_postgres
      changed_when: false
    - ansible.builtin.assert:
        that: (retained_postgres.stdout | from_json | first).Image == assigned_postgres.stdout
        fail_msg: PostgreSQL differs from the retained release image. A database upgrade needs its own reviewed migration.
      no_log: true

    - name: Verify the exact existing edge before any production mutation
      ansible.builtin.shell: |
        python3 - <<'PYCODE'
        import json,subprocess
        c=json.loads(subprocess.check_output(['docker','inspect','{{ channel.edge_container }}']))[0]
        i=json.loads(subprocess.check_output(['docker','image','inspect','{{ release_identity.infrastructure.caddy }}']))[0]
        assert c['State']['Running'] and c['Image']==i['Id'], 'Edge image drift'
        assert c['NetworkSettings']['Networks']['agentify-ingress']['IPAddress']=='172.30.80.2', 'Edge IP drift'
        mounts=[m for m in c['Mounts'] if m['Destination']=='/etc/caddy/Caddyfile']
        assert len(mounts)==1 and mounts[0]['Type']=='bind' and mounts[0]['Source']=='{{ channel.edge_configuration }}', 'Edge configuration binding drift'
        print('Exact edge image, IP and configuration binding accepted')
        PYCODE
      changed_when: false
      when: channel_name == 'production'

    - name: Read and validate the current gateway public origin
      ansible.builtin.shell: |
        python3 - <<'PYCODE'
        import json,subprocess
        c=json.loads(subprocess.check_output(['docker','inspect','{{ channel.commerce_project }}-gateway-1']))[0]
        env=dict(v.split('=',1) for v in c['Config']['Env'] if '=' in v)
        origin=env['PUBLIC_BASE_URL']
        allowed=['https://agentify.ad','https://app.agentify.ad'] if '{{ channel_name }}'=='production' else ['https://test.agentify.ad']
        assert origin in allowed, 'Unexpected source origin'
        print(origin)
        PYCODE
      changed_when: false
      register: current_public_origin

    - name: Identify an actual canonical-origin change
      ansible.builtin.set_fact:
        origin_changed: "{{ current_public_origin.stdout != channel.origin }}"

    - name: Read the current public catalog from the controller perspective
      ansible.builtin.uri:
        url: "{{ current_public_origin.stdout }}/x402/catalog"
        status_code: 200
        return_content: true
      delegate_to: localhost
      become: false
      register: current_public_catalog

    - name: Identify the first live-approval schema activation
      ansible.builtin.command:
        argv: [docker, exec, "{{ channel.postgres_container }}", psql, -U, agentify_commerce, -d, agentify_commerce, -At, -v, ON_ERROR_STOP=1, -c, "select count(*) from information_schema.columns where table_schema='public' and table_name='merchants' and column_name='live_approved_at'"]
      changed_when: false
      register: live_approval_column
      when: channel_name == 'production'

    - name: Require the reviewed approval inventory before stopping production
      ansible.builtin.assert:
        that:
          - release_initial_live_merchant_ids is defined
          - release_initial_live_merchant_ids is sequence and release_initial_live_merchant_ids is not string and release_initial_live_merchant_ids is not mapping
          - release_initial_live_merchant_ids | unique | length == release_initial_live_merchant_ids | length
        fail_msg: The first live-approval migration needs the privately reviewed exact merchant ID inventory. This does not grant approval.
      when: channel_name == 'production' and live_approval_column.stdout == '0'

    - name: Mark the start of the non-automatic recovery boundary
      ansible.builtin.copy:
        content: "{{ {'revision': release_revision, 'channel': channel_name, 'state': 'activating'} | to_nice_json }}\n"
        dest: "{{ release_directory }}/release-state.json"
        mode: '0644'

    - name: Create the private release recovery directory
      ansible.builtin.file:
        path: "{{ recovery_directory }}"
        state: directory
        mode: '0700'

    - name: Preserve the existing production scheduled-backup directory
      ansible.builtin.file:
        path: "{{ channel.backup_directory }}"
        state: directory
        mode: '0700'
      when: channel_name == 'production'

    - name: Preserve only the pre-activation public resource inventory
      ansible.builtin.copy:
        content: "{{ current_public_catalog.json['items'] | map(attribute='id') | sort | list | to_json }}\n"
        dest: "{{ recovery_directory }}/published-resource-ids.json"
        mode: '0600'

    - name: Disable legacy automatic test delivery
      ansible.builtin.shell: |
        set -eu
        for unit in agentify-test-pull.timer agentify-test-pull.service; do
          if systemctl cat "$unit" >/dev/null 2>&1; then
            systemctl disable --now "$unit"
          fi
          rm -f "/etc/systemd/system/$unit"
          ln -s /dev/null "/etc/systemd/system/$unit"
        done
        systemctl daemon-reload
      when: channel_name == 'test'

    - name: Hold only the existing Agentify scheduled jobs
      ansible.builtin.shell: |
        set -eu
        if [ -f /etc/cron.d/agentify ]; then
          cp -p /etc/cron.d/agentify '{{ recovery_directory }}/cron.before'
          mv /etc/cron.d/agentify '{{ recovery_directory }}/cron.held'
        fi
        if [ -f /etc/cron.d/agentify-release ]; then
          cp -p /etc/cron.d/agentify-release '{{ recovery_directory }}/release-cron.before'
          mv /etc/cron.d/agentify-release '{{ recovery_directory }}/release-cron.held'
        fi

    - name: Stop the old commerce writers before the origin-sensitive gate
      ansible.builtin.command:
        argv: [docker, stop, --time, '60', "{{ channel.commerce_project }}-gateway-1", "{{ channel.commerce_project }}-cabinet-1"]

    - name: Record the old challenge deadline after stopping its issuer
      ansible.builtin.shell: |
        python3 - <<'PYCODE'
        import json,subprocess,time
        c=json.loads(subprocess.check_output(['docker','inspect','{{ channel.commerce_project }}-gateway-1']))[0]
        e=dict(v.split('=',1) for v in c['Config']['Env'] if '=' in v)
        timeout=int(e.get('PAYMENT_TIMEOUT_SECONDS','300'))
        assert 0 < timeout <= 3600, 'Unexpected challenge TTL needs a reviewed drain window'
        print(int(time.time())+timeout)
        PYCODE
      changed_when: false
      register: challenge_deadline
      when: channel_name == 'production' and origin_changed

    - name: Require no production obligations that depend on the old origin
      ansible.builtin.command:
        argv: [docker, exec, "{{ channel.postgres_container }}", psql, -U, agentify_commerce, -d, agentify_commerce, -At, -v, ON_ERROR_STOP=1, -c, "select (select count(*) from orders where open) + (select count(*) from cabinet_verifications where expires_at>now()) + (select count(*) from cabinet_woo_grants where expires_at>now()) + (select count(*) from cabinet_sessions where expires_at>now()) + (select count(*) from cards where card::text like '%app.agentify.ad%') + (select count(*) from orders where record::text like '%app.agentify.ad%')"]
      changed_when: false
      register: origin_gate
      failed_when: origin_gate.rc != 0 or origin_gate.stdout != '0'
      when: channel_name == 'production' and origin_changed

    - name: Stop existing scanner writers without inventing a source on test
      ansible.builtin.shell: |
        set -eu
        for name in '{{ channel.scanner_project }}-web-1' '{{ channel.scanner_project }}-worker-1'; do
          if docker container inspect "$name" >/dev/null 2>&1; then docker stop --time 60 "$name"; fi
        done
        running_jobs="$(docker ps -q --filter label=com.docker.compose.project={{ channel.scanner_project }} --filter label=com.docker.compose.oneoff=True)"
        test -z "$running_jobs"

    - name: Identify the first shared-identity activation before any schema mutation
      ansible.builtin.shell: |
        set -eu
        if [ "$(docker exec '{{ channel.postgres_container }}' psql -U agentify_commerce -d agentify_commerce -Atc "select count(*) from pg_database where datname='agentify_scanner'")" = 0 ]; then
          echo 1
        else
          docker exec '{{ channel.postgres_container }}' psql -U agentify_commerce -d agentify_scanner -At -v ON_ERROR_STOP=1 -c "select count(*) from information_schema.tables where table_schema='public' and table_name='scanner_auth_users'"
        fi
      changed_when: false
      register: legacy_scanner_identity

    - ansible.builtin.set_fact:
        identity_cutover_required: "{{ legacy_scanner_identity.stdout == '1' }}"

    - name: Record non-recoverable aggregate row fingerprints before migrations
      ansible.builtin.shell: |
        set -eu
        umask 077
        for db in agentify_commerce agentify_scanner; do
          if [ "$(docker exec '{{ channel.postgres_container }}' psql -U agentify_commerce -d agentify_commerce -Atc "select count(*) from pg_database where datname='$db'")" = 1 ]; then
            docker exec -i '{{ channel.postgres_container }}' psql -U agentify_commerce -d "$db" -At -v ON_ERROR_STOP=1 -v identity_cutover={{ identity_cutover_required | ternary('true', 'false') }} < '{{ release_source_directory }}/deploy/ansible/release-data-fingerprint.sql' > '{{ recovery_directory }}/'"$db".fingerprint
          fi
        done
      no_log: true

    - name: Ensure only this channel's ingress and private database networks exist
      ansible.builtin.shell: |
        python3 - <<'PY'
        import json,subprocess
        for name,internal in [('{{ channel.ingress_network }}',False),('{{ channel.database_network }}',True)]:
            p=subprocess.run(['docker','network','inspect',name],capture_output=True,text=True)
            if p.returncode:
                assert '{{ channel_name }}' == 'test', 'Existing production network is missing'
                args=['docker','network','create','--driver','bridge']
                if internal: args += ['--internal']
                subprocess.run(args+[name],check=True)
            else:
                n=json.loads(p.stdout)[0]
                assert n['Driver']=='bridge' and n['Internal']==internal, 'Network boundary differs'
        PY

    - name: Start the retained PostgreSQL volume with the pinned image and channel networks
      ansible.builtin.command:
        argv: "{{ commerce_compose + ['up', '-d', '--no-build', '--no-deps', '--wait', 'postgres'] }}"
        chdir: "{{ release_source_directory }}"
      no_log: true

    - name: Create only an absent test scanner database, never replace one
      ansible.builtin.command:
        argv: [docker, exec, "{{ channel.postgres_container }}", psql, -U, agentify_commerce, -d, agentify_commerce, -At, -v, ON_ERROR_STOP=1, -c, "select count(*) from pg_database where datname='agentify_scanner'"]
      changed_when: false
      register: scanner_database
    - ansible.builtin.assert:
        that: channel_name == 'test' or scanner_database.stdout == '1'
        fail_msg: Production scanner database is missing; restore data, never create an empty substitute.
    - ansible.builtin.command:
        argv: [docker, exec, "{{ channel.postgres_container }}", createdb, -U, agentify_commerce, --owner, agentify_commerce, agentify_scanner]
      when: channel_name == 'test' and scanner_database.stdout == '0'

    - name: Initialize fresh test runtime roles with stable channel-owned credentials
      ansible.builtin.command:
        argv: "{{ scanner_compose + ['run', '--rm', '--no-deps', '-T', '-e', 'RECONCILE_RUNTIME_ROLE_PASSWORDS=true', '-e', 'ROLE_PASSWORD_ROTATION_MAINTENANCE_ACK=true', 'roles-reconcile'] }}"
        chdir: "{{ release_source_directory }}/ops/deploy/droplet"
      when: channel_name == 'test' and scanner_database.stdout == '0'
      no_log: true

    - name: Reconcile scanner roles before its additive schema activation
      ansible.builtin.command:
        argv: "{{ scanner_compose + ['run', '--rm', '--no-deps', '-T', 'roles-reconcile'] }}"
        chdir: "{{ release_source_directory }}/ops/deploy/droplet"
      no_log: true

    - name: Apply only scanner migrations preceding the destructive identity cleanup
      ansible.builtin.command:
        argv: "{{ scanner_compose + ['run', '--rm', '--no-deps', '-T', 'migrate', 'node', 'packages/scanner-database/dist/migrate-cli.js', '--identity-preflight'] }}"
        chdir: "{{ release_source_directory }}/ops/deploy/droplet"
      no_log: true

    - name: Prepare credentials for the stopped one-off identity importer
      ansible.builtin.command:
        argv: [python3, "{{ release_source_directory }}/deploy/ansible/prepare-identity-cutover.py", "{{ release_directory }}"]
      no_log: true
      when: identity_cutover_required

    - name: Validate and fingerprint source identities before cabinet proof invalidation
      ansible.builtin.command:
        argv: "{{ identity_cutover_command + ['preflight', '/cutover/identity-cutover.json'] }}"
      no_log: true
      when: identity_cutover_required

    - name: Apply commerce migrations with the locally built application image
      ansible.builtin.command:
        argv: "{{ commerce_compose + ['run', '--rm', '--no-deps', '-T', 'migrate'] }}"
        chdir: "{{ release_source_directory }}"
      no_log: true

    - name: Import and verify exact identities and still-pending report links
      ansible.builtin.command:
        argv: "{{ identity_cutover_command + ['apply', '/cutover/identity-cutover.json'] }}"
      no_log: true
      when: identity_cutover_required

    - name: Verify retained customer rows against their pre-migration fingerprints
      ansible.builtin.shell: |
        set -eu
        for db in agentify_commerce agentify_scanner; do
          before='{{ recovery_directory }}/'"$db".fingerprint
          if [ -f "$before" ]; then
            after='{{ recovery_directory }}/'"$db".after
            docker exec -i '{{ channel.postgres_container }}' psql -U agentify_commerce -d "$db" -At -v ON_ERROR_STOP=1 -v identity_cutover={{ identity_cutover_required | ternary('true', 'false') }} < '{{ release_source_directory }}/deploy/ansible/release-data-fingerprint.sql' > "$after"
            cmp "$before" "$after"
          fi
        done
      changed_when: false

    - name: Record the verified post-import commerce projection before scanner cleanup
      ansible.builtin.shell: |
        set -eu
        umask 077
        docker exec -i '{{ channel.postgres_container }}' psql -U agentify_commerce -d agentify_commerce -At -v ON_ERROR_STOP=1 < '{{ release_source_directory }}/deploy/ansible/release-data-fingerprint.sql' > '{{ recovery_directory }}/commerce-post-import.fingerprint'
      no_log: true
      when: identity_cutover_required

    - name: Record the exact accepted target identity projection before cleanup
      ansible.builtin.shell: |
        set -eu
        umask 077
        for db in agentify_commerce agentify_scanner; do
          docker exec -i '{{ channel.postgres_container }}' psql -U agentify_commerce -d "$db" -At -v ON_ERROR_STOP=1 < '{{ release_source_directory }}/deploy/ansible/release-identity-target-fingerprint.sql' > '{{ recovery_directory }}/'"$db".identity-target
        done
      no_log: true
      when: identity_cutover_required

    - name: Authorize old scanner identity removal only after both projection checks
      ansible.builtin.command:
        argv: "{{ identity_cutover_command + ['authorize-cleanup', '/cutover/identity-cutover.json'] }}"
      no_log: true
      when: identity_cutover_required

    - name: Apply the guarded scanner cleanup through its ordinary migration ledger
      ansible.builtin.command:
        argv: "{{ scanner_compose + ['run', '--rm', '--no-deps', '-T', 'migrate'] }}"
        chdir: "{{ release_source_directory }}/ops/deploy/droplet"
      no_log: true

    - name: Prove cleanup retained commerce rows and scanner report capabilities
      ansible.builtin.shell: |
        set -eu
        for db in agentify_commerce agentify_scanner; do
          before='{{ recovery_directory }}/'"$db".fingerprint
          if [ -f "$before" ]; then
            after='{{ recovery_directory }}/'"$db".after-cleanup
            docker exec -i '{{ channel.postgres_container }}' psql -U agentify_commerce -d "$db" -At -v ON_ERROR_STOP=1 -v identity_cutover={{ identity_cutover_required | ternary('true', 'false') }} < '{{ release_source_directory }}/deploy/ansible/release-data-fingerprint.sql' > "$after"
            cmp "$before" "$after"
          fi
        done
        docker exec -i '{{ channel.postgres_container }}' psql -U agentify_commerce -d agentify_commerce -At -v ON_ERROR_STOP=1 < '{{ release_source_directory }}/deploy/ansible/release-data-fingerprint.sql' > '{{ recovery_directory }}/commerce-after-cleanup.fingerprint'
        cmp '{{ recovery_directory }}/commerce-post-import.fingerprint' '{{ recovery_directory }}/commerce-after-cleanup.fingerprint'
        for db in agentify_commerce agentify_scanner; do
          docker exec -i '{{ channel.postgres_container }}' psql -U agentify_commerce -d "$db" -At -v ON_ERROR_STOP=1 < '{{ release_source_directory }}/deploy/ansible/release-identity-target-fingerprint.sql' > '{{ recovery_directory }}/'"$db".identity-target-after-cleanup
          cmp '{{ recovery_directory }}/'"$db".identity-target '{{ recovery_directory }}/'"$db".identity-target-after-cleanup
        done
      changed_when: false
      when: identity_cutover_required

    - name: Apply remaining scanner activation steps once in dependency order
      ansible.builtin.command:
        argv: "{{ scanner_compose + ['run', '--rm', '--no-deps', '-T', item] }}"
        chdir: "{{ release_source_directory }}/ops/deploy/droplet"
      loop: [queue-init, database-dashboards-install, database-access-finalize, database-access-verify]
      no_log: true

    - name: Hold the first live cutover for the separate private operator command
      ansible.builtin.pause:
        prompt: >-
          Commerce writers remain stopped and this release lock is held.
          In a separate SSH session, run the private approval command from this
          exact staged image and environment for the reviewed existing accounts.
          Press Enter only when those commands have completed. The next check
          refuses activation unless the complete approved set matches inventory.
      when: channel_name == 'production' and live_approval_column.stdout == '0' and release_initial_live_merchant_ids | length > 0

    - name: Read the complete approval set before first enforcement
      ansible.builtin.command:
        argv: [docker, exec, "{{ channel.postgres_container }}", psql, -U, agentify_commerce, -d, agentify_commerce, -At, -v, ON_ERROR_STOP=1, -c, "select coalesce(json_agg(id order by id),'[]'::json) from merchants where live_approved_at is not null"]
      changed_when: false
      register: first_live_approval_set
      when: channel_name == 'production' and live_approval_column.stdout == '0'

    - name: Refuse unreviewed grants or missing approvals before reopening writers
      ansible.builtin.assert:
        that: (first_live_approval_set.stdout | from_json | sort) == (release_initial_live_merchant_ids | sort)
        fail_msg: The approved merchant set differs from the reviewed inventory. Keep writers stopped and reconcile through the private operator.
      when: channel_name == 'production' and live_approval_column.stdout == '0'

    - name: Start scanner runtime from the same source revision accepted for commerce
      ansible.builtin.command:
        argv: "{{ scanner_compose + ['up', '-d', '--no-build', '--no-deps', '--wait', 'web', 'worker'] }}"
        chdir: "{{ release_source_directory }}/ops/deploy/droplet"
      no_log: true

    - name: Let every old-origin unpaid challenge expire before reopening commerce
      ansible.builtin.shell: |
        python3 - <<'PYCODE'
        import time
        remaining=max(0,int('{{ challenge_deadline.stdout }}')-time.time())
        print('Waiting for the previously issued challenge window to close', flush=True)
        time.sleep(remaining)
        PYCODE
      when: channel_name == 'production' and origin_changed
      changed_when: false

    - name: Start commerce and the common route table without building
      ansible.builtin.command:
        argv: "{{ commerce_compose + ['up', '-d', '--no-build', '--no-deps', '--wait', 'gateway', 'cabinet', 'web'] }}"
        chdir: "{{ release_source_directory }}"
      no_log: true

    - name: Install the thin production edge configuration without releasing its reserved IP
      ansible.builtin.shell: |
        python3 - <<'PY'
        import json,pathlib,subprocess
        c=json.loads(subprocess.check_output(['docker','inspect','{{ channel.edge_container }}']))[0]
        mounts=[m for m in c['Mounts'] if m['Destination']=='/etc/caddy/Caddyfile']
        assert len(mounts)==1 and mounts[0]['Type']=='bind' and mounts[0]['Source']=='{{ channel.edge_configuration }}'
        i=json.loads(subprocess.check_output(['docker','image','inspect','{{ release_identity.infrastructure.caddy }}']))[0]
        assert c['State']['Running'] and c['Image']==i['Id'], 'Edge image drift'
        assert c['NetworkSettings']['Networks']['agentify-ingress']['IPAddress']=='172.30.80.2', 'Edge IP drift'
        target=pathlib.Path(mounts[0]['Source'])
        recovery=pathlib.Path('{{ recovery_directory }}/edge-Caddyfile.before')
        if not recovery.exists(): recovery.write_bytes(target.read_bytes())
        # In-place write preserves the inode held by the existing file bind.
        # Atomic rename would leave the running Caddy reading the old config.
        with target.open('wb') as out:
            out.write(pathlib.Path('{{ release_source_directory }}/deploy/edge/Caddyfile').read_bytes())
            out.flush()
            import os
            os.fsync(out.fileno())
        subprocess.run(['docker','exec','{{ channel.edge_container }}','caddy','reload','--config','/etc/caddy/Caddyfile','--adapter','caddyfile'],check=True)
        PY
      when: channel_name == 'production'
      no_log: true

    - name: Install revision-pinned scheduled jobs for this release
      ansible.builtin.template:
        src: release-jobs.sh.j2
        dest: /home/dmitry/agentify-configuration/scanner-jobs.sh
        mode: '0700'
    - ansible.builtin.copy:
        content: |
          SHELL=/bin/bash
          {% if channel_name == 'production' %}
          17 3 * * * root /home/dmitry/agentify-configuration/scanner-jobs.sh backup
          {% endif %}
          23 4 * * * root /home/dmitry/agentify-configuration/scanner-jobs.sh privacy
        dest: /etc/cron.d/agentify-release
        mode: '0644'

  rescue:
    - ansible.builtin.fail:
        msg: Activation stopped. Inspect the recorded state. A read-only gate before the recovery boundary leaves it staged; if it is activating, do not blindly retry, roll back after migrations or restart old writers. Use the recorded evidence and a reviewed forward recovery.
  always:
    - name: Remove the one-off importer credential file on success or failure
      ansible.builtin.file:
        path: "{{ recovery_directory }}/identity-cutover.env"
        state: absent
      no_log: true
    - name: Release only this operation's lock
      ansible.builtin.file:
        path: /run/lock/agentify-release
        state: absent
