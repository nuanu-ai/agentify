# A release runs as agentify-release.service, TEST's timer's, or as
# agentify-release-<channel>.service, a person's, and either can be in the
# middle of an activation. Restarting it there stops activation with SIGTERM,
# which restores the databases or leaves the release unverified, and the
# release does not start again by itself. So needrestart never restarts
# either; the next release is a fresh process that loads the upgraded
# libraries.
$nrconf{override_rc}{qr(^agentify-release(-(test|production))?\.service$)} = 0;
