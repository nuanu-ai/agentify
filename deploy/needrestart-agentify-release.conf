# TEST's release timer starts a oneshot service that can be in the middle of
# an activation. Restarting it there leaves the applications stopped until the
# next tick runs the activation again, so needrestart never restarts it; the
# timer starts a fresh process every minute anyway, and that process loads the
# upgraded libraries.
$nrconf{override_rc}{qr(^agentify-release\.service$)} = 0;
