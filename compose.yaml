# The whole stack on one command: the scanner at the front page, the
# documentation, the dashboard and the gateway, all on http://localhost:8080,
# with one Postgres holding one database, `agentify`. Nothing needs a build on
# the host first.
#
#   docker compose up --build
#   open http://localhost:8080
#
# The database volume outlives `docker compose down`; `down -v` starts from
# nothing. Migrations run as their own services before the applications: one
# for the gateway's and the dashboard's tables, one for the scanner's, which
# are built into another image. All go into the one database, each set with
# its own history.
#
# The database test suite runs against a database of its own, `agentify_test`,
# on this same server, and needs nothing else from this file:
#
#   docker compose up -d --wait postgres
#   pnpm test:db
#
# Name the service: `up -d` alone starts everything. The suite creates its
# database when it is missing, as long as the server is on 5432; a host that
# publishes it elsewhere names it in AGENTIFY_TEST_DATABASE_URL, read from the
# command line rather than from `.env`. Pointing that or DATABASE_URL at
# `agentify` is refused, because the suite empties what it is given. Two runs
# at once against one database pull the ground out from under each other.
#
# Submit an address on the front page and the worker runs the scan; the report
# asks for an email before it opens in full, and that link is answered by the
# dashboard's private identity route. Every message goes to the dashboard's
# log here.
#
# To sign in, open http://localhost:8080/dashboard/sign-in, request a link,
# open it from the dashboard's log and press its confirmation button, which
# makes your account; then press "Open my seller dashboard", which makes your
# merchant. That is the only way in, here and on both deployed channels: no
# command makes an account or a merchant.
#
# The operator's commands look after the accounts there are:
#
#   docker compose exec app \
#     pnpm --filter @agentify/dashboard account list
#
# `list` inspects accounts and `revoke` ends their sessions.
# `operator you@example.com` lets an address that has signed in once read the
# operator's dashboard at /admin, and `--off` takes that away.
#
# Nothing is bought by itself. A purchase is an explicit command, so a sale in
# the dashboard is one somebody made:
#
#   pnpm buy                      # the first card in the catalogue
#   pnpm buy esim                 # the asynchronous one
#
# The passwords and keys in this file are deliberate sandbox values: this stack
# holds a developer's test orders on a test network, and no deployment reuses
# any of them.
#
# ## The same file on a server
#
# Every value a deployment has to change is a variable with the laptop's answer
# as its default, set in a `.env` beside this file rather than in a copy of it.
#
#   AGENTIFY_SITE_ADDRESS   what Caddy listens on            :8080
#   AGENTIFY_PUBLIC_ORIGIN  what a browser types             http://localhost:8080
#   AGENTIFY_WEB_PUBLISH    the web port published here      8080:8080
#   AGENTIFY_COOKIE_SECURE  Secure on the session cookie     false
#   AGENTIFY_FACILITATOR_URL  how payments are facilitated   sandbox:scripted
#   AGENTIFY_PAYMENT_NETWORK  the chain payments use         eip155:84532
#   CDP_API_KEY_ID             Coinbase facilitator key ID   absent
#   CDP_API_KEY_SECRET         Coinbase facilitator secret   absent
#   AGENTIFY_SURFACE_MODE     what the static pages say       sandbox
#   AGENTIFY_POSTGRES_PUBLISH  the database port published   5432:5432
#                           here, or a narrower bind
#   TOKEN_HMAC_SECRET       what signs a report link         a sandbox value
#   REPORT_IDENTITY_SECRET  what the scanner shows the       a sandbox value
#                           dashboard's private route
#
# The two *_PUBLISH variables move the ports of a stack run from this file
# alone. The deployed channels replace them in their overlays instead:
# deploy/compose.public.yaml publishes no database port, the test channel's
# deploy/compose.agentify-test.yaml binds the web door to
# AGENTIFY_TEST_LISTEN_ADDRESS, and deploy/compose.hetzner-commerce.yaml
# publishes no web port, its edge being the only public listener.
#
# The scanner's remaining settings are the unprefixed names its own processes
# read, written out in its service below with the laptop's defaults.
#
# The first three move together and none can be derived from another: behind
# an edge that terminates TLS, the origin has nothing to do with the published
# port. Set one and forget another, and payment challenges name a door that
# answers nothing.
#
# On a host reached over https, AGENTIFY_COOKIE_SECURE must be "true".
#
# Two more variables belong to the laptop alone, and here they are one string,
# `csk_test_local-sandbox-merchant-key`: AGENTIFY_SEED_KEY, the key the gateway
# makes sure exists at start-up so the stack comes up selling, and
# AGENTIFY_MERCHANT_KEY, the key the mock merchant sells with. A second boot
# writes nothing, and a key disabled at a terminal stays disabled. Named with
# nothing after it, `AGENTIFY_SEED_KEY=`, the gateway seeds nothing and says so
# at start-up.
#
# A deployed channel does neither: deploy/compose.public.yaml empties the seed
# and runs no mock merchant. A key kept in a host's file would be a way in that
# cannot be revoked, because it is handed to the gateway at every start and
# seeded into every fresh database. The release's preflight refuses a rendered
# seed.

# One image behind three services, which pick their role at `command`. The
# explicit image name is what makes them share it: without one, Compose builds
# and tags the same Dockerfile once per service.
x-app: &app
  build:
    context: .
    dockerfile: deploy/Dockerfile.app
  image: "${AGENTIFY_APP_IMAGE:-agentify-app}"
  restart: unless-stopped

# The scanner's worker and its migration share one image the same way.
x-scanner-app: &scanner-app
  build:
    context: .
    dockerfile: deploy/Dockerfile.scanner-worker
  image: "${AGENTIFY_SCANNER_WORKER_IMAGE:-agentify-scanner-worker}"
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentify
      POSTGRES_PASSWORD: agentify
      POSTGRES_DB: agentify
    ports:
      # Published so that `pnpm test:db` and psql from the terminal reach this
      # server; the suite uses a database of its own on it, never `agentify`.
      # Compose refuses an empty entry, so AGENTIFY_POSTGRES_PUBLISH always names a
      # mapping; deploy/compose.public.yaml removes the port altogether.
      - "${AGENTIFY_POSTGRES_PUBLISH:-5432:5432}"
    volumes:
      - agentify-postgres:/var/lib/postgresql/data
      # Creates the test suites' databases on a new volume only. On an existing one
      # Postgres ignores this directory and the suites create their own. See
      # deploy/postgres-init/.
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The gateway's first query is what would otherwise discover that the
      # server is up and the database is not ready yet.
      test: ["CMD-SHELL", "pg_isready -U agentify -d agentify"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Its own service rather than part of the application's start-up: a migration
  # inside the process it migrates for runs once per replica and races itself.
  #
  # The gateway's and the dashboard's tables keep separate histories, because the
  # migrator compares with the newest entry of the history it is given and would
  # take the other set's entry for its own.
  migrate:
    <<: *app
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgres://agentify:agentify@postgres:5432/agentify
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The gateway and the dashboard in one process, each on its own listener:
  # Caddy sends /v0, /x402 and /healthz to 3000 and /dashboard to 3001; 3002 is
  # the scanner's route to the dashboard and is never published. Both read this
  # one environment, so a variable here means one thing to both.
  app:
    <<: *app
    command: ["pnpm", "--filter", "@agentify/app", "start"]
    environment:
      # One Postgres for everything: the gateway's orders, receipts and queue,
      # and the dashboard's people and their sessions.
      DATABASE_URL: postgres://agentify:agentify@postgres:5432/agentify
      # On start the gateway makes sure a row for this key exists on the sandbox
      # merchant, so the mock merchant below is recognised without anybody running a
      # command. Laptop only; see the header.
      #
      # No colon in the default, on purpose: `${VAR-default}` gives the default only
      # when the variable is unset, so a deployment naming it empty gets nothing
      # rather than the sandbox's key.
      SANDBOX_MERCHANT_KEY: "${AGENTIFY_SEED_KEY-csk_test_local-sandbox-merchant-key}"
      # The address merchants and agents reach this stack at: Caddy's door, not
      # this process's port. Payment challenges, catalogue listings and mailed links
      # are built on it. A deployment names the origin itself, because behind a TLS
      # edge it has nothing to do with the published port; one that sends real
      # mail with the laptop's value is refused at start-up.
      PUBLIC_BASE_URL: "${AGENTIFY_PUBLIC_ORIGIN:-http://localhost:${AGENTIFY_HOST_PORT:-8080}}"
      # The laptop's defaults have no chain behind them, so a purchase completes
      # with no network, wallet or faucet. A deployment names its own pair, and the
      # release preflight holds each channel to it; the runtime cannot, because a
      # test chain must keep accepting the scripted facilitator. The dashboard only
      # describes these and has no defaults of its own.
      FACILITATOR_URL: "${AGENTIFY_FACILITATOR_URL:-sandbox:scripted}"
      PAYMENT_NETWORK: "${AGENTIFY_PAYMENT_NETWORK:-eip155:84532}"
      # Required on a live chain, where the gateway refuses to start without both;
      # empty everywhere else. No colon, as above: empty means no credential.
      CDP_API_KEY_ID: "${CDP_API_KEY_ID-}"
      CDP_API_KEY_SECRET: "${CDP_API_KEY_SECRET-}"
      # A challenge cannot be built without a destination, and a fresh stack's
      # merchant has set none; only the sandbox may fall back like this. It is a
      # well-known local-devnet account, public and valueless, and nothing settles
      # here.
      PAY_TO_ADDRESS: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
      # What the scanner presents on the dashboard's private identity route (3002,
      # never published). It must not equal AUTH_SECRET or MAIL_API_KEY: the
      # dashboard refuses to start rather than share one credential between two
      # doors.
      REPORT_IDENTITY_SECRET: "${REPORT_IDENTITY_SECRET:-a-sandbox-report-identity-secret-nobody-should-reuse}"
      # Signs merchants' session cookies. The dashboard refuses to start without it
      # rather than fall back to the sign-in library's own default, which is public.
      # Changing it signs everybody out and does nothing worse.
      AUTH_SECRET: "${AGENTIFY_AUTH_SECRET:-a-sandbox-secret-nobody-should-reuse-anywhere}"
      # `sandbox:log` writes every message, with its recipient and link, into this
      # service's log, so email-link sign-in works with no mail account and no
      # network. A configuration naming a real provider cannot also be the sandbox.
      MAIL_URL: "${MAIL_URL:-sandbox:log}"
      MAIL_API_KEY: "${MAIL_API_KEY:-}"
      MAIL_FROM: "${MAIL_FROM:-Agentify <no-reply@localhost>}"
      # Off because a Secure cookie is never sent back over plain http, so nobody
      # could sign in locally. Wherever the dashboard is reached over https this must
      # be "true", or a merchant's session is exposed to anybody on the path.
      COOKIE_SECURE: "${AGENTIFY_COOKIE_SECURE:-false}"
      # Caddy passes /dashboard through unstripped, and the dashboard builds its
      # links from the same string.
      BASE_PATH: /dashboard
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Both listeners, because a check on one would call a process healthy
      # whose other surface nobody can reach. The dashboard answers a probe at
      # the bare root as well as under its mount point.
      test:
        [
          "CMD",
          "node",
          "-e",
          "Promise.all(['http://127.0.0.1:3000/healthz','http://127.0.0.1:3001/healthz'].map(u=>fetch(u))).then(rs=>process.exit(rs.every(r=>r.ok)?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      # start_period hides the first seconds, while tsx refuses connections, but
      # it also delays the verdict `web` waits for; fifteen retries after it keep
      # that wait at about a minute.
      retries: 15
      start_period: 15s

  # A merchant on the other side, so there is something to sell: the offline
  # gate's mock merchant, pointed at this gateway, written as a merchant's
  # engineer would write it.
  merchant:
    <<: *app
    command: ["pnpm", "--filter", "@agentify/slice", "serve"]
    environment:
      GATEWAY_URL: http://app:3000
      # The same key the gateway seeds above; if the two differ, the catalogue
      # comes up empty. No colon, as above, but here empty means the merchant
      # refuses to start ("MERCHANT_API_KEY is not set") rather than selling on a
      # server with the key printed in this file.
      MERCHANT_API_KEY: "${AGENTIFY_MERCHANT_KEY-csk_test_local-sandbox-merchant-key}"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # The merchant is a long poll with no port to ask, so it writes one line about
      # its subscription to a file and this reads it. Healthy needs both a `selling`
      # line and a file fresh enough to show the loop still turns: a frozen process
      # leaves a stale `selling` line, and a fresh file may say it is not getting
      # through. The path is built from the runtime's tmpdir both here and in
      # packages/slice/src/serve.ts. The line is printed whatever the outcome, so
      # .State.Health.Log says why.
      #
      # Strings are joined with `+`, not template literals: Compose substitutes
      # `${...}` in this value before Node sees it.
      #
      # `selling` means no poll failed in the last ninety seconds, so a gateway
      # restarted on purpose leaves this service red for up to ninety seconds.
      test:
        - CMD
        - node
        - -e
        - |
          const fs = require("node:fs");
          const p = require("node:path").join(require("node:os").tmpdir(), "agentify-merchant-subscription");
          try {
            const line = fs.readFileSync(p, "utf8").trim();
            const age = Math.round((Date.now() - fs.statSync(p).mtimeMs) / 1000);
            console.log(line + " (written " + age + "s ago)");
            process.exit(age < 15 && line.startsWith("selling") ? 0 : 1);
          } catch (thrown) {
            console.log("cannot read " + p + ": " + thrown.message);
            process.exit(1);
          }
      interval: 5s
      timeout: 3s
      # Three, to absorb a probe that loses its timeout on a loaded machine. A
      # dropped poll is not what they cover: that keeps the line at `doubting` for
      # the whole ninety-second window.
      retries: 3
      # It starts through tsx and publishes its catalogue before it first writes
      # the file.
      start_period: 15s

  # The scanner's tables, in the same database, with their history in
  # `drizzle.scanner_migrations`. Separate from `migrate` because the scanner's
  # migrations are built into the scanner's image and the app image leaves them
  # out. No service prepares the queue: it lives in the gateway's `pgboss`
  # schema, and both its writer and its reader create it idempotently at start.
  scanner-migrate:
    <<: *scanner-app
    command: ["node", "packages/scanner-database/dist/migrate-cli.js"]
    environment:
      DATABASE_URL: postgres://agentify:agentify@postgres:5432/agentify
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # What runs a scan: it takes the job off the queue, fetches the site and
  # writes the findings. Everything that costs money or leaves this machine for
  # anywhere but the site being scanned is off, and a deployment turns on only
  # what it has paid for.
  scanner-worker:
    <<: *scanner-app
    environment:
      DATABASE_URL: postgres://agentify:agentify@postgres:5432/agentify
      # The address a report is linked at, which is the door Caddy answers
      # rather than the port any of these processes listens on.
      APP_BASE_URL: "${AGENTIFY_PUBLIC_ORIGIN:-http://localhost:${AGENTIFY_HOST_PORT:-8080}}"
      # One name per running worker, because heartbeats are keyed on it and two
      # workers answering to one name look like one worker restarting. Each
      # deployment names its own; this is the laptop's.
      WORKER_ID: "${WORKER_ID:-agentify-local-1}"
      # Two rather than a server's four: a laptop has other uses for its cores, and
      # a scan is mostly waiting on somebody else's site.
      SCANNER_CONCURRENCY: "${SCANNER_CONCURRENCY:-2}"
      # Which datasets the analytics may name. The release holds the test
      # channel to this exact set of answers, so a test stack cannot write into
      # a production dataset by inheriting a variable somebody forgot.
      ANALYTICS_ENV: "${ANALYTICS_RUNTIME_ENV:-local}"
      ANALYTICS_RUNTIME_ENV: "${ANALYTICS_RUNTIME_ENV:-local}"
      ANALYTICS_SERVER_DELIVERY_ENABLED: "false"
      POSTHOG_ENABLED: "${POSTHOG_ENABLED:-false}"
      POSTHOG_DESTINATION_ENV: "${POSTHOG_DESTINATION_ENV:-local}"
      META_CAPI_ENABLED: "${META_CAPI_ENABLED:-false}"
      META_DESTINATION_ENV: "${META_DESTINATION_ENV:-local}"
      PARTNER_POSTBACK_ENABLED: "${PARTNER_POSTBACK_ENABLED:-false}"
      PARTNER_POSTBACK_SECRET: "${PARTNER_POSTBACK_SECRET:-}"
      # Passive browser observation through an Apify actor, which is a paid
      # service and a deployment target of its own. Off, and every knob it
      # would need is named here so that turning it on is a line in a `.env`
      # rather than an edit to this file.
      APIFY_BROWSER_ENABLED: "${APIFY_BROWSER_ENABLED:-false}"
      APIFY_BROWSER_MODE: "${APIFY_BROWSER_MODE:-off}"
      APIFY_API_TOKEN: "${APIFY_API_TOKEN:-}"
      APIFY_BROWSER_ACTOR_ID: "${APIFY_BROWSER_ACTOR_ID:-}"
      APIFY_BROWSER_ACTOR_BUILD: "${APIFY_BROWSER_ACTOR_BUILD:-}"
      APIFY_BROWSER_SAMPLE_RATE: "${APIFY_BROWSER_SAMPLE_RATE:-0.10}"
      APIFY_BROWSER_CONCURRENCY: "${APIFY_BROWSER_CONCURRENCY:-1}"
      APIFY_BROWSER_TIMEOUT_SECONDS: "${APIFY_BROWSER_TIMEOUT_SECONDS:-60}"
      APIFY_BROWSER_MAX_RUN_USD: "${APIFY_BROWSER_MAX_RUN_USD:-0.05}"
      APIFY_BROWSER_DAILY_BUDGET_USD: "${APIFY_BROWSER_DAILY_BUDGET_USD:-25}"
      APIFY_BROWSER_MAX_PAGES: "${APIFY_BROWSER_MAX_PAGES:-3}"
    depends_on:
      postgres:
        condition: service_healthy
      scanner-migrate:
        condition: service_completed_successfully

  # The front page, here as on both deployed channels, with the same route
  # table in front of it.
  scanner:
    build:
      context: .
      dockerfile: deploy/Dockerfile.scanner
      target: runner
    image: "${AGENTIFY_SCANNER_IMAGE:-agentify-scanner}"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://agentify:agentify@postgres:5432/agentify
      APP_BASE_URL: "${AGENTIFY_PUBLIC_ORIGIN:-http://localhost:${AGENTIFY_HOST_PORT:-8080}}"
      # What signs the tokens in a report link, and what encrypts the address a
      # report was asked for. The scanner derives the second from the first
      # when it is given no key of its own, which is what keeps a laptop down
      # to one line here; a deployment sets both.
      TOKEN_HMAC_SECRET: "${TOKEN_HMAC_SECRET:-a-sandbox-token-hmac-secret-nobody-should-reuse}"
      EMAIL_ENCRYPTION_KEY: "${EMAIL_ENCRYPTION_KEY:-}"
      # On, so the whole path a reader walks works from this one command: a scan, a
      # report, an address confirmed through the dashboard's private route, and the
      # dashboard opening for that person. deploy/compose.public.yaml turns it off
      # for deployments, where what a public site accepts from strangers is the
      # operator's decision.
      REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-true}"
      DASHBOARD_IDENTITY_URL: http://app:3002
      REPORT_IDENTITY_SECRET: "${REPORT_IDENTITY_SECRET:-a-sandbox-report-identity-secret-nobody-should-reuse}"
      SCAN_ACCEPTANCE_ENABLED: "${SCAN_ACCEPTANCE_ENABLED:-true}"
      REMEDIATION_PROMPT_ENABLED: "${REMEDIATION_PROMPT_ENABLED:-true}"
      # Who the operator of this site is, in the words its trust pages print.
      # A deployment answers for itself; a laptop is nobody's operator.
      PRIVACY_EMAIL: "${PRIVACY_EMAIL:-privacy@agentify.ad}"
      ABUSE_EMAIL: "${ABUSE_EMAIL:-abuse@agentify.ad}"
      LEGAL_OPERATOR: "${LEGAL_OPERATOR:-Operator identity pending confirmation}"
      LEGAL_IDENTITY_CONFIRMED: "${LEGAL_IDENTITY_CONFIRMED:-false}"
      # The bot check in front of submission. Enforced needs both halves, and
      # the process refuses to start with one of them, so a laptop has neither.
      TURNSTILE_ENFORCED: "${TURNSTILE_ENFORCED:-false}"
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      # Surfaces that cost money, reach another company or are not finished.
      # Off here and off unless a deployment names them.
      BENCHMARK_ENABLED: "${BENCHMARK_ENABLED:-false}"
      PUBLIC_SHARE_ENABLED: "${PUBLIC_SHARE_ENABLED:-false}"
      PARTNER_POSTBACK_ENABLED: "${PARTNER_POSTBACK_ENABLED:-false}"
      CARD_SIGNAL_ENABLED: "false"
      APIFY_BROWSER_MODE: "${APIFY_BROWSER_MODE:-off}"
      ANALYTICS_RUNTIME_ENV: "${ANALYTICS_RUNTIME_ENV:-local}"
      ANALYTICS_SERVER_DELIVERY_ENABLED: "false"
      POSTHOG_BROWSER_KEY: "${POSTHOG_BROWSER_KEY:-}"
      POSTHOG_BROWSER_HOST: "${POSTHOG_BROWSER_HOST:-}"
      POSTHOG_DESTINATION_ENV: "${POSTHOG_DESTINATION_ENV:-local}"
      META_PIXEL_ID: "${META_PIXEL_ID:-}"
      META_DESTINATION_ENV: "${META_DESTINATION_ENV:-local}"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
      scanner-migrate:
        condition: service_completed_successfully
      app:
        condition: service_started

  # Deletes what the retention policy says is over. It runs on a server's
  # schedule and never by itself, so its profile is one nothing enables; it is
  # defined here so the schedule runs the image this file names.
  #
  #   docker compose --profile jobs run --rm scanner-privacy
  scanner-privacy:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.scanner
      target: privacy-jobs
    image: "${AGENTIFY_SCANNER_PRIVACY_IMAGE:-agentify-scanner-privacy}"
    restart: "no"
    environment:
      DATABASE_URL: postgres://agentify:agentify@postgres:5432/agentify
      APP_BASE_URL: "${AGENTIFY_PUBLIC_ORIGIN:-http://localhost:${AGENTIFY_HOST_PORT:-8080}}"
      TOKEN_HMAC_SECRET: "${TOKEN_HMAC_SECRET:-a-sandbox-token-hmac-secret-nobody-should-reuse}"
      EMAIL_ENCRYPTION_KEY: "${EMAIL_ENCRYPTION_KEY:-}"
      # This job renders no page and takes no registration; the two names below
      # are off so that it cannot, whatever the rest of the stack is set to.
      REGISTRATION_ENABLED: "false"
      CARD_SIGNAL_ENABLED: "false"
      STRIPE_ADAPTER: local
      PRIVACY_CLEANUP_ACK: "yes"
      PRIVACY_CLEANUP_DRY_RUN: "false"
      PRIVACY_CLEANUP_BATCH_SIZE: "100"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    image: "${AGENTIFY_WEB_IMAGE:-agentify-web}"
    restart: unless-stopped
    ports:
      # AGENTIFY_HOST_PORT moves the host side when 8080 is taken: an ssh tunnel on
      # 127.0.0.1:8080 wins over Docker's wildcard and makes a healthy stack look
      # broken. `pnpm buy` runs on the host and does not follow it; point it with
      #
      #   GATEWAY_URL=http://localhost:8090 pnpm buy
      #
      # AGENTIFY_WEB_PUBLISH replaces the whole mapping, for instance with one
      # interface (`192.0.2.10:443:443`), since Caddy listens on 443 once its
      # address is a hostname; the deployed channels replace it in their overlays
      # instead (see the variables at the top). The mapping does not change the
      # address the stack names itself by: set AGENTIFY_PUBLIC_ORIGIN as well, or
      # every status_url, payment challenge and dashboard link keeps naming
      # localhost.
      - "${AGENTIFY_WEB_PUBLISH:-${AGENTIFY_HOST_PORT:-8080}:8080}"
    environment:
      # A bare port locally, which is what keeps Caddy's automatic HTTPS off; a
      # hostname on a server, which is what turns it on. deploy/Caddyfile says
      # why TLS-ALPN is the only challenge that can reach it here.
      AGENTIFY_SITE_ADDRESS: "${AGENTIFY_SITE_ADDRESS:-:8080}"
      # Mandatory in Caddy, so that no stack falls back to a front page nobody
      # chose.
      AGENTIFY_FRONT_PAGE: scanner_front_page
      # Set by hand because Caddy cannot derive it from the chain, so the release
      # checks it against the channel before anything starts and against the
      # rendered pages afterwards.
      AGENTIFY_SURFACE_MODE: "${AGENTIFY_SURFACE_MODE:-sandbox}"
    volumes:
      # The routing and the shared assets are mounted over the copies baked
      # into the image so that editing either shows up on reload. The
      # documentation is not: it is a build, and it comes from the image.
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./packages/visual/public:/srv/assets:ro
      # Where Caddy keeps its certificate and ACME account key. A named volume,
      # because containers get recreated and the certificate authority refuses a
      # sixth issuance for the same name within a week. Empty locally: a bare port
      # runs no ACME.
      - agentify-caddy:/data
    # Waited for, but not required: without `required: false`, one service that
    # never turns healthy aborts `docker compose up` and nothing answers at all,
    # not even to say which service is broken. A dead scanner still takes the
    # front page with it, and a dead application /dashboard, /v0 and /x402; /docs
    # survives. Each comes back by itself, because Caddy resolves service names
    # per request.
    depends_on:
      app:
        condition: service_healthy
        required: false
      scanner:
        condition: service_healthy
        required: false

volumes:
  agentify-postgres:
  agentify-caddy:
