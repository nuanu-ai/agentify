# A throwaway WooCommerce shop for the integration probes in this directory.
#
# Ports are chosen not to collide with the project's own compose.yaml, which
# publishes 8080 (the door) and 5432 (postgres). This stand publishes 8088
# (the shop) and 8099 (the callback receiver), both bound to the loopback.
#
# The passwords here are fixed dev strings. That is deliberate: the whole
# stand is local, disposable, and the probes have to be reproducible from a
# clean checkout without a secret to hand around. Nothing here is a credential
# for anything that exists outside this file.
name: coinslot-woo-spike

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40

  wordpress:
    # Pinned deliberately: WooCommerce's current release refuses to install on
    # WordPress below 7.0, so an older pin silently turns this stand into a
    # different experiment.
    image: wordpress:7.1-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"
      # The same shop over TLS. WooCommerce's REST authentication branches on
      # is_ssl(), so both doors are needed to see both branches.
      - "127.0.0.1:8443:443"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wp_data:/var/www/html
      # The probe instrument. It logs every outbound HTTP request and every
      # mail attempt, and it is the one place where this stand differs from a
      # stock shop. See mu-plugins/coinslot-probe.php for what each hook does
      # and why.
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./var/probe:/var/probe
      - ./var/certs:/var/certs:ro
      - ./apache/zz-ssl.conf:/etc/apache2/conf-enabled/zz-ssl.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 40

  # WP-CLI against the same document root and the same database. Used by
  # setup.sh; it is not a long-running service.
  cli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_data:/var/www/html

  # Where WooCommerce POSTs the granted key pair. Two constraints fix its
  # shape, both read out of the source rather than guessed:
  #   - WooCommerce rejects a callback_url that is not https
  #     (class-wc-auth.php, make_validation);
  #   - WordPress only lets wp_safe_remote_post reach ports 80, 443 and 8080
  #     (wp_http_validate_url), so inside the network it listens on 443.
  # See README.
  callback:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "server.mjs"]
    ports:
      - "127.0.0.1:8099:443"
    volumes:
      - ./callback:/app:ro
      - ./var/callback:/var/callback
      - ./var/certs:/var/certs:ro

volumes:
  db_data:
  wp_data:
