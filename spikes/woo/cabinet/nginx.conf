# TLS in front of the Coinslot cabinet, for the demo runbook and for nothing
# else.
#
# It exists because of one fact measured on this stand: WooCommerce refuses a
# callback_url that is not https, and WordPress only lets an outgoing request
# reach ports 80, 443 and 8080 (wp_http_validate_url). The deployed cabinet is
# behind real TLS on 443 and meets neither obstacle; a cabinet running on a
# laptop over plain http on some high port meets both. So this terminates TLS on
# 443 with the stand's own certificate and passes the request to the cabinet on
# the host.
#
# It is named `cabinet` in the compose file, which is the name the shop reaches
# it by on this network, and the same name the runbook puts in /etc/hosts so
# that a browser reaches it too. One name from both sides is the whole trick:
# WooCommerce is given one callback address and one return address, and both of
# them have to work — the first from the shop's own server, the second from the
# person's browser.
#
# Nothing here is product code and nothing here ships. See spikes/woo/DEMO.md.
events {}

http {
  server {
    listen 443 ssl;
    server_name cabinet;

    ssl_certificate     /var/certs/cabinet-cert.pem;
    ssl_certificate_key /var/certs/cabinet-key.pem;

    # The forms the cabinet serves are small and its answers are pages.
    client_max_body_size 1m;

    location / {
      proxy_pass http://host.docker.internal:3001;
      # The host header is passed through unchanged, because the cabinet
      # compares the Origin a browser sends against the host it was addressed
      # to before it accepts a form post. Rewritten here, every form on the
      # site would be refused as having come from somewhere else.
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 120s;
    }
  }
}
