# A second, TLS front door on the same Apache.
#
# It exists because WooCommerce picks its REST authentication scheme from
# is_ssl(): over https the granted consumer key and secret go in as HTTP Basic,
# over plain http they must be OAuth 1.0a one-legged signatures
# (class-wc-rest-authentication.php, authenticate()). A real merchant shop is
# on https, so the stand has to be able to speak both or the probes would only
# exercise the path nobody uses.
#
# WordPress's own siteurl stays http://localhost:8088. That is deliberate:
# wc-auth builds its URLs from home_url(), and this way the grant flow is
# measured on the plain-http shop while the REST probes can pick either door.
# REST routes are not subject to redirect_canonical, so the https door serves
# /wp-json/* without bouncing back to http.
LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so

Listen 443

<VirtualHost *:443>
	DocumentRoot /var/www/html
	SSLEngine on
	SSLCertificateFile /var/certs/shop-cert.pem
	SSLCertificateKeyFile /var/certs/shop-key.pem

	<Directory /var/www/html>
		Options FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>
</VirtualHost>
