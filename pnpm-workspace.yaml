# One product, one reproducible install: every package of it is installed from
# this workspace and its lockfile, code and documentation alike. The scanner's
# packages are for now checked under a lint and compiler configuration of their
# own, which is why the root commands that run over them are scoped.
packages:
  - packages/*
  - apps/*

allowBuilds:
  core-js: false
  esbuild: true
  sharp: true
