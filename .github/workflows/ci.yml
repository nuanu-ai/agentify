name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Reading is enough for the checks: they must publish nothing and write nowhere.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Keep main and tag evidence complete; pull-request feedback may discard an
  # obsolete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Public pull requests run only on GitHub-hosted infrastructure. No job in this
# repository receives a route or credential that can deliver to test or live.
jobs:
  secret_scan:
    name: CI secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: ./scripts/scan-secrets.sh . "$GITHUB_SHA"

  # Every check that needs the source, the dependencies or a database shares
  # one checkout, one install and one database server. Matrix jobs used to
  # spend almost nine minutes on setup while the checks themselves took
  # seconds, and a second job for half the workspace spent that again and
  # answered on a different version of Postgres than production runs. The jobs
  # beside this one are split by what they need — a browser, the portal build,
  # only files — never by which half of the product they check. One gate has
  # one answer: this exact commit is fit to release, or it is not.
  gate:
    name: gate
    needs: secret_scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # PostgreSQL 17.11 Alpine: the same immutable image the commerce stack deploys.
        image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: agentify_commerce
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: agentify_commerce_test
        # Let GitHub choose the host port so concurrent jobs cannot contend for
        # the runner's 5432.
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U agentify_commerce -d agentify_commerce_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node v5 otherwise infers pnpm from packageManager and tries to
          # cache it before the next step has enabled Corepack.
          package-manager-cache: false

      # pnpm arrives through Corepack; its version is taken from packageManager
      # in the root package.json — the same one the developer has on the machine.
      - run: corepack enable

      # One server, two schemas' worth of tests. The image makes the database it
      # is given and the user that owns it; this makes the scanner's beside it.
      #
      # The role is a superuser, and three of the migrations are the reason:
      # they put the browser-observation tables under FORCE row level security
      # and write no policy for them, so an owner is subject to a policy set
      # that admits nobody. This is the same account the deployed stack uses —
      # there, too, the scanner connects as the cluster's own role — so the
      # suites run against the privileges the product actually has.
      - name: give the scanner its database on the same server
        env:
          PGPASSWORD: ci-only
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 \
            -p ${{ job.services.postgres.ports[5432] }} \
            -U agentify_commerce -d agentify_commerce_test \
            -c "create role agentify_scanner login superuser password 'ci-only'" \
            -c "create database agentify_scanner_migration_test owner agentify_scanner"

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db
        env:
          AGENTIFY_TEST_DATABASE_URL: postgresql://agentify_commerce:ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/agentify_commerce_test
      - run: pnpm scanner:test:integration
        env:
          DATABASE_URL: postgresql://agentify_scanner:ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/agentify_scanner_migration_test
          MIGRATION_TEST_DATABASE_URL: postgresql://agentify_scanner:ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/agentify_scanner_migration_test
      - run: pnpm scanner:test:db
        env:
          DATABASE_URL: postgresql://agentify_scanner:ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/agentify_scanner_migration_test
          MIGRATION_TEST_DATABASE_URL: postgresql://agentify_scanner:ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/agentify_scanner_migration_test
      # `build` and `typecheck` compile different sets of files. The former uses
      # the package tsconfig that decides what ships; the latter reads the whole
      # source tree including tests and emits nothing.
      - run: pnpm build
      # This one runs the site it has just built, so it comes after the build.
      # It reads APP_BASE_URL to know which absolute URLs that site should be
      # publishing in its robots and its sitemap — the built server reads the
      # variable when it answers, not when it was built, so this step is the
      # only one that needs it. It starts that server on loopback and asks it;
      # it reaches nothing outside.
      - run: pnpm scanner:self-readiness
        env:
          APP_BASE_URL: https://agentify.ad
          DATABASE_URL: postgresql://agentify_scanner:ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/agentify_scanner_migration_test
          MIGRATION_TEST_DATABASE_URL: postgresql://agentify_scanner:ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/agentify_scanner_migration_test

  # The browser observer's test drives a real Chromium, and installing one with
  # its system packages is the slowest step in this file by a wide margin:
  # nineteen seconds on a good day and three minutes on a bad one. It runs
  # beside the gate instead of in front of every other check, and it needs no
  # database.
  browser:
    name: browser
    needs: secret_scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @agentify/browser-observer-actor exec playwright install --with-deps chromium

      - run: pnpm scanner:test:actor

  # The portal keeps a separate gate because its rendered examples are a
  # distinct release promise. It installs from the same workspace lockfile.
  portal:
    name: portal
    needs: secret_scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:portal

  # The decision log needs neither Node nor dependencies — only bash and files.
  decisions:
    name: decisions
    needs: secret_scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-decisions.sh
      - run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - run: python3 -m unittest discover -s deploy/ansible -p 'test_*.py'
