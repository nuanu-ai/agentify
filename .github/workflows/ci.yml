name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Reading is enough for the checks: they must publish nothing and write nowhere.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Keep main's evidence complete; pull-request feedback may discard an
  # obsolete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Public pull requests run only on GitHub-hosted infrastructure. No job in this
# repository receives a route or credential that can deliver to test or live.
jobs:
  secret_scan:
    name: CI secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: ./scripts/scan-secrets.sh . "$GITHUB_SHA"

  # Static checks need no database or build output and run beside the tests.
  checks:
    name: checks
    needs: secret_scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      # Files, exports and dependencies nothing uses; `knip.ts` says what it
      # reads as used and what it leaves alone.
      - run: pnpm deadcode

  # The offline suite needs only source and dependencies. It can start without
  # waiting for the static checks, which produce no files the tests consume.
  tests:
    name: tests
    needs: secret_scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Database suites share one server and run in sequence because they empty
  # its tables. Checks of the built applications follow the build here.
  gate:
    name: gate
    needs: secret_scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # PostgreSQL 17.11 Alpine: the same immutable image the stack deploys.
        image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: agentify
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: agentify_test
        # Let GitHub choose the host port so concurrent jobs cannot contend for
        # the runner's 5432.
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U agentify -d agentify_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node v5 otherwise infers pnpm from packageManager and tries to
          # cache it before the next step has enabled Corepack.
          package-manager-cache: false

      # pnpm arrives through Corepack; its version is taken from packageManager
      # in the root package.json — the same one the developer has on the machine.
      - run: corepack enable

      # One server and one account for every suite, as the stack has. The image
      # makes `pnpm test:db`'s database; this makes the one the scanner's suites
      # drop and remake beside it (deploy/postgres-init/ does both on a laptop).
      #
      # The account must be the cluster's superuser: migrations put the
      # browser-observation tables under FORCE row level security with no
      # policy, which admits no owner that is not a superuser.
      - name: give the scanner's suites their database on the same server
        env:
          PGPASSWORD: ci-only
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 \
            -p ${{ job.services.postgres.ports[5432] }} \
            -U agentify -d agentify_test \
            -c "create database agentify_scanner_migration_test"

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db
        env:
          AGENTIFY_TEST_DATABASE_URL: postgresql://agentify:ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/agentify_test
      - run: pnpm scanner:test:integration
        env:
          DATABASE_URL: postgresql://agentify:ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/agentify_scanner_migration_test
          MIGRATION_TEST_DATABASE_URL: postgresql://agentify:ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/agentify_scanner_migration_test
      - run: pnpm scanner:test:db
        env:
          DATABASE_URL: postgresql://agentify:ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/agentify_scanner_migration_test
          MIGRATION_TEST_DATABASE_URL: postgresql://agentify:ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/agentify_scanner_migration_test
      # `build` and `typecheck` compile different sets of files. The former uses
      # the package tsconfig that decides what ships; the latter reads the whole
      # source tree including tests and emits nothing.
      - run: pnpm build
      # Read the dashboard's and the scanner's builds, so they come after
      # them: the script a page loads on its first visit stays under its
      # budget, and every file the browser gets is hashed and kept for a year.
      - run: pnpm --filter @agentify/dashboard budget
      - run: pnpm --filter @agentify/web budget
      # Starts the scanner's build as its image does, with nothing installed
      # beside it, as built and as an import() in server code splits it: the
      # process comes up, answers its probe and a page, and stops when told.
      - run: pnpm scanner:test:start
      # Runs the site just built, on loopback, so it comes after the build. The
      # built server reads APP_BASE_URL and AGENTIFY_SURFACE_MODE when it
      # answers, not when it was built: the live site's address for the absolute
      # URLs in its robots and sitemap, and the live channel for its llms.txt.
      - run: pnpm scanner:self-readiness
        env:
          APP_BASE_URL: https://agentify.ad
          AGENTIFY_SURFACE_MODE: live
          DATABASE_URL: postgresql://agentify:ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/agentify_scanner_migration_test
          MIGRATION_TEST_DATABASE_URL: postgresql://agentify:ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/agentify_scanner_migration_test
      # The door to the operator's dashboard is the router's answer, so it is
      # asked of the build too, on a database the migrations built: /admin is
      # the site's 404 page for everybody but an operator, and the dashboard
      # for an operator.
      - run: pnpm scanner:test:admin-door
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://agentify:ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/agentify_scanner_migration_test

  # Browser suites share one Chromium installation and run beside the other
  # checks. Applications are built before the suites that read them.
  browser:
    name: browser
    needs: secret_scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @agentify/browser-observer-actor exec playwright install --with-deps chromium

      - run: pnpm scanner:test:actor

      # Builds the dashboard's pages and checks, in the same Chromium, that the
      # click after a hover is answered from its fetch, that nothing kept
      # before a press is shown after it, and that a press keeps the scroll.
      - run: pnpm dashboard:test:browser

      # Builds the scanner and checks, in the same Chromium, that its pages
      # come alive without a complaint, that a click shows at once, that a
      # hover's fetch serves the click, and that the consent banner takes a
      # choice without a reload.
      - run: pnpm scanner:test:browser

      # Builds the documentation and checks, in the same Chromium and through
      # a stand-in for the Caddyfile's /docs block, that the channel's notice
      # outlives a move between pages, that a click on a fetched link asks for
      # nothing more, that the search and the outline work, that a phone
      # reaches the pages and the sections, and that old addresses lead on.
      # The preceding scanner suite leaves its web build for these checks.
      - name: check documentation in Chromium
        run: |
          pnpm --filter @agentify/docs build
          pnpm exec vitest run --project integration apps/docs/testing/in-chromium.integration.test.ts

  # The documentation keeps a separate gate because its rendered examples are a
  # distinct release promise. It installs from the same workspace lockfile,
  # and keeps the speed budget of its pages against the build it makes.
  portal:
    name: portal
    needs: secret_scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:portal

      - run: pnpm --filter @agentify/docs budget

  # Every screen state the gallery draws, at a phone's, a tablet's and a
  # desktop's width: nothing on a page reaches past the window, and axe finds
  # nothing it rates serious or critical. A job of its own, beside the gate,
  # because it needs Chromium and no database; the headless shell is all a
  # check that takes no screenshots launches.
  screens:
    name: screens
    needs: secret_scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @agentify/gallery exec playwright install --with-deps --only-shell chromium

      - run: pnpm gallery

      - run: pnpm gallery:check

  # The decision log and the retired sentences need only bash and files, and
  # the release's own tests need Docker, which the runner has, and Node for the
  # release's preflight, a script with no dependencies; nothing is installed.
  decisions:
    name: decisions
    needs: secret_scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: ./scripts/check-decisions.sh
      - run: ./scripts/check-retired-claims.sh
      - run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - run: python3 -m unittest discover -s deploy/ansible -p 'test_*.py'
