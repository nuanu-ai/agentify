name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Reading is enough for the checks: they must publish nothing and write nowhere.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Keep main and tag evidence complete; pull-request feedback may discard an
  # obsolete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Public pull requests run only on GitHub-hosted infrastructure. No job in this
# repository receives a route or credential that can deliver to test or live.
jobs:
  # These checks share one checkout and one install. Four matrix jobs used to
  # spend almost nine minutes doing setup while the checks themselves took
  # seconds. One gate has one answer: this exact commit is fit to release, or it
  # is not.
  gate:
    name: gate
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostgreSQL 17.11 Alpine: the same immutable image the commerce stack deploys.
        image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: agentify_commerce
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: agentify_commerce_test
        # Let GitHub choose the host port so concurrent jobs cannot contend for
        # the runner's 5432.
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U agentify_commerce -d agentify_commerce_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node v5 otherwise infers pnpm from packageManager and tries to
          # cache it before the next step has enabled Corepack.
          package-manager-cache: false

      # pnpm arrives through Corepack; its version is taken from packageManager
      # in the root package.json — the same one the developer has on the machine.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:commerce
      - run: pnpm typecheck:commerce
      - run: pnpm test:commerce
      - run: pnpm test:db
        env:
          AGENTIFY_TEST_DATABASE_URL: postgresql://agentify_commerce:ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/agentify_commerce_test
      # `build` and `typecheck` compile different sets of files. The former uses
      # the package tsconfig that decides what ships; the latter reads the whole
      # source tree including tests and emits nothing.
      - run: pnpm build:commerce

  # The portal keeps a separate gate because its rendered examples are a
  # distinct release promise. It installs from the same workspace lockfile.
  portal:
    name: portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:portal

  # The decision log needs neither Node nor dependencies — only bash and files.
  decisions:
    name: decisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-decisions.sh

  # Scanner checks keep their own job and database service while sharing the
  # repository toolchain and lockfile with commerce and the portal.
  agentify:
    name: agentify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: agentify_scanner
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: agentify_scanner_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentify_scanner -d agentify_scanner_migration_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://agentify_scanner:ci-only@127.0.0.1:5432/agentify_scanner_migration_test
      MIGRATION_TEST_DATABASE_URL: postgresql://agentify_scanner:ci-only@127.0.0.1:5432/agentify_scanner_migration_test
      APP_BASE_URL: https://agentify.ad

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentify/browser-observer-actor exec playwright install --with-deps chromium
      - run: pnpm check:scanner
      - run: pnpm typecheck:scanner
      - run: pnpm test:scanner
      - run: pnpm scanner:test:actor
      - run: pnpm scanner:test:integration
      - run: pnpm scanner:test:db
      - run: pnpm build:scanner
      - run: pnpm scanner:self-readiness
