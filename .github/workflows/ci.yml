name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Reading is enough for the checks: they must publish nothing and write nowhere.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Keep main and tag evidence complete; pull-request feedback may discard an
  # obsolete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Public pull requests run only on GitHub-hosted infrastructure. No job in this
# repository receives a route or credential that can deliver to test or live.
jobs:
  # These checks share one checkout and one install. Four matrix jobs used to
  # spend almost nine minutes doing setup while the checks themselves took
  # seconds. One gate has one answer: this exact commit is fit to release, or it
  # is not.
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node v5 otherwise infers pnpm from packageManager and tries to
          # cache it before the next step has enabled Corepack.
          package-manager-cache: false

      # pnpm arrives through Corepack; its version is taken from packageManager
      # in the root package.json — the same one the developer has on the machine.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:commerce
      - run: pnpm typecheck:commerce
      - run: pnpm test:commerce
      # `build` and `typecheck` compile different sets of files. The former uses
      # the package tsconfig that decides what ships; the latter reads the whole
      # source tree including tests and emits nothing.
      - run: pnpm build:commerce

      # test:db stays outside this free, deterministic gate. It runs against the
      # deployment host's own `agentify_commerce_test` database before activation.

  # The portal keeps a separate gate because its rendered examples are a
  # distinct release promise. It installs from the same workspace lockfile.
  portal:
    name: portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:portal

  # The decision log needs neither Node nor dependencies — only bash and files.
  decisions:
    name: decisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-decisions.sh

  # Scanner checks keep their own job and database service while sharing the
  # repository toolchain and lockfile with commerce and the portal.
  agentify:
    name: agentify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: b2a
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: b2a_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U b2a -d b2a_migration_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://b2a:ci-only@127.0.0.1:5432/b2a_migration_test
      MIGRATION_TEST_DATABASE_URL: postgresql://b2a:ci-only@127.0.0.1:5432/b2a_migration_test
      NEXT_PUBLIC_APP_BASE_URL: https://agentify.ad
      NEXT_PUBLIC_DISPLAY_BRAND: Agentify

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentify/browser-observer-actor exec playwright install --with-deps chromium
      - run: pnpm check:agentify
      - run: pnpm typecheck:agentify
      - run: pnpm test:agentify
      - run: pnpm agentify:test:actor
      - run: pnpm agentify:test:integration
      - run: pnpm agentify:test:db
      - run: pnpm build:agentify
      - run: pnpm agentify:self-readiness
