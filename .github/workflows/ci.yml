name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Reading is enough for the checks: they must publish nothing and write nowhere.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Keep main and tag evidence complete; pull-request feedback may discard an
  # obsolete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Public pull requests run only on GitHub-hosted infrastructure. No job in this
# repository receives a route or credential that can deliver to test or live.
jobs:
  # These checks share one checkout and one install. Four matrix jobs used to
  # spend almost nine minutes doing setup while the checks themselves took
  # seconds. One gate has one answer: this exact commit is fit to release, or it
  # is not.
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # setup-node v5 otherwise infers pnpm from packageManager and tries to
          # cache it before the next step has enabled Corepack.
          package-manager-cache: false

      # pnpm arrives through Corepack; its version is taken from packageManager
      # in the root package.json — the same one the developer has on the machine.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      # `build` and `typecheck` compile different sets of files. The former uses
      # the package tsconfig that decides what ships; the latter reads the whole
      # source tree including tests and emits nothing.
      - run: pnpm build

      # test:db stays outside this free, deterministic gate. It runs against the
      # deployment host's own `coinslot_test` database before activation.

  # The portal is a job of its own because it is a project of its own: a
  # separate vitepress build with its own lockfile, deliberately outside the
  # workspace so that releasing the documentation is not tied to releasing the
  # code. Folding it into the gate would install it twice and undo that.
  portal:
    name: portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - run: corepack enable

      # `--ignore-workspace` is not decoration. pnpm searches upwards for a
      # workspace file, finds the repository's, and installs the eight packages
      # of the monorepo instead of vitepress — leaving the build with nothing to
      # run and the failure two steps away from its cause.
      - run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: portal

      - run: pnpm run docs:build
        working-directory: portal

      # The build's exit code says the site compiled, not that it kept its
      # examples. The pages carry theirs by reference — one file, read by the
      # merchant and by `portal-fixtures.test.ts` — and a snippet syntax that
      # changed under an upgrade would print the reference as text while every
      # test stayed green. This is the step the job exists for.
      - run: node scripts/check-portal-render.mjs

  # The decision log needs neither Node nor dependencies — only bash and files.
  decisions:
    name: decisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-decisions.sh

  # Agentify remains an independent workspace during repository consolidation.
  # Keeping its original runtime and checks here makes the temporary boundary
  # explicit without changing the CoinSlot package graph or release jobs.
  agentify:
    name: agentify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: b2a
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: b2a_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U b2a -d b2a_migration_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://b2a:ci-only@127.0.0.1:5432/b2a_migration_test
      MIGRATION_TEST_DATABASE_URL: postgresql://b2a:ci-only@127.0.0.1:5432/b2a_migration_test
      NEXT_PUBLIC_APP_BASE_URL: https://agentify.ad
      NEXT_PUBLIC_DISPLAY_BRAND: Agentify

    defaults:
      run:
        working-directory: agentify

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: agentify/.nvmrc
          package-manager-cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
          run_install: false
          package_json_file: agentify/package.json

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @b2a/browser-observer-actor exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm ops:test
      - run: pnpm --filter @b2a/browser-observer-actor test:integration
      - run: pnpm test:integration
      - run: pnpm db:check
      - run: pnpm db:test:migrations
      - run: pnpm build
      - run: pnpm self-readiness:candidate
