name: Deploy TEST

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Branch, tag or full commit SHA from this repository
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  select:
    name: Move the TEST deployment intent
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted deployment controller
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require this workflow to run from main
        env:
          EXPECTED: ${{ github.repository }}/.github/workflows/deploy-test.yml@refs/heads/main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_REF" = "$EXPECTED"

      - name: Resolve the repository candidate to one commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$CANDIDATE")"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$encoded" --jq .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the candidate history
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 0
          path: candidate-source

      - name: Scan the candidate for secrets
        run: ./scripts/scan-secrets.sh candidate-source "${{ steps.candidate.outputs.sha }}"

      - name: Publish the exact TEST intent
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          read_ref="repos/$GITHUB_REPOSITORY/git/ref/tags/deploy-test"
          write_ref="repos/$GITHUB_REPOSITORY/git/refs/tags/deploy-test"
          if gh api "$read_ref" >/dev/null 2>&1; then
            gh api --method PATCH "$write_ref" -f "sha=$CANDIDATE" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/deploy-test -f "sha=$CANDIDATE" >/dev/null
          fi
          test "$(gh api "$read_ref" --jq .object.sha)" = "$CANDIDATE"
          {
            echo "### TEST selection published"
            echo
            echo "\`deploy-test\` now names \`$CANDIDATE\`. The server pull agent continues the deployment."
            echo "This workflow does not claim that activation or runtime verification has completed."
          } >> "$GITHUB_STEP_SUMMARY"
