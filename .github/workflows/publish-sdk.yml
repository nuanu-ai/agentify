name: Publish Agentify SDK

# Only the publish job can obtain the identity npm accepts for these packages,
# and only through the production environment, which GitHub admits for app-v*
# tags alone. The checks in the verify job are steps a branch can edit, so they
# are not what keeps a branch from publishing; the environment is. The publish
# job installs and builds nothing: it publishes the tarballs verify checked.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: app-v* tag name to check main's head against, without publishing
        required: true
        type: string
  push:
    tags:
      - 'app-v*'

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    outputs:
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      contracts_version: ${{ steps.release.outputs.contracts_version }}
      sdk_version: ${{ steps.release.outputs.sdk_version }}

    steps:
      - name: Check out the release source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require the release source on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          if git fetch --no-tags origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" 2>/dev/null; then
            tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            test "$tag_commit" = "$GITHUB_SHA"
          elif [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            echo "release tag ${RELEASE_TAG} does not exist" >&2
            exit 1
          else
            test "$GITHUB_REF" = 'refs/heads/main'
            test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          fi

      - name: Scan the release source for secrets
        run: ./scripts/scan-secrets.sh . HEAD

      - name: Require the tagged commit to pass CI
        if: github.event_name == 'push'
        uses: actions/github-script@v8
        with:
          script: |
            const deadline = Date.now() + 25 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ci.yml",
                branch: "main",
                event: "push",
                head_sha: context.sha,
                per_page: 100,
              });
              const run = data.workflow_runs.find((candidate) => candidate.head_sha === context.sha);

              if (run?.status === "completed") {
                if (run.conclusion === "success") {
                  core.info(`CI succeeded for ${context.sha} in run ${run.id}`);
                  return;
                }
                core.setFailed(`CI run ${run.id} concluded ${run.conclusion} for ${context.sha}`);
                return;
              }

              core.info(run ? `CI run ${run.id} is ${run.status}` : `Waiting for CI on ${context.sha}`);
              await new Promise((resolve) => setTimeout(resolve, 15_000));
            }

            core.setFailed(`Timed out waiting for CI on ${context.sha}`);

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Enable the repository pnpm version
        run: corepack enable

      # Node's bundled npm may predate npm Trusted Publishing support.
      - name: Install npm with Trusted Publishing support
        run: npm install -g npm@11.6.2

      - name: Install the exact workspace
        run: pnpm install --frozen-lockfile

      - name: Resolve the versions the tag would publish
        id: release
        run: ./scripts/check-sdk-release-tag.sh "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify the release source
        run: |
          pnpm exec biome ci .
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Verify the packed SDK outside the workspace
        run: pnpm outside release-packs

      - name: Keep the checked tarballs for the publish job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-packs
          path: release-packs/*.tgz
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Require the npm package names to be bootstrapped
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          missing=0
          for package in @nuanu-ai/agentify-contracts @nuanu-ai/agentify; do
            if ! npm view "$package" name >/dev/null 2>&1; then
              echo "::error::$package does not exist on npm; complete the one-time authenticated bootstrap before rerunning this workflow"
              missing=1
            fi
          done
          test "$missing" -eq 0

  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
      CONTRACTS_VERSION: ${{ needs.verify.outputs.contracts_version }}
      SDK_VERSION: ${{ needs.verify.outputs.sdk_version }}

    steps:
      - name: Check out the Node.js version file
        uses: actions/checkout@v5
        with:
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      # Node's bundled npm may predate npm Trusted Publishing support.
      - name: Install npm with Trusted Publishing support
        run: npm install -g npm@11.6.2

      - name: Fetch the tarballs verify checked
        uses: actions/download-artifact@v8
        with:
          name: release-packs
          path: release-packs

      # Contracts first: the SDK's manifest names the contracts version exactly.
      - name: Publish the package versions the registry does not hold yet
        run: |
          set -euo pipefail
          publish() {
            local tarball="$1" name="$2" version="$3"
            local packed
            packed="$(tar -xOzf "$tarball" package/package.json |
              node -p 'const m = JSON.parse(require("fs").readFileSync(0, "utf8")); m.name + "@" + m.version')"
            if [ "$packed" != "$name@$version" ]; then
              echo "$tarball carries $packed, not the $name@$version verify resolved" >&2
              return 1
            fi

            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is already on npm"
              return 0
            fi
            npm publish "$tarball" --provenance --access public --tag "$DIST_TAG"
          }

          publish "release-packs/nuanu-ai-agentify-contracts-${CONTRACTS_VERSION}.tgz" @nuanu-ai/agentify-contracts "$CONTRACTS_VERSION"
          publish "release-packs/nuanu-ai-agentify-${SDK_VERSION}.tgz" @nuanu-ai/agentify "$SDK_VERSION"

  confirm:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the Node.js version file
        uses: actions/checkout@v5
        with:
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify the registry accepted the exact release
        run: |
          set -euo pipefail

          # The registry records a publish some time after `npm publish`
          # reports it, and not both packages at once: the contracts package can
          # lag the SDK by minutes. A short wait fails a release whose rerun
          # then finds nothing left to publish.
          expect_version() {
            local selector="$1"
            local expected="$2"
            local actual=""

            for attempt in {1..60}; do
              if actual="$(npm view "$selector" version 2>/dev/null)" && [ "$actual" = "$expected" ]; then
                return 0
              fi
              if [ "$attempt" -lt 60 ]; then
                sleep 5
              fi
            done

            echo "$selector resolved to ${actual:-(nothing)}, expected $expected" >&2
            return 1
          }

          expect_version "@nuanu-ai/agentify-contracts@${{ needs.verify.outputs.contracts_version }}" "${{ needs.verify.outputs.contracts_version }}"
          expect_version "@nuanu-ai/agentify@${{ needs.verify.outputs.sdk_version }}" "${{ needs.verify.outputs.sdk_version }}"
          expect_version "@nuanu-ai/agentify-contracts@${{ needs.verify.outputs.dist_tag }}" "${{ needs.verify.outputs.contracts_version }}"
          expect_version "@nuanu-ai/agentify@${{ needs.verify.outputs.dist_tag }}" "${{ needs.verify.outputs.sdk_version }}"

          install_dir="$(mktemp -d)"
          trap 'rm -rf "$install_dir"' EXIT
          cd "$install_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact \
            "@nuanu-ai/agentify-contracts@${{ needs.verify.outputs.contracts_version }}" \
            "@nuanu-ai/agentify@${{ needs.verify.outputs.sdk_version }}"
          node --input-type=module -e '
            const contracts = await import("@nuanu-ai/agentify-contracts");
            const sdk = await import("@nuanu-ai/agentify");
            if (sdk.contractVersion !== contracts.CONTRACT_VERSION) {
              throw new Error("SDK contract " + sdk.contractVersion + " != contracts " + contracts.CONTRACT_VERSION);
            }
            if (typeof sdk.createClient !== "function" || typeof contracts.CardSchema?.safeParse !== "function") {
              throw new Error("the registry packages do not expose the public SDK contract");
            }
          '
