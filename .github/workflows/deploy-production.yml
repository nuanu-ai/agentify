name: Deploy PRODUCTION

on:
  push:
    tags:
      - "app-v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the accepted tag, CI and images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require an app tag on public main history
        id: source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^app-v[0-9A-Za-z._-]+$ ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          revision="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$revision" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$revision" refs/remotes/origin/main
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      # Production releases only by the digests main's own images run
      # published, so that run is waited for here, beside CI and under the
      # same deadline: a build still running is a wait, and a failed one stops
      # the tag here instead of on the server.
      - name: Require successful CI and images for the exact tagged commit
        uses: actions/github-script@v8
        env:
          REVISION: ${{ steps.source.outputs.revision }}
        with:
          script: |
            const workflows = { "ci.yml": "CI", "images.yml": "images" };
            const pending = new Set(Object.keys(workflows));
            const deadline = Date.now() + 25 * 60 * 1000;
            while (Date.now() < deadline) {
              for (const workflow of [...pending]) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow,
                  event: "push",
                  head_sha: process.env.REVISION,
                  per_page: 100,
                });
                const run = data.workflow_runs.find(
                  (candidate) => candidate.head_sha === process.env.REVISION && candidate.head_branch === "main",
                );
                if (run?.status === "completed") {
                  if (run.conclusion !== "success") {
                    core.setFailed(`Latest main ${workflows[workflow]} run ${run.id} concluded ${run.conclusion}`);
                    return;
                  }
                  pending.delete(workflow);
                }
              }
              if (pending.size === 0) return;
              await new Promise((resolve) => setTimeout(resolve, 15_000));
            }
            const missing = [...pending].map((workflow) => workflows[workflow]).join(" and ");
            core.setFailed(`${missing} did not succeed for ${process.env.REVISION} within 25 minutes`);

  publish:
    name: Move the accepted PRODUCTION intent
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the accepted source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.revision }}

      - name: Publish the exact accepted PRODUCTION intent
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          set -euo pipefail
          read_ref="repos/$GITHUB_REPOSITORY/git/ref/tags/deploy-production"
          write_ref="repos/$GITHUB_REPOSITORY/git/refs/tags/deploy-production"
          if gh api "$read_ref" >/dev/null 2>&1; then
            gh api --method PATCH "$write_ref" -f "sha=$REVISION" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/deploy-production -f "sha=$REVISION" >/dev/null
          fi
          test "$(gh api "$read_ref" --jq .object.sha)" = "$REVISION"
          {
            echo "### PRODUCTION selection published"
            echo
            echo "\`deploy-production\` now names \`$REVISION\`. The server pull agent continues the deployment."
            echo "This workflow does not claim that activation or runtime verification has completed."
          } >> "$GITHUB_STEP_SUMMARY"
