name: Deploy PRODUCTION

on:
  push:
    tags:
      - "app-v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the accepted tag and CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require an app tag on public main history
        id: source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^app-v[0-9A-Za-z._-]+$ ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          revision="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$revision" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$revision" refs/remotes/origin/main
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for the exact tagged commit
        uses: actions/github-script@v8
        env:
          REVISION: ${{ steps.source.outputs.revision }}
        with:
          script: |
            const deadline = Date.now() + 25 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ci.yml",
                event: "push",
                head_sha: process.env.REVISION,
                per_page: 100,
              });
              const run = data.workflow_runs.find(
                (candidate) => candidate.head_sha === process.env.REVISION && candidate.head_branch === "main",
              );
              if (run?.status === "completed") {
                if (run.conclusion === "success") return;
                core.setFailed(`Latest main CI run ${run.id} concluded ${run.conclusion}`);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 15_000));
            }
            core.setFailed(`CI did not succeed for ${process.env.REVISION} within 25 minutes`);

  deploy:
    name: Build and deploy PRODUCTION on its server
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Check out the accepted source and deployment controller
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.revision }}

      - name: Require the PRODUCTION deployment configuration
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
          INVENTORY_JSON: ${{ secrets.INVENTORY_JSON }}
          HEADSCALE_AUTH_KEY: ${{ secrets.HEADSCALE_AUTH_KEY }}
          HEADSCALE_LOGIN_SERVER: ${{ vars.HEADSCALE_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          for variable in SSH_KEY KNOWN_HOSTS INVENTORY_JSON HEADSCALE_AUTH_KEY HEADSCALE_LOGIN_SERVER; do
            test -n "${!variable:-}" || { echo "Missing PRODUCTION $variable" >&2; exit 1; }
          done

      - name: Join the private deployment mesh
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd
        with:
          authkey: ${{ secrets.HEADSCALE_AUTH_KEY }}
          args: --login-server=${{ vars.HEADSCALE_LOGIN_SERVER }}
          hostname: agentify-production-${{ github.run_id }}
          timeout: 3m
          version: 1.98.9

      - name: Install the pinned deployment client
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install --disable-pip-version-check -r deploy/ansible/requirements.txt
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"

      - name: Install channel-scoped SSH and inventory facts
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
          INVENTORY_JSON: ${{ secrets.INVENTORY_JSON }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh "$RUNNER_TEMP/agentify-evidence"
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$INVENTORY_JSON" > "$RUNNER_TEMP/inventory.json"
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts "$RUNNER_TEMP/inventory.json"

      - name: Stage PRODUCTION from the accepted revision
        env:
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          ansible-playbook -i deploy/ansible/inventory.yml \
            -e @"$RUNNER_TEMP/inventory.json" deploy/ansible/release.yml \
            --limit production -e release_phase=stage -e release_channel_ack=production \
            -e "release_revision=$REVISION" -e "release_controller_revision=$REVISION" \
            -e "release_evidence_directory=$RUNNER_TEMP/agentify-evidence"

      - name: Activate and verify PRODUCTION
        env:
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          ansible-playbook -i deploy/ansible/inventory.yml \
            -e @"$RUNNER_TEMP/inventory.json" deploy/ansible/release.yml \
            --limit production -e release_phase=activate -e release_channel_ack=production \
            -e "release_revision=$REVISION" -e "release_controller_revision=$REVISION" \
            -e "release_evidence_directory=$RUNNER_TEMP/agentify-evidence"
