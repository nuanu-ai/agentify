services:
  - type: worker
    name: agentify-scanner-worker
    runtime: docker
    dockerfilePath: ./agentify/ops/deploy/scanner-worker.Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANALYTICS_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: WORKER_HEALTH_PORT
        value: "8081"
      - key: WORKER_ID
        generateValue: true
      - key: SCANNER_CONCURRENCY
        value: "10"
      - key: SCANNER_CACHE_ENABLED
        value: "false"
      - key: POSTHOG_ENABLED
        value: "false"
      - key: META_CAPI_ENABLED
        value: "false"
