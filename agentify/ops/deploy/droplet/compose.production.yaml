name: agentify

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "14"

services:
  postgres:
    profiles: [local]
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentify
      POSTGRES_USER: agentify_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_WEB_PASSWORD: ${POSTGRES_WEB_PASSWORD:?POSTGRES_WEB_PASSWORD is required}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?POSTGRES_WORKER_PASSWORD is required}
      POSTGRES_PRIVACY_PASSWORD: ${POSTGRES_PRIVACY_PASSWORD:?POSTGRES_PRIVACY_PASSWORD is required}
      POSTGRES_DASHBOARD_PASSWORD: ${POSTGRES_DASHBOARD_PASSWORD:?POSTGRES_DASHBOARD_PASSWORD is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U agentify_admin -d agentify || pg_isready -U agentify -d agentify",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    logging: *default-logging

  migrate:
    build:
      context: ../../..
      dockerfile: ops/deploy/scanner-worker.Dockerfile
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL:-postgresql://agentify_admin:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/agentify}
    command: ["node", "packages/db/dist/migrate-cli.js"]
    depends_on:
      roles-reconcile:
        condition: service_completed_successfully
    networks: [backend, egress]
    logging: *default-logging
    restart: "no"

  roles-reconcile:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: agentify
      POSTGRES_HOST: postgres
      DATABASE_MODE: ${DATABASE_MODE:-local}
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-}
      WEB_DATABASE_URL: ${WEB_DATABASE_URL:-}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:-}
      PRIVACY_DATABASE_URL: ${PRIVACY_DATABASE_URL:-}
      DASHBOARD_DATABASE_URL: ${DASHBOARD_DATABASE_URL:-}
      POSTGRES_WEB_PASSWORD: ${POSTGRES_WEB_PASSWORD:?POSTGRES_WEB_PASSWORD is required}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?POSTGRES_WORKER_PASSWORD is required}
      POSTGRES_PRIVACY_PASSWORD: ${POSTGRES_PRIVACY_PASSWORD:?POSTGRES_PRIVACY_PASSWORD is required}
      POSTGRES_DASHBOARD_PASSWORD: ${POSTGRES_DASHBOARD_PASSWORD:?POSTGRES_DASHBOARD_PASSWORD is required}
      LEGACY_POSTGRES_PASSWORD: ${LEGACY_POSTGRES_PASSWORD:-}
      RECONCILE_RUNTIME_ROLE_PASSWORDS: ${RECONCILE_RUNTIME_ROLE_PASSWORDS:-}
      ROLE_PASSWORD_ROTATION_MAINTENANCE_ACK: ${ROLE_PASSWORD_ROTATION_MAINTENANCE_ACK:-}
    command: ["/runtime-reconcile.sh"]
    volumes:
      - ./postgres-init:/runtime-roles:ro
      - ./reconcile-runtime-roles.sh:/runtime-reconcile.sh:ro
      - ./validate-database-config.sh:/runtime-validate-database-config.sh:ro
    networks: [backend, egress]
    logging: *default-logging
    restart: "no"

  queue-init:
    build:
      context: ../../..
      dockerfile: ops/deploy/scanner-worker.Dockerfile
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL:-postgresql://agentify_admin:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/agentify}
    command: ["node", "apps/scanner-worker/dist/queue-init-cli.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend, egress]
    logging: *default-logging
    restart: "no"

  database-access-finalize:
    image: postgres:17.6-alpine
    environment:
      DATABASE_MODE: ${DATABASE_MODE:-local}
      DATABASE_CONFIG_SCOPE: admin
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-}
      DATABASE_URL: ${ADMIN_DATABASE_URL:-postgresql://agentify_admin:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/agentify}
    command: ["/runtime-finalize-database-access.sh"]
    volumes:
      - ./finalize-database-access.sh:/runtime-finalize-database-access.sh:ro
      - ./validate-database-config.sh:/runtime-validate-database-config.sh:ro
    depends_on:
      database-dashboards-install:
        condition: service_completed_successfully
    networks: [backend, egress]
    logging: *default-logging
    restart: "no"

  database-dashboards-install:
    image: postgres:17.6-alpine
    environment:
      DATABASE_MODE: ${DATABASE_MODE:-local}
      DATABASE_CONFIG_SCOPE: admin
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-}
      DATABASE_URL: ${ADMIN_DATABASE_URL:-postgresql://agentify_admin:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/agentify}
    command: ["/runtime-install-database-dashboards.sh"]
    volumes:
      - ../../dashboards:/runtime-dashboards:ro
      - ./install-database-dashboards.sh:/runtime-install-database-dashboards.sh:ro
      - ./validate-database-config.sh:/runtime-validate-database-config.sh:ro
    depends_on:
      queue-init:
        condition: service_completed_successfully
    networks: [backend, egress]
    logging: *default-logging
    restart: "no"

  database-config-check:
    profiles: [tools]
    image: alpine:3.22
    environment:
      DATABASE_MODE: ${DATABASE_MODE:-local}
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-}
      WEB_DATABASE_URL: ${WEB_DATABASE_URL:-}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:-}
      PRIVACY_DATABASE_URL: ${PRIVACY_DATABASE_URL:-}
      DASHBOARD_DATABASE_URL: ${DASHBOARD_DATABASE_URL:-}
    command: ["/runtime-validate-database-config.sh"]
    volumes:
      - ./validate-database-config.sh:/runtime-validate-database-config.sh:ro
    network_mode: none
    logging: *default-logging
    restart: "no"

  database-access-verify:
    profiles: [tools]
    image: postgres:17.6-alpine
    environment:
      DATABASE_MODE: ${DATABASE_MODE:-local}
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-}
      WEB_DATABASE_URL: ${WEB_DATABASE_URL:-}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:-}
      PRIVACY_DATABASE_URL: ${PRIVACY_DATABASE_URL:-}
      DASHBOARD_DATABASE_URL: ${DASHBOARD_DATABASE_URL:-}
    command: ["/runtime-verify-database-access.sh"]
    volumes:
      - ./verify-database-access.sh:/runtime-verify-database-access.sh:ro
      - ./validate-database-config.sh:/runtime-validate-database-config.sh:ro
    networks: [egress]
    logging: *default-logging
    restart: "no"

  web:
    build:
      context: ../../..
      dockerfile: ops/deploy/droplet/web.Dockerfile
      args:
        NEXT_PUBLIC_APP_BASE_URL: https://agentify.ad
        NEXT_PUBLIC_DISPLAY_BRAND: Agentify
        NEXT_PUBLIC_REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_SUPABASE_AUTH_URL: ${NEXT_PUBLIC_SUPABASE_AUTH_URL:-}
        NEXT_PUBLIC_SUPABASE_AUTH_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_AUTH_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    environment:
      APP_BASE_URL: https://agentify.ad
      NEXT_PUBLIC_APP_BASE_URL: https://agentify.ad
      NEXT_PUBLIC_DISPLAY_BRAND: Agentify
      NEXT_PUBLIC_PRIVACY_EMAIL: privacy@agentify.ad
      NEXT_PUBLIC_ABUSE_EMAIL: abuse@agentify.ad
      NEXT_PUBLIC_LEGAL_OPERATOR: ${NEXT_PUBLIC_LEGAL_OPERATOR:-Operator identity pending confirmation}
      NEXT_PUBLIC_LEGAL_IDENTITY_CONFIRMED: ${NEXT_PUBLIC_LEGAL_IDENTITY_CONFIRMED:-false}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      SUPABASE_AUTH_URL: ${SUPABASE_AUTH_URL:-}
      SUPABASE_AUTH_PUBLISHABLE_KEY: ${SUPABASE_AUTH_PUBLISHABLE_KEY:-}
      SUPABASE_AUTH_SERVICE_ROLE_KEY: ${SUPABASE_AUTH_SERVICE_ROLE_KEY:-}
      NEXT_PUBLIC_SUPABASE_AUTH_URL: ${NEXT_PUBLIC_SUPABASE_AUTH_URL:-}
      NEXT_PUBLIC_SUPABASE_AUTH_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_AUTH_PUBLISHABLE_KEY:-}
      DATABASE_URL: ${WEB_DATABASE_URL:-postgresql://agentify_web:${POSTGRES_WEB_PASSWORD}@postgres:5432/agentify}
      DASHBOARD_DATABASE_URL: ${DASHBOARD_DATABASE_URL:-postgresql://agentify_dashboard:${POSTGRES_DASHBOARD_PASSWORD}@postgres:5432/agentify}
      TOKEN_HMAC_SECRET: ${TOKEN_HMAC_SECRET:?TOKEN_HMAC_SECRET is required}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:?EMAIL_ENCRYPTION_KEY is required}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-disabled}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      SCAN_ACCEPTANCE_ENABLED: ${SCAN_ACCEPTANCE_ENABLED:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-reports@agentify.ad}
      LOCAL_EMAIL_EVIDENCE_ENABLED: "false"
      TURNSTILE_ENFORCED: ${TURNSTILE_ENFORCED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      SCANNER_CACHE_ENABLED: ${SCANNER_CACHE_ENABLED:-false}
      BENCHMARK_ENABLED: ${BENCHMARK_ENABLED:-false}
      PUBLIC_SHARE_ENABLED: ${PUBLIC_SHARE_ENABLED:-false}
      PARTNER_POSTBACK_ENABLED: ${PARTNER_POSTBACK_ENABLED:-false}
      APIFY_BROWSER_MODE: ${APIFY_BROWSER_MODE:-off}
      REMEDIATION_PROMPT_ENABLED: ${REMEDIATION_PROMPT_ENABLED:-true}
      CARD_SIGNAL_ENABLED: "false"
      ANALYTICS_RUNTIME_ENV: production
      ANALYTICS_SERVER_DELIVERY_ENABLED: "false"
    depends_on:
      database-access-finalize:
        condition: service_completed_successfully
    networks: [frontend, backend]
    logging: *default-logging

  privacy-cleanup:
    profiles: [jobs]
    image: agentify-privacy-cleanup:latest
    build:
      context: ../../..
      dockerfile: ops/deploy/droplet/web.Dockerfile
      target: privacy-jobs
      args:
        NEXT_PUBLIC_APP_BASE_URL: https://agentify.ad
        NEXT_PUBLIC_DISPLAY_BRAND: Agentify
        NEXT_PUBLIC_REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_SUPABASE_AUTH_URL: ${NEXT_PUBLIC_SUPABASE_AUTH_URL:-}
        NEXT_PUBLIC_SUPABASE_AUTH_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_AUTH_PUBLISHABLE_KEY:-}
    environment:
      APP_BASE_URL: https://agentify.ad
      NEXT_PUBLIC_APP_BASE_URL: https://agentify.ad
      DATABASE_URL: ${PRIVACY_DATABASE_URL:-postgresql://agentify_privacy:${POSTGRES_PRIVACY_PASSWORD}@postgres:5432/agentify}
      TOKEN_HMAC_SECRET: ${TOKEN_HMAC_SECRET:?TOKEN_HMAC_SECRET is required}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:?EMAIL_ENCRYPTION_KEY is required}
      EMAIL_PROVIDER: disabled
      SUPABASE_AUTH_URL: ${SUPABASE_AUTH_URL:?SUPABASE_AUTH_URL is required for privacy cleanup}
      SUPABASE_AUTH_SERVICE_ROLE_KEY: ${SUPABASE_AUTH_SERVICE_ROLE_KEY:?SUPABASE_AUTH_SERVICE_ROLE_KEY is required for privacy cleanup}
      REGISTRATION_ENABLED: "false"
      CARD_SIGNAL_ENABLED: "false"
      STRIPE_ADAPTER: local
      PRIVACY_CLEANUP_ACK: "yes"
      PRIVACY_CLEANUP_DRY_RUN: "false"
      PRIVACY_CLEANUP_BATCH_SIZE: "100"
    networks: [backend, egress]
    logging: *default-logging
    restart: "no"

  worker:
    build:
      context: ../../..
      dockerfile: ops/deploy/scanner-worker.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${WORKER_DATABASE_URL:-postgresql://agentify_worker:${POSTGRES_WORKER_PASSWORD}@postgres:5432/agentify}
      APP_BASE_URL: https://agentify.ad
      WORKER_HEALTH_PORT: 8081
      WORKER_ID: agentify-droplet-1
      SCANNER_CONCURRENCY: ${SCANNER_CONCURRENCY:-4}
      SCANNER_CACHE_ENABLED: ${SCANNER_CACHE_ENABLED:-false}
      ANALYTICS_ENV: production
      ANALYTICS_RUNTIME_ENV: production
      ANALYTICS_SERVER_DELIVERY_ENABLED: "false"
      POSTHOG_ENABLED: "false"
      POSTHOG_DESTINATION_ENV: production
      META_CAPI_ENABLED: "false"
      META_DESTINATION_ENV: production
      PARTNER_POSTBACK_ENABLED: ${PARTNER_POSTBACK_ENABLED:-false}
      PARTNER_POSTBACK_SECRET: ${PARTNER_POSTBACK_SECRET:-}
      APIFY_BROWSER_ENABLED: ${APIFY_BROWSER_ENABLED:-false}
      APIFY_BROWSER_MODE: ${APIFY_BROWSER_MODE:-off}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      APIFY_BROWSER_ACTOR_ID: ${APIFY_BROWSER_ACTOR_ID:-}
      APIFY_BROWSER_ACTOR_BUILD: ${APIFY_BROWSER_ACTOR_BUILD:-}
      APIFY_BROWSER_SAMPLE_RATE: ${APIFY_BROWSER_SAMPLE_RATE:-0.10}
      APIFY_BROWSER_CONCURRENCY: ${APIFY_BROWSER_CONCURRENCY:-1}
      APIFY_BROWSER_TIMEOUT_SECONDS: ${APIFY_BROWSER_TIMEOUT_SECONDS:-60}
      APIFY_BROWSER_MAX_RUN_USD: ${APIFY_BROWSER_MAX_RUN_USD:-0.05}
      APIFY_BROWSER_DAILY_BUDGET_USD: ${APIFY_BROWSER_DAILY_BUDGET_USD:-25}
      APIFY_BROWSER_MAX_PAGES: ${APIFY_BROWSER_MAX_PAGES:-3}
    depends_on:
      database-access-finalize:
        condition: service_completed_successfully
    networks: [backend, egress]
    logging: *default-logging

  database-backup:
    profiles: [jobs]
    image: postgres:17.6-alpine
    environment:
      DATABASE_MODE: ${DATABASE_MODE:-local}
      DATABASE_CONFIG_SCOPE: admin
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-}
      DATABASE_URL: ${ADMIN_DATABASE_URL:-postgresql://agentify_admin:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/agentify}
    command: ["/runtime-database-backup.sh"]
    volumes:
      - /opt/agentify/shared/backups:/backups
      - ./database-backup.sh:/runtime-database-backup.sh:ro
      - ./validate-database-config.sh:/runtime-validate-database-config.sh:ro
    networks: [backend, egress]
    logging: *default-logging
    restart: "no"

  database-import-public:
    profiles: [cutover]
    image: postgres:17.6-alpine
    environment:
      DATABASE_MODE: ${DATABASE_MODE:-local}
      DATABASE_CONFIG_SCOPE: admin
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-}
      DATABASE_URL: ${ADMIN_DATABASE_URL:-postgresql://agentify_admin:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/agentify}
      CUTOVER_DUMP_BASENAME: ${CUTOVER_DUMP_BASENAME:-}
      CUTOVER_IMPORT_ACK: ${CUTOVER_IMPORT_ACK:-}
    command: ["/runtime-import-public-data.sh"]
    volumes:
      - /opt/agentify/shared/backups:/backups:ro
      - ./import-public-data.sh:/runtime-import-public-data.sh:ro
      - ./validate-database-config.sh:/runtime-validate-database-config.sh:ro
    networks: [egress]
    logging: *default-logging
    restart: "no"

  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    environment:
      ADMIN_BASIC_AUTH_USER: ${ADMIN_BASIC_AUTH_USER:?ADMIN_BASIC_AUTH_USER is required}
      ADMIN_BASIC_AUTH_HASH: ${ADMIN_BASIC_AUTH_HASH:?ADMIN_BASIC_AUTH_HASH is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [frontend]
    logging: *default-logging

networks:
  frontend:
  egress:
  backend:
    internal: true

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
