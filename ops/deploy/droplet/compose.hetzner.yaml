# The scanner keeps its own project and database within the common release. The edge owns
# public TLS; this override keeps the original Caddy available only by profile.
services:
  caddy:
    profiles: [legacy-ingress]
    ports: !override []

  web:
    image: "${AGENTIFY_SCANNER_WEB_IMAGE:?set a SHA-tagged scanner web image}"
    networks:
      frontend:
      backend:
      agentify-ingress:
        aliases: [agentify-site]

  worker:
    image: "${AGENTIFY_SCANNER_WORKER_IMAGE:?set a SHA-tagged scanner worker image}"

  migrate:
    image: "${AGENTIFY_SCANNER_WORKER_IMAGE:?set a SHA-tagged scanner worker image}"

  queue-init:
    image: "${AGENTIFY_SCANNER_WORKER_IMAGE:?set a SHA-tagged scanner worker image}"

  privacy-cleanup:
    image: "${AGENTIFY_SCANNER_PRIVACY_IMAGE:?set a SHA-tagged scanner privacy image}"

networks:
  agentify-ingress:
    external: true
    name: ${AGENTIFY_INGRESS_NETWORK:-agentify-ingress}
