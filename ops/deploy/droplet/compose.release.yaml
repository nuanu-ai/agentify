# Same images for runtime, migration and scheduled jobs in both channels.
services:
  web:
    build: !reset null
    image: "${AGENTIFY_SCANNER_WEB_IMAGE:?set the release manifest image digest}"
  worker:
    build: !reset null
    image: "${AGENTIFY_SCANNER_WORKER_IMAGE:?set the release manifest image digest}"
  migrate:
    build: !reset null
    image: "${AGENTIFY_SCANNER_WORKER_IMAGE:?set the release manifest image digest}"
  queue-init:
    build: !reset null
    image: "${AGENTIFY_SCANNER_WORKER_IMAGE:?set the release manifest image digest}"
  privacy-cleanup:
    build: !reset null
    image: "${AGENTIFY_SCANNER_PRIVACY_IMAGE:?set the release manifest image digest}"
  roles-reconcile:
    image: "${AGENTIFY_POSTGRES_IMAGE:?set the release manifest Postgres digest}"
  database-dashboards-install:
    image: "${AGENTIFY_POSTGRES_IMAGE:?set the release manifest Postgres digest}"
  database-access-finalize:
    image: "${AGENTIFY_POSTGRES_IMAGE:?set the release manifest Postgres digest}"
  database-access-verify:
    image: "${AGENTIFY_POSTGRES_IMAGE:?set the release manifest Postgres digest}"
  database-config-check:
    image: "${AGENTIFY_ALPINE_IMAGE:?set the release manifest Alpine digest}"
  database-backup:
    image: "${AGENTIFY_POSTGRES_IMAGE:?set the release manifest Postgres digest}"
    volumes: !override
      - ${AGENTIFY_BACKUP_DIRECTORY:?set the isolated backup directory}:/backups
      - ./database-backup.sh:/runtime-database-backup.sh:ro
      - ./validate-database-config.sh:/runtime-validate-database-config.sh:ro
