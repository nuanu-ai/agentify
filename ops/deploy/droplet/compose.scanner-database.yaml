# Scanner application connectivity to its own database and cabinet identity.
# The worker and privacy job share no cabinet credential or identity secret.
services:
  migrate:
    networks: [backend, egress, agentify-scanner-db]
  roles-reconcile:
    environment:
      POSTGRES_HOST: agentify-scanner-postgres
      POSTGRES_DB: agentify_scanner
    networks: [backend, egress, agentify-scanner-db]
  queue-init:
    networks: [backend, egress, agentify-scanner-db]
  database-dashboards-install:
    networks: [backend, egress, agentify-scanner-db]
  database-access-finalize:
    networks: [backend, egress, agentify-scanner-db]
  database-access-verify:
    networks: [backend, egress, agentify-scanner-db]
  web:
    environment:
      CABINET_IDENTITY_URL: http://agentify-cabinet-identity:3002
      REPORT_IDENTITY_SECRET: "${REPORT_IDENTITY_SECRET:?set the private report identity secret}"
    networks:
      frontend:
      backend:
      agentify-scanner-db:
      agentify-ingress:
        aliases: [agentify-site]
  worker:
    networks: [backend, egress, agentify-scanner-db]
  privacy-cleanup:
    networks: [backend, egress, agentify-scanner-db]
  database-backup:
    networks: [backend, egress, agentify-scanner-db]
networks:
  agentify-scanner-db:
    external: true
    name: ${AGENTIFY_SCANNER_DB_NETWORK:-agentify-scanner-db}
