name: agentify

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: b2a
      POSTGRES_PASSWORD: b2a_local_only
      POSTGRES_DB: b2a
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b2a -d b2a"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - b2a-postgres:/var/lib/postgresql/data
      - ../packages/scanner-database/scripts/init-local-databases.sql:/docker-entrypoint-initdb.d/10-init-local-databases.sql:ro

volumes:
  b2a-postgres:
