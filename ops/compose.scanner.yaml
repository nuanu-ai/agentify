# Its own project, because the commerce stack in the root compose.yaml also
# has a service named postgres: under one project name, bringing this one up
# would recreate that container with this definition.
name: agentify-scanner

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: agentify_scanner
      POSTGRES_PASSWORD: agentify_scanner_local_only
      POSTGRES_DB: agentify_scanner
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentify_scanner -d agentify_scanner"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - agentify-scanner-postgres:/var/lib/postgresql/data
      - ../packages/scanner-database/scripts/init-local-databases.sql:/docker-entrypoint-initdb.d/10-init-local-databases.sql:ro

volumes:
  agentify-scanner-postgres:
